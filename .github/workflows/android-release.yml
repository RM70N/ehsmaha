name: Build & Publish Android App

# يُشغَّل تلقائياً عند رفع تاج إصدار مثل v1.0.0 (نفس تاج نسخة سطح المكتب —
# الاثنان ينشران أصولهما (assets) في نفس الإصدار على GitHub Releases)، أو
# يدوياً من تبويب Actions.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write # لإنشاء/تحديث GitHub Release ورفع ملف APK إليه

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli@8 يتطلب Node >= 22 (على عكس مشروع سطح المكتب
          # الذي لا يزال متوافقاً مع Node 20).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Decode signing keystore
        working-directory: mobile/android
        env:
          # نمرّرها كمتغيرات بيئة (بدل تضمينها مباشرة داخل نص heredoc) —
          # أضمن وأوضح عند التشخيص، ولا يخضع محتواها لأي تفسير من الصَدَفة.
          EHSMAHA_KEYSTORE_BASE64: ${{ secrets.EHSMAHA_KEYSTORE_BASE64 }}
          EHSMAHA_KEYSTORE_PASSWORD: ${{ secrets.EHSMAHA_KEYSTORE_PASSWORD }}
          EHSMAHA_KEY_ALIAS: ${{ secrets.EHSMAHA_KEY_ALIAS }}
          EHSMAHA_KEY_PASSWORD: ${{ secrets.EHSMAHA_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$EHSMAHA_KEYSTORE_BASE64" ] && missing="$missing EHSMAHA_KEYSTORE_BASE64"
          [ -z "$EHSMAHA_KEYSTORE_PASSWORD" ] && missing="$missing EHSMAHA_KEYSTORE_PASSWORD"
          [ -z "$EHSMAHA_KEY_ALIAS" ] && missing="$missing EHSMAHA_KEY_ALIAS"
          [ -z "$EHSMAHA_KEY_PASSWORD" ] && missing="$missing EHSMAHA_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::الأسرار التالية غير مضبوطة أو فارغة في GitHub Secrets:$missing — تحقق من الاسم بالضبط (حساس لحالة الأحرف) في Settings > Secrets and variables > Actions. راجع mobile/README.md قسم التوقيع."
            exit 1
          fi
          echo "$EHSMAHA_KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$EHSMAHA_KEYSTORE_PASSWORD"
            echo "keyAlias=$EHSMAHA_KEY_ALIAS"
            echo "keyPassword=$EHSMAHA_KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to permanent filename
        run: |
          mkdir -p dist
          # نبحث عن الـ APK الناتج بدل افتراض اسم/مسار ثابت (app-release.apk) —
          # يختلف حسب إصدار Android Gradle Plugin. لو ما لقينا شيئاً نطبع
          # محتوى مجلد outputs كاملاً لتشخيص أسهل بدل رسالة "لا يوجد ملف" مبهمة.
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::لم يُعثر على أي ملف APK داخل mobile/android/app/build/outputs/apk"
            find mobile/android/app/build/outputs -type f 2>/dev/null || echo "(مجلد outputs غير موجود إطلاقاً)"
            exit 1
          fi
          echo "APK found at: $APK_PATH"
          cp "$APK_PATH" dist/ehsmaha.apk

      - name: Clean up keystore
        if: always()
        working-directory: mobile/android
        run: rm -f release.keystore keystore.properties

      - name: Resolve release tag
        id: tag
        run: |
          # نفس التاج المستخدم دائماً — سواء جاء التشغيل من push لتاج حقيقي
          # أو من تشغيل يدوي (workflow_dispatch). هذا يضمن أن ملف APK ينضم
          # لنفس GitHub Release الذي تنشر إليه نسخة سطح المكتب (electron-builder
          # يستخدم رقم النسخة من desktop/package.json)، فيصير إصدار واحد فيه
          # كل الملفات (exe, dmg×2, apk) بدل إصدارات متفرّقة.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' mobile/android/app/build.gradle)
            echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/ehsmaha.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
