name: Export Release Assets as Artifact

# سكربت مساعد لمرة واحدة: ينزّل ملفات إصدار v1.0.0 (exe/dmg/apk) عبر gh CLI
# (المُثبَّت مسبقاً على أي GitHub-hosted runner، ويستخدم GITHUB_TOKEN
# التلقائي الذي له صلاحية قراءة إصدارات هذا المستودع نفسه حتى لو كان
# خاصاً) ويرفعها كـ"Artifact" لتشغيل الـ workflow — وهذا نوع ملفات مختلف
# عن "Release assets" ويمكن تنزيله عبر GitHub API even للمستودعات الخاصة
# بدون الحاجة لجلسة متصفح مسجَّلة دخول. الهدف: تمكين نقل هذي الملفات
# لصاحب المستودع مباشرة (مثلاً ليرفعها بنفسه على استضافة الموقع) دون
# الحاجة لجعل المستودع عاماً.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "التاج المطلوب تصدير ملفاته"
        required: false
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p export
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir export \
            --pattern "ehsmaha-setup.exe" \
            --pattern "ehsmaha-x64.dmg" \
            --pattern "ehsmaha-arm64.dmg" \
            --pattern "ehsmaha.apk"
          ls -la export

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ehsmaha-release-assets
          path: export/*
          retention-days: 3

      - name: Push files to a temp git branch (splitting large ones)
        # نقل بديل عبر git نفسه (وليس عبر رابط Artifact الموقَّع على Azure Blob
        # Storage) — بعض بيئات الشبكات تحجب نطاق Azure الموقَّع لكنها تسمح
        # بعمليات git العادية إلى github.com. الملفات الأصغر من حد 100MB الذي
        # يفرضه git تُنقَل كما هي، وملفات dmg (أكبر من الحد) تُقسَّم لأجزاء
        # بحجم 90MB ثم تُدمَج لاحقاً في الطرف المستقبِل عبر cat.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="tmp/asset-transfer"
          git checkout --orphan "$BRANCH"
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p transfer
          for f in export/ehsmaha.apk export/ehsmaha-setup.exe export/ehsmaha-x64.dmg export/ehsmaha-arm64.dmg; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              name=$(basename "$f")
              if [ "$size" -lt 90000000 ]; then
                cp "$f" transfer/
              else
                split -b 90000000 -d -a 2 "$f" "transfer/${name}.part"
                echo "تقسيم $f (حجمه $size بايت) إلى أجزاء"
              fi
            fi
          done
          ls -la transfer
          git add transfer
          git commit -m "نقل مؤقت لملفات الإصدار عبر git"
          git push --force origin "HEAD:$BRANCH"
