name: Desktop Release (Windows)

# يبني تطبيق احسمها لويندوز وينشره على GitHub Releases عند رفع تاج vX.Y.Z.
# مستقل تماماً عن نشر الموقع (pages.yml): تحديث الموقع لا يتطلب إصدار EXE جديد
# (التطبيق يزامن محتوى الموقع بنفسه عبر content-manifest.json).
#
# قواعد: (1) لا نشر قبل نجاح lint + الاختبارات + E2E. (2) التاج يجب أن يطابق desktop/package.json.
# (3) لا يُحذف ولا يُستبدل أي أصل منشور لنفس الإصدار — رقم جديد لكل إصدار.
# (4) التوقيع الرقمي يُفعَّل فقط لو وُجدت أسرار CSC_LINK / CSC_KEY_PASSWORD.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "انشر الإصدار (ينشئ التاج v<desktop/package.json> على main تلقائياً)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Version matches tag
        if: github.ref_type == 'tag'
        run: node scripts/verify-version.js "${{ github.ref_name }}"
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Relay (login endpoints) deps + tests
        working-directory: tiktok-relay
        run: |
          npm ci
          node --test test/*.test.js
      - name: Bundle site and run Electron E2E (Xvfb)
        timeout-minutes: 15
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 || true
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e

  build-windows:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build NSIS installer
        run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Verify artifacts (exe, blockmap, latest.yml, sha512, version)
        run: npm run verify:dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: |
            desktop/dist/ehsmaha-setup.exe
            desktop/dist/ehsmaha-setup.exe.blockmap
            desktop/dist/latest.yml

  # macOS: يُبقي أزرار dmg بالموقع تعمل (روابط releases/latest/download). غير مطلوب للمواصفات،
  # وفشله لا يمنع نشر نسخة ويندوز.
  build-macos:
    needs: verify
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run prepare-assets && npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          if-no-files-found: error
          path: |
            desktop/dist/ehsmaha-*.dmg
            desktop/dist/ehsmaha-*.dmg.blockmap
            desktop/dist/latest-mac.yml

  publish:
    if: ${{ always() && needs.build-windows.result == 'success' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')) }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-dist
          path: dist
      - name: Publish to GitHub Release (never overwrite published assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="v$(node -p "require('./desktop/package.json').version")"; fi
          echo "TAG=$TAG"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -qx 'ehsmaha-setup.exe'; then
              echo "الإصدار $TAG منشور مسبقاً بأصوله. ارفع رقم الإصدار (package.json + تاج جديد) بدل الاستبدال." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$REPO" --target "${{ github.sha }}" --title "$TAG" --notes "إصدار تطبيق احسمها لويندوز $TAG"
          fi
          # الـEXE والـblockmap أولاً، ثم latest.yml أخيراً: المحدّث لا يرى الإصدار قبل اكتمال ملفاته.
          gh release upload "$TAG" dist/ehsmaha-setup.exe dist/ehsmaha-setup.exe.blockmap --repo "$REPO"
          for f in dist/ehsmaha-*.dmg dist/ehsmaha-*.dmg.blockmap dist/latest-mac.yml; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo "$REPO"
          done
          gh release upload "$TAG" dist/latest.yml --repo "$REPO"
