name: Build & Publish Desktop App

# يُشغَّل تلقائياً عند رفع تاج إصدار مثل v1.0.0، أو يدوياً من تبويب Actions.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write # electron-builder يحتاج هذه الصلاحية لإنشاء/رفع GitHub Release

jobs:
  # ينشئ GitHub Release للتاج (لو ما كان موجوداً) قبل أي بناء. بدون هذه
  # الخطوة، كل مهمة (windows-latest, macos-latest) — بل وحتى مهام النشر
  # الداخلية لكل معمارية مختلفة (x64/arm64) على ماك — تحاول إنشاء نفس
  # الإصدار في نفس اللحظة تقريباً، فيحدث تعارض (race condition) يفشل معه
  # طلب "إنشاء Release" لدى GitHub بخطأ 422 "Published releases must have
  # a valid tag" حتى لو نجح رفع الملفات فعلياً. إنشاء الإصدار مرة واحدة
  # هنا أولاً يعني أن كل مهمة لاحقة تجده موجوداً بالفعل فتكتفي برفع
  # الملفات إليه مباشرة بدل التسابق على إنشائه.
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./desktop/package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "الإصدار $TAG موجود بالفعل — تخطّي الإنشاء"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "تم إنشاؤه تلقائياً بواسطة GitHub Actions"
          fi

  build:
    needs: ensure-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and publish (${{ matrix.os }})
        working-directory: desktop
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
