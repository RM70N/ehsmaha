name: Deploy site to GitHub Pages

# ينشر الموقع فقط (index.html + roulette3d.html + bomb3d.html + tug3d.html + xo.html + ektheb-alay.html + almeezan3d.html + wesh-taghayar.html + hallaha-qabli.html + code-race.html + callcenter3d.html + la-tatayeh3d.html + harf-alnajat3d.html + revival-system/ (مشهد الإنعاش) + about-experience/ (معاينات من نحن) + الشعار) على GitHub Pages — لا ينشر كود البوت/السيرفر/الاختبارات.
# يشتغل عند أي دفع إلى main يغيّر ملفات الموقع، أو يدوياً من تبويب Actions.
# الإعداد لمرة وحدة: Settings → Pages → Build and deployment → Source = "GitHub Actions"، ثم Custom domain = ehsmaha.com
on:
  push:
    branches: [main]
    paths:
      - index.html
      - roulette3d.html
      - bomb3d.html
      - tug3d.html
      - xo.html
      - ektheb-alay.html
      - almeezan3d.html
      - wesh-taghayar.html
      - hallaha-qabli.html
      - code-race.html
      - callcenter3d.html
      - la-tatayeh3d.html
      - harf-alnajat3d.html
      - revival-system/**
      - dhmx-welcome/**
      - about-experience/previews-sq/**
      - about-experience/posters/**
      - code-race-banner.png
      - discord-logo.png
      - CNAME
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html roulette3d.html bomb3d.html tug3d.html xo.html ektheb-alay.html almeezan3d.html wesh-taghayar.html hallaha-qabli.html code-race.html callcenter3d.html la-tatayeh3d.html harf-alnajat3d.html code-race-banner.png discord-logo.png CNAME _site/
          cp -r revival-system _site/revival-system
          cp -r dhmx-welcome _site/dhmx-welcome
          # معاينات صفحة «من نحن» (صفحات معزولة وصور)، بدون مصادر البناء
          mkdir -p _site/about-experience
          cp -r about-experience/previews-sq about-experience/posters _site/about-experience/
          # GitHub Pages لا يدعم _redirects/netlify.toml: روابط الإحالة مثل ehsmaha.com/ahmed-2024
          # لازم تحمّل نفس index.html، فنخلّي 404.html نسخة منه (تطبيق صفحة واحدة يقرأ المسار بنفسه).
          cp index.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
