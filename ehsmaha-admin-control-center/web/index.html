/* ---------- 16 · MODALS / DRAWERS / CONFIRM ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background:
  radial-gradient(800px 500px at 50% 40%, rgba(56,32,95,.28), transparent 70%), rgba(5,5,8,.72); animation: fadeIn var(--t-base) var(--ease-out); }
.scrim::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px); background-size: 100% 4px; pointer-events: none; }
.scrim.out { animation: fadeOut 200ms var(--ease-out) forwards; }
.sheet { position: relative; width: min(600px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column; border-radius: var(--r-xl); background: linear-gradient(180deg, #1A1C25, #131419); box-shadow: 0 0 0 1px var(--seam-2), inset 0 1px 0 rgba(255,255,255,.06), 0 40px 90px -20px rgba(0,0,0,.85); animation: sheetIn 380ms var(--ease-out); overflow: hidden; }
.sheet.wide { width: min(880px, 100%); }
.scrim.out .sheet { animation: sheetOut 200ms var(--ease-out) forwards; }
.sheet-h { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px 16px; border-bottom: 1px solid var(--seam); }
.sheet-h .glyph { width: 40px; height: 40px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--well); box-shadow: inset 0 0 0 1px var(--seam-2); color: var(--lavender); flex: none; }
.sheet-h .glyph.cut { color: #F3A3AC; box-shadow: inset 0 0 0 1px rgba(227,108,121,.4); background: rgba(227,108,121,.08); }
.sheet-h .tt { flex: 1; min-width: 0; }
.sheet-h h3 { font-size: 17px; line-height: 1.3; }
.sheet-h .tt .rack { margin-bottom: 6px; }
.sheet-b { padding: 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.sheet-f { display: flex; justify-content: flex-start; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--seam); background: rgba(9,9,13,.4); flex-wrap: wrap; }
.sheet-f .sp { flex: 1; }
.steps { display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--seam); background: rgba(9,9,13,.35); }
.step { position: relative; flex: 1; display: flex; align-items: center; gap: 8px; height: 38px; font-size: 11.5px; color: var(--ink-4); }
.step b { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 10px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--seam-3); transition: background-color var(--t-base), box-shadow var(--t-base), color var(--t-base); }
.step::after { content: ""; position: absolute; bottom: -1px; inset-inline: 0; height: 2px; background: var(--violet-hi); transform: scaleX(0); transform-origin: right; transition: transform 420ms var(--ease-out); }
.step.on { color: var(--ink); }
.step.on b { background: var(--violet); color: #fff; box-shadow: none; }
.step.on::after { transform: scaleX(1); }
.step.done { color: var(--ink-2); }
.step.done b { background: rgba(121,82,216,.25); color: var(--lavender); box-shadow: none; }
.step.fail b { background: var(--cut); color: #fff; }
.step.fail::after { background: var(--cut); transform: scaleX(1); }
.confirm { border-radius: var(--r-md); overflow: hidden; box-shadow: inset 0 0 0 1px var(--seam-2); margin-top: 4px; animation: rise var(--t-base) var(--ease-out); }
.confirm.high { box-shadow: inset 0 0 0 1px rgba(232,182,92,.4); }
.confirm.critical { box-shadow: inset 0 0 0 1px rgba(227,108,121,.5); }
.confirm .ch { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(255,255,255,.03); border-bottom: 1px solid var(--seam); font-weight: 600; font-size: 13.5px; }
.confirm.critical .ch { background: rgba(227,108,121,.1); color: #F3A3AC; }
.confirm.high .ch { background: rgba(232,182,92,.08); color: #F1CD8C; }
.confirm .row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--seam); font-size: 13px; }
.confirm .row:last-child { border-bottom: 0; }
.confirm .row > span:first-child { color: var(--silver); }
.processing { display: grid; justify-items: center; gap: 14px; padding: 30px 10px; text-align: center; color: var(--silver); }
.processing .orb { width: 64px; height: 64px; position: relative; }
.processing .orb svg { width: 64px; height: 64px; animation: rotate 1.4s linear infinite; }
.processing .orb circle { fill: none; stroke-width: 2; }
.processing .orb .bg { stroke: rgba(255,255,255,.08); }
.processing .orb .fg { stroke: var(--violet-hi); stroke-dasharray: 40 200; stroke-linecap: round; }
.processing ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: var(--fs-sm); text-align: start; }
.processing li { display: flex; align-items: center; gap: 8px; opacity: .35; transition: opacity var(--t-base); }
.processing li.on { opacity: 1; color: var(--ink-2); }
.processing li .tally { width: 6px; height: 6px; }
.result { border-radius: var(--r-md); overflow: hidden; box-shadow: inset 0 0 0 1px var(--seam-2); animation: rise var(--t-base) var(--ease-out); }
.result .rh { display: flex; align-items: center; gap: 14px; padding: 16px; }
.result .seal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.result.ok .seal { background: var(--go-a); color: var(--go); box-shadow: inset 0 0 0 1px rgba(66,201,154,.4); }
.result.pending .seal { background: var(--hold-a); color: var(--hold); box-shadow: inset 0 0 0 1px rgba(232,182,92,.4); }
.result.fail .seal { background: var(--cut-a); color: var(--cut); box-shadow: inset 0 0 0 1px rgba(227,108,121,.4); }
.result .seal svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.result .seal .draw { stroke-dasharray: 30; stroke-dashoffset: 30; animation: drawCheck 520ms var(--ease-out) 120ms forwards; }
.result.fail .seal { animation: shake 420ms var(--ease-out); }
.result h4 { font-size: 15px; }
.result .msg { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.result .rb { padding: 0 16px 16px; display: grid; gap: 12px; }
.kv { display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr); gap: 0; margin: 0; border-radius: var(--r-md); overflow: hidden; box-shadow: inset 0 0 0 1px var(--seam); }
.kv dt, .kv dd { padding: 9px 14px; border-bottom: 1px solid var(--seam); margin: 0; font-size: 13px; }
.kv dt { color: var(--silver); background: rgba(255,255,255,.02); }
.kv dd { color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.kv dt:nth-last-of-type(1), .kv dd:last-of-type { border-bottom: 0; }
pre.json { margin: 0; padding: 12px 14px; border-radius: var(--r-sm); background: var(--well); box-shadow: inset 0 0 0 1px var(--seam); font-size: 11.5px; line-height: 1.6; color: var(--lavender); overflow: auto; max-height: 300px; direction: ltr; text-align: left; }
.subh { font-size: 12px; color: var(--silver); font-weight: 500; margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
.subh::after { content: ""; flex: 1; height: 1px; background: var(--seam); }
/* drawer */
.drawer-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(5,5,8,.55); animation: fadeIn var(--t-base) var(--ease-out); }
.drawer { position: fixed; z-index: 71; top: 0; bottom: 0; inset-inline-end: 0; width: min(520px, 100vw); display: flex; flex-direction: column; background: linear-gradient(180deg, #181A22, #111218); box-shadow: 0 0 0 1px var(--seam-2), -30px 0 80px rgba(0,0,0,.6); animation: drawerIn 420ms var(--ease-out); }
.drawer.out { animation: drawerOut 220ms var(--ease-out) forwards; }
.drawer-scrim.out { animation: fadeOut 220ms forwards; }
.drawer .sheet-b { flex: 1; }
.rel-acts { display: grid; gap: 6px; }
.rel-acts .op { grid-template-columns: 32px minmax(0, 1fr) auto; padding: 10px 12px; }
.rel-acts .op .oi { width: 32px; height: 32px; }

/* toasts */
.toasts { position: fixed; z-index: 95; inset-inline-end: 20px; bottom: 20px; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: grid; grid-template-columns: 4px auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border-radius: var(--r-md); background: rgba(31,33,43,.96); box-shadow: 0 0 0 1px var(--seam-2), 0 18px 40px -10px rgba(0,0,0,.7); font-size: 13px; animation: toastIn 360ms var(--ease-out); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overflow: hidden; }
.toast.out { animation: toastOut 220ms var(--ease-out) forwards; }
.toast .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--go); }
.toast.bad .bar { background: var(--cut); } .toast.warn .bar { background: var(--hold); } .toast.info .bar { background: var(--lavender); }
.toast .i { color: var(--go); } .toast.bad .i { color: var(--cut); } .toast.warn .i { color: var(--hold); } .toast.info .i { color: var(--lavender); }

/* ---------- 17 · MOTION SYSTEM ---------- */
/* stagger choreography: elements tagged [data-st] rise in sequence once */
.st-in [data-st] { animation: rise var(--t-scene) var(--ease-out) both; animation-delay: calc(min(var(--i, 0), 14) * 45ms); }
.entrance .side { animation: sideIn 700ms var(--ease-out) both; }
.entrance .top { animation: fadeDown 600ms var(--ease-out) 120ms both; }
.entrance .hero { animation: heroIn 900ms var(--ease-out) 180ms both; }
.view.leaving { animation: viewOut 140ms var(--ease-out) forwards; }
.view.entering { animation: viewIn 360ms var(--ease-out) both; }
.decisive.draw { animation: lineDraw 900ms var(--ease-io) 120ms both; }
.relay.draw .ln { stroke-dashoffset: 0; }
.relay.draw .ln-wrap { animation: fadeIn 800ms var(--ease-out) 300ms both; }
.relay.draw .nd, .relay.draw .hub { animation: nodeIn 520ms var(--ease-spring) both; animation-delay: calc(240ms + var(--i, 0) * 50ms); transform-box: fill-box; transform-origin: center; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes sideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes heroIn { from { opacity: 0; transform: translateY(16px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes viewOut { to { opacity: 0; transform: translateY(6px); } }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes titleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes lineDraw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes nodeIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes flow { to { stroke-dashoffset: -20; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rotate { to { transform: rotate(360deg); } }
@keyframes ring { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.6); } }
@keyframes ringBox { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes tallyPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes shimmer { to { transform: translateX(-100%); } }
@keyframes scan { from { background-position: 150% 0; } to { background-position: -50% 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes drawCheck { to { stroke-dashoffset: 0; } }
@keyframes barUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes sheetOut { to { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes drawerIn { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes drawerOut { to { transform: translateX(-100%); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-20px); } }
@keyframes badgeIn { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes valFlash { 0% { color: var(--lavender); text-shadow: 0 0 18px rgba(143,107,234,.8); } 100% { color: inherit; text-shadow: none; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes gateOut { to { opacity: 0; transform: translateY(-12px) scale(.98); } }
@keyframes sweep { from { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } to { transform: scaleX(1); opacity: 0; } }
@keyframes wire { from { right: -30%; } to { right: 100%; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }

  .chart .line.draw { stroke-dashoffset: 0; }
}

/* ---------- 18 · RESPONSIVE ---------- */
@media (max-width: 1280px) {
  .svc-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .span-4 { grid-column: span 6; }
  .span-8, .span-7, .span-5 { grid-column: span 12; }
  .sys .hide-l { display: none; }
}
@media (max-width: 1100px) {
  .hero { grid-template-columns: 1fr; }
  .verdict { border-inline-end: 0; border-bottom: 1px solid var(--seam); }
  .gsearch { width: min(260px, 30vw); }
  .clock { display: none; }
  .pl { grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr) auto; }
  .pl .kv2.hide-t { display: none; }
}
@media (max-width: 900px) {

  .side-scrim.open { opacity: 1; pointer-events: auto; }
  .top .m-only { display: inline-flex; }
  .top .d-only { display: none; }
  .gsearch { width: auto; flex: 1; }
  .gsearch .kbd { display: none; }
  .crumb { display: none; }
  .sys { display: none; }
  .content { padding: 20px 14px 96px; }
  .scene { grid-template-columns: 1fr; }
  .scene-art { width: 70%; opacity: .55; }
  .scene h1 { font-size: 24px; }
  .scene-facts { overflow-x: auto; }
  .span-4, .span-6 { grid-column: span 12; }
  .svc-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .verdict .big b { font-size: 60px; }
  .relay { min-height: 0; }
  .ev { grid-template-columns: 1fr; }
  .rl { grid-template-columns: minmax(0, 1fr) auto; }
  .rl .wire, .rl .dst { display: none; }
  .mnav { display: grid; }
  .toasts { bottom: 82px; inset-inline-end: 12px; }
  .preview-ribbon { bottom: 80px; }
  .portal { grid-template-columns: 1fr; }
  .portal-stage { min-height: 280px; padding: 28px 24px; border-inline-end: 0; border-bottom: 1px solid var(--seam); }
  .portal-stage .portal-copy, .portal-stage .portal-foot { display: none; }
  .portal-stage .orbit { width: 520px; inset-inline-start: -30%; }
  .portal-gate { padding: 28px 20px 40px; }
}
@media (max-width: 720px) {
  .dt thead { display: none; }
  .dt, .dt tbody, .dt tr, .dt td { display: block; width: 100%; }
  .dt tbody tr { padding: 10px 14px; border-bottom: 1px solid var(--seam); position: relative; }
  .dt tbody tr:hover td:first-child { box-shadow: none; }
  .dt td { border: 0; padding: 4px 0; max-width: none; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; text-align: start !important; }
  .dt td::before { content: attr(data-l); color: var(--ink-4); font-size: 11px; font-family: var(--f-sans); font-weight: 400; }
  .dt td.sel { position: absolute; top: 10px; inset-inline-end: 12px; width: auto; display: block; padding: 0; }
  .dt td.sel::before { display: none; }
  .dt td .clip { max-width: none; white-space: normal; }
  .dt td.n, .dt td.id { direction: rtl; }
  .pl { grid-template-columns: auto minmax(0, 1fr) auto; }
  .pl .xp, .pl .kv2 { display: none; }
  .ops-list { grid-template-columns: 1fr; }
  .tl-i { grid-template-columns: 52px 14px minmax(0, 1fr); }

  .sec-sum b { font-size: 28px; }
  .sheet { max-height: 92vh; border-radius: var(--r-xl) var(--r-xl) 0 0; }
  .scrim { place-items: end center; padding: 0; }
  .sheet, .sheet.wide { width: 100%; }
  .confirm .row { grid-template-columns: 1fr; gap: 2px; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { border-bottom: 0; padding-bottom: 2px; }
  .cc-head h1 { font-size: 24px; }
  .band-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ro .v { font-size: 24px; }
  .tickets, .casts, .studio, .shelf { grid-template-columns: 1fr; }
  .stages span { font-size: 10px; }
}
/* mobile bottom nav */
.mnav { display: none; position: fixed; z-index: 26; inset-inline: 10px; bottom: 10px; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 16px; background: rgba(20,21,28,.92); box-shadow: 0 0 0 1px var(--seam-2), 0 18px 40px rgba(0,0,0,.6); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); padding-bottom: calc(6px + env(safe-area-inset-bottom) * .5); }
.mnav a, .mnav button { position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border: 0; background: none; border-radius: 10px; color: var(--silver); font-size: 10.5px; cursor: pointer; min-height: 48px; align-content: center; }
.mnav [aria-current="page"] { color: var(--ink); background: rgba(121,82,216,.16); }
.mnav [aria-current="page"] .i { color: var(--lavender); }
.mnav .badge { position: absolute; top: 4px; inset-inline-end: 18%; min-width: 15px; height: 15px; border-radius: 4px; background: var(--cut); color: #fff; font-size: 9.5px; display: grid; place-items: center; font-family: var(--f-mono); }

.noscript { padding: 40px; text-align: center; color: var(--silver); }
@media (max-width: 900px) { .mnav { display: grid; } }

/**
 * mountChart(host, rows, { type: 'line'|'bar', x, y, height, tone: 'violet'|'lat', fmtY, fmtX, failKey })

function mountChart(host, rows, opt) {

    const ticks = [0, .25, .5, .75, 1].map((k) => max * k).filter((x, i) => i % 2 === 0 || Number.isInteger(x));

      xl = rows.map((r, i) => (i % every === 0 ? `<text x="${(bx(i) + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(shortX(o.fmtX(r[o.x])))}</text>` : '')).join('');
      body += rows.map((r, i) => `<rect class="hit" data-i="${i}" x="${bx(i).toFixed(1)}" y="${pad.t}" width="${bw.toFixed(1)}" height="${ih}"/>`).join('');

    if (!animate) { $$('.bar', svg).forEach((b) => { b.style.animation = 'none'; }); const a = $('.area', svg); if (a) { a.style.animation = 'none'; a.style.opacity = 1; } }

      const scale = svg.getBoundingClientRect().width / W;
      tip.innerHTML = `<b>${esc(o.fmtY(vals[i], r))}</b><span>${esc(o.fmtX(r[o.x]))}</span>${o.tipExtra ? o.tipExtra(r) : ''}`;

}

function setupSearch() {

    const secs = me.sections.filter((s) => (s.label + secShort(s) + s.id + (s.description || '')).toLowerCase().includes(t)).slice(0, 6);
    items = [...secs.map((s) => ({ href: `#/s/${s.id}`, html: `${icon(s.icon)}<span>${esc(s.label)}</span><span class="micro ws">${WS[s.workspace]?.code.split(' ')[0] || ''}</span>` })), ...(t.length >= 2 ? [{ href: `#/search?q=${encodeURIComponent(q.value.trim())}`, html: `${icon('search')}<span>بحث شامل في البيانات عن «${esc(q.value.trim())}»</span><span class="kbd micro ws">ENTER</span>` }] : [])];

    form.appendChild(pop); q.setAttribute('aria-expanded', 'true');

  };

  q.addEventListener('keydown', (e) => {
    if (!pop) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(-1, sel - 1); paint(); }
    else if (e.key === 'Escape') { close(); }
  });
  q.addEventListener('blur', () => setTimeout(close, 120));
  form.addEventListener('submit', (e) => {
    e.preventDefault(); const v = q.value.trim();

    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); q.focus(); q.select(); }
  });
}

function relaySvg(services) {
  const W = 640, H = 300, hx = 320, hy = 150, nw = 134, nh = 34;
  const byId = Object.fromEntries(services.map((s) => [s.id, s]));
  let lines = '', nodes = '', i = 0;
  for (const [id, p] of Object.entries(RELAY)) {
    const s = byId[id]; if (!s) continue; const tone = svcTone(s.status);
    let d;
    if (p.x > hx + 50) d = `M${hx + 62},${hy} C${hx + 120},${hy} ${p.x - nw / 2 - 60},${p.y} ${p.x - nw / 2},${p.y}`;
    else if (p.x < hx - 50) d = `M${hx - 62},${hy} C${hx - 120},${hy} ${p.x + nw / 2 + 60},${p.y} ${p.x + nw / 2},${p.y}`;
    else if (p.y < hy) d = `M${hx},${hy - 22} L${hx},${p.y + nh / 2}`;
    else d = `M${hx},${hy + 22} L${hx},${p.y - nh / 2}`;
    lines += `<path class="base" d="${d}"/><path class="ln ${tone}" d="${d}"><title>${esc(s.label)}: ${STATUS_AR[s.status] || ''}</title></path>`;

  }
  return `<svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="خريطة اتصال الأنظمة"><defs><linearGradient id="hubg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A3A9E"/><stop offset="1" stop-color="#2A1848"/></linearGradient></defs>

}
function fixSvgStyles(root) { $$('svg [style]', root).forEach((el) => { const s = el.getAttribute('style'); el.removeAttribute('style'); s.split(';').filter(Boolean).forEach((d) => { const [k, ...v] = d.split(':'); el.style.setProperty(k.trim(), v.join(':').trim()); }); }); $$('.relay.draw .nd, .relay.draw .hub', root).forEach((g) => g.style.setProperty('--i', g.dataset.i)); }

function verdictOf(services) {
  const conf = services.filter((s) => s.status !== 'unconfigured');
  const up = services.filter((s) => s.status === 'up').length, down = services.filter((s) => s.status === 'down').length, unk = services.filter((s) => s.status === 'unknown').length;
  let h;
  if (down) h = `<span class="hl-cut">${down === 1 ? 'خدمة واحدة' : `${down} خدمات`}</span> لا تستجيب وتحتاج تدخلاً`;
  else if (!conf.length) h = `<span class="hl-hold">لم تُهيّأ أي خدمة خارجية</span> بعد في متغيرات البيئة`;
  else if (unk && !up) h = `<span class="hl-hold">بانتظار أول فحص</span> للخدمات المهيّأة`;
  else h = `<span class="hl-go">كل الأنظمة المهيّأة تعمل</span>${services.length - conf.length ? ` · ${services.length - conf.length} غير مُهيّأة` : ''}`;
  return { up, total: services.length, html: h };
}

function readout(m) {
  if (m.status !== 'ok') return `<div class="ro na" title="${esc(m.reason || '')}"><div class="l"><span>${esc(m.label)}</span><span class="chip ghost">غير متاح</span></div><div class="v">—</div><div class="why">${esc(m.reason || '')}</div><div class="s">${esc(m.source)} · ${ago(m.updatedAt)}</div></div>`;
  const v = m.value; let val, cls = '';
  if (typeof v === 'number') val = `<span data-count="${v}" data-key="m:${m.id}">${fmtN(v)}</span>`;
  else if (m.id === 'bridgeStreamers') val = `<span data-count="${v.enabled}" data-key="m:bs-e">${fmtN(v.enabled)}</span> <small>مفعّل من ${fmtN(v.total)}</small>`;
  else if (m.id === 'events') val = `<span data-count="${v.streamerEvents}" data-key="m:ev">${fmtN(v.streamerEvents)}</span>${v.event100 ? ` <small>+ «عدد جديد» (${esc(v.event100)})</small>` : ''}`;
  else if (m.id === 'botHealth') { cls = 'txt'; val = `<span class="chip go"><i class="tally go pulse"></i>${v.ready === false ? 'غير جاهز' : 'متصل'}</span><small class="mono">ping ${v.ping ?? '—'}ms · تشغيل ${v.uptime != null ? Math.round(v.uptime / 60) + 'د' : '—'}</small>`; }
  else if (m.id === 'guild') val = `<span data-count="${v.members}" data-key="m:gm">${fmtN(v.members)}</span> <small>عضو · ${fmtN(v.online)} متصل</small>`;
  else if (m.id === 'commands') val = `<span data-count="${v.inFiles}" data-key="m:cmd">${fmtN(v.inFiles)}</span> <small>أمر في الملفات</small>`;
  else { cls = 'txt'; val = `<span class="mono">${esc(JSON.stringify(v))}</span>`; }
  return `<div class="ro"><div class="l"><span>${esc(m.label)}${m.id === 'guild' && v?.name ? ` · ${esc(v.name)}` : ''}</span><i class="tally go"></i></div><div class="v ${cls}">${val}</div><div class="s">${esc(m.source)} · ${ago(m.updatedAt)}</div></div>`;
}

function sectionTabs(sec) {
  const t = [];
  if (sec.id === 'audit') t.push({ id: 'log', html: `${icon('history', 'sm')} السجل` });
  for (const x of sec.views) t.push({ id: x.id, html: esc(x.label), na: x.available ? null : x.unavailableReason });

  return t;
}
function moveInk(root = document) {
  const act = $('.tab[aria-selected="true"]', root), ink = $('.tab-ink', root); if (!act || !ink) return;
  ink.style.width = `${act.offsetWidth - 20}px`; ink.style.transform = `translateX(${act.offsetLeft + 10}px)`;
  act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
async function switchTab(sec, tab) {
  const tabs = sectionTabs(sec); const cur = tab && tabs.some((t) => t.id === tab) ? tab : tabs[0]?.id || 'actions';
  $$('#view .tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.t === cur))); moveInk($('#view'));
  const body = $('#tab-body'); if (!REDUCED.matches) { body.classList.add('leaving'); await sleep(110); body.classList.remove('leaving'); }
  return renderTab(sec, cur);
}
function renderTab(sec, cur) {
  const old = $('#tab-body'); const body = document.createElement('div'); body.id = 'tab-body'; body.className = 'view entering'; old.replaceWith(body);
  if (sec.id === 'access' && cur === 'matrix') return pageAccess(body);
  if (sec.id === 'audit' && cur === 'log') return pageAudit(body);
  if (cur === 'actions') return actionsTab(body, sec);
  const vw = sec.views.find((x) => x.id === cur); if (!vw) { body.innerHTML = emptyState('العرض غير موجود'); return; }
  if (sec.id === 'health' && cur === 'now') healthBoard(body);
  if (sec.id === 'integration' && cur === 'links') integrationMap(body);
  return viewTab(body, sec, vw);
}

const ID_KEY = /(^id$|^uid$|^sid$|_id$|Id$|^hash|^key$|^ip$|^file$|^channel)/;
const DATEISH = /(At$|_at$|^at$|^ts$|^t$|^since$|^joined$|^timeout$)/;
const STATUS_KEYS = new Set(['status', 'state', 'ok', 'enabled', 'severity', 'allowed', 'changed', 'archived', 'admin', 'managed', 'isGift', 'hasSettings', 'warning_role_given', 'linkedTiktok']);
function toneOf(v) {
  const s = String(v).toLowerCase().trim();

// =====================================================================
// Operation sheet — نموذج مولَّد من تعريف الخادم ← تأكيد متناسب مع الخطورة ← تنفيذ ← نتيجة حقيقية
// لا تُعرض حركة نجاح قبل أن يؤكد الخادم النجاح والتحقق من المصدر.

const APPLY = { live: 'يُطبَّق فوراً في البوت (يقرأ قاعدته عند كل حدث)', ttl: 'يُطبَّق خلال ≤10 دقائق (كاش داخل البوت)', restart: 'لا يُطبَّق في البوت الجاري حتى إعادة تشغيله' };
const lookupCache = new Map();
async function lookup(kind) { if (!lookupCache.has(kind)) lookupCache.set(kind, get(`/api/lookup/${kind}`).then((r) => r.items).catch(() => null)); return lookupCache.get(kind); }

function fieldHtml(f) {
  const id = `f-${f.name}`; const req = f.required ? ' required' : '';
  let ctl;
  if (f.type === 'boolean') ctl = `<label class="switch"><input type="checkbox" id="${id}" name="${f.name}" ${f.default ? 'checked' : ''}><i></i></label>`;
  else if (f.type === 'select') ctl = `<select class="input" id="${id}" name="${f.name}"${req}>${f.required ? '' : '<option value="">—</option>'}${(f.options || []).map((o) => `<option value="${esc(o.value)}" ${String(f.default) === String(o.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') ctl = `<textarea class="input" id="${id}" name="${f.name}" maxlength="${f.max || 4000}"${req} placeholder="${esc(f.placeholder || '')}"></textarea>`;
  else if (f.type === 'datetime') ctl = `<input class="input ltr" type="datetime-local" id="${id}" name="${f.name}"${req}>`;
  else if (['number', 'integer'].includes(f.type)) ctl = `<input class="input ltr" type="number" inputmode="decimal" id="${id}" name="${f.name}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} step="${f.type === 'integer' ? 1 : 'any'}" value="${f.default ?? ''}"${req}>`;
  else if (f.optionsFrom) ctl = `<select class="input" id="${id}" name="${f.name}" data-from="${f.optionsFrom}"${req}><option value="">جارٍ التحميل…</option></select>`;
  else ctl = `<input class="input ${f.type === 'snowflake' || f.type === 'url' ? 'ltr' : ''}" id="${id}" name="${f.name}" maxlength="${f.max || 200}" autocomplete="off" placeholder="${esc(f.placeholder || '')}"${req}>`;
  return `<div class="field" data-f="${f.name}"><label for="${id}">${esc(f.label)}${f.required ? ' <span class="faint">*</span>' : ''}</label>${ctl}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}<div class="err" data-err></div></div>`;
}

async function fillLookups(root, descriptor) {
  for (const sel of root.querySelectorAll('select[data-from]')) {
    const kind = sel.dataset.from; const f = descriptor.fields.find((x) => x.name === sel.name);
    if (kind === 'members') { // بحث لحظي: نقلب الحقل إلى إدخال + قائمة اقتراحات
      const inp = document.createElement('input'); inp.className = 'input ltr'; inp.name = sel.name; inp.id = sel.id; inp.required = sel.required; inp.autocomplete = 'off'; inp.placeholder = 'ابحث بالاسم أو الصق معرّف العضو'; const dl = document.createElement('datalist'); dl.id = `dl-${sel.name}`; inp.setAttribute('list', dl.id);
      let t; inp.addEventListener('input', () => { clearTimeout(t); const v = inp.value.trim(); if (v.length < 2 || /^\d{16,21}$/.test(v)) return; t = setTimeout(async () => { try { const r = await get(`/api/lookup/members?q=${encodeURIComponent(v)}`); dl.innerHTML = r.items.map((i) => `<option value="${esc(i.value)}">${esc(i.label)}</option>`).join(''); } catch { /* */ } }, 300); });
      sel.replaceWith(inp, dl); continue;
    }
    const items = await lookup(kind);
    if (!items) { const inp = document.createElement('input'); inp.className = 'input ltr'; inp.name = sel.name; inp.id = sel.id; inp.required = sel.required; inp.placeholder = f?.type === 'snowflake' ? 'الصق المعرّف (تعذّر تحميل القائمة)' : 'اكتب القيمة'; sel.replaceWith(inp); continue; }
    sel.innerHTML = `<option value="">— اختر —</option>${items.map((i) => `<option value="${esc(i.value)}">${esc(i.label)}</option>`).join('')}`;
  }
}

function collect(form, descriptor) {
  const params = {};
  for (const f of descriptor.fields) {
    const el = form.elements[f.name]; if (!el) continue;
    if (f.type === 'boolean') params[f.name] = el.checked;
    else if (f.type === 'datetime') { if (el.value) params[f.name] = new Date(el.value).getTime(); }
    else if (['number', 'integer'].includes(f.type)) { if (el.value !== '') params[f.name] = Number(el.value); }
    else if (el.value !== '') params[f.name] = el.value.trim();
  }
  return params;
}

function dataTable(data) {
  if (Array.isArray(data) && data.length && typeof data[0] === 'object') {
    const cols = [...new Set(data.slice(0, 30).flatMap((r) => Object.keys(r)))].slice(0, 8);
    return `<div class="dt-wrap"><div class="dt-scroll"><table class="dt compact"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${data.slice(0, 100).map((r) => `<tr>${cols.map((c) => `<td data-l="${esc(c)}">${esc(typeof r[c] === 'object' ? JSON.stringify(r[c]) : /(^ts$|At$|^at$)/.test(c) && typeof r[c] === 'number' ? fmtDate(r[c]) : r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }
  return `<pre class="json">${esc(JSON.stringify(data, null, 2))}</pre>`;
}

const SEAL_OK = '<svg viewBox="0 0 24 24"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function resultView(res, descriptor) {
  const pending = res.status === 'saved_pending_apply';
  const kv = [];
  if (res.after) kv.push(['القيمة المقروءة من المصدر بعد التنفيذ', `<pre class="json">${esc(JSON.stringify(res.after, null, 2))}</pre>`]);
  if (res.before && descriptor.kind !== 'read') kv.push(['القيمة السابقة', `<pre class="json">${esc(JSON.stringify(res.before, null, 2))}</pre>`]);
  const detail = res.detail && Array.isArray(res.detail) ? dataTable(res.detail) : res.detail ? `<pre class="json">${esc(JSON.stringify(res.detail, null, 2))}</pre>` : '';
  return `<div class="result ${pending ? 'pending' : 'ok'}"><div class="rh"><span class="seal">${pending ? icon('clock', 'lg') : SEAL_OK}</span><div><h4>${esc(pending ? 'محفوظة — بانتظار التطبيق' : descriptor.kind === 'read' ? 'تم' : 'نُفِّذت وتم التحقق منها')}</h4><div class="msg">${esc(res.message || '')}</div></div></div>
    <div class="rb">${descriptor.kind !== 'read' ? `<div class="meta" style="margin:0"><span>${icon('check')}تحقق من المصدر الأصلي</span><span>معرّف التدقيق: <span class="mono">${esc(res.auditId || '—')}</span></span><span class="mono">${res.ms}ms</span>${res.replayed ? '<span class="chip hold">نتيجة مكررة (نفس الطلب)</span>' : ''}</div>` : ''}${kv.length ? `<dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}${detail}${res.data ? dataTable(res.data) : ''}</div></div>`;
}

function openAction(descriptor, { onDone, prefill = {} } = {}) {
  if (!descriptor) return;
  const key = newKey(); let dirty = false; let busy = false;
  const form = document.createElement('form'); form.noValidate = false; form.autocomplete = 'off'; form.id = `af-${key}`;
  const needsConfirm = descriptor.kind !== 'read' && descriptor.danger !== 'low';
  const steps = needsConfirm ? ['الإدخال', 'التأكيد', 'التنفيذ', 'النتيجة'] : ['الإدخال', 'التنفيذ', 'النتيجة'];
  const S = needsConfirm ? { form: 0, confirm: 1, run: 2, done: 3 } : { form: 0, run: 1, done: 2 };
  form.innerHTML = `<p class="muted" style="margin-bottom:18px">${esc(descriptor.description)}</p>
    <div data-fields>${descriptor.fields.map(fieldHtml).join('')}<div class="field ${descriptor.reasonRequired || needsConfirm ? '' : 'hidden'}" data-f="_reason"><label for="f-_reason">${descriptor.reasonRequired ? 'سبب العملية *' : 'سبب العملية (اختياري)'}</label><input class="input" id="f-_reason" name="_reason" maxlength="500" placeholder="يُسجَّل في سجل التدقيق" ${descriptor.reasonRequired ? 'required minlength="3"' : ''}><div class="err" data-err></div></div></div>
    <div data-confirm class="hidden"></div><div data-proc class="hidden"></div><div data-out></div>`;
  form.addEventListener('input', () => { dirty = true; });
  const applyPrefill = () => { for (const [k, v] of Object.entries(prefill)) { const el = form.elements[k]; if (el && !el.value) { el.value = v; } } };
  applyPrefill();

  const tone = descriptor.danger === 'critical' || descriptor.danger === 'high' ? 'solid-danger' : 'primary';
  const submit = btn(descriptor.kind === 'read' ? 'عرض' : needsConfirm ? 'متابعة للتأكيد' : 'تنفيذ', { cls: tone, ic: descriptor.kind === 'read' ? 'eye' : 'bolt', type: 'submit' });
  submit.setAttribute('form', form.id); // الزر في تذييل النافذة خارج النموذج
  const cancel = btn('إغلاق', { cls: 'ghost', onClick: () => onCancel() });
  const sp = document.createElement('span'); sp.className = 'sp';
  const tags = document.createElement('span'); tags.className = 'stat-word'; tags.innerHTML = descriptor.kind === 'read' ? '<span class="chip vio">قراءة</span>' : `<span class="chip ${DANGER_TONE[descriptor.danger]}">خطورة ${DANGER_AR[descriptor.danger] || ''}</span>${descriptor.reversible ? '<span class="chip">قابل للتراجع</span>' : ''}`;
  const m = sheet({ title: descriptor.label, rack: `<span class="u">${secCode(descriptor.section)}</span> ${esc(descriptor.id)}`, glyph: descriptor.icon || 'bolt', glyphCls: ['high', 'critical'].includes(descriptor.danger) ? 'cut' : '', body: form, footer: [submit, cancel, sp, tags], steps, dirty: () => dirty && !done, wide: descriptor.kind === 'read' });
  m.setStep(S.form);
  fillLookups(form, descriptor).then(applyPrefill);
  let done = false, stage = 'form';

  function onCancel() {
    if (stage === 'confirm') { stage = 'form'; $('[data-confirm]', form).className = 'hidden'; $('[data-fields]', form).classList.remove('hidden'); submit.querySelector('span').textContent = 'متابعة للتأكيد'; cancel.querySelector('span').textContent = 'إغلاق'; m.setStep(S.form); return; }
    m.close();
  }
  const showErrors = (fields) => { for (const e of form.querySelectorAll('[data-err]')) e.textContent = ''; for (const [k, msg] of Object.entries(fields || {})) { const el = form.querySelector(`[data-f="${k}"] [data-err]`); if (el) el.textContent = msg; } };

  async function execute() {
    busy = true; setBusy(submit, true, 'جارٍ التنفيذ والتحقق…'); cancel.disabled = true;
    const out = $('[data-out]', form); out.innerHTML = '';
    const proc = $('[data-proc]', form);
    $('[data-fields]', form).classList.add('hidden'); $('[data-confirm]', form).classList.add('hidden');
    proc.className = 'processing'; proc.setAttribute('role', 'status');
    proc.innerHTML = `<div class="orb"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26"/></svg></div><b style="color:var(--ink)">جارٍ التنفيذ على المصدر الأصلي</b><ol><li class="on"><i class="tally go"></i>فحص الصلاحية والمدخلات</li><li><i class="tally"></i>تنفيذ العملية</li><li><i class="tally"></i>إعادة القراءة من المصدر للتحقق</li><li><i class="tally"></i>التسجيل في سجل التدقيق</li></ol>`;
    m.setStep(S.run);
    const lis = $$('li', proc); let k = 0; const tick = setInterval(() => { if (k < lis.length - 1) { k++; lis[k].classList.add('on'); $('.tally', lis[k]).className = 'tally hold'; } }, 650);
    try {
      const res = await post(`/api/actions/${descriptor.section}/${descriptor.shortId}/run`, { params: collect(form, descriptor), idempotencyKey: key, confirm: true, reason: form.elements._reason?.value || undefined });
      clearInterval(tick); done = true; stage = 'done'; proc.className = 'hidden';
