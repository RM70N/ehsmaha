<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>إعدادات احسمها</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { padding: 24px; max-width: 640px; margin: 0 auto; line-height: 1.7; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  section { background: var(--surface); border: 1px solid rgba(167,139,250,.2); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--soft); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .row small { color: var(--soft); display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  input[type=range] { width: 180px; accent-color: var(--accent); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
  .kv dt { color: var(--soft); } .kv dd { margin: 0; direction: ltr; text-align: right; }
  #status { min-height: 22px; font-size: 13px; color: var(--soft); }
</style>
</head>
<body>
  <h1>إعدادات احسمها</h1>

  <section>
    <h2>التطبيق</h2>
    <dl class="kv">
      <dt>إصدار التطبيق</dt><dd id="v-app">-</dd>
      <dt>إصدار محتوى الموقع</dt><dd id="v-content">-</dd>
      <dt>مصدر المحتوى</dt><dd id="v-source">-</dd>
    </dl>
    <div class="actions">
      <button id="b-check" type="button">التحقق من تحديث التطبيق</button>
      <button id="b-install" type="button" class="ghost" hidden>تثبيت التحديث وإعادة التشغيل</button>
      <button id="b-sync" type="button" class="ghost">إعادة تحميل محتوى الموقع</button>
      <button id="b-apply" type="button" class="ghost" hidden>تطبيق تحديث المحتوى الآن</button>
    </div>
  </section>

  <section>
    <h2>التشغيل</h2>
    <label class="row"><span>تشغيل احسمها مع ويندوز<small>معطّل افتراضياً</small></span><input type="checkbox" id="s-startup"></label>
    <label class="row"><span>زر الإغلاق يصغّر التطبيق إلى شريط النظام<small>يبقى شغّالاً لاستقبال الإشعارات</small></span><input type="checkbox" id="s-tray"></label>
    <label class="row"><span>حجم الواجهة <small id="zoom-val"></small></span><input type="range" id="s-zoom" min="0.7" max="1.5" step="0.05"></label>
    <div class="actions"><button id="b-full" type="button" class="ghost">ملء الشاشة (F11)</button></div>
  </section>

  <section>
    <h2>الإشعارات</h2>
    <label class="row"><span>تفعيل إشعارات ويندوز</span><input type="checkbox" data-n="enabled"></label>
    <label class="row"><span>صوت الإشعار</span><input type="checkbox" data-n="sound"></label>
    <label class="row"><span>لعبة أو محتوى جديد</span><input type="checkbox" data-n="newGame"></label>
    <label class="row"><span>الفعاليات ورسائل احسمها</span><input type="checkbox" data-n="events"></label>
    <label class="row"><span>فعاليات الستريمرز</span><input type="checkbox" data-n="streamer"></label>
    <label class="row"><span>الحساب والرسائل الخاصة<small>تظهر بنص عام على شاشة القفل</small></span><input type="checkbox" data-n="account"></label>
    <label class="row"><span>تحديثات التطبيق</span><input type="checkbox" data-n="updates"></label>
    <div class="actions"><button id="b-test" type="button" class="ghost">إرسال إشعار تجريبي</button></div>
  </section>

  <section>
    <h2>التشخيص</h2>
    <div class="actions">
      <button id="b-copy" type="button" class="ghost">نسخ بيانات التشخيص</button>
      <button id="b-logs" type="button" class="ghost">فتح مجلد السجلات</button>
    </div>
    <p style="font-size:13px;color:var(--soft);margin:8px 0 0">السجلات محلية على جهازك فقط ولا تُرسل لأي جهة، وتُحجب منها كلمات المرور والتوكنات.</p>
  </section>

  <div id="status" role="status"></div>
  <script src="settings.js"></script>
</body>
</html>
