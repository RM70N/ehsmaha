<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>احسمها | لا يوجد اتصال</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 50% 30%, #170B2D 0%, #07040D 70%); }
  .card { max-width: 460px; padding: 32px; }
  img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: var(--soft); line-height: 1.9; margin: 0 0 22px; font-size: 15px; }
  .hint { margin-top: 16px; font-size: 13px; color: var(--soft); opacity: .8; }
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>احسمها يحتاج اتصالاً بالإنترنت للتواصل مع الألعاب والبث. بنحاول نرجع الاتصال تلقائياً.</p>
    <button id="retry" type="button">إعادة المحاولة الآن</button>
    <div class="hint" id="hint">المحاولة التالية خلال ٥ ثوانٍ</div>
  </main>
  <script src="offline.js"></script>
</body>
</html>
