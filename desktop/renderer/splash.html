<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; font-src 'self'">
<title>احسمها</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 32%, #210f3f 0%, #0d0620 58%, #0b0518 100%);
    color: #f4ecff;
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; user-select: none; -webkit-app-region: drag;
  }
  .logo {
    width: 132px; height: 132px; border-radius: 30px; object-fit: contain;
    box-shadow: 0 18px 46px rgba(124, 58, 237, .45);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .logo-fallback {
    width: 132px; height: 132px; border-radius: 30px;
    background: linear-gradient(135deg, #7c3aed, #c026d3);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900;
    box-shadow: 0 18px 46px rgba(124, 58, 237, .45);
  }
  h1 { margin: 6px 0 0; font-size: 26px; font-weight: 900; letter-spacing: .5px; }
  p { margin: 0; font-size: 14px; opacity: .68; }
  .bar { width: 190px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar span { display: block; width: 42%; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #7c3aed, #c026d3); animation: slide 1.25s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-115%) } 100% { transform: translateX(255%) } }
  @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.045) } }
</style>
</head>
<body>
  <img class="logo" id="logo" src="logo.png" alt="احسمها" onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>ا</div>'">
  <h1>احسمها</h1>
  <p>جارِ تشغيل التطبيق...</p>
  <div class="bar"><span></span></div>
</body>
</html>
