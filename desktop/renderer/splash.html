<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>احسمها</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(circle at 50% 30%, #170B2D 0%, #07040D 70%); user-select: none; -webkit-app-region: drag; }
  .logo { width: 120px; height: 120px; border-radius: 28px; object-fit: contain; box-shadow: 0 16px 44px rgba(124,58,237,.4); }
  h1 { margin: 4px 0 0; font-size: 26px; font-weight: 800; }
  p { margin: 0; font-size: 14px; color: var(--soft); }
  .bar { width: 180px; height: 4px; border-radius: 99px; background: rgba(167,139,250,.18); overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; border-radius: 99px; background: var(--accent); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-120%) } 100% { transform: translateX(260%) } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100% } }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="احسمها">
  <h1>احسمها</h1>
  <p>جارٍ التشغيل</p>
  <div class="bar" aria-hidden="true"><span></span></div>
</body>
</html>
