# Render Blueprint لبوت احسمها — خدمة وحدة: البوت + طبقة الـAPI مدمجة داخله
# (خدمة وحدة شغالة 24/7 ≈ 720 ساعة بالشهر، تكفيها الـ750 ساعة المجانية بـRender).
# الاستخدام: Render Dashboard → New → Blueprint → اختر المستودع،
# وبخانة "Blueprint Path" اكتب: discord-bot/render.yaml
# القيم السرية (sync: false) يطلبها Render منك وقت الإنشاء.

services:
  # البوت — Web Service: اتصال دائم بـDiscord + منفذ PORT لـ/health وWebhook
  # البث وربط الألعاب، + طبقة الـAPI (Firebase) على منفذ داخلي 127.0.0.1.
  - type: web
    name: ehsmaha-discord-bot
    runtime: node
    rootDir: discord-bot
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        value: "1552260327008247879"
      - key: API_KEY
        sync: false
      # Service Account لقاعدة بيانات الموقع (Firebase) — لطبقة الـAPI المدمجة.
      # (API_BASE_URL ما ينحط: فاضي = الـAPI مدمجة. حطه بس لو عندك خدمة API منفصلة)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://streamgame-180b8-default-rtdb.europe-west1.firebasedatabase.app
      - key: ADMIN_IDS
        sync: false
      # مفتاح Gemini للمساعد الذكي (مطلوب) — من aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SITE_URL
        value: https://ehsmaha.com
      # ربط روم ديسكورد بألعاب الموقع: يحصر الرومات بسيرفر احسمها (Developer Mode → كلك يمين على السيرفر → Copy Server ID)
      - key: OFFICIAL_GUILD_ID
        sync: false
      # سر Webhook البث — Render يولّده تلقائياً (انسخه للي يرسل الأحداث)
      - key: STREAM_WEBHOOK_SECRET
        generateValue: true
      - key: TICKET_CLOSE_MODE
        value: archive
      - key: MEMBERS_INTENT
        value: auto
      - key: MESSAGE_CONTENT_INTENT
        value: auto
      # قاعدة بيانات البوت: بدون DATABASE_URL تنحفظ تلقائياً بشكل دائم سحابياً
      # (عبر طبقة الـAPI المدمجة) وترجع بعد كل تحديث — ما تحتاج PostgreSQL.
      # ⚠️ API_KEY لازم يبقى نفس القيمة القديمة: النسخة المحفوظة مشفّرة فيه.
