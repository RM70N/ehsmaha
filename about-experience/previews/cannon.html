<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>معاينة المدفع البشري</title>
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* Layout: بث رياضي عربي. مشهد 3D بملء الشاشة، ولوحات صلبة حادة الزوايا بظل مسطّح، ولوحة ستريمر سفلية */
:root{
  --ink:#0D1229;
  --ink-2:#171E45;
  --paper:#F6ECDC;
  --mute:rgba(246,236,220,.6);
  --hot:#FF5A1F;
  --sun:#FFD23F;
  --mint:#34E0A1;
  --red:#FF3B4E;
  --cyan:#3FD6FF;
  --line:rgba(246,236,220,.16);
  --shadow:5px 5px 0 rgba(6,8,22,.55);
  --f-disp:'Lalezar','Cairo',system-ui,sans-serif;
  --f-body:'Cairo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#E8B27A;color:var(--paper);font-family:var(--f-body);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{position:relative;height:100%;overflow:hidden;background:#E8B27A}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2}
.plate{background:var(--ink);border:2px solid var(--ink-2);box-shadow:var(--shadow);outline:1px solid var(--line);outline-offset:-5px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* الشريط العلوي */
.top{top:14px;inset-inline:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;pointer-events:none}
.brand{display:flex;align-items:stretch;background:var(--hot);box-shadow:var(--shadow);border:2px solid var(--ink)}
.brand .logo{font-family:var(--f-disp);font-size:28px;line-height:1;color:var(--ink);padding:8px 18px 6px;letter-spacing:.2px}
.brand .round{display:grid;place-items:center;padding:0 14px;background:var(--ink);font-weight:800;font-size:12px;color:var(--mute);line-height:1.1;text-align:center}
.brand .round b{display:block;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--sun);font-variant-numeric:tabular-nums}
.phase{justify-self:center;position:relative;overflow:hidden;min-width:min(340px,100%);padding:9px 26px 14px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.2px}
.phase i{position:absolute;inset-inline:0;bottom:0;height:6px;background:var(--hot);transform-origin:right;transform:scaleX(var(--p,0));transition:transform .25s linear}
.windcard{display:flex;align-items:center;gap:10px;padding:6px 16px}
.windcard svg{width:36px;height:22px;transition:transform .5s}
.windcard .wv{font-family:var(--f-disp);font-size:28px;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.windcard .wl{font-size:11px;font-weight:800;color:var(--mute);line-height:1.2}
.windcard .wl b{display:block;color:var(--paper);font-size:13px}

/* الترتيب */
.board{top:86px;inset-inline-end:16px;width:min(300px,44vw);max-height:54%;display:flex;flex-direction:column}
.board h3{margin:0;padding:8px 14px;font-family:var(--f-disp);font-weight:400;font-size:20px;color:var(--ink);background:var(--sun);display:flex;justify-content:space-between;align-items:center}
.board h3 span:last-child{font-family:var(--f-body);font-weight:900;font-size:13px;background:var(--ink);color:var(--sun);padding:0 10px}
#rows{list-style:none;margin:0;padding:4px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
#rows li{position:relative;display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto;gap:9px;align-items:center;padding:5px 8px;font-weight:800;font-size:14px;overflow:hidden;isolation:isolate;background:rgba(255,255,255,.04)}
#rows li::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:100%;z-index:-1;transform-origin:right;transform:scaleX(var(--w,0));background:rgba(255,90,31,.42);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
#rows li.top1::before{background:rgba(255,210,63,.55)}
#rows li.live{background:rgba(255,90,31,.2);box-shadow:inset 3px 0 0 var(--hot)}
#rows li.new{animation:slidein .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#rows .rk{font-family:var(--f-disp);font-weight:400;font-size:20px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums;line-height:1}
#rows li.r1 .rk{color:var(--sun)}#rows li.r2 .rk{color:#D5DAE3}#rows li.r3 .rk{color:#E09A62}
#rows canvas{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink-2);display:block;background:var(--ink-2)}
#rows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rows .vl{direction:ltr;font-variant-numeric:tabular-nums;font-weight:900}
#rows .vl small{font-size:11px;opacity:.7;margin-inline-start:2px}
#rows .vl.pend{font-weight:700;opacity:.7;font-size:12px}
#rows li.empty{display:block;color:var(--mute);font-weight:600;padding:12px;background:none}

/* سلّم الهدايا */
.ladder{top:86px;inset-inline-start:16px;width:min(236px,30vw);pointer-events:none}
.ladder h3{margin:0;padding:6px 12px;font-family:var(--f-disp);font-weight:400;font-size:18px;background:var(--mint);color:var(--ink)}
.ladder ul{list-style:none;margin:0;padding:4px 6px 6px;display:flex;flex-direction:column;gap:2px}
.ladder li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font-size:12px;font-weight:700;line-height:1.25;padding:3px 2px}
.ladder .pc{min-width:48px;text-align:center;font-family:var(--f-disp);font-size:15px;line-height:1.3;padding:0 6px;background:var(--ink-2);color:var(--sun);font-variant-numeric:tabular-nums}
.ladder li.big .pc{background:var(--sun);color:var(--ink)}
.ladder li span:last-child{color:var(--paper)}
.ladder li b{display:block;font-weight:900;font-size:12.5px}
.ladder li i{font-style:normal;color:var(--mute);font-weight:600}

/* إشعارات الهدايا */
.toasts{bottom:140px;inset-inline-end:16px;width:min(280px,60vw);display:flex;flex-direction:column;gap:5px;pointer-events:none}
.toast{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 10px 4px 4px;background:var(--ink);border-inline-start:5px solid var(--mint);box-shadow:var(--shadow);font-weight:800;font-size:13px;animation:slidein .35s cubic-bezier(.2,.9,.3,1.2)}
.toast canvas{width:28px;height:28px;border-radius:50%;display:block}
.toast .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .tx small{display:block;color:var(--mute);font-size:11px;font-weight:700}
.toast .cn{font-family:var(--f-disp);font-size:18px;color:var(--sun);font-variant-numeric:tabular-nums}
.toast.big{border-inline-start-color:var(--sun);background:linear-gradient(90deg,#3A2A06,var(--ink))}
.toast.bad{border-inline-start-color:var(--red)}

/* بانر اللاعب */
.stage{top:92px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));text-align:center;pointer-events:none}
.stage .tag{display:inline-block;padding:2px 18px;background:var(--hot);color:var(--ink);font-size:13px;font-weight:900;margin-bottom:6px;border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(6,8,22,.55)}
.stage .tag.gold{background:var(--sun)}
.stage .who{display:flex;align-items:center;justify-content:center;gap:12px}
.stage #sAv{width:62px;height:62px;border-radius:50%;border:3px solid var(--sun);box-shadow:3px 3px 0 rgba(6,8,22,.55);background:var(--ink-2);display:block}
.stage .nm{font-family:var(--f-disp);font-size:clamp(34px,4.6vw,50px);line-height:1.1;text-shadow:0 3px 0 var(--ink),0 0 24px rgba(13,18,41,.5);text-wrap:balance}
.stage .meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.stage .meta span{padding:0 12px;background:var(--ink);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;border:2px solid var(--ink-2)}
.stage .num{direction:ltr;margin-top:0;font-family:var(--f-disp);font-size:clamp(50px,7vw,76px);line-height:1.05;color:var(--sun);text-shadow:0 4px 0 var(--ink),0 0 32px rgba(255,160,40,.5);font-variant-numeric:tabular-nums}
.stage .num small{font-size:.4em;margin-inline-start:6px;color:var(--paper)}
.stage .note{display:inline-block;margin-top:2px;padding:1px 16px;background:var(--ink);border:2px solid var(--ink-2);font-weight:800;font-size:14px}
.stage.pop .nm,.stage.pop .num{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:.2}to{transform:none;opacity:1}}
.fxrow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.fxrow span{padding:0 10px;font-size:12.5px;font-weight:900;border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(6,8,22,.55)}
.fxrow .pen{background:var(--red);color:#fff}
.fxrow .buff{background:var(--mint);color:var(--ink)}
.fxrow .shd{background:var(--cyan);color:var(--ink)}

/* لوحة الستريمر */
.deck{bottom:14px;left:50%;transform:translateX(-50%);width:min(780px,calc(100% - 32px));padding:8px 10px 10px;pointer-events:auto}
.deck .bar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px;font-weight:900}
.deck .bar .lb{font-family:var(--f-disp);font-weight:400;font-size:17px;color:var(--red);letter-spacing:.2px}
.deck .en{flex:1;height:10px;background:var(--ink-2);position:relative;overflow:hidden}
.deck .en i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--e,100%);background:var(--sun);transition:width .15s linear}
.deck .bar b{font-variant-numeric:tabular-nums;color:var(--sun);min-width:26px;text-align:end}
.deck .tg{padding:1px 12px;background:var(--ink-2);border:2px solid var(--line);font-weight:900;font-size:12px;cursor:pointer}
.deck .tg[aria-pressed="true"]{background:var(--hot);color:var(--ink);border-color:var(--ink)}
.deck .grp{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.deck .grp+.grp{margin-top:6px}
.deck .gl{font-size:11px;font-weight:900;color:var(--mute);margin:6px 0 4px}
.dbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;padding:4px 2px 3px;background:var(--ink-2);border:2px solid var(--line);cursor:pointer;font-weight:900;font-size:12.5px;line-height:1.15;text-align:center;overflow:hidden;transition:transform .08s}
.dbtn:hover{border-color:var(--sun)}
.dbtn:active{transform:translateY(2px)}
.dbtn .k{position:absolute;top:1px;inset-inline-start:4px;font-family:var(--f-disp);font-weight:400;font-size:14px;color:var(--mute)}
.dbtn .c{font-family:var(--f-disp);font-weight:400;font-size:15px;color:var(--sun)}
.dbtn.pen{border-color:rgba(255,59,78,.5)}
.dbtn.pen .c{color:#FF8D99}
.dbtn.pen.on{background:var(--red);border-color:var(--ink);color:#fff}
.dbtn.pen.on .c{color:#fff}
.dbtn[disabled]{opacity:.38;cursor:not-allowed}
.dbtn::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);transform-origin:right;transform:scaleX(var(--cd,0));pointer-events:none}

.rec{bottom:150px;inset-inline-start:16px;display:flex;align-items:center;gap:10px;padding:4px 14px;font-size:12px;font-weight:900}
.rec b{font-family:var(--f-disp);font-size:22px;color:var(--sun);font-variant-numeric:tabular-nums;font-weight:400}
.snd{top:14px;inset-inline-start:calc(16px + min(236px,30vw) + 10px);width:42px;height:42px;display:grid;place-items:center;cursor:pointer;padding:0;display:none}
.sndbtn{position:absolute;z-index:2;bottom:14px;inset-inline-end:16px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;padding:0}
.sndbtn svg{width:22px;height:22px}
.sndbtn .off{display:none}.sndbtn[aria-pressed="false"] .on{display:none}.sndbtn[aria-pressed="false"] .off{display:block}

.bubble{position:absolute;z-index:3;transform:translate(-50%,-100%);padding:2px 14px;background:#fff;color:var(--ink);font-weight:900;font-size:16px;white-space:nowrap;pointer-events:none;border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(6,8,22,.55)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--ink)}
#nogl{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;text-align:center;background:var(--ink);font-size:18px;font-weight:700}

@media (max-width:900px){ .ladder{display:none} }
@media (max-width:700px){
  .top{grid-template-columns:1fr auto;top:10px;gap:8px}
  .phase{grid-column:1/-1;grid-row:2;min-width:0;width:100%;padding:5px 12px 11px;font-size:13px}
  .brand .logo{font-size:22px;padding:6px 12px 4px}.brand .round{display:none}
  .windcard{padding:4px 10px}.windcard .wl{display:none}.windcard .wv{font-size:22px}
  .board{top:112px;width:min(220px,56vw);max-height:24%}
  #rows li{grid-template-columns:18px 28px minmax(0,1fr) auto;gap:6px;padding:3px 6px;font-size:13px}
  #rows canvas{width:28px;height:28px}
  .stage{top:auto;bottom:178px}
  .stage .nm{font-size:32px}.stage .num{font-size:52px}.stage #sAv{width:46px;height:46px}
  .deck{padding:6px;bottom:8px}
  .deck .grp{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dbtn{min-height:42px;font-size:11.5px}
  .toasts{bottom:auto;top:116px;inset-inline-start:auto;inset-inline-end:16px;width:min(190px,48vw);display:none}
  .rec{display:none}
  .sndbtn{display:none}
}
@media (prefers-reduced-motion:reduce){#rows li.new,.stage.pop .nm,.stage.pop .num,.toast{animation:none}}


/* ---- معاينة: إخفاء لوحة الستريمر وزر الصوت، وإبقاء المشهد ولوحة الترتيب وسلم الهدايا ---- */
#deck,#snd{display:none!important}
html.pv-paused *{animation-play-state:paused!important}
</style>
<script src="pv-core.js"></script>
</head><body>
<div id="app" dir="rtl" lang="ar">
  <canvas id="gl" aria-label="ساحة المدفع البشري"></canvas>

  <header class="hud top">
    <div class="brand"><span class="logo">المدفع البشري</span><span class="round">الجولة<b id="rn">1</b></span></div>
    <div class="plate phase" id="phase"><span id="phaseT">…</span><i id="phaseBar"></i></div>
    <div class="plate windcard" aria-label="الرياح">
      <svg id="windSvg" viewBox="0 0 34 20" aria-hidden="true"><path d="M2 10h26M20 3l9 7-9 7" fill="none" stroke="#FFD23F" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      <span class="wv" id="wind">0.0</span>
      <span class="wl"><b>رياح</b>م/ث</span>
    </div>
  </header>

  <aside class="hud plate ladder" id="ladder" aria-label="سلم الهدايا">
    <h3>هدايا الدعم</h3>
    <ul id="ladderList"></ul>
  </aside>

  <section class="hud plate board" aria-label="الترتيب">
    <h3><span id="boardTitle">المشاركون</span><span id="boardCount">0</span></h3>
    <ul id="rows"></ul>
  </section>

  <div class="hud toasts" id="toasts" aria-live="polite"></div>

  <div class="hud stage" id="stage" hidden>
    <div class="tag" id="sTag"></div>
    <div class="who"><canvas id="sAv" width="124" height="124"></canvas><div class="nm" id="sName"></div></div>
    <div class="meta" id="sMeta"></div>
    <div class="num" id="sNum"><span id="sNumV">0.0</span><small>م</small></div>
    <div class="fxrow" id="fxRow"></div>
    <div class="note" id="sNote"></div>
  </div>

  <div class="hud plate rec" id="rec" hidden><span>الرقم القياسي</span><b id="recV">0</b><span id="recN"></span></div>

  <section class="hud plate deck" id="deck" aria-label="لوحة الستريمر">
    <div class="bar"><span class="lb">لوحة الستريمر</span><div class="en"><i id="enFill"></i></div><b id="enV">100</b><button type="button" class="tg" id="autoBtn" aria-pressed="true">ستريمر آلي</button></div>
    <div class="gl" id="obsLabel">عوائق في الجو (مفاتيح 1 إلى 8)</div>
    <div class="grp" id="obsBtns"></div>
    <div class="gl" id="penLabel">عقوبة اللاعب القادم (قبل الإطلاق)</div>
    <div class="grp" id="penBtns"></div>
  </section>

  <button class="hud plate sndbtn" id="snd" type="button" aria-pressed="false" aria-label="تشغيل الصوت">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
  </button>
  <div id="nogl" hidden>المتصفح ما يدعم WebGL، جرّب متصفح ثاني.</div>
</div>

<script type="text/plain" id="cannon-game-js">
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var app=$('#app'), canvas=$('#gl');
/* [دمج] جسر المضيف: الصفحة الأم (index.html) تعرّف window.__cannonHost لاستقبال أحداث اللعبة */
var HOST=window.__pvHost||null;
function hostCall(n,a){ try{ if(HOST&&HOST[n]) return HOST[n](a); }catch(e){} }
if(typeof THREE==='undefined'||!THREE.WebGLRenderer){ $('#nogl').textContent='تعذّر تحميل محرك الثلاثي الأبعاد. تأكد من الإنترنت ثم أعد فتح اللعبة.'; $('#nogl').hidden=false; hostCall('onError','three'); return; }
var renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ $('#nogl').hidden=false; hostCall('onError','webgl'); return; }
var IS_SMALL=Math.min(window.innerWidth,window.innerHeight)<700;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

/* ---------- ثوابت ---------- */
var RC=1.3, CANNON_L=6, PIVOT_Y=2.2, MARK_STEP=25, MARK_COUNT=16;
/* [دمج] إعدادات الجولة من شاشة الإعداد. الافتراضي = سلوك اللعبة الأصلي (دخول 14ث، رمية وحدة، رياح خفيفة، طاقة عادية) */
var CFG={entry:14,shots:1,wind:1,energyRate:1,maxAngle:89,mult:1,obs:true,pen:true,penSec:3,gift:true,auto:true,late:false,max:30};
var JERSEYS=[0xFF6A2B,0x2F7BFF,0x3FD17A,0xB45CFF,0xFF4D8D,0x19C9B4,0xFFC83D,0xE5462B];
var HELMETS=[0xF4F4F4,0xFFC83D,0xE5462B,0x2F7BFF,0x1E1E2A,0x3FD17A];
var SKINS=[0xF2C19A,0xD9A074,0xA86B45,0xFFD6B0,0x8A5A3B];
var SCREAMS=['آااااه!','يا أمييييي!','طييييير!','وين رايح؟!','ساعدوووني!','أنا أطيييير!','لااااا!','بسسس!','ماااااما!'];
var AFTER=['أنا بخير…','وين أنا؟','مرة ثانية!','دوخة','كنت بوصل!','الله يستر'];
var BOTS=['أبو فهد','سلطان','نورة','ريم','ملك_الشات','صقر','حمودي','دانة','أبو سعود','بندر','لولو','القناص','تركي','هيفاء','أبو خالد','فيصل','وتين','عبدالله'];
var BOT_MSGS=['45 100','40 90','50 85','35 80','45 70','90 100','5 90','60 75','30 95','45 99','55 60','42 96','48 88','80 55'];
var ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];

/* ---------- مساعدات ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

  uniforms:{tDiffuse:{value:null},uSpeed:{value:0},uVig:{value:0.55},uFlash:{value:0},uTime:{value:0}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'uniform sampler2D tDiffuse; uniform float uSpeed,uVig,uFlash,uTime; varying vec2 vUv; void main(){ vec2 c=vUv-0.5; float d=length(c); vec3 col=vec3(0.0); for(int i=0;i<8;i++){ float k=float(i)/7.0; vec2 uv=vUv-c*uSpeed*0.07*k; col+=texture2D(tDiffuse,uv).rgb; } col/=8.0; col=(col-0.5)*1.1+0.5; float l=dot(col,vec3(0.299,0.587,0.114)); col=mix(vec3(l),col,1.14); col*=vec3(1.04,1.0,0.93); col*=1.0-smoothstep(0.3,0.95,d)*uVig; col+=uFlash; col+=(fract(sin(dot(vUv*vec2(1.0,1.7)+uTime,vec2(12.9898,78.233)))*43758.5453)-0.5)*0.03; gl_FragColor=vec4(col,1.0); }'

function initComposer(){
  if(!(THREE.EffectComposer&&THREE.RenderPass&&THREE.UnrealBloomPass&&THREE.ShaderPass)) return false;
  try{
    var w=app.clientWidth||800,h=app.clientHeight||600,rt;
    try{ rt=new THREE.WebGLMultisampleRenderTarget(w,h,{format:THREE.RGBAFormat}); rt.samples=4; }catch(e){ rt=undefined; }
    composer=new THREE.EffectComposer(renderer,rt);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(w,h),IS_SMALL?0.4:0.5,0.5,0.92);
    composer.addPass(bloom);
    fx=new THREE.ShaderPass(FinalShader); composer.addPass(fx);
    return true;
  }catch(e){ composer=null; return false; }
}
if(!initComposer()){ renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; }
function resize(){
  var w=app.clientWidth||800,h=app.clientHeight||600, pr=Math.min(window.devicePixelRatio||1,IS_SMALL?1.5:1.75);
  renderer.setPixelRatio(pr); renderer.setSize(w,h,false);
  if(composer){ composer.setPixelRatio(pr); composer.setSize(w,h); }
  camera.aspect=w/h; camera.updateProjectionMatrix();
}

function buildStand(){

  for(t=0;t<tiers;t++){ var tb=mesh(new THREE.BoxGeometry(84,1.1,2.8),conc,36,t*1.1+0.55,-18.5-t*2.8,false); tb.receiveShadow=true; tb.castShadow=true; scene.add(tb); }

  var roof=mesh(new THREE.BoxGeometry(88,0.5,18),std(0xD8342B,0.6),36,10.8,-25.5); roof.rotation.x=0.14; scene.add(roof);
  [-5,77].forEach(function(px){ [-17,-32].forEach(function(pz){ scene.add(mesh(new THREE.CylinderGeometry(0.3,0.3,10.5,8),std(0xE6E6EE,0.4,0.6),px,5.3,pz)); }); });

  var bodyG=new THREE.BoxGeometry(0.7,0.95,0.5), headG=new THREE.SphereGeometry(0.28,8,6);
  var bm=new THREE.MeshStandardMaterial({roughness:0.85}), hm=new THREE.MeshStandardMaterial({roughness:0.8});
  var bodies=new THREE.InstancedMesh(bodyG,bm,N), heads=new THREE.InstancedMesh(headG,hm,N);
  var col=new THREE.Color(), people=[];
  for(t=0;t<tiers;t++) for(i=0;i<perTier;i++){
    var idx=t*perTier+i;
    people.push({x:-4+i*2.28+rnd(-.4,.4),y:t*1.1+1.1,z:-18.5-t*2.8,ph:rnd(0,6.28),sp:rnd(6,11)});
    col.setHSL(Math.random(),0.65,0.5); bodies.setColorAt(idx,col);
    col.set(pick(SKINS)); heads.setColorAt(idx,col);
  }
  bodies.instanceColor.needsUpdate=true; heads.instanceColor.needsUpdate=true;
  scene.add(bodies,heads);
  crowd={bodies:bodies,heads:heads,people:people,dummy:new THREE.Object3D(),excite:0.2};
}
var crowdT=0;
function updateCrowd(dt){
  if(!crowd) return; crowdT+=dt; var d=crowd.dummy, i, p, jump;
  crowd.excite+=((state==='done'?1:(cur?0.7:0.25))-crowd.excite)*Math.min(1,dt*2);
  for(i=0;i<crowd.people.length;i++){
    p=crowd.people[i]; jump=Math.max(0,Math.sin(crowdT*p.sp+p.ph))*crowd.excite*0.9;
    d.position.set(p.x,p.y+0.48+jump,p.z); d.rotation.set(0,0,0); d.updateMatrix(); crowd.bodies.setMatrixAt(i,d.matrix);
    d.position.set(p.x,p.y+1.2+jump,p.z); d.updateMatrix(); crowd.heads.setMatrixAt(i,d.matrix);
  }
  crowd.bodies.instanceMatrix.needsUpdate=true; crowd.heads.instanceMatrix.needsUpdate=true;
}

function updateFX(dt){
  var i,p,k;
  for(i=parts.length-1;i>=0;i--){
    p=parts[i]; p.life-=dt;
    if(p.life<=0){ scene.remove(p.s); p.s.material.dispose(); parts.splice(i,1); continue; }
    var dr=Math.max(0,1-p.drag*dt); p.vx*=dr; p.vy*=dr; p.vz*=dr; p.vy+=p.g*dt;
    p.s.position.x+=p.vx*dt; p.s.position.y=Math.max(0.1,p.s.position.y+p.vy*dt); p.s.position.z+=p.vz*dt;
    if(p.flutter){ p.s.position.x+=Math.sin(p.ph+p.life*7)*dt*3; }
    k=p.life/p.max; p.size+=p.grow*dt; p.s.scale.setScalar(p.size); p.s.material.opacity=p.op*Math.min(1,k*2.2); p.s.material.rotation+=p.rv*dt;
  }
  for(i=debris.length-1;i>=0;i--){
    var d=debris[i]; d.life-=dt; if(d.life<=0){ scene.remove(d.m); debris.splice(i,1); continue; }
    d.vy-=22*dt; d.m.position.x+=d.vx*dt; d.m.position.y+=d.vy*dt; d.m.position.z+=d.vz*dt; d.m.rotation.x+=d.rx*dt; d.m.rotation.z+=d.rz*dt;
    if(d.m.position.y<0.15){ d.m.position.y=0.15; d.vy*=-0.35; d.vx*=0.7; d.vz*=0.7; }
  }
  for(i=rings.length-1;i>=0;i--){
    var r=rings[i]; r.t+=dt; var q=r.t/r.life; if(q>=1){ scene.remove(r.m); r.m.material.dispose(); r.m.geometry.dispose(); rings.splice(i,1); continue; }
    var sc=1+(r.max-1)*(1-Math.pow(1-q,3)); r.m.scale.set(sc,sc,sc); r.m.material.opacity=0.85*(1-q);
  }
  muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*900);
}

  } else if(type==='cheer'){

  } else if(type==='zap'){ n=noise(); f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1600; n.connect(f); f.connect(g); env(g,t,0.003,0.7,0.4); n.start(t); n.stop(t+0.45); }

function updateObstacles(dt,t){
  var c=cur&&!cur.rest?cur:null;
  for(var i=obstacles.length-1;i>=0;i--){
    var o=obstacles[i]; o.t+=dt; o.life-=dt; var m=o.m, hitTest=true;
    if(o.id==='bird'){
      if(o.home&&c){ var dx=c.x-o.x, dy=c.y-o.y, d=Math.hypot(dx,dy)||1; o.vx+=(dx/d*20-o.vx)*dt*1.8; o.vy+=(dy/d*20-o.vy)*dt*1.8; }
      o.x+=o.vx*dt; o.y+=o.vy*dt; var wv=m.userData.w; wv[0].rotation.x=Math.sin(o.t*20)*0.9; wv[1].rotation.x=-Math.sin(o.t*20)*0.9; m.rotation.y=o.vx>0?0:Math.PI;
    } else if(o.id==='balloons'){ o.y+=o.vy*dt; o.x+=Math.sin(o.t*1.6)*dt*3; m.rotation.y+=dt*0.8; }
    else if(o.id==='plane'){ o.x+=o.vx*dt; m.userData.prop.rotation.x+=dt*60; m.rotation.y=Math.PI; if(Math.random()<dt*30) spawnP({x:o.x+4,y:o.y,z:o.z,size:1.4,grow:3,life:.8,color:0xEEEEEE,op:.5}); }
    else if(o.id==='fan'){ hitTest=false; m.userData.bl.rotation.x+=dt*16; if(c&&Math.abs(c.x-o.x)<12&&Math.abs(c.y-o.y)<7){ c.vx-=26*dt*(c.pens&&c.pens.glass?1.6:1); c.vy-=3*dt; if(Math.random()<dt*40) spawnP({x:o.x+rnd(-8,0),y:o.y+rnd(-3,3),z:o.z,vx:-22,size:.8,life:.5,color:0xCFF4FF,add:true,op:.6}); if(!o.hit){ o.hit=true; c.hits=(c.hits||0)+1; renderChips(c); showBubble('ريح قوية!',900); } } }
    else if(o.id==='lightning'){
      hitTest=false; m.position.set(o.sx,o.y,o.z); if(o.t<0.85){ o.tele.material.opacity=0.35+Math.abs(Math.sin(o.t*18))*0.6; }
      else if(!o.bolt&&o.t<1.3){ o.bolt=mkBolt(o.sx,o.y,0); o.bolt.position.z=o.z; scene.add(o.bolt); flash=Math.max(flash,0.35); shake=Math.max(shake,0.5); sfx('zap'); scene.remove(o.tele);
        if(c&&Math.abs(c.x-o.sx)<5.2) hitChar(c,o); }
      else if(o.t>=1.3&&o.bolt){ scene.remove(o.bolt); o.bolt=null; o.life=Math.min(o.life,0); }
      o.x=o.sx;
    }
    else if(o.id==='anvil'){
      if(o.t<0.9){ o.tele.material.opacity=0.3+Math.abs(Math.sin(o.t*16))*0.6; hitTest=false; }
      else{ o.vy=-52; o.y+=o.vy*dt; m.rotation.z=Math.sin(o.t*3)*0.1; if(o.y<1.4){ dustBurst(o.x,o.z,10,1); debrisBurst(o.x,o.z,6,0.8); shake=Math.max(shake,0.6); sfx('thud'); o.life=0; } }
    }
    else if(o.id==='rocket'){
      if(c){ var rx=c.x-o.x, ry=c.y-o.y, rd=Math.hypot(rx,ry)||1; o.vx+=(rx/rd*42-o.vx)*dt*2.2; o.vy+=(ry/rd*42-o.vy)*dt*2.2; }
      o.x+=o.vx*dt; o.y+=o.vy*dt; m.rotation.z=Math.atan2(o.vy,o.vx); spawnP({x:o.x-Math.cos(m.rotation.z)*2.4,y:o.y-Math.sin(m.rotation.z)*2.4,z:o.z,size:rnd(1.3,2.2),grow:3,life:.7,color:pick([0xFFC84A,0xDDDDDD]),op:.7,add:Math.random()<0.4});
    }
    else if(o.id==='ufo'){
      hitTest=false;
      if(c){ o.x+=(c.x+8-o.x)*Math.min(1,dt*2.4); o.y+=(Math.max(14,c.y+15)-o.y)*Math.min(1,dt*2); }
      m.rotation.y+=dt*2; m.userData.beam.material.opacity=0.16+Math.abs(Math.sin(o.t*10))*0.14;
      if(c&&!c.hold&&!o.hit&&Math.abs(c.x-o.x)<4.2&&c.y<o.y&&o.y-c.y<28){ o.cap+=dt; if(o.cap>0.28){ o.hit=true; if(c.invuln||c.shield>0){ if(!c.invuln) c.shield--; sparks(c); ring(c.x,c.y,c.z,0x3FD6FF,9,0.5); renderChips(c); showBubble('تصدّى!',900); } else { c.hold=1.5*(c.pens&&c.pens.glass?1.5:1); c.holdVx=c.vx; c.vx=c.vy=0; c.hits=(c.hits||0)+1; renderChips(c); showBubble('يخطفوني!!',1200); sfx('zap'); shake=Math.max(shake,0.5); } } }
    }
    m.position.set(o.x,o.y,o.z);
    if(hitTest&&c&&!o.hit){ var ddx=c.x-o.x, ddy=c.y-o.y; if(Math.abs(c.z-o.z)<7&&ddx*ddx+ddy*ddy<(o.r+1.7)*(o.r+1.7)) hitChar(c,o); }
    if(o.life<=0||o.y<-6){ killObstacle(o); obstacles.splice(i,1); }
  }
}

      shake=Math.max(shake,0.35+imp*0.8); sfx('thud'); showBubble(c.bounces===1?'آخخخ!':'آخ!',800);

    if(c.sparkT<=0&&c.t<2.6&&!c.onGround){ c.sparkT=0.018; spawnP({x:c.x,y:c.y,z:c.z,vx:rnd(-2,2)-c.vx*0.06,vy:rnd(-2,2),vz:rnd(-2,2),size:rnd(0.5,0.9),life:rnd(.3,.6),color:pick([0xFFC84A,0xFF6A2B]),add:true,g:-3}); }

var GIFT_ALIAS={'rose':'rose','finger heart':'finger','fingerheart':'finger','doughnut':'donut','donut':'donut','hand hearts':'hearts','handhearts':'hearts','corgi':'corgi','money gun':'moneygun','moneygun':'moneygun','galaxy':'galaxy','lion':'lion'};

<script>/* راوند توضيحي: المدفع البشري (نسخة معاينة معزولة)
   المحرك (cannon-game-*) من index.html كما هو: المدفع، الرياح، الطيران، الهبوط، المسافة، لوحة الترتيب.
   المسافات والفائز يحسبها المحرك فعليًا، والسيناريو يرسل فقط أوامر الشات ودعمًا وهميًا. */
(function () {
  'use strict';
  PV.game = 'cannon';
  var host = window.__pvHost = {
    onReady: function () {}, onError: function (k) { PV.emit('error', String(k)); },
    onResult: function (r) { host.result = r; }, onRoundOver: function () {}, result: null
  };
  function begin(id) {
    var S = function (ms) { return PV.sleep(ms, id); }, HC = window.HC;
    HC.configure({ entry: 3.4, shots: 1, wind: 0, maxAngle: 89, mult: 1, obs: true, pen: false, gift: true, auto: false, late: false, max: 30 });
    HC.show();
    HC.begin([], { entry: 3.4, shots: 1, wind: 0, maxAngle: 89, mult: 1, obs: true, pen: false, gift: true, auto: false, late: false, max: 30 });
    PV.emit('step', { i: 0 });
    (async function () {
      await S(700);
      PV.emit('chat', { name: 'فيصل', text: '45 80', cmd: true }); window.ehsemhaChat('فيصل', '45 80');
      await S(1100);
      PV.emit('chat', { name: 'مشاري', text: '50 90', cmd: true }); window.ehsemhaChat('مشاري', '50 90');
      /* انتظر دور الإطلاق */
      var seen = {}, tries = 0;
      while (!host.result) {
        await S(100);
        var cur = window.__pv && window.__pv.cur(), st = HC.state();
        if (st === 'firing') {
          if (cur && !seen['s:' + cur.p.name]) { seen['s:' + cur.p.name] = 1; PV.emit('step', { i: 1 }); }
          if (cur && cur.p.name === 'مشاري' && !cur.rest && !seen.sup && cur.t > 0.5) {
            seen.sup = 1;
            PV.emit('step', { i: 2 });
            PV.emit('gift', { from: 'مشاهد', gift: 'دونات' }); HC.gift('مشاهد', 'donut', 30, 1);
            await S(450);
            PV.emit('obstacle', { name: 'طيور' }); HC.key('Digit1');
          }
          if (cur && cur.rest && !seen['l:' + cur.p.name]) { seen['l:' + cur.p.name] = 1; PV.emit('landed', { name: cur.p.name, dist: cur.p.dist }); PV.emit('step', { i: 3 }); }
        }
        if (++tries > 2400) { PV.emit('error', 'timeout'); return; }
      }
      PV.emit('step', { i: 4 });
      PV.emit('result', { winner: host.result.winner.name, dist: host.result.winner.dist, results: host.result.results });
      await S(4200);
      PV.emit('done');
    })().catch(function () {});
  }
  function waitReady() {
    PV.run(async function (id) {
      var tries = 0;
