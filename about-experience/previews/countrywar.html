<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>معاينة لعبة الدول</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root {
  /* خلفيات */
  --bg: #0b0518;
  --bg-2: #0d0620;
  --bg-3: #130a25;
  --surface: #1a1030;
  --surface2: #1c1234;
  --border: rgba(167,139,255,.16);
  --border-strong: rgba(167,139,255,.3);

  /* نص */
  --text: #EDE9FF;
  --muted: #8C7BB6;

  /* براند / لمسات */
  --accent: #7C3AED;
  --accent2: #A78BFF;
  --accent-light: #C4B0FF;
  --accent-dark: #4C1D95;
  --text-on-accent: #14071f;
  --brand-violet: #8B5CF6;

  /* فرق/حالات */
  --brand-pink: #EC4899;
  --brand-cyan: #22D3EE;
  --brand-amber: #F59E0B;
  --brand-green: #34D399;
  --green: #34D399;
  --orange: #F59E0B;
  --gray-letter: #4b5563;
  --red: #ef4444;
  --gold: #F59E0B;

  /* تعطيل */
  --disabled-bg: #241a3d;
  --disabled-text: #5f5286;

  /* انحناءات */
  --radius-pill: 999px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --r: 16px;

  /* ظلال الأزرار (شكل الزر ثلاثي الأبعاد) */
  --shadow-btn: 0 6px 0 var(--accent-dark), 0 14px 32px rgba(124,58,237,.45);
  --shadow-btn-pressed: 0 2px 0 var(--accent-dark);

  /* خطوط */
  --font: 'Tajawal', sans-serif;
  --font-brand: 'Cairo', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0518;color:#EDE9FF;overflow:hidden;font-family:'Tajawal',system-ui,sans-serif;direction:rtl}

/* مسرح الراوند (9:16) — منسوخ كما هو من ملف "شاشات الراوند" */
.rd-stage{position:relative;width:min(98%,640px);aspect-ratio:9/16;height:auto;max-height:min(88vh,960px);margin:0 auto;container-type:size;overflow:hidden;background:transparent;border-radius:var(--radius-lg);box-shadow:none;direction:rtl;font-family:'Tajawal',system-ui,sans-serif;flex:0 0 auto;transition:width .25s ease,max-height .25s ease;}
/* لما يختفي شات البث (المستخدم يضغط إخفاء) تاخذ شاشة الراوند مساحة أكبر
   وتظل متمركزة تماماً في نص الشاشة بدل ما تظل بنفس المقاس الصغير. */
.chat-collapsed .rd-stage{width:min(92%,880px);max-height:min(94vh,1220px);}
/* على الجوال (والشاشات الضيقة) الشات ينزل تحت المحتوى ويأخذ حتى 38vh
   (راجع القاعدة العامة لـ [class$="-layout"])، فمسرح الراوند لازم يتقلّص
   لمقاس يتماشى فعلياً مع المساحة المتبقية بدل نسبة vh عمومية كبيرة كانت
   تخليه يتزاحم مع الشات وعناصر الموقع الثابتة (لوحة المتصدرين/النقاط). */
@media (max-width:768px){
  .rd-stage{width:min(100%,440px);max-height:min(56dvh,680px);}
  .chat-collapsed .rd-stage{width:min(100%,480px);max-height:min(78dvh,860px);}
}
@media (max-width:480px){
  .rd-stage{max-height:min(50dvh,560px);}
  .chat-collapsed .rd-stage{max-height:min(72dvh,720px);}
}
.rd-stage *{box-sizing:border-box;}
/* أثناء الراوند يختفي عنوان اللعبة الكبير ليأخذ مسرح الراوند المساحة كاملة */
.page.rd-live .game-title-header{display:none;}
/* وبنفس المنطق تختفي كل عناصر "قبل الراوند" (شريط الحالة/زر الكلمة
   المفتاحية/قائمة المشاركين وشريط جولة الكراسي) أثناء الراوند نفسه، لأنها
   كانت تبقى ظاهرة فوق مسرح الراوند وتزاحمه على المساحة، وهذا بالضبط ما كان
   يسبب "التداخل" في الشاشات الصغيرة أو عند التكبير (زوم): المساحة المتاحة
   لمسرح الراوند تصير غير كافية فيتراكب مع ما فوقه. تفريغ هذه المساحة يحل
   المشكلة في الألعاب الثلاث دفعة واحدة (الروليت/حرب الدول/الكرسي المتحرك). */
.page.rd-live .status-strip,
.page.rd-live .game-special-btn,
.page.rd-live .participants-overlay,
.page.rd-live .chairs-round-bar{display:none !important;}
/* يمنع إيماءة تكبير الصفحة (pinch-zoom) وتكبير النقر المزدوج داخل مسرح
   الراوند تحديداً لهذه الألعاب الثلاث فقط (بدون التأثير على باقي الموقع) —
   هذا هو سبب التداخل عند "الزوم" فعلياً: عناصر الموقع الثابتة (لوحة
   المتصدرين والنقاط أعلى الشاشة، position:fixed) لا تتحرك بنفس تناسق تكبير
   اللمس على الجوال فتتراكب مع محتوى الراوند. */
.roulette-layout,.cw-layout,.chairs-layout,.rd-stage{touch-action:manipulation;}
.rd-l1{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 60% at 50% 0%,rgba(36,18,69,.55) 0%,rgba(21,10,44,.28) 45%,transparent 85%);}
.rd-l2{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(50% 30% at 50% 82%,rgba(232,160,200,.11),transparent 70%);}
.rd-l3{position:absolute;inset:0;border-radius:inherit;opacity:.5;background-image:linear-gradient(rgba(227,195,106,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(227,195,106,.045) 1px,transparent 1px);background-size:6cqw 6cqw;-webkit-mask-image:radial-gradient(ellipse 78% 78% at 50% 45%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 78% 78% at 50% 45%,#000 55%,transparent 100%);}
.rd-inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.5cqw 3.5cqw 4cqw;gap:2.4cqw;}

.rd-head{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding:0 1cqw;}
.rd-head-side{display:flex;align-items:baseline;gap:1.6cqw;}
.rd-num-gold{font-family:'Amiri',serif;font-size:9cqw;font-weight:700;color:#E3C36A;line-height:1;text-shadow:0 0 4cqw rgba(227,195,106,.45);}
.rd-num-pink{font-family:'Amiri',serif;font-size:9cqw;font-weight:700;color:#E8A0C8;line-height:1;}
.rd-head-lbl{font-size:3.4cqw;font-weight:700;color:#C9B7E8;}

.rd-body{flex:1;display:flex;flex-direction:column;gap:2.6cqw;min-height:0;}

/* ===== منشور القرعة (حرب الدول) ===== */
.rd-lens{position:relative;height:30cqw;flex:0 0 auto;border-radius:4cqw;overflow:hidden;background:linear-gradient(180deg,#150a2c,#20103f 50%,#150a2c);border:.5cqw solid rgba(227,195,106,.28);box-shadow:inset 0 0 8cqw rgba(0,0,0,.75),0 0 6cqw rgba(227,195,106,.12);}
.rd-lens-view{position:absolute;inset:0;overflow:hidden;}
.rd-lens-track{will-change:transform;}
.rd-lens-row{height:30cqw;display:flex;align-items:center;justify-content:center;gap:3cqw;}
.rd-lens-chip{width:14cqw;height:14cqw;border-radius:3.6cqw;display:grid;place-items:center;font-family:'Amiri',serif;font-size:8cqw;color:#150a2c;font-weight:700;box-shadow:0 .8cqw 3cqw rgba(0,0,0,.5);flex:0 0 auto;overflow:hidden;}
.rd-lens-name{font-family:'Amiri',serif;font-size:11cqw;font-weight:700;color:#F6EBD0;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62cqw;}
.rd-lens-vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,6,32,.95),transparent 26%,transparent 74%,rgba(13,6,32,.95));pointer-events:none;}
.rd-lens-line{position:absolute;left:0;right:0;top:50%;height:.35cqw;transform:translateY(-50%);background:linear-gradient(90deg,transparent,#E3C36A,transparent);opacity:.9;}
.rd-beam{position:absolute;top:0;bottom:0;width:1.6cqw;animation:rdBeam 1.6s ease-in-out infinite;}
.rd-beam.l{left:0;background:linear-gradient(90deg,rgba(232,160,200,.85),transparent);}
.rd-beam.r{right:0;background:linear-gradient(-90deg,rgba(232,160,200,.85),transparent);}
.rd-scan{position:absolute;left:0;right:0;height:6cqw;background:linear-gradient(180deg,transparent,rgba(227,195,106,.16),transparent);animation:rdScanline 2.2s linear infinite;pointer-events:none;}
.rd-lens-tag{position:absolute;top:1.4cqw;right:2.4cqw;font-size:2.8cqw;font-weight:700;letter-spacing:.2cqw;color:rgba(227,195,106,.75);}

/* ===== شبكة الدول (حرب الدول) ===== */
.rd-cgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:1.8cqw;align-content:center;overflow-y:auto;overflow-x:hidden;}
.rd-ccard{position:relative;border-radius:2.6cqw;padding:1.8cqw .6cqw;display:flex;flex-direction:column;align-items:center;gap:1cqw;background:#1a0d33;border:.4cqw solid rgba(227,195,106,.16);cursor:pointer;transition:opacity .35s ease,transform .35s cubic-bezier(.16,1,.3,1);}
/* شريحة العلم مستطيلة 3:2 لا مربّعة: الأعلام كلها أفقية، فالمربّع كان يحصر
   عرض العلم في نصف عرض البطاقة المتاح ويطلع صغيراً وغير واضح (وأكثرها تضرراً
   علم السعودية بنص الشهادة). العرض هنا صار 1.5× والارتفاع كما هو تماماً —
   فالعلم يكبر بلا أي تغيّر في ارتفاع البطاقة أو تخطيط الشبكة. */
.rd-ccard .rd-chip{width:14.1cqw;height:9.4cqw;border-radius:2.6cqw;display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:5.6cqw;font-weight:700;color:#150a2c;box-shadow:0 .6cqw 2.4cqw rgba(0,0,0,.45);overflow:hidden;flex:0 0 auto;}
/* contain لا cover: cover كان يقصّ العلم ليملأ الشريحة فيضيع طرفه المميّز
   (المثلث الأسود بعلم الكويت والشريط الأحمر بعلم الإمارات، فيظهران كعلمين
   مختلفين تماماً). مع width/height:100% + contain يكبر العلم لأقصى حجم يسعه
   داخل الشريحة بنسبته الحقيقية: لا قصّ ولا خروج عن حدودها حتى للأعلام المربّعة
   (سويسرا 1:1). الشريحة flex لا grid عشان يكون ارتفاعها محدّداً فيُحسب
   height:100% عليه — بصف grid تلقائي كان الارتفاع يُحسب من المحتوى فيتجاوز
   العلمُ المربّع حدودَ الشريحة ويُقصّ بـoverflow:hidden. */
.rd-ccard .cw-flag-img{width:100%;height:100%;aspect-ratio:auto;object-fit:contain;border-radius:2.6cqw;box-shadow:none;}
.rd-ccard .cw-country-flag{font-size:6cqw;line-height:1;}
.rd-cname{font-size:3.1cqw;font-weight:700;color:#F6EBD0;text-align:center;line-height:1.1;}
.rd-ccard-aim{position:absolute;inset:-.4cqw;border-radius:3.2cqw;border:.6cqw solid #E8A0C8;box-shadow:0 0 6cqw rgba(232,160,200,.8);opacity:0;transition:opacity .2s ease;pointer-events:none;}
.rd-ccard.aim{transform:scale(1.1);}
.rd-ccard.aim .rd-ccard-aim{opacity:1;}
.rd-ccard.eliminated{opacity:.28;filter:grayscale(1);cursor:not-allowed;}

/* ===== لوحة اللاعبين وأرقامهم (دائرة الإقصاء) ===== */
.rd-roster{flex:0 0 auto;border-radius:3.4cqw;padding:2.2cqw 2cqw;background:#1a0d33;border:.45cqw solid rgba(227,195,106,.26);box-shadow:inset 0 0 6cqw rgba(0,0,0,.55),0 1cqw 4cqw rgba(0,0,0,.45);}
.rd-roster-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.6cqw;padding:0 .6cqw;}
.rd-roster-t1{font-size:3cqw;font-weight:700;color:rgba(227,195,106,.8);}
.rd-roster-t2{font-size:2.8cqw;font-weight:700;color:#8E77BC;}
.rd-roster-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2cqw;max-height:44cqw;overflow-y:auto;overflow-x:hidden;}
.rd-roster-grid::-webkit-scrollbar,.rd-cgrid::-webkit-scrollbar{width:.8cqw;}
.rd-roster-grid::-webkit-scrollbar-thumb,.rd-cgrid::-webkit-scrollbar-thumb{background:rgba(227,195,106,.25);border-radius:1cqw;}
.rd-rcell{display:flex;flex-direction:column;align-items:center;gap:.4cqw;padding:1.2cqw .2cqw;border-radius:2.2cqw;background:rgba(13,6,32,.55);border:.4cqw solid rgba(227,195,106,.16);transition:background .25s ease,border-color .25s ease;min-width:0;}
.rd-rcell-chip{width:8cqw;height:8cqw;border-radius:50%;display:grid;place-items:center;font-family:'Amiri',serif;font-size:4.6cqw;font-weight:700;color:#150a2c;flex:0 0 auto;overflow:hidden;}
.rd-rcell-num{font-family:'Amiri',serif;font-size:6.4cqw;font-weight:700;line-height:1;color:#E3C36A;}
.rd-rcell-name{font-size:2.5cqw;font-weight:700;color:#C9B7E8;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.rd-rcell.chooser{background:linear-gradient(160deg,rgba(227,195,106,.34),rgba(227,195,106,.1));border-color:#E3C36A;}
.rd-rcell.chooser .rd-rcell-num{color:#FFF3D4;}
.rd-rcell.aim{background:linear-gradient(160deg,rgba(232,160,200,.42),rgba(232,160,200,.14));border-color:#E8A0C8;}
.rd-rcell.aim .rd-rcell-num{color:#FFE2F1;}

/* ===== حلقة الطاقة (دائرة الإقصاء) ===== */
.rd-chooser{display:none;flex:0 0 auto;border-radius:3cqw;padding:2cqw 3cqw;background:linear-gradient(90deg,rgba(227,195,106,.18),rgba(232,160,200,.14));border:.4cqw solid rgba(227,195,106,.55);align-items:center;justify-content:center;gap:2.4cqw;transform-origin:top;}
.rd-chooser.show{display:flex;animation:rdBannerIn .45s cubic-bezier(.16,1,.3,1) both;}
.rd-chooser-lbl{font-size:3.6cqw;font-weight:700;color:#C9B7E8;flex:0 0 auto;}
.rd-chooser-name{font-family:'Amiri',serif;font-size:9cqw;font-weight:700;color:#FFF3D4;line-height:1;text-shadow:0 0 5cqw rgba(227,195,106,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rd-circle{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;}
.rd-circle-box{position:relative;aspect-ratio:1;height:min(78cqw,100%);max-width:100%;}
.rd-ring-in{position:absolute;inset:6cqw;border-radius:50%;border:.4cqw solid rgba(227,195,106,.16);}
.rd-ring-dash{position:absolute;inset:0;border-radius:50%;border:.35cqw dashed rgba(232,160,200,.2);}
.rd-ring{position:absolute;inset:2cqw;border-radius:50%;will-change:transform;}
.rd-ring-grad{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(227,195,106,0) 0deg,rgba(227,195,106,0) 300deg,rgba(232,160,200,.35) 336deg,rgba(227,195,106,.95) 358deg,rgba(255,255,255,.9) 360deg);-webkit-mask:radial-gradient(circle,transparent 0 41%,#000 41.5% 50%,transparent 50.5%);mask:radial-gradient(circle,transparent 0 41%,#000 41.5% 50%,transparent 50.5%);filter:blur(.2cqw);}
.rd-ring-dot{position:absolute;left:50%;top:0;width:3.2cqw;height:3.2cqw;margin-left:-1.6cqw;margin-top:-1.6cqw;border-radius:50%;background:#FFF6DE;box-shadow:0 0 6cqw 1.4cqw rgba(227,195,106,.8);}
.rd-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;}
.rd-center-num{font-family:'Amiri',serif;font-size:22cqw;font-weight:700;line-height:.9;color:#E3C36A;text-shadow:0 0 7cqw rgba(227,195,106,.45);}
.rd-center-lbl{font-size:3.4cqw;font-weight:700;color:#C9B7E8;letter-spacing:.3cqw;}
.rd-pnode{position:absolute;transform:translate(-50%,-50%) scale(1);display:flex;flex-direction:column;align-items:center;gap:.8cqw;transition:transform .3s cubic-bezier(.16,1,.3,1);}
.rd-pnode-av{position:relative;width:calc(12.4cqw * var(--rd-ns,1));height:calc(12.4cqw * var(--rd-ns,1));border-radius:50%;display:grid;place-items:center;font-family:'Amiri',serif;font-size:calc(7.2cqw * var(--rd-ns,1));font-weight:700;color:#150a2c;box-shadow:0 .8cqw 3cqw rgba(0,0,0,.5);}
.rd-pnode-glow{position:absolute;inset:-1cqw;border-radius:50%;border:.7cqw solid #FFF3D4;box-shadow:0 0 6cqw rgba(227,195,106,.9);opacity:0;}
.rd-pnode-name{font-size:calc(3cqw * var(--rd-ns,1));font-weight:700;color:#F6EBD0;background:rgba(13,6,32,.75);padding:.3cqw 1.4cqw;border-radius:2cqw;white-space:nowrap;max-width:26cqw;overflow:hidden;text-overflow:ellipsis;}
.rd-pnode.live{transform:translate(-50%,-50%) scale(1.2);z-index:2;}
.rd-pnode.live .rd-pnode-glow{opacity:1;}

/* ===== تذييل المسرح: التلميح + زر البدء ===== */
.rd-foot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1.6cqw;}
.rd-hint{font-size:3.2cqw;font-weight:700;color:#C9B7E8;min-height:4cqw;text-align:center;}
.rd-cta{width:100%;display:flex;align-items:center;justify-content:center;}
.rd-btn{display:inline-flex;align-items:center;justify-content:center;gap:2cqw;font-family:'Tajawal',sans-serif;font-weight:700;border-radius:999px;cursor:pointer;transition:transform .12s cubic-bezier(.22,1,.36,1),filter .12s cubic-bezier(.22,1,.36,1);padding:0 8cqw;font-size:5cqw;height:13cqw;background:#C9A84C;color:#0D0D14;border:.3cqw solid #C9A84C;box-shadow:0 0 0 .8cqw rgba(201,168,76,.2);white-space:nowrap;}
.rd-btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-.3cqw);}
.rd-btn:disabled{opacity:.45;cursor:not-allowed;}

/* ===== سجل الإقصاء أسفل المسرح (يبقى كما هو وظيفياً بألوان التصميم الجديد) ===== */
#cw-elim-log,#rou-elim-log{width:min(100%,520px);margin:14px auto 0;gap:6px;}
#cw-elim-log .cw-elim-item,#rou-elim-log .elim-item{background:rgba(26,13,51,.85);border:1px solid rgba(232,160,200,.35);border-radius:12px;box-shadow:none;padding:8px 14px;}
#cw-elim-log .cw-elim-text,#rou-elim-log .elim-text{color:#F6EBD0;font-size:13px;}
#cw-elim-log .cw-elim-sub,#rou-elim-log .elim-sub{color:#8E77BC;}

/* ===== طبقة الإقصاء (نفس أنيميشن التصميم الجديد) ===== */
.rd-ov{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(58,26,86,.94),rgba(9,4,22,.985));backdrop-filter:blur(1.8cqw);animation:rdOvBack 2.2s linear both;z-index:6;}
.rd-ov-card{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:2cqw;animation:rdOvCard 2.2s cubic-bezier(.16,1,.3,1) both;}
.rd-ov-stage{position:relative;width:100%;height:40cqw;display:grid;place-items:center;}
.rd-shock{position:absolute;width:34cqw;height:34cqw;border-radius:50%;border:.8cqw solid rgba(227,195,106,.9);animation:rdShock 2.2s ease-out both;}
.rd-shock2{position:absolute;width:34cqw;height:34cqw;border-radius:50%;border:.6cqw solid rgba(232,160,200,.8);animation:rdShock2 2.2s ease-out both;}
.rd-sparks{position:absolute;display:grid;place-items:center;width:0;height:0;}
.rd-spark{position:absolute;}
.rd-spark i{display:block;width:1.2cqw;height:4cqw;border-radius:1cqw;background:linear-gradient(180deg,#FFF3D4,rgba(232,160,200,0));}
.rd-clapL{position:absolute;animation:rdClapL 2.2s cubic-bezier(.2,.9,.25,1) both;}
.rd-clapR{position:absolute;animation:rdClapR 2.2s cubic-bezier(.2,.9,.25,1) both;}
.rd-hand{position:relative;width:16cqw;height:19cqw;}
.rd-hand i{position:absolute;display:block;}
.rd-hand .p{bottom:0;left:0;width:16cqw;height:13cqw;border-radius:46% 54% 38% 62%/58% 42% 62% 38%;box-shadow:0 1cqw 4cqw rgba(0,0,0,.5);}
.rd-hand .f1{top:1.2cqw;left:1.4cqw;width:3cqw;height:8cqw;border-radius:2cqw;transform:rotate(-14deg);}
.rd-hand .f2{top:0;left:5cqw;width:3.2cqw;height:9.5cqw;border-radius:2cqw;transform:rotate(-5deg);}
.rd-hand .f3{top:.6cqw;left:8.8cqw;width:3.2cqw;height:9cqw;border-radius:2cqw;transform:rotate(4deg);}
.rd-hand .f4{top:2.4cqw;left:12.2cqw;width:3cqw;height:7.4cqw;border-radius:2cqw;transform:rotate(12deg);}
.rd-hand .th{bottom:1.4cqw;right:-2.2cqw;width:6.4cqw;height:3.4cqw;border-radius:2cqw;transform:rotate(-30deg);}
.rd-hand.gold .p{background:linear-gradient(150deg,#F6E0AE,#C9A84C);}
.rd-hand.gold .f1{background:linear-gradient(180deg,#F6E0AE,#D8B85F);}
.rd-hand.gold .f2{background:linear-gradient(180deg,#F9E9C4,#D8B85F);}
.rd-hand.gold .f3{background:linear-gradient(180deg,#F6E0AE,#D8B85F);}
.rd-hand.gold .f4{background:linear-gradient(180deg,#EFD79E,#C9A84C);}
.rd-hand.gold .th{background:linear-gradient(90deg,#EFD79E,#C9A84C);}
.rd-hand.pink .p{background:linear-gradient(150deg,#F6C9DF,#C97FA8);}
.rd-hand.pink .f1{background:linear-gradient(180deg,#F6C9DF,#D492B6);}
.rd-hand.pink .f2{background:linear-gradient(180deg,#FBDDEC,#D492B6);}
.rd-hand.pink .f3{background:linear-gradient(180deg,#F6C9DF,#D492B6);}
.rd-hand.pink .f4{background:linear-gradient(180deg,#F0BBD5,#C97FA8);}
.rd-hand.pink .th{background:linear-gradient(90deg,#F0BBD5,#C97FA8);}
.rd-fly{position:absolute;left:14cqw;animation:rdFlyOut 2.2s cubic-bezier(.32,.02,.2,1) both;}
.rd-fly-av{width:22cqw;height:22cqw;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-family:'Amiri',serif;font-size:12cqw;font-weight:700;color:#150a2c;box-shadow:0 0 8cqw rgba(232,160,200,.6),0 1.2cqw 4cqw rgba(0,0,0,.6);border:.7cqw solid rgba(255,243,212,.9);}
.rd-fly-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.rd-ov-name{font-family:'Amiri',serif;font-size:19cqw;font-weight:700;line-height:1;color:#FFF3D4;text-shadow:0 0 9cqw rgba(232,160,200,.65);animation:rdBigIn 2.2s cubic-bezier(.16,1,.3,1) both;text-align:center;padding:0 4cqw;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rd-ov-out{font-family:'Amiri',serif;font-size:13cqw;font-weight:700;line-height:1;color:#E8A0C8;letter-spacing:1cqw;animation:rdBigIn 2.2s cubic-bezier(.16,1,.3,1) .06s both;}
.rd-ov-sub{font-size:4cqw;font-weight:700;color:#C9B7E8;animation:rdSubIn 2.2s ease both;text-align:center;padding:0 6cqw;}

/* ===== الكراسي المخفيّة (الكرسي المتحرك) ===== */
.rd-chairs-hidden{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34cqw;height:34cqw;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(227,195,106,.2),rgba(13,6,32,0) 70%);border:.5cqw solid rgba(227,195,106,.25);}
.rd-chairs-hidden span{font-family:'Amiri',serif;font-size:7cqw;font-weight:700;color:#E3C36A;text-align:center;line-height:1.2;animation:rdGoldPulse 1.8s ease-in-out infinite;}

@keyframes rdOvBack{0%{opacity:0}6%{opacity:1}86%{opacity:1}100%{opacity:0}}

.cw-turn-banner.show{display:flex;animation:rdBannerIn .5s cubic-bezier(.16,1,.3,1) both;}
.cw-turn-title{font-size:4cqw;font-weight:700;color:#C9B7E8;flex:0 0 auto;}
.cw-turn-name{font-family:'Amiri',serif;font-size:10cqw;font-weight:700;color:#FFF3D4;line-height:1;text-shadow:0 0 5cqw rgba(227,195,106,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fx-shake{animation:fxShake .5s ease;}

.pv-win{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(70% 50% at 50% 45%,rgba(227,195,106,.22),rgba(13,6,32,.92) 70%);animation:rdOvBack 6s ease both;animation-fill-mode:forwards}

.pv-win-card{display:flex;flex-direction:column;align-items:center;gap:2.4cqw;animation:pvWinIn .7s cubic-bezier(.16,1,.3,1) both}
.pv-win-av{width:30cqw;height:30cqw;border-radius:50%;overflow:hidden;border:.9cqw solid #E3C36A;box-shadow:0 0 8cqw rgba(227,195,106,.55)}
.pv-win-av img{width:100%;height:100%;object-fit:cover;display:block}
.pv-win-k{font-size:3.6cqw;font-weight:700;color:#E8A0C8;letter-spacing:.3cqw}
.pv-win-name{font-family:'Amiri',serif;font-size:13cqw;font-weight:700;color:#FFF3D4;line-height:1;text-shadow:0 0 5cqw rgba(227,195,106,.6)}
.pv-win-country{display:flex;align-items:center;gap:2.4cqw;font-size:5.4cqw;font-weight:800;color:#F6EBD0}
.pv-win-country .cw-flag-img{width:11cqw;height:auto;aspect-ratio:3/2;object-fit:contain;border-radius:1.2cqw}
.pv-win-sub{font-size:3.2cqw;font-weight:700;color:#C9B7E8}
@media (prefers-reduced-motion:reduce){.pv-win-card{animation:none}}

<script>/* راوند توضيحي: لعبة الدول (نسخة معاينة معزولة)
   المنطق المرسوم هنا مأخوذ من countrywar في index.html: رسم منشور القرعة، شبكة الدول، مؤثر الإقصاء.
   الأحداث والأسماء وهمية محلية، ولا شيء منها يتصل بالبث أو الحسابات. */
(function () {
  'use strict';
  PV.game = 'countrywar';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---- أدوات مشتركة منسوخة من تصميم شاشة الراوند ---- */
  var RD_HUES = [45, 300, 275, 330, 38, 285, 262, 320];
  function rdGrad(i) { var h = RD_HUES[((i % RD_HUES.length) + RD_HUES.length) % RD_HUES.length]; return 'linear-gradient(145deg,hsl(' + h + ' 72% 78%),hsl(' + (h + 18) + ' 58% 52%))'; }
  function rdAr(n) { return String(n); }
  function rdLetter(name) { var s = String(name == null ? '' : name).replace(/^@/, '').trim() || '؟'; var core = s.indexOf('ال') === 0 ? s.slice(2) : s; return core[0] || '؟'; }
  function rdHash(str) { var h = 0; str = String(str || ''); for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }

  /* ---- معطيات وهمية محلية ---- */
  var FLAGS = window.PV_FLAGS || {};
  var BANK = [
    { name: 'السعودية', code: 'sa' }, { name: 'الكويت', code: 'kw' },
    { name: 'قطر', code: 'qa' }, { name: 'الامارات', code: 'ae' }
  ];
  function avatar(seed, hue) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(' + hue + ' 70% 62%)"/><stop offset="1" stop-color="hsl(' + (hue + 30) + ' 55% 34%)"/></linearGradient></defs><rect width="64" height="64" fill="url(#g)"/><circle cx="32" cy="25" r="11" fill="hsl(' + (hue + 10) + ' 40% 88%)"/><path d="M10 64c2-15 12-22 22-22s20 7 22 22z" fill="hsl(' + (hue + 10) + ' 40% 88%)"/></svg>';
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }
  var USERS = [
    { uniqueId: 'mishari', nickname: 'مشاري', avatar: avatar('m', 268) },
    { uniqueId: 'nawaf', nickname: 'نواف', avatar: avatar('n', 192) },
    { uniqueId: 'faisal', nickname: 'فيصل', avatar: avatar('f', 330) },
    { uniqueId: 'sultan', nickname: 'سلطان', avatar: avatar('s', 38) }
  ];
  /* التعيين السري محفوظ بالسيناريو فقط، ولا يظهر إلا عند الإقصاء */
  var SECRET = { mishari: 'السعودية', nawaf: 'الكويت', faisal: 'الامارات', sultan: 'قطر' };
  /* نواف يقصي قطر (سلطان) ثم فيصل يقصي الكويت (نواف) ثم مشاري يقصي الامارات (فيصل) فيفوز مشاري بالسعودية */
  var TURNS = [
    { turn: 'nawaf', pick: 'قطر' },
    { turn: 'faisal', pick: 'الكويت' },
    { turn: 'mishari', pick: 'الامارات' }
  ];

  var participants = new Map(), active = [], eliminated = new Set();
  USERS.forEach(function (u) { participants.set(u.uniqueId, u); });

  function flagImg(c) { return '<img class="cw-flag-img" src="' + (FLAGS[c.code] || '') + '" alt="">'; }
  function chipInner(user) {
    var letter = esc(rdLetter(user.nickname));
    return user.avatar ? '<img src="' + user.avatar + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">' : letter;
  }

  function updateHead() {
    $('cw-remain-num').textContent = rdAr(active.length);
    $('cw-round-num').textContent = rdAr(eliminated.size + 1);
  }
  function renderGrid() {
    var grid = $('cw-countries-grid'); grid.innerHTML = '';
    var all = active.map(function (c) { return c.name; }).concat(Array.from(eliminated));
    var idx = 0;
    BANK.filter(function (c) { return all.indexOf(c.name) >= 0; }).forEach(function (c) {
      var card = document.createElement('div');
      card.className = 'rd-ccard' + (eliminated.has(c.name) ? ' eliminated' : '');
      card.dataset.name = c.name;
      card.innerHTML = '<div class="rd-ccard-aim"></div><div class="rd-chip" style="background:' + rdGrad(idx) + '">' + flagImg(c) + '</div><div class="rd-cname">' + esc(c.name) + '</div>';
      idx++; grid.appendChild(card);
    });
    updateHead();
  }
  /* نفس drawCWWheel الأصلية */
  function drawWheel(rotationAngle) {
    var track = $('cw-lens-track'); var n = active.length;
    if (n === 0) { track.innerHTML = ''; return; }
    var slice = (2 * Math.PI) / n;
    var pos = rotationAngle === 0 ? 0 : (-rotationAngle / slice) - 0.5;
    var base = Math.floor(pos), frac = pos - base;
    if (track.dataset.base !== String(base) || track.dataset.count !== String(n)) {
      track.dataset.base = String(base); track.dataset.count = String(n);
      var html = '';
      for (var i = -1; i <= 2; i++) {
        var idx = (((base + i) % n) + n) % n, entry = active[idx], user = participants.get(entry.uid);
        html += '<div class="rd-lens-row"><div class="rd-lens-chip" style="background:' + rdGrad(idx) + '">' + chipInner(user) + '</div><div class="rd-lens-name">' + esc(user.nickname) + '</div></div>';
      }
      track.innerHTML = html;
    }
    track.style.transform = 'translateY(' + (-(frac + 1) * 30).toFixed(3) + 'cqw)';
    updateHead();
  }
  function spin(winnerIdx, dur) {
    return new Promise(function (resolve) {
      var n = active.length, slice = (2 * Math.PI) / n;
      var finalAngle = -(winnerIdx * slice + slice / 2) - 5 * 2 * Math.PI, start = performance.now();
      (function animate(now) {
        var t = Math.min((now - start) / dur, 1), eased = 1 - Math.pow(1 - t, 3);

        if (t < 1) requestAnimationFrame(animate); else resolve();
      })(performance.now());
    });
  }
  /* مؤثر الإقصاء الأصلي (rdElimOverlay) بدون الصوت */
  function elimOverlay(user, sub) {
    var stage = $('cw-stage'), nickname = user.nickname, letter = esc(rdLetter(nickname)), grad = rdGrad(rdHash(nickname));
    var prev = stage.querySelector('.rd-ov'); if (prev) prev.remove();
    var sparks = '';
    for (var i = 0; i < 12; i++) sparks += '<div class="rd-spark" style="transform:rotate(' + (i * 30) + 'deg)"><i style="animation:rdSpark 2.2s cubic-bezier(.16,1,.3,1) ' + ((i % 4) * 0.03) + 's both"></i></div>';
    var hand = function (c) { return '<div class="rd-hand ' + c + '"><i class="p"></i><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i><i class="th"></i></div>'; };
    var ov = document.createElement('div'); ov.className = 'rd-ov';
    ov.innerHTML = '<div class="rd-ov-card"><div class="rd-ov-stage"><div class="rd-shock"></div><div class="rd-shock2"></div><div class="rd-sparks">' + sparks + '</div><div class="rd-clapL">' + hand('gold') + '</div><div class="rd-clapR">' + hand('pink') + '</div><div class="rd-fly"><div class="rd-fly-av" style="background:' + grad + '"><img src="' + user.avatar + '" alt=""></div></div></div><div class="rd-ov-name">' + esc(nickname) + '</div><div class="rd-ov-out">خــرج</div><div class="rd-ov-sub">' + esc(sub) + '</div></div>';
    stage.appendChild(ov);
    setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 2250);
    var g = $('cw-countries-grid'); g.classList.remove('fx-shake'); void g.offsetWidth; g.classList.add('fx-shake');
  }
  function showWinner(user, country) {
    var c = BANK.filter(function (x) { return x.name === country; })[0];
    var el = document.createElement('div'); el.className = 'pv-win';
    el.innerHTML = '<div class="pv-win-card"><div class="pv-win-av"><img src="' + user.avatar + '" alt=""></div><div class="pv-win-k">الفائز</div><div class="pv-win-name">' + esc(user.nickname) + '</div><div class="pv-win-country">' + flagImg(c) + '<span>' + esc(country) + '</span></div><div class="pv-win-sub">آخر دولة بقيت في الحرب</div></div>';
    $('cw-stage').appendChild(el);
  }

  function boot() {
    PV.run(async function (id) {

      $('cw-stage').classList.add('pv-ready');
      var spinResult = $('cw-spin-result');
      spinResult.textContent = 'في انتظار المشاركين'; spinResult.className = 'cw-spin-result show';
      PV.emit('step', { i: 0 });

      await S(450);

      PV.emit('step', { i: 1 });
      active = USERS.map(function (u) { var name = SECRET[u.uniqueId]; return { name: name, code: BANK.filter(function (b) { return b.name === name; })[0].code, uid: u.uniqueId }; });
      renderGrid(); drawWheel(0);
      spinResult.textContent = 'اضغط لتدوير منشور القرعة'; spinResult.className = 'cw-spin-result show';

      for (var r = 0; r < TURNS.length; r++) {
        var T = TURNS[r], fast = r > 0;
        PV.emit('step', { i: 2 });
        spinResult.className = 'cw-spin-result'; $('cw-turn-banner').className = 'cw-turn-banner';
        var wIdx = active.findIndex(function (a) { return a.uid === T.turn; });
        await spin(wIdx, fast ? 2300 : 3200);
        var turnUser = participants.get(T.turn);
        spinResult.textContent = 'الدور على ' + turnUser.nickname; spinResult.className = 'cw-spin-result show';
        $('cw-turn-name').textContent = turnUser.nickname; $('cw-turn-banner').className = 'cw-turn-banner show';
        /* إبراز البطاقة المستهدفة قبل الإقصاء */
        await S(fast ? 700 : 1000);
        PV.emit('step', { i: 3 });
        PV.emit('chat', { name: turnUser.nickname, text: T.pick, cmd: true });
        var card = document.querySelector('.rd-ccard[data-name="' + T.pick + '"]'); if (card) card.classList.add('aim');
        await S(fast ? 800 : 1100);
        PV.emit('step', { i: 4 });
        var ownerUid = active.filter(function (a) { return a.name === T.pick; })[0].uid, owner = participants.get(ownerUid);
        var self = ownerUid === T.turn;
        elimOverlay(owner, self ? (turnUser.nickname + ' أقصى نفسه') : ('أقصاها ' + turnUser.nickname + ' · ' + T.pick));
        active = active.filter(function (a) { return a.name !== T.pick; }); eliminated.add(T.pick);
        PV.emit('elim', { country: T.pick, owner: owner.nickname, by: turnUser.nickname, remaining: active.length });
        spinResult.textContent = turnUser.nickname + ' قصى دولة ' + T.pick + ' (' + owner.nickname + ')'; spinResult.className = 'cw-spin-result show';
        $('cw-turn-banner').className = 'cw-turn-banner';
        renderGrid();
        await S(fast ? 1700 : 2100);
        if (active.length > 1) { drawWheel(0); }
      }
      PV.emit('step', { i: 5 });
      var win = active[0], wu = participants.get(win.uid);
      showWinner(wu, win.name);
      PV.emit('result', { winner: wu.nickname, country: win.name });
      await S(3600);
      PV.emit('done');
    });
  }
  PV.onCmd(function (cmd) { if (cmd === 'start') boot(); });
  if (document.fonts && document.fonts.ready) { Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1200); })]).then(function () { PV.emit('ready'); boot(); }); }
  else { PV.emit('ready'); boot(); }
})();
</script>
</body></html>
