<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اكذب عليّ — احسمها</title>
<style>:root{--bg:#160F22;--bg2:#1d1430;--panel:#241a38;--panel2:#2c2145;--line:#3b2d5c;--v:#7B3FE4;--vl:#B79CFF;--ink:#F4EDE0;--mute:#a99cc4;--gold:#E3B94F;--amber:#F2A33A;--red:#E5484D;--calm:#59C3A5;--r:14px;--fs:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI','Noto Naskh Arabic','Noto Sans Arabic',Tahoma,'Geeza Pro',system-ui,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
.screen{min-height:100vh}
:focus-visible{outline:2px solid var(--vl);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.6em 1.1em;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:#372a58;border-color:#54407f}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--v);border-color:var(--v);color:#fff}
.btn.pri:hover{background:#8d55ee}
.btn.big{padding:.85em 1.4em;font-size:1.08em}
.btn.sm{padding:.3em .7em;font-size:.88em}
.btn.warn{border-color:#7a3a46;color:#ffb3b8}
.btn.ghost{background:transparent}
/* ───── الافتتاحية ───── */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
.in-wrap{text-align:center;position:relative;width:min(92vw,720px)}
.in-cards{height:210px;position:relative;margin-bottom:18px}
.ic{position:absolute;left:50%;top:0;width:128px;height:178px;margin-left:-64px;border-radius:14px;background:linear-gradient(160deg,#35265a,#221836);border:1px solid #5b44899e;display:grid;place-items:center;opacity:0;animation:icfly 1s cubic-bezier(.2,.8,.2,1) forwards}
.ic::before{content:'';position:absolute;inset:7px;border:1px solid rgba(183,156,255,.25);border-radius:9px}
.ic b{font-size:56px;font-weight:900;color:var(--vl);opacity:.9}
.ic:nth-child(1){--x:-150px;--r:-9deg;animation-delay:.1s}
.ic:nth-child(2){--x:0px;--r:0deg;animation-delay:.28s}
.ic:nth-child(3){--x:150px;--r:9deg;animation-delay:.46s}
@keyframes icfly{from{opacity:0;transform:translate(calc(var(--x)*3),-160px) rotate(calc(var(--r)*4)) scale(.7)}to{opacity:1;transform:translate(var(--x),0) rotate(var(--r)) scale(1)}}
.in-title{font-size:clamp(46px,9vw,84px);font-weight:900;line-height:1.1;position:relative;display:inline-block;overflow:hidden;padding:0 .1em}
.in-title::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 1.1s 1.3s ease-in-out forwards;mix-blend-mode:overlay}
@keyframes sweep{to{transform:translateX(120%)}}
.in-phrase{margin-top:14px;font-size:clamp(17px,2.6vw,24px);color:var(--vl);opacity:0;animation:fadeup .7s 1.9s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.in-skip{position:fixed;bottom:22px;left:22px;color:var(--mute);font-size:.9em;border:1px solid var(--line);padding:.35em .9em;border-radius:99px}
/* ───── العلامة والعنوان ───── */
.ek-title{font-weight:900;line-height:1.15;color:var(--ink);text-shadow:.045em .05em 0 var(--v);letter-spacing:0;position:relative;display:inline-block}
.ek-title .liar{color:var(--vl)}
.ek-tag{display:block;margin-top:.15em;height:.28em}
.mark{display:inline-flex;align-items:center;gap:.4em;font-size:.82em;color:var(--mute)}
.mark i{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--v);box-shadow:.35em 0 0 -.1em var(--gold)}
/* ───── شاشة البداية ───── */
#scStart{display:grid;place-items:center;padding:28px 16px}
.st-box{max-width:640px;width:100%;text-align:center}
.st-box .logo{width:112px;height:112px;margin:0 auto 10px;display:block}
.st-box .ek-title{font-size:clamp(54px,12vw,96px)}
.st-box .phrase{margin:18px auto 28px;color:var(--vl);font-size:clamp(17px,3vw,22px)}
.st-btns{display:grid;gap:12px;max-width:340px;margin:0 auto}
.st-foot{margin-top:34px}
/* ───── الإعداد ───── */
#scSetup{padding:0 0 60px}
.su-top{position:sticky;top:0;z-index:5;background:rgba(22,15,34,.96);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.su-top h1{font-size:1.2em;flex:1;min-width:140px}
.su-body{max-width:1000px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:.5em 1.1em;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-weight:600}
.tab.on{background:var(--v);border-color:var(--v);color:#fff}
.summ{padding:.7em 1em;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);margin-bottom:14px;font-size:.95em;color:var(--mute)}
.summ b{color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fld>label,.fld>.lb{font-weight:600;font-size:.95em}
.fld small{color:var(--mute);font-size:.82em}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea,.rc textarea,.search{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5em .7em;width:100%}
.fld textarea{min-height:84px;resize:vertical;color:var(--text);font:inherit}
.fld input[type=range]{width:100%;accent-color:var(--v)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px}
.sw input{width:20px;height:20px;accent-color:var(--v)}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.rc.bad{border-color:#7a3a46}
.rc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rc-h b{font-size:1.05em}
.rc-h .sp{flex:1}
.badge{font-size:.78em;padding:.15em .7em;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.badge.ok{color:var(--calm);border-color:#2f6b5b}
.badge.err{color:#ffb3b8;border-color:#7a3a46}
.badge.warn{color:var(--amber);border-color:#7a5a24}
.badge.demo{color:var(--gold);border-color:#6d5a22}
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rc-st{display:flex;flex-direction:column;gap:5px}
.rc-st textarea{min-height:92px;resize:vertical}
.rc-st .meta{display:flex;justify-content:space-between;font-size:.82em;color:var(--mute)}
.rc-st .meta .over{color:var(--red)}
.rc-st label.pick{display:flex;gap:6px;align-items:center;font-size:.9em}
.rc-st label.pick input{accent-color:var(--red)}
.rc.inv .rc-st label.pick input{accent-color:var(--calm)}
.rc-ex{margin-top:10px}
.rc-ex textarea{min-height:56px}
.rc-pv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pv{border:1px solid var(--line);border-radius:10px;padding:.5em .7em;background:var(--bg2);font-size:.82em;min-height:3.4em;position:relative}
.pv i{font-style:normal;font-weight:800;color:var(--vl);margin-left:.3em}
.pv.t{border-color:var(--red)}
.rc.inv .pv.t{border-color:var(--calm)}
.pv em{position:absolute;top:-.7em;left:.5em;font-style:normal;font-size:.8em;background:var(--red);color:#fff;border-radius:99px;padding:0 .6em}
.rc.inv .pv em{background:var(--calm);color:#0b2b22}
.bank-i{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.bank-i.used{opacity:.55}
.bank-i ol{flex:1;padding-inline-start:1.2em;font-size:.92em}
.search{margin-bottom:12px}
.empty{color:var(--mute);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:var(--r)}
/* ───── شاشة اللعب ───── */
#scGame{height:100vh;overflow:hidden}
.gm{display:flex;height:100vh}
#stageWrap{flex:1;min-width:0;min-height:0;position:relative}
#stage{position:absolute;inset:0}
#host{width:340px;flex:none;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
body.cleanview #host,body.aud #host{display:none}
body.aud #scStart,body.aud #scSetup{display:none!important}
.hp-sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.hp-sec h3{font-size:.86em;color:var(--mute);font-weight:600;margin-bottom:8px}
.hp-state{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hp-state b{font-size:1.1em}
.hp-state span{color:var(--mute);font-size:.88em}
.hp-main{width:100%;margin-top:10px}
.hp-why{font-size:.8em;color:var(--amber);margin-top:6px;min-height:1.2em}
.hp-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hp-row .btn{flex:1;white-space:nowrap}
.live{display:grid;gap:5px;margin-top:6px}
.live div{display:grid;grid-template-columns:1.2em 1fr 2.8em;align-items:center;gap:6px;font-size:.85em}
.live i{display:block;height:7px;border-radius:99px;background:var(--bg);position:relative;overflow:hidden}
.live i::after{content:'';position:absolute;inset:0;width:var(--p,0%);background:var(--vl);border-radius:99px}
.secret{font-weight:800;font-size:1.05em}
.secret.lie{color:var(--red)}.secret.tr{color:var(--calm)}
.qlist{display:grid;gap:6px;max-height:190px;overflow:auto}
.qi{display:flex;gap:6px;align-items:center;font-size:.86em;background:var(--bg);border-radius:10px;padding:.3em .5em}
.qi span{flex:1;min-width:0;overflow-wrap:anywhere}
.qi small{color:var(--mute)}
.nlog{font-size:.8em;color:var(--mute);display:grid;gap:3px;max-height:120px;overflow:auto}
.nlog .ok{color:var(--calm)}.nlog .no{color:#ffb3b8}
details.tp>summary{cursor:pointer;font-weight:600;font-size:.92em}
.tp .box{display:grid;gap:8px;margin-top:10px}
.tp .r2{display:flex;gap:6px;flex-wrap:wrap}
.tp input,.tp select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:.35em .6em;min-width:0;flex:1}
.hp-top{display:flex;gap:6px;flex-wrap:wrap}
.hp-top .btn{flex:1;white-space:nowrap}
#modal{position:fixed;inset:0;z-index:70;background:rgba(10,6,18,.78);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:480px;width:100%;max-height:86vh;overflow:auto}
.mbox h2{margin-bottom:10px;font-size:1.15em}
.mbox ul{padding-inline-start:1.2em;display:grid;gap:7px;margin-bottom:14px}
.mbox .row{justify-content:flex-end}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:grid;gap:6px;pointer-events:none;width:max-content;max-width:92vw}
.tst{background:var(--panel2);border:1px solid var(--line);padding:.55em 1em;border-radius:99px;font-size:.92em;animation:fadeup .25s}
/* ───── المسرح ───── */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;gap:.8em;padding:.9em 1.2em .9em;background:var(--bg);color:var(--ink);font-size:var(--fs);overflow:hidden}
.stage *{min-width:0}
.st-top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:1em;position:relative;padding-bottom:.75em}
.st-brand{display:flex;align-items:center;gap:.6em}
.st-brand svg{width:2.2em;height:2.2em}
.st-name{font-weight:900;font-size:1.5em;text-shadow:.05em .06em 0 var(--v)}
.st-round{font-size:1.05em;color:var(--mute);font-weight:600}
.st-state{padding:.25em 1em;border:1px solid var(--line);border-radius:99px;font-size:.95em;font-weight:700;color:var(--vl);background:var(--bg2);white-space:nowrap}
.stage[data-phase=voting] .st-state{color:var(--amber);border-color:#7a5a24}
.st-pc{font-size:.95em;color:var(--mute)}.st-pc b{color:var(--ink);font-size:1.15em}
.st-tbar{position:absolute;left:0;right:0;bottom:0;height:.35em;border-radius:99px;background:var(--bg2);overflow:hidden}
.st-tbar i{display:block;height:100%;width:0;background:var(--vl);border-radius:99px;transition:width .2s linear,background .3s}
.st-tbar.hot i{background:var(--amber)}
.st-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 17em;gap:1.1em}
.st-center{position:relative;display:flex;flex-direction:column;gap:.8em;min-height:0}
.st-banner{align-self:center;padding:.3em 1.3em;border-radius:99px;font-weight:800;font-size:1.05em;border:1px solid var(--amber);color:var(--amber);background:rgba(242,163,58,.08)}
.st-banner.g{border-color:var(--calm);color:var(--calm);background:rgba(89,195,165,.08)}
.st-cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;align-items:center}
.card{position:relative;display:flex;flex-direction:column;gap:.7em;background:linear-gradient(180deg,#2b2048,#231a3a);border:1px solid var(--line);border-radius:.9em;padding:1.1em 1.2em 1em;overflow:hidden;min-height:min(100%,30em);max-height:100%;transition:border-color .4s,opacity .4s,background .4s;animation:dealIn .6s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
@keyframes dealIn{from{opacity:0;transform:translateY(-1.4em) rotate(-2deg)}to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;inset:.4em;border:1px solid rgba(183,156,255,.16);border-radius:.6em;pointer-events:none}
.c-head{display:flex;align-items:center;gap:.7em;position:relative}
.c-no{flex:none;width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font-size:1.5em;font-weight:900;background:var(--v);color:#fff;box-shadow:0 0 0 .18em rgba(123,63,228,.28)}
.c-title{font-size:.85em;color:var(--mute);letter-spacing:.02em;line-height:1.3}
.c-title b{display:block;color:var(--vl);font-size:1.05em}
.c-seal{margin-inline-start:auto;width:1.6em;height:1.6em;border-radius:50%;border:1px dashed rgba(183,156,255,.45);position:relative}
.c-seal::after{content:'';position:absolute;inset:.35em;border-radius:50%;border:1px solid rgba(183,156,255,.35)}
.c-text{flex:1;min-height:0;overflow:auto;font-size:calc(1.5em*var(--ts,1));line-height:1.62;font-weight:500;overflow-wrap:anywhere;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.62em - 1px),rgba(183,156,255,.09) calc(1.62em - 1px),rgba(183,156,255,.09) 1.62em);scrollbar-width:none;padding-top:.05em}
.c-text.long{font-size:calc(1.12em*var(--ts,1))}
.c-foot{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.4em .7em;min-height:2.3em;visibility:hidden}
.stage[data-phase=tally] .c-foot,.stage[data-phase=reveal] .c-foot,.stage[data-phase=explain] .c-foot,.stage[data-phase=scores] .c-foot{visibility:visible}
.c-bar{height:.7em;border-radius:99px;background:var(--bg);overflow:hidden}
.c-bar i{display:block;height:100%;width:var(--p,0%);background:var(--vl);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.c-pct{direction:ltr;unicode-bidi:isolate;font-weight:900;font-size:1.35em;min-width:2.6em;text-align:left}
.c-sub{grid-column:1/-1;font-size:.82em;color:var(--mute)}
.c-stamp{position:absolute;top:66%;left:50%;transform:translate(-50%,-50%) rotate(-9deg) scale(1);font-size:2.6em;font-weight:900;padding:.05em .5em;border:.09em solid;border-radius:.3em;opacity:0;pointer-events:none;background:rgba(22,15,34,.55)}
.card.lie{border-color:var(--red);background:linear-gradient(180deg,#3a1d3c,#2a1832)}
.card.lie .c-no{background:var(--red)}
.card.lie .c-stamp{color:var(--red);opacity:1;animation:stampIn .45s cubic-bezier(.2,1.3,.4,1) both}
.card.lie .c-bar i{background:var(--red)}
.card.truth{border-color:rgba(89,195,165,.55)}
.card.truth .c-no{background:#2f7d69}
.card.truth .c-stamp{color:var(--calm);opacity:1;animation:stampIn .45s cubic-bezier(.2,1.3,.4,1) both}
.card.truth .c-bar i{background:var(--calm)}
@keyframes stampIn{from{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(2.2)}to{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(1)}}
.stage[data-phase=locked] .card{border-color:#7a5a24}
.st-explain{border:1px solid rgba(89,195,165,.45);background:rgba(89,195,165,.07);border-radius:.9em;padding:.7em 1.1em;max-height:34%;overflow:auto;font-size:1.05em}
.st-explain b{color:var(--calm)}
.st-explain .nm{display:block;margin-top:.35em;font-size:.88em;color:var(--mute)}
.st-q{position:absolute;left:50%;top:.2em;transform:translateX(-50%);max-width:82%;background:var(--panel2);border:1px solid var(--amber);border-radius:1em;padding:.9em 1.4em;font-size:1.35em;font-weight:700;text-align:center;box-shadow:0 .6em 2em rgba(0,0,0,.5);animation:fadeup .3s;z-index:3}
.st-q small{display:block;font-size:.6em;color:var(--amber);margin-bottom:.2em}
.st-lobby,.st-final,.st-tie{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;text-align:center}
.lob-h{font-size:1.2em;color:var(--mute)}
.lob-word{font-size:3.6em;font-weight:900;padding:.05em .7em;border-radius:.3em;border:.06em dashed var(--vl);color:var(--ink);text-shadow:.05em .06em 0 var(--v)}
.lob-n{font-size:1.2em;color:var(--mute)}.lob-n b{font-size:1.6em;color:var(--ink)}
.chips{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;max-width:90%;max-height:6.8em;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.2em .8em .2em .3em;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:.92em;max-width:12em}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85em;background:hsl(var(--h,260) 45% 38%);color:#fff;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fin-h{font-size:1.1em;color:var(--mute)}
.fin-w{font-size:2.6em;font-weight:900;color:var(--gold);overflow-wrap:anywhere;max-width:100%}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:.8em;margin:.3em 0;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:.3em;width:30%;max-width:13em}
.pod .av{width:3.2em;height:3.2em;font-size:1.1em}
.pod .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pt{color:var(--mute);font-size:.88em}
.pod .bk{width:100%;border-radius:.6em .6em 0 0;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:start center;padding-top:.3em;font-size:1.8em;font-weight:900;color:var(--vl)}
.pod.p1 .bk{height:6.4em;border-color:var(--gold);color:var(--gold)}.pod.p2 .bk{height:4.6em}.pod.p3 .bk{height:3.4em}
.fin-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7em;width:100%;max-width:56em}
.fs{background:var(--panel);border:1px solid var(--line);border-radius:.9em;padding:.6em .8em}
.fs small{display:block;color:var(--mute);font-size:.8em}
.fs b{font-size:1.3em}
.fs.big b{color:var(--red);font-size:1.7em}
.fin-title{font-weight:800;color:var(--vl);font-size:1.15em}

      <rect x="46" y="20" width="54" height="74" rx="8" transform="rotate(8 73 57)" fill="none" stroke="#F4EDE0" stroke-opacity=".35"/>
      <circle cx="63" cy="48" r="4.6" fill="#F4EDE0"/><circle cx="87" cy="52" r="4.6" fill="#F4EDE0"/>
      <path d="M60 70 Q74 62 88 74" stroke="#F4EDE0" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="98" cy="22" r="6" fill="#E3B94F"/>
    </symbol>
  </defs>

<script>/* ═════════ اكذب عليّ — المنطق (بدون DOM) ═════════ */
const EkLogic = (function () {
  'use strict';
  function mulberry32(a) {
    a = a >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hashStr(s) { let h = 2166136261 >>> 0; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function normalize(t) {
    let s = String(t == null ? '' : t);
    s = s.replace(/[​-‏‪-‮⁦-⁩﻿]/g, '');
    s = s.replace(/[ً-ٰٟـ]/g, '');
    s = s.replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0));
    s = s.replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();
    s = s.replace(/[!؟?.،,:;"'«»()\[\]{}\-_+*#@~|\\/]/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }
  /* يحلل رسالة الشات: تصويت، «واثق n»، أو «سؤال ...» */
  function parseMsg(text, maxQ) {
    const raw = String(text == null ? '' : text).replace(/[​-‏‪-‮⁦-⁩﻿]/g, '').trim();
    if (!raw) return null;
    const n = normalize(raw);
    if (/^[123]$/.test(n)) return { k: 'vote', n: parseInt(n, 10) - 1, conf: false };
    let m = n.match(/^واثق ([123])$/);
    if (m) return { k: 'vote', n: parseInt(m[1], 10) - 1, conf: true };
    m = raw.match(/^سؤال[\s:：،,\-]+([\s\S]+)$/);
    if (m) {
      const q = m[1].replace(/\s+/g, ' ').trim();
      if (!q) return null;
      if (maxQ && q.length > maxQ) return { k: 'q', tooLong: true };
      return { k: 'q', text: q };
    }
    return null;
  }

  const DEF = {
    joinWord: 'انضم', rounds: 5, answerSecs: 25, interrogation: true, interrogSecs: 60, confident: true,
    allowEdit: true, shuffle: true, textSize: 'medium', sfx: 80, maxQLen: 90, maxQPerUser: 2, goalPct: 60, camera: false
  };
  const PHASE_LABEL = {
    idle: 'جاهز', lobby: 'الانضمام', present: 'تقديم القصص', ask: 'الاستجواب', voting: 'التصويت مفتوح', locked: 'الإجابات مقفلة',
    tally: 'كشف النسب', reveal: 'كشف الكذبة', explain: 'الحقيقة', scores: 'الترتيب', tieHold: 'تعادل', final: 'النهاية'
  };

  class Match {
    constructor(opts) {
      opts = opts || {};
      this.cfg = Object.assign({}, DEF, opts.cfg || {});
      this.rng = mulberry32((opts.seed != null ? opts.seed : (Date.now() ^ 0x5bd1e995)) >>> 0);
      this.handlers = {};
      this.rounds = []; this.reserve = [];
      this.players = new Map(); this.order = [];
      this._reset();
    }
    _reset() {
      this.phase = 'idle'; this.phaseT = 0; this.phaseDur = Infinity; this.paused = false; this.gameTime = 0;
      this.ri = -1; this.cur = null; this.answered = 0; this.questions = []; this.qShown = null; this.qCount = new Map();
      this.history = []; this.winners = []; this.endInfo = null; this.notices = []; this.reserveUsed = 0; this.tiedIds = null;
      this.stats = { votes: 0, wrong: 0 }; this.leadBefore = null; this.lastScoresDelta = null; this.finishedFlag = false;
    }
    on(n, f) { (this.handlers[n] = this.handlers[n] || []).push(f); return this; }
    emit(n, d) {
      (this.handlers[n] || []).slice().forEach(h => { try { h(d); } catch (e) { console.error(e); } });
      (this.handlers['*'] || []).slice().forEach(h => { try { h(n, d); } catch (e) { console.error(e); } });
    }
    configure(c) { Object.assign(this.cfg, c || {}); }
    setRounds(a) { this.rounds = a.map(r => ({ stories: r.stories.map(String), target: r.target | 0, explain: String(r.explain || ''), inverted: !!r.inverted })); }
    setReserve(a) { this.reserve = a.map(r => ({ stories: r.stories.map(String), target: r.target | 0, explain: String(r.explain || ''), inverted: !!r.inverted })); }
    aliveList() { return this.order.map(id => this.players.get(id)); }
    notice(t) { this.notices.unshift({ t, at: this.gameTime }); if (this.notices.length > 30) this.notices.pop(); this.emit('notice', t); }

    /* ---------- اللاعبون ---------- */
    addPlayer(u) {
      const id = String(u.userId);
      if (!id || this.players.has(id)) return { ok: false, reason: 'duplicate' };
      const p = {
        id, name: String(u.nickname || id).replace(/[\u0000-\u001f]/g, '').slice(0, 40) || id, avatar: /^https?:\/\//i.test(u.avatarUrl || '') ? u.avatarUrl : '',
        points: 0, correct: 0, confUsed: false, confWins: 0, confLoss: 0, vote: null, joinIndex: this.order.length, hue: hashStr(id) % 360, roundPts: 0, lastDelta: 0
      };
      this.players.set(id, p); this.order.push(id);
      this.emit('playerJoined', { id, name: p.name, avatarUrl: p.avatar, count: this.players.size });
      return { ok: true, player: p };
    }

    /* ---------- استقبال الشات ---------- */
    receiveChat(msg) {
      if (!msg || msg.userId == null || String(msg.userId) === '') return { ok: false, reason: 'invalid' };
      const text = String(msg.text == null ? '' : msg.text);
      if (!text.trim()) return { ok: false, reason: 'empty' };
      const id = String(msg.userId), ph = this.phase;
      if (ph === 'lobby') {
        if (normalize(text) === normalize(this.cfg.joinWord)) { const r = this.addPlayer(msg); return r.ok ? { ok: true, action: 'join' } : { ok: false, reason: r.reason }; }
        return { ok: false, reason: 'ignored' };
      }
      const p = this.players.get(id);
      if (ph === 'voting') {
        if (!p) return { ok: false, reason: 'not-player' };
        if (this.paused) return { ok: false, reason: 'paused' };
        const c = parseMsg(text);
        if (!c || c.k !== 'vote') return { ok: false, reason: 'ignored' };
        let conf = c.conf;
        if (conf && !this.cfg.confident) return { ok: false, reason: 'ignored' };
        if (conf && p.confUsed) { conf = false; this.notice('«' + p.name + '» كرر «واثق» بعد استهلاكه — عُدّ تصويتًا عاديًا'); }
        if (p.vote && !this.cfg.allowEdit) return { ok: false, reason: 'locked-first' };
        const first = !p.vote;
        p.vote = { n: c.n, conf, at: this.gameTime };
        if (first) this.answered++;
        this.emit('voteReceived', { id, first });
        return { ok: true, action: conf ? 'confident' : 'vote' };
      }
      if (ph === 'ask') {
        if (!p) return { ok: false, reason: 'not-player' };
        if (this.paused) return { ok: false, reason: 'paused' };
        const c = parseMsg(text, this.cfg.maxQLen);
        if (!c || c.k !== 'q') return { ok: false, reason: 'ignored' };
        if (c.tooLong) return { ok: false, reason: 'q-too-long' };
        const n = this.qCount.get(id) || 0;
        if (n >= this.cfg.maxQPerUser) return { ok: false, reason: 'q-limit' };
        const key = normalize(c.text);
        if (this.questions.some(q => q.key === key)) return { ok: false, reason: 'q-dup' };
        this.qCount.set(id, n + 1);
        const q = { id: this.questions.length + 1, key, text: c.text, by: p.name, uid: id, shown: false };
        this.questions.push(q);
        this.emit('questionReceived', { id: q.id });
        return { ok: true, action: 'question' };
      }
      return { ok: false, reason: p ? 'closed' : 'not-player' };
    }

    /* ---------- التحكم ---------- */
    openLobby() { this._enter('lobby', Infinity); }
    canStart() { return this.phase === 'lobby' && this.rounds.length > 0; }
    startMatch() {
      if (!this.canStart()) return false;
      const keepRounds = this.rounds, keepRes = this.reserve;
      for (const p of this.players.values()) { p.points = 0; p.correct = 0; p.confUsed = false; p.confWins = 0; p.confLoss = 0; p.vote = null; p.roundPts = 0; p.lastDelta = 0; }
      const players = this.players, order = this.order, h = this.handlers, cfg = this.cfg;
      this._reset(); this.players = players; this.order = order; this.handlers = h; this.rounds = keepRounds; this.reserve = keepRes;
      this.emit('matchStarted', {});
      this._beginRound(0);
      return true;
    }
    pause() { if (!this.paused) { this.paused = true; this.emit('paused', true); } }
    resume() { if (this.paused) { this.paused = false; this.emit('paused', false); } }
    extend(ms) { if (this.phase === 'voting' || this.phase === 'ask') { this.phaseDur += ms; return true; } return false; }
    closeEarly() { if (this.phase === 'voting' && !this.paused) { this.phaseT = this.phaseDur; return true; } return false; }
    rematchSame() {
      const players = this.players, order = this.order, h = this.handlers, rounds = this.rounds, res = this.reserve;
      this._reset(); this.players = players; this.order = order; this.handlers = h; this.rounds = rounds; this.reserve = res;
      for (const p of players.values()) { p.points = 0; p.correct = 0; p.confUsed = false; p.confWins = 0; p.confLoss = 0; p.vote = null; p.roundPts = 0; p.lastDelta = 0; }
      this.openLobby();
    }
    fullReset() {
      const h = this.handlers, rounds = this.rounds, res = this.reserve;
      this.players = new Map(); this.order = []; this._reset(); this.handlers = h; this.rounds = rounds; this.reserve = res; this.emit('reset', {});
    }
    toSettings() { const players = this.players, order = this.order, h = this.handlers, r = this.rounds, rs = this.reserve; this._reset(); this.players = players; this.order = order; this.handlers = h; this.rounds = r; this.reserve = rs; this.emit('phase', { phase: 'idle' }); }

    /* ---------- المراحل ---------- */
    _enter(name, dur) { this.phase = name; this.phaseT = 0; this.phaseDur = dur; this.emit('phase', { phase: name, dur, round: this.ri }); }
    _beginRound(i, tb) {
      const def = tb ? this.reserve[this.reserveUsed++] : this.rounds[i];
      this.ri = i;
      const order = [0, 1, 2];
      if (this.cfg.shuffle) for (let k = 2; k > 0; k--) { const j = Math.floor(this.rng() * (k + 1)); const t = order[k]; order[k] = order[j]; order[j] = t; }
      this.cur = {
        idx: i, tb: !!tb, def, order, stories: order.map(o => def.stories[o]), targetDisp: order.indexOf(def.target),
        inverted: def.inverted, explain: def.explain, counts: [0, 0, 0], confCounts: [0, 0, 0], result: null, applied: false, revealed: false
      };
      for (const p of this.players.values()) { p.vote = null; p.roundPts = 0; p.lastDelta = 0; }
      this.answered = 0; this.questions = []; this.qShown = null; this.qCount = new Map();
      this.emit('roundStarted', { round: i + 1, total: this.rounds.length, inverted: def.inverted, tiebreak: !!tb });
      this._enter('present', Infinity);
    }
    _openVoting() {
      for (const p of this.players.values()) p.vote = null;
      this.answered = 0;
      this._enter('voting', this.cfg.answerSecs * 1000);
      this.emit('votingOpened', { round: this.ri + 1, seconds: this.cfg.answerSecs });
    }
    _lock() {
      const cur = this.cur, counts = [0, 0, 0], conf = [0, 0, 0];
      let total = 0, confTotal = 0;
      for (const p of this.players.values()) {
        if (!p.vote) continue;
        counts[p.vote.n]++; total++;
        if (p.vote.conf) { conf[p.vote.n]++; confTotal++; p.confUsed = true; }
      }
      const t = cur.targetDisp;
      const right = counts[t], wrong = total - right;
      const correctIds = [], pts = new Map();
      for (const p of this.players.values()) {
        let d = 0;
        if (p.vote) {
          const ok = p.vote.n === t;
          if (ok) { d = p.vote.conf ? 200 : 100; correctIds.push(p.id); }
          else if (p.vote.conf) d = -100;
        }
        pts.set(p.id, d);
      }
      cur.counts = counts; cur.confCounts = conf;
      cur.result = {
        counts, confCounts: conf, total, confTotal, right, wrong, correctIds, pts,
        deception: total > 0 ? (wrong / total) * 100 : null, noVote: this.players.size - total
      };
      this.emit('votingClosed', { round: this.ri + 1, total, counts: counts.slice() });
      this._enter('locked', 1900);
    }
    _applyScores() {
      const cur = this.cur; if (!cur || cur.applied) return;
      cur.applied = true;
      const before = this.leaderboard().map(p => p.id);
      for (const p of this.players.values()) {
        const d = cur.result.pts.get(p.id) || 0;
        p.points += d; p.roundPts = d; p.lastDelta = d;
        if (p.vote && p.vote.n === cur.targetDisp) { p.correct++; if (p.vote.conf) p.confWins++; }

    updSndBtn();
  }

  /* ───── واجهة برمجية للربط لاحقًا ───── */
  window.EkthebAlayGame = {
    receiveChat: m => G.receiveChat(m),
    handleChat: (user, text) => G.receiveChat({ userId: user && (user.userId != null ? user.userId : user.id), nickname: user && (user.nickname || user.name), avatarUrl: user && (user.avatarUrl || user.avatar), text }),
    addPlayer: u => G.addPlayer(u), next: () => G.doNext(), pause: () => G.pause(), resume: () => G.resume(),
    getState: () => ({ phase: G.phase, round: G.ri + 1, players: G.players.size, leaderboard: G.leaderboard().slice(0, 10).map(p => ({ id: p.id, name: p.name, points: p.points })) }),
    on: (n, f) => G.on(n, f), snapshot: () => makeSnap(G, cfg), openAudience,
    _G: G, _store: store, _freeze: v => { frozen = v !== false; }, _advance: ms => { for (let t = 0; t < ms; t += 50) G.tick(Math.min(50, ms - t)); },
    _addTest: addTestPlayers, _enter: enterGame, _quick: startQuick, _skipIntro: () => { if (introEnd) introEnd(); $('#intro').hidden = true; if (screen === 'intro') startScreen(); },
    _pushSnap: pushSnap, _audience: () => ({ snap: aud.snap })
  };
  boot();
})();
</script>
<script>
(function(){
  'use strict';
  if(!/[?&]embed=1/.test(location.search)) return;
  var TAG='ek', wonSent={};
  function post(o){ try{ o.source='ehsemha-'+TAG; parent.postMessage(o,'*'); }catch(e){} }
  document.documentElement.classList.add('embed');
  var st=document.createElement('style');
  st.textContent='html.embed,html.embed body{overscroll-behavior:none}';
  document.head.appendChild(st);
  function msg(u,text){ return {userId:String(u.uniqueId),nickname:u.nickname||u.uniqueId,avatarUrl:u.avatar||'',text:String(text||''),receivedAt:Date.now()}; }
  function winners(list){ var out=[]; (list||[]).forEach(function(p){ if(p) out.push({uniqueId:String(p.id),nickname:p.name||p.id,avatar:p.avatar||''}); }); return out; }
  var api=null;
  
  api=window.EkthebAlayGame;
  try{ api._skipIntro(); }catch(e){}
  api.on('matchStarted',function(){ post({type:'start'}); });
  api.on('matchFinished',function(){ setTimeout(function(){ var G=api._G, ids=(G.winners||[]).slice(); var ws=winners(ids.map(function(id){ return G.players.get(id); })); post({type:'win',winners:ws}); post({type:'finish'}); },0); });

  window.EhsemhaEmbed={
    tag:TAG,
    ready:function(){ return !!api; },
    chat:function(u,text){ if(!api||!u||!u.uniqueId) return null; try{ return api.receiveChat(msg(u,text)); }catch(e){ console.error(e); return null; } },
    state:function(){ try{ return api&&api.getState?api.getState():null; }catch(e){ return null; } }
  };
  post({type:'ready'});
})();
</script>
