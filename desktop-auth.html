<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>تسجيل الدخول لتطبيق احسمها</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07040D; color: #F8F7FC; font-family: "Segoe UI", Tahoma, sans-serif; }
  .card { width: min(92vw, 420px); background: #170B2D; border: 1px solid rgba(167,139,250,.25); border-radius: 16px; padding: 32px 28px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #A78BFA; line-height: 1.7; margin: 0 0 20px; font-size: 14px; }
  button { width: 100%; padding: 13px 16px; border: 0; border-radius: 10px; background: #7C3AED; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { background: #5B21B6; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { margin-top: 16px; min-height: 22px; font-size: 14px; }
  .err { color: #fca5a5; }
</style>
</head>
<body>
<div class="card">
  <h1>تسجيل الدخول لتطبيق احسمها</h1>
  <p>سجّل الدخول بحسابك في جوجل من هذا المتصفح، وبعدها يرجع تطبيق احسمها يكمل تلقائياً.</p>
  <button id="go" type="button" disabled>تسجيل الدخول بجوجل</button>
  <div id="msg" role="status"></div>
</div>
<form id="back" method="post" style="display:none">
  <input type="hidden" name="state" id="f-state">
  <input type="hidden" name="idToken" id="f-id">
  <input type="hidden" name="accessToken" id="f-access">
</form>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

  // نفس إعداد الويب العام للموقع (ليس سراً — تحميه قواعد Firebase ونطاقات التفويض).
  const app = initializeApp({
    apiKey: "AIzaSyCo37Dpu-tYccZcfgHqttJfh9vgOj0bTEE",
    authDomain: "streamgame-180b8.firebaseapp.com",
    projectId: "streamgame-180b8"
  });
  const auth = getAuth(app);
  const params = new URLSearchParams(location.search);
  const port = Number(params.get('port'));
  const state = String(params.get('state') || '');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('go');

  // يقبل فقط عودة إلى حلقة الجهاز المحلية بالمنفذ المخصص للتطبيق (لا إعادة توجيه لأي جهة أخرى).
  const valid = Number.isInteger(port) && port >= 43711 && port <= 43722 && /^[a-f0-9]{32}$/.test(state);
  if (!valid) {
    msg.className = 'err';
    msg.textContent = 'رابط غير صالح. افتح تسجيل الدخول من داخل تطبيق احسمها.';
  } else {
    btn.disabled = false;
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true; msg.className = ''; msg.textContent = 'جاري فتح نافذة جوجل...';
    try {
      const result = await signInWithPopup(auth, new GoogleAuthProvider());
      const cred = GoogleAuthProvider.credentialFromResult(result);
      if (!cred || (!cred.idToken && !cred.accessToken)) throw new Error('no-credential');
      msg.textContent = 'تم. جاري الرجوع للتطبيق...';
      const form = document.getElementById('back');
      form.action = 'http://127.0.0.1:' + port + '/__auth/callback';
      document.getElementById('f-state').value = state;
      document.getElementById('f-id').value = cred.idToken || '';
      document.getElementById('f-access').value = cred.accessToken || '';
      form.submit();
    } catch (e) {
      btn.disabled = false; msg.className = 'err';
      msg.textContent = (e && e.code === 'auth/popup-closed-by-user') ? 'أُغلقت النافذة قبل إكمال الدخول.' : 'تعذّر تسجيل الدخول، حاول مرة أخرى.';
    }
  });
</script>
</body>
</html>
