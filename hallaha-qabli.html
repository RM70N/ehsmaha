<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حلّها قبلي — احسمها</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--bg:#160F22;--bg2:#1E1530;--card:#241A38;--card2:#2C2145;--line:#3A2E57;--acc:#7B3FE4;--acc2:#B79CFF;--gold:#F4C430;--amber:#F2A33A;--tx:#F3EEFF;--mut:#A99BC8;--ok:#5EE0A0;--bad:#FF7A8A;--steel:#4a4064}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Cairo,Tajawal,'Segoe UI',Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -10%,#2b1b4a 0%,var(--bg) 62%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(22,15,34,.85);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}
.brand svg{width:26px;height:26px}
.sp{flex:1}
.btn{padding:9px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;transition:background .15s,transform .1s}
.btn:hover{background:#38295a}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:#9a68ff}.btn.pri:hover{background:#8d52f0}
.btn.gold{background:var(--gold);color:#2a1d00;border-color:#ffe082}.btn.gold:hover{background:#ffd54a}
.btn.big{padding:13px 26px;font-size:18px;border-radius:14px}.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.scr{flex:1;min-height:0;overflow:auto;position:relative}
/* بداية */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;max-width:1180px;margin:0 auto;padding:28px 22px;min-height:100%}
.hero h1{font-size:54px;font-weight:900;line-height:1.15;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:19px;color:var(--mut);line-height:1.8;margin-bottom:22px;max-width:520px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.stat{margin-top:16px;color:var(--mut);font-size:14px}
/* إعداد */
.wrap{max-width:760px;margin:0 auto;padding:26px 20px 40px}
.wrap h2{font-size:30px;font-weight:900;margin-bottom:6px}.wrap .sub{color:var(--mut);margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}.fld label{font-weight:700;font-size:14px;color:var(--acc2)}
.fld input,.fld select{padding:11px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:16px}
.chk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:700}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.note{margin-top:12px;font-size:13.5px;color:var(--mut);line-height:1.7;padding:11px 14px;border-radius:12px;background:rgba(123,63,228,.1);border:1px solid rgba(123,63,228,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* خزنة */
.vault{direction:ltr;position:relative;width:100%;max-width:560px;margin:0 auto;perspective:1500px;user-select:none}
.vframe{position:relative;aspect-ratio:520/440;width:100%}
.vframe>svg,.vframe .cav,.vframe .door{position:absolute}
.vframe>svg.fr{inset:0;width:100%;height:100%}
.vframe .cav,.vframe .door{left:11.15%;top:13.2%;width:77.7%;height:73.6%}
.cav{border-radius:14px;overflow:hidden;background:#0c0816}.cav svg{width:100%;height:100%;display:block}
.cav .glow{opacity:0;transition:opacity .9s}.vault.open .cav .glow{opacity:1}
.door{transform-origin:0 50%;transition:transform 1.3s cubic-bezier(.55,0,.25,1);transform-style:preserve-3d;z-index:2}
.door svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.vault.open .door{transform:rotateY(-112deg)}
.vframe>svg.hg{inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.q{fill:var(--amber);opacity:.85}
.vault.armed .win{animation:winp 1.6s ease-in-out infinite}
.vault.armed .q{animation:qp 1.6s ease-in-out infinite}
@keyframes winp{50%{stroke:#ffd27a;filter:drop-shadow(0 0 4px rgba(242,163,58,.7))}}
@keyframes qp{50%{opacity:1}}
.vault.lite.armed .win,.vault.lite.armed .q{animation:none}
.wheel{transform-origin:330px 150px;transition:transform 1s cubic-bezier(.4,0,.2,1)}
.vault.turn .wheel{transform:rotate(540deg)}
.bolt{transition:transform .4s ease-in}.vault.retract .bolt{transform:translateX(-30px)}
.vault.shake .vframe{animation:shk .45s linear}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-3px,1px)}30%{transform:translate(3px,-1px)}45%{transform:translate(-2px,0)}60%{transform:translate(2px,1px)}80%{transform:translate(-1px,0)}}
.dg{font-weight:900;fill:var(--tx);font-family:Cairo,sans-serif}
.dg.gold{fill:var(--gold)}
.led{fill:#2a2340;transition:fill .3s}.led.on{fill:var(--amber)}.led.win{fill:var(--gold)}
.lockring{fill:none;stroke:var(--acc2);stroke-width:3;opacity:0;transition:opacity .3s}.vault.locked .lockring{opacity:1}
.reduced *{transition-duration:.01s!important;animation:none!important}
/* بانر فوق الخزنة */
.stagebox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.vtitle{min-height:60px;text-align:center}
.vtitle .big{font-size:30px;font-weight:900}
.vtitle .sm{color:var(--mut);font-size:16px;margin-top:2px}
.vtitle.pop .big{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.winner{min-height:54px;text-align:center;font-weight:900;font-size:26px;color:var(--gold)}
.winner small{display:block;color:var(--mut);font-size:15px;font-weight:700}
/* شاشة اللعب */
.play{display:grid;grid-template-columns:minmax(210px,250px) minmax(0,1fr) minmax(280px,380px);gap:14px;padding:14px;height:100%;min-height:0}
.play>*{min-height:0}
.panel{background:rgba(36,26,56,.82);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h3{padding:12px 14px 8px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;flex:none}
.panel h3 .sp{flex:1}
.hud{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:15px}
.chip b{color:var(--gold)}
.chip.pulse{animation:cp .45s}
@keyframes cp{40%{transform:scale(1.12);border-color:var(--acc2);background:#3a2a62}}
.timer{position:relative;width:62px;height:62px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:7}
.timer .tr{stroke:var(--line)}.timer .tp{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.timer.low .tp{stroke:var(--bad)}
.timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;overflow:hidden;gap:8px}
.mid .vault{max-width:min(560px,100%)}
.how{font-size:15px;color:var(--mut);text-align:center;line-height:1.6}
.how b{color:var(--tx)}
.lock-banner{font-weight:900;color:var(--acc2);font-size:20px}
/* سجل */
.logbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 12px 12px;scrollbar-width:thin}
.legend{display:flex;flex-direction:column;gap:3px;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut);flex:none;background:rgba(0,0,0,.15)}
.legend span{display:flex;align-items:center;gap:7px}
.ic{width:18px;height:18px;flex:none}
.stg{margin-top:10px}
.stg>h4{font-size:13.5px;color:var(--acc2);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.stg>h4 em{font-style:normal;color:var(--mut);font-weight:600}
.stg.live{border:1.5px dashed var(--amber);border-radius:12px;padding:10px 12px;background:rgba(242,163,58,.07)}
.stg.latest>h4{color:var(--gold)}
.stg.old{opacity:.78}
.att{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.att.best{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.att .cd{display:flex;gap:4px;direction:ltr}
.att .cd i{font-style:normal;width:30px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#0e0a18;border:1px solid #4b3d6e;font-weight:900;font-size:22px}
.att .rs{display:flex;gap:6px;flex-wrap:wrap;font-size:13.5px;font-weight:700}
.att .rs span{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:#1a1228;border:1px solid var(--line)}
.att .rs b{font-size:16px;color:var(--tx)}
.att .wh{grid-column:1/3;font-size:12.5px;color:var(--mut)}
.att .tagb{font-size:11.5px;color:#2a1d00;background:var(--gold);border-radius:999px;padding:1px 8px;font-weight:900}
.att.new .cd i{animation:dg .35s both;animation-delay:calc(var(--i)*.07s)}
.att.new .rp,.att.new .rm,.att.new .wh{animation:fin .3s both}
.att.new .rp{animation-delay:calc(var(--i)*.07s + .3s)}.att.new .rm{animation-delay:calc(var(--i)*.07s + .55s)}.att.new .wh{animation-delay:calc(var(--i)*.07s + .7s)}
@keyframes dg{from{opacity:0;transform:translateY(8px) scale(.8)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
.vl{font-size:13px;color:var(--mut);padding:7px 10px;border-radius:10px;background:var(--bg2);margin-top:8px;border:1px solid var(--line)}
.vl b{color:var(--gold);direction:ltr;unicode-bidi:isolate}
.empty{color:var(--mut);font-size:14px;padding:10px 4px;line-height:1.7}
/* نقاط */
.sc{flex:1;min-height:0;overflow-y:auto;padding:0 10px 10px;scrollbar-width:thin}
.pr{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;margin-bottom:4px}
.pr:nth-child(odd){background:rgba(255,255,255,.03)}
.pr .rk{width:22px;text-align:center;color:var(--mut);font-weight:800}
.pr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:15px}
.pr .pt{font-weight:900;color:var(--gold)}
.pr.wait{opacity:.6}
.pr small{color:var(--mut);font-size:11.5px}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;overflow:hidden;background-size:cover;background-position:center}
/* أدوات الستريمر */
.host{flex:none;border-top:1px solid var(--line);background:rgba(18,12,30,.96);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.host .row{justify-content:center}
.hostfeed{font-size:12.5px;color:var(--mut);max-height:64px;overflow:auto;display:flex;flex-direction:column;gap:2px;text-align:center}
.hostfeed .warn{color:var(--amber)}.hostfeed .ok{color:var(--ok)}
.hostmin{position:fixed;bottom:10px;inset-inline-start:10px;z-index:30}
.linkchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.linkchip i{width:9px;height:9px;border-radius:50%;background:var(--ok)}.linkchip.off i{background:var(--bad)}.linkchip.off{border-color:var(--bad)}.linkchip.sim i{background:var(--amber)}
.alert{padding:10px 16px;border-radius:12px;background:rgba(255,122,138,.14);border:1.5px solid var(--bad);font-weight:800;text-align:center;font-size:15px}
.alert.ok{background:rgba(94,224,160,.12);border-color:var(--ok)}
.pausebar{padding:8px 14px;border-radius:12px;background:rgba(242,163,58,.14);border:1.5px solid var(--amber);font-weight:900;text-align:center}
/* ردهة */
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1100px;margin:0 auto;padding:22px;align-items:center;min-height:100%}
.joinbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center}
.joinbox .w{display:inline-block;margin:6px 0 8px;font-size:48px;font-weight:900;color:var(--gold);padding:4px 26px;border-radius:16px;background:#0e0a18;border:2px dashed #6b5b8f}
.joinbox .ex{margin-top:10px;font-size:16px;color:var(--tx);line-height:1.7;padding:10px;border-radius:12px;background:rgba(123,63,228,.12)}
.joinbox .ex b{direction:ltr;unicode-bidi:isolate;color:var(--gold)}
.plist{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-height:190px;overflow:auto;margin:12px 0}
.pc{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:14px;animation:pop .3s}
/* نهاية */
.final{max-width:900px;margin:0 auto;padding:26px 18px;text-align:center}
.final .win{margin-bottom:18px}.final .win .nm{font-size:48px;font-weight:900;color:var(--gold);line-height:1.3}.final .muted{color:var(--mut)}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.top3 .cardx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.top3 .cardx:first-child{border-color:var(--gold)}
/* مودال / توست */
#modal{position:fixed;inset:0;z-index:100;background:rgba(8,5,16,.7);display:flex;align-items:center;justify-content:center;padding:18px}
#modal[hidden]{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.mbox h3{font-size:22px;margin-bottom:10px}.mbox p,.mbox li{color:var(--mut);line-height:1.8;font-size:15.5px}.mbox ol{padding-inline-start:20px}
.mbox .row{margin-top:16px;justify-content:flex-start}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{padding:9px 16px;border-radius:12px;background:#2c2145;border:1px solid var(--acc2);font-weight:700;animation:pop .25s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall var(--d) cubic-bezier(.3,.5,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
.simbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-top:4px;border-top:1px dashed var(--line)}
.embed .top{display:none!important}
.srsr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* جوال */
.playcol{display:flex;flex-direction:column;min-height:0;height:100%}.playcol .play{flex:1}
@media (max-width:980px){
 .hero{grid-template-columns:1fr;gap:10px}.hero h1{font-size:38px}
 .lobby{grid-template-columns:1fr}
 .scr.playscr{overflow-y:auto;overflow-x:hidden}
 .playcol{height:auto;min-height:100%}
 .play{display:flex;flex-direction:column;height:auto;overflow:visible;padding:10px;gap:10px;flex:none}
 .mid{overflow:visible;flex:none}
 .play .mid{order:1}.play .logpanel{order:2;height:400px;flex:none}.play .scorepanel{order:3;max-height:260px;flex:none}
 .host{margin-top:auto}
 .grid2{grid-template-columns:1fr}
 .top3{grid-template-columns:1fr}
 .vtitle .big{font-size:24px}
 .host .btn{padding:7px 10px;font-size:13px}
}

.att .rs .tagb{background:var(--gold);color:#2a1d00;border-color:#ffe082;font-size:11.5px;font-weight:900;padding:2px 9px}
.door .dback{position:absolute;inset:0;border-radius:14px;transform:rotateY(180deg);backface-visibility:hidden;background:linear-gradient(135deg,#3a3157,#1d1730);border:3px solid #6b5b8f;box-shadow:inset 0 0 0 10px rgba(0,0,0,.18)}
.door svg{backface-visibility:hidden}

.embed #app{padding-top:38px}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx" aria-hidden="true"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>/* منطق «حلّها قبلي» — بلا أي اعتماد على المتصفح. يُختبر في node ويُدمج في الصفحة. */
(function (root) {
  'use strict';
  const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';
  const normDigits = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[​-‏‪-‮⁦-⁩﻿٬٫]/g, '');
  const normWord = s => String(s == null ? '' : s).replace(/[ً-ٰٟـ​-‏‪-‮⁦-⁩﻿]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim().toLowerCase();
  /* محاولة صالحة: ثلاثة أرقام مختلفة، متصلة أو مفصولة بفاصل واضح */
  function parseAttempt(text) {
    const s = normDigits(text).trim();
    if (!/\d/.test(s)) return { ok: false, reason: 'chat' };
    const m = /^(\d)(\d)(\d)$/.exec(s) || /^(\d)[\s,،.\-_/]+(\d)[\s,،.\-_/]+(\d)$/.exec(s);
    if (!m) return { ok: false, reason: (s.match(/\d/g) || []).length >= 2 ? 'format' : 'chat' };
    if (m[1] === m[2] || m[1] === m[3] || m[2] === m[3]) return { ok: false, reason: 'dup' };
    return { ok: true, code: m[1] + m[2] + m[3] };
  }
  /* التقييم: الموضع الصحيح أولًا، ثم الأرقام الموجودة بمواضع مختلفة، دون عدّ رقم مرتين */
  function evaluate(code, guess) {
    let exact = 0; const rc = [], rg = [];
    for (let i = 0; i < 3; i++) { if (code[i] === guess[i]) exact++; else { rc.push(code[i]); rg.push(guess[i]); } }
    let mis = 0;
    for (const g of rg) { const k = rc.indexOf(g); if (k >= 0) { mis++; rc.splice(k, 1); } }
    return { exact, mis };
  }
  const DEF = { joinWord: 'انضم', vaults: 5, collectSec: 20, readSec: 8, maxStages: 8, points: 100, late: true, reduced: false, quality: 'normal', manual: false };
  const D = { intro: 2200, locked: 1300, opening: 6800, held: 5200 };
  const RUN = ['intro', 'collect', 'locked', 'reveal', 'opening', 'held'];

  function create(opts) {
    opts = opts || {};
    const rng = opts.rng || Math.random, clock = opts.now || (() => Date.now());
    const G = { cfg: Object.assign({}, DEF, opts.cfg || {}), phase: 'idle', paused: false, autoPaused: false, linkDown: false, link: true, joinOpen: true, matchId: 0, vaultNo: 0, vaultTotal: 0, stage: 0, stageSeq: 0, tb: null, tieRes: null, players: new Map(), listeners: [], feed: [], hv: 0, t: null, vlog: [], hist: [], cur: null, awarded: new Set(), seen: new Set(), seenQ: [] };
    let secret = null;
    const emit = (ev, d) => G.listeners.forEach(f => { try { f(ev, d); } catch (e) { } });
    const feed = (txt, kind) => { const last = G.feed[G.feed.length - 1]; if (last && last.base === txt) { last.n++; last.text = txt + ' (×' + last.n + ')'; last.t = clock(); } else { G.feed.push({ t: clock(), text: txt, base: txt, n: 1, kind: kind || 'info' }); if (G.feed.length > 80) G.feed.shift(); } emit('feed'); };
    function setPhase(ph, ms) { G.phase = ph; G.paused = false; G.autoPaused = false; G.t = { total: ms, deadline: ms === Infinity ? Infinity : clock() + ms, rem: 0 }; emit('state'); }
    const plist = () => [...G.players.values()];
