    const peek = $('#owner-peek'), errBox = $('#enter-err'), btn = $('#enter-btn');
    let found = null, seq = 0, t, pending = null;
    const showErr = (reason, code) => {
      const e = (ENTER_ERR[reason] || ENTER_ERR.invalid)(code);
      errBox.innerHTML = `<div class="note note-err">${ic('alert-triangle')}<div><b>${e.t}</b><br>${e.p}${e.retry ? `<div style="margin-top:10px"><button type="button" class="btn btn-sm btn-ghost" data-retry>${ic('refresh')}<span>أعد المحاولة</span></button></div>` : ''}</div></div>`;
      if (reason !== 'offline') inp.setAttribute('aria-invalid', 'true');
    };
    const lookup = () => {
      const code = normalizeCode(inp.value);
      found = null; errBox.innerHTML = ''; inp.removeAttribute('aria-invalid'); clearTimeout(t); pending = null;
      if (!code) { peek.innerHTML = ''; return; }
      if (code.length < RACE.CODE_MIN) { peek.innerHTML = ''; return; }
      if (!/^[A-Z0-9]+$/.test(code)) { peek.innerHTML = ''; showErr('invalid', code); return; }
      peek.innerHTML = `<div class="owner-peek"><span class="av"></span><div class="who" style="display:flex;flex-direction:column;gap:8px"><span class="skeleton" style="width:50%"></span><span class="skeleton" style="width:30%"></span></div></div>`;
      const my = ++seq;
      let done; pending = new Promise(res => done = res);
      t = setTimeout(async () => {
        const r = await RaceAPI.lookupCode(code);
        done();
        if (my !== seq) return;
        if (!r.found) { peek.innerHTML = ''; showErr('not_found', code); return; }
        if (r.owner.me) { peek.innerHTML = ''; showErr('own_code', code); return; }
        found = { code, ...r.owner };
        peek.innerHTML = `<div class="owner-peek"><span class="av">${esc(initial(r.owner.name))}</span><div class="who"><b>${esc(r.owner.name)}</b><span>${r.owner.rank ? `المركز ${r.owner.rank} · ` : ''}${P.uses(r.owner.uses)}</span></div>${plate(code)}</div>`;
      }, 320);
    };
    inp.addEventListener('input', lookup);
    if (inp.value) lookup();
    const submit = async () => {
      const code = normalizeCode(inp.value);
      if (!code) { errBox.innerHTML = `<div class="note note-err">${ic('alert-triangle')}<div><b>اكتب كود اللاعب أولًا</b><br>اطلبه من صاحبه، أو افتح رابط المشاركة الذي أرسله لك. للتجربة: <button type="button" class="btn btn-sm btn-quiet" data-try="RAKAN">جرّب RAKAN</button></div></div>`; inp.focus(); return; }
      if (code.length < RACE.CODE_MIN) { showErr('invalid', code); inp.focus(); return; }
      if (pending) { btn.classList.add('is-loading'); await pending; btn.classList.remove('is-loading'); }
      if (!found) { if (!errBox.innerHTML) lookup(); inp.focus(); return; }
      const ok = await Dialog.confirm({
        title: `دعم ${esc(found.name)}؟`, ok: 'نعم، أكّد الكود', cancel: 'رجوع', icon: 'check',
        body: `<div class="stack"><div class="owner-peek"><span class="av">${esc(initial(found.name))}</span><div class="who"><b>${esc(found.name)}</b><span>${found.rank ? `المركز ${found.rank}` : 'لم يدخل الترتيب بعد'}</span></div>${plate(found.code)}</div>
          <ul class="rules-mini"><li>${ic('check')}يُضاف استخدام واحد لرصيد ${esc(found.name)}</li><li>${ic('lock')}لا يمكنك دعم كود آخر في هذا الموسم</li><li>${ic('gift')}لا تحصل على إطار أو جائزة مقابل الدعم</li></ul></div>`
      });
      if (!ok) return;
      btn.classList.add('is-loading'); errBox.innerHTML = '';
      const r = await RaceAPI.confirmUse(found.code);
      btn.classList.remove('is-loading');
      if (!r.ok) { if (r.reason === 'queued') { Router.render(true); return; } showErr(r.reason, found.code); return; }
      const after = { ...(Sel.standings().byUid[r.owner.uid] || {}), uses: r.uses };
      Signal.fly(btn, () => { });
      Sound.chime();
      $('#enter-body').innerHTML = `<div class="panel success-burst" tabindex="-1" id="enter-ok">
        <div class="ring">${ic('check', 'ico-xl')}</div>
        <h2>احتُسب دعمك لـ${esc(r.owner.name)}</h2>
        <p class="t2" style="margin:8px auto 0;max-width:40ch">أضفت استخدامًا واحدًا لرصيده. أصبح لديه <b class="num">${after.uses}</b> ${after.rank ? `وهو في المركز <b class="num">${after.rank}</b>` : ''}. هذا الدعم يُحتسب مرة واحدة فقط.</p>
        <div class="btn-row" style="justify-content:center;margin-top:20px"><a class="btn btn-ghost" href="#/board">${ic('list-numbers')}<span>شاهد الصدارة</span></a>${!Store.state.myCode ? `<a class="btn btn-primary" href="#/create"><span>${ic('plus')} أنشئ كودك أنت</span></a>` : `<a class="btn btn-primary" href="#/card"><span>${ic('share')} شارك كودك</span></a>`}</div></div>`;

      announce(`احتُسب دعمك لـ${r.owner.name}`);
    };
    $('#enter-form').addEventListener('submit', e => { e.preventDefault(); submit(); });
    root.addEventListener('click', e => {
      if (e.target.closest('[data-retry]')) submit();
      const tr = e.target.closest('[data-try]'); if (tr) { inp.value = tr.dataset.try; lookup(); inp.focus(); }
    });
    if (!params.code) setTimeout(() => inp.focus({ preventScroll: true }), 60);
  }
};
/* إشارة: نقطة تنتقل من زر التأكيد إلى الأعلى (الأثر يغادر نحو صاحب الكود) */
const Signal = {
  fly(from, done) {
    if (Motion.reduced() || !from) return done && done();
    const r = from.getBoundingClientRect();
    const d = document.createElement('i'); d.className = 'signal-dot';
    d.style.left = (r.left + r.width / 2 - 5) + 'px'; d.style.top = (r.top + r.height / 2 - 5) + 'px';
    document.body.appendChild(d);
    const a = d.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${-r.left / 3}px,${-r.top + 30}px) scale(.4)`, opacity: 0 }], { duration: 900, easing: 'cubic-bezier(.5,0,.2,1)' });
    a.onfinish = () => { d.remove(); done && done(); };
  }
};

/* ---------- 4) لوحة الصدارة ---------- */
function boardRow(r, extra = '') {
  const gap = r.rank === 1 ? '<span class="gold">المتصدر</span>' : r.tiedWithAbove ? '<span class="gap-m">متعادل · وصل لاحقًا</span>' : `<span class="gap-m">خلف ${r.rank - 1} بـ</span><b class="num">${r.gapUp}</b>`;
  return `<li class="brow ${r.rank <= 3 ? 'top-' + r.rank : ''} ${r.me ? 'is-me' : ''} ${extra}" data-k="${r.uid}" data-u="${r.uses}" data-href="${r.me ? '#/me' : '#/c/' + encodeURIComponent(r.code)}" tabindex="0" role="link" aria-label="${esc(r.name)}، المركز ${r.rank}، ${P.uses(r.uses)}. افتح البطاقة">
    <span class="rk">${r.rank}</span>
    <div class="who"><span class="nm">${esc(r.name)}</span><span class="sub"><span class="code-txt">${esc(r.code)}</span>${r.tiedWithAbove || r.tiedWithBelow ? `<span class="chip chip-warn xs">${ic('arrows-sort')}تعادل</span>` : ''}${Sel.isOpen() && r.today ? `<span><span class="ltr">+${r.today}</span> اليوم</span>` : ''}</span></div>
    <span class="code-col"><span class="code-txt">${esc(r.code)}</span></span>
    <span class="gap">${gap}</span>
    <span class="uses num">${r.uses}<small>استخدام</small></span></li>`;
}
Regions.def('board', () => {
  const s = Store.state, ended = !!s.final;
  let ranked;
  if (ended) ranked = s.final.top.map((r, i, a) => ({ ...r, gapUp: i ? a[i - 1].uses - r.uses : 0, tiedWithAbove: i > 0 && a[i - 1].uses === r.uses, tiedWithBelow: !!a[i + 1] && a[i + 1].uses === r.uses, today: 0 }));
  else ranked = Sel.standings(s).ranked;
  if (!ranked.length) return emptyState('list-numbers', 'لا يوجد ترتيب بعد', ended ? 'انتهى الموسم دون أي استخدام صحيح، لذلك لا يوجد فائز.' : 'أول تأكيد صحيح لأي كود يفتح لوحة الصدارة.', ended ? '' : `<a class="btn btn-primary" href="#/create"><span>أنشئ كودك</span></a>`);
  const top = ranked.slice(0, 10);
  let html = `<ol class="board" aria-label="أول عشرة">${top.map(r => boardRow(r)).join('')}</ol>`;
  const st = Sel.standings(s);
  const me = st.byUid[s.me.uid];
  if (me && !ended && me.rank > 10) {
    const tenth = st.ranked[9];
    html += `<div class="board-sep">موقعك</div><ol class="board">${boardRow(me)}</ol>
      <p class="small t2" style="margin-top:8px;padding-inline:6px">تحتاج <b class="num">${P.uses(tenth.uses - me.uses + 1)}</b> لتدخل العشرة الأوائل، و<b class="num">${P.uses(me.toPass || (st.ranked[me.rank - 2].uses - me.uses + 1))}</b> لتتجاوز ${esc(st.ranked[me.rank - 2].name)}.</p>`;
  } else if (me && ended && s.final.me && s.final.me.rank > 10) {
    html += `<div class="board-sep">موقعك النهائي</div><ol class="board">${boardRow({ ...me, rank: s.final.me.rank, uses: s.final.me.uses, gapUp: 0 })}</ol>`;
  } else if (me && !me.rank) {
    html += `<div class="note" style="margin-top:12px">${ic('info-circle')}<div>كودك <span class="code-txt">${esc(me.code)}</span> لم يدخل الترتيب بعد. أول استخدام صحيح يضعك في القائمة.</div></div>`;
  }
  if (top.some(r => r.tiedWithAbove)) html += `<div class="note note-warn" style="margin-top:12px">${ic('arrows-sort')}<div><b>تعادل بالعدد.</b> يتقدم من وصل إلى هذا العدد أولًا حسب وقت تسجيل الخادم. <a href="#/rules?s=tie">قاعدة الحسم</a></div></div>`;
  return html;
});
Regions.def('summit', () => {
  const st = Sel.standings();
  const [a, b, c] = st.ranked;
  if (!a) return '';
  const g = b ? a.uses - b.uses : a.uses;
  return `<div class="summit" aria-labelledby="sum-h">
    <div class="summit-head">${ic('flame', 'ico-lg gold')}<h2 id="sum-h">مواجهة القمة</h2><span class="chip chip-gold">${ic('clock')}<span class="num ltr" data-cd-text="season">${fmtDurShort(Sel.left())}</span></span></div>
    <div class="summit-vs">
      <div class="summit-p lead"><div class="rk">المركز 1</div><div class="nm">${esc(a.name)}</div><div class="u num">${a.uses}</div><div class="small t2">${plate(a.code)}</div></div>
      <div class="summit-gap"><b class="num">${b ? (g || '=') : '-'}</b><span>${b ? (g ? 'الفارق' : 'تعادل') : ''}</span></div>
      ${b ? `<div class="summit-p"><div class="rk">المركز 2</div><div class="nm">${esc(b.name)}</div><div class="u num">${b.uses}</div><div class="small t2">${plate(b.code)}</div></div>` : '<div></div>'}
    </div>
    ${c ? `<div class="summit-third"><span>المركز 3: <b>${esc(c.name)}</b> <span class="num">${c.uses}</span></span><span class="muted">يبعد ${P.uses(a.uses - c.uses)} عن القمة</span></div>` : ''}
    ${b && g === 0 ? `<p class="small t2" style="text-align:center;margin-top:10px">التعادل يُحسم بالأسبقية: ${esc(a.name)} وصل للرقم أولًا.</p>` : ''}
  </div>`;
});
Pages.board = {

  render() {
    const s = Store.state, ph = Sel.phase(s), f = s.final;
    if (ph === 'certifying') return `<div class="wrap">${pageHead('اعتماد النتائج', 'انتهى الوقت. توقف احتساب الاستخدامات ويجري اعتماد الترتيب النهائي.')}<div class="panel">${Regions.html('board')}</div></div>`;
    if (f) {
      const [p1, p2, p3] = f.top;

      return `<div class="wrap">
        ${pageHead('النتائج النهائية', `${RACE.SEASON_NAME} · اعتُمدت ${fmtDateTime(f.at)}. هذه الأرقام ثابتة ولن تتغير.`, null, `<div class="row-flex"><span class="chip chip-gold">${ic('lock')}معتمدة</span><span class="chip">${ic('users')}${fmtN(f.totalUses)} استخدام صحيح في الموسم</span></div>`)}
        ${f.winner ? `<section class="panel panel-gold">
          <div class="podium" aria-label="المنصة">${pod(p2, 2)}${pod(p1, 1)}${pod(p3, 3)}</div>
          <div class="row-flex" style="margin-top:18px;justify-content:center">
            <span class="t2">فاز ${esc(f.winner.name)} ${f.tie ? `بالتعادل مع ${esc(f.tieWith.name)}، وحُسم لأنه وصل للرقم أولًا` : `بفارق <b class="num gold">${P.uses(f.margin)}</b>`}</span></div>
          <div class="btn-row" style="justify-content:center;margin-top:16px"><button class="btn btn-ghost" data-replay>${ic('player-play')}<span>أعد مشاهدة التتويج</span></button>${Sel.isWinner(s) ? `<a class="btn btn-gold" href="#/vip"><span>${ic('key')} افتح لوحة جائزتك</span></a>` : ''}</div>
        </section>` : ''}
        <section class="sec-tight"><div class="board-head" aria-hidden="true"><span>المركز</span><span>اللاعب</span><span>الكود</span><span>الفارق</span><span>الاستخدامات</span></div>${Regions.html('board')}</section>
      </div>`;
    }
    return `<div class="wrap">
      ${pageHead('لوحة الصدارة', 'أول عشرة بعدد الاستخدامات الصحيحة. تتحدث تلقائيًا.', null, `<div class="row-flex"><span class="chip chip-live">مباشر</span><span class="chip">${ic('clock')}متبقٍ <span class="num ltr" data-cd-text="season">${fmtDurShort(Sel.left())}</span></span>${Store.state.live ? '' : '<span class="chip chip-line">بيانات تجريبية</span>'}</div>`)}
      ${ph === 'final24' ? `<section style="margin-bottom:20px">${Regions.html('summit')}</section>` : ''}
      <div class="board-head" aria-hidden="true"><span>المركز</span><span>اللاعب</span><span>الكود</span><span>الفارق</span><span>الاستخدامات</span></div>
      ${Regions.html('board', 'data-flip')}
      <p class="small muted" style="margin-top:16px">${ic('info-circle', 'ico-sm')} الترتيب بعدد الاستخدامات، وعند التساوي يتقدم من وصل للعدد أولًا. <a href="#/rules">القواعد</a></p>
    </div>`;
  },
  mount(root) {
    const off = RaceAPI.listenLeaderboard(() => Regions.refresh());
    const h = e => { if (e.target.closest('[data-replay]')) Ceremony.replay(); };
    root.addEventListener('click', h);
    return () => { off(); root.removeEventListener('click', h); };
  }
};
Pages.results = { title: 'النتائج', render: (p) => Pages.board.render(p), mount: (r, p) => Pages.board.mount(r, p) };

/* ---------- 5) كودي وإحصائياتي ---------- */
Regions.def('mestats', () => {
  const s = Store.state, m = Sel.mine(s); if (!m) return '';
  const ended = !Sel.isOpen(s);
  const second = m.ranked[1];
  const gapNext = m.rank === 1 ? (second ? `<dd class="num gold">+${m.uses - second.uses}<small>تتقدم</small></dd>` : '<dd class="num">-</dd>') : m.rank ? `<dd class="num">${m.toPass}<small>للمركز ${m.rank - 1}</small></dd>` : `<dd class="num">1<small>لدخول الترتيب</small></dd>`;
  return `<dl class="stats">
    <div class="stat"><dt>${ic('sparkles')}استخدامات اليوم</dt><dd class="num">${ended ? '-' : m.today}</dd></div>
    <div class="stat hl"><dt>${ic('hash')}المجموع</dt><dd class="num">${m.uses}</dd></div>
    <div class="stat"><dt>${ic('list-numbers')}${ended ? 'المركز النهائي' : 'ترتيبك الآن'}</dt><dd class="num">${m.rank || '-'}<small>من ${Sel.standings(s).ranked.length}</small></dd></div>
    <div class="stat"><dt>${ic('trending-up')}أعلى ترتيب</dt><dd class="num">${s.bestRank || '-'}</dd></div>
    <div class="stat"><dt>${ic('arrow-big-up-lines')}${m.rank === 1 ? 'تقدمك على الثاني' : 'الفارق للمركز التالي'}</dt>${gapNext}</div>
    <div class="stat"><dt>${ic('clock')}${ended ? 'انتهى' : 'متبقٍ'}</dt><dd class="num ltr" style="font-size:22px" ${ended ? '' : 'data-cd-text="season"'}>${ended ? '00:00' : fmtDurShort(Sel.left(s))}</dd></div>
  </dl>`;
});
Regions.def('mecoach', () => coachHTML(coachMsg(Sel.mine())));
Regions.def('mechart', () => {
  const data = Sel.myDaily();
  const max = Math.max(4, ...data.map(d => d.n));
  const total = data.reduce((a, d) => a + d.n, 0);
  return `<div class="chart" role="img" aria-label="نشاط آخر ${data.length} أيام: ${data.map(d => `اليوم ${d.day} ${d.n}`).join('، ')}">
    ${data.map(d => `<div class="col ${d.today ? 'today' : ''}"><div class="bar" style="height:${Math.max(2, d.n / max * 100)}%"><b>${d.n}</b></div><span>${d.today ? 'اليوم' : 'ي' + d.day}</span></div>`).join('')}</div>
    <p class="small muted" style="margin-top:10px">${P.uses(total)} في آخر ${P.days(data.length)} من الموسم.</p>`;
});
Regions.def('menext', () => {
  const m = Sel.mine(); if (!m) return '';
  const nm = Sel.nextMilestone(m.uses);
  const prev = nm ? (RACE.MILESTONES[RACE.MILESTONES.indexOf(nm) - 1]?.n || 0) : 100;
  const pct = nm ? clamp((m.uses - prev) / (nm.n - prev) * 100, 0, 100) : 100;
  const trace = Array.from({ length: 100 }, (_, i) => { const n = i + 1; return `<i class="${n <= m.uses ? 'on' : ''} ${n === 5 || n === 25 ? 'm' : ''} ${n === 100 ? 'm m100' : ''}"></i>`; }).join('');
  return `<div class="trace-wrap"><div class="trace" role="img" aria-label="${Math.min(m.uses, 100)} من 100 أثر">${trace}</div>
    <div class="prog" style="flex:1;min-width:200px">${nm ? `<div class="prog-top"><span>${esc(nm.name)}</span><b class="num">${m.uses} / ${nm.n}</b></div>
      <div class="prog-bar ${nm.tier === 'silver' ? 'silver' : nm.tier === 'gold' ? 'gold' : ''}"><i style="--p:${pct}%"></i></div>
      <p class="small t2">باقي <b class="num">${P.uses(nm.n - m.uses)}</b> من حسابات مختلفة. ${esc(nm.reward)}.</p>` : `<div class="prog-top"><span class="gold">فتحت كل المحطات</span><b class="num">${m.uses}</b></div><p class="small t2">أنت «أسطورة الأكواد». كل نقطة في الشبكة استخدام صحيح من حساب مختلف.</p>`}
      <a class="btn btn-quiet" href="#/milestones">مراحل الإنجاز ${ic('chevron-left', 'ico-sm')}</a></div></div>`;
});
function achLogHTML() {
  const s = Store.state;
  const items = RACE.MILESTONES.filter(m => s.ach[m.id]).map(m => ({ m, at: s.ach[m.id].at }));
  if (!items.length) return `<p class="small muted">لا إنجازات بعد. أول محطة عند 5 استخدامات.</p>`;
  return `<ul class="log">${items.reverse().map(({ m, at }) => `<li>${msBadge(m, 'open').replace('class="ms-badge"', 'class="ms-badge" style="width:36px;height:36px"')}<div><b>${esc(m.name)}</b><div class="small muted">${esc(m.reward)}</div></div><span class="when">${fmtDate(at, { day: 'numeric', month: 'short' })}</span></li>`).join('')}</ul>`;
}

          <div class="note">${ic('eye-off')}<div>لا نعرض أسماء الحسابات التي استخدمت كودك. ترى العدد والترتيب فقط.</div></div>

function designsHTML(interactive) {
  const s = Store.state, n = s.myUses.length, cur = s.myCode ? s.myCode.design : 'base';
  const ds = [['base', 'الأساسي', 'متاح'], ['silver', 'الفضي', '25 استخدامًا'], ['gold', 'الذهبي', '100 استخدام']];
  return `<div class="designs" role="group" aria-label="تصاميم البطاقة">${ds.map(([d, nm, req]) => {

}

        <span class="chip ${label[1]}" style="align-self:flex-start">${ic(label[2])}${label[0]}</span>

      </article>`;
    }).join('');
    return `<div class="wrap">
      ${pageHead('مراحل الإنجاز', 'ثلاث محطات تُفتح بعدد المستخدمين المختلفين الذين أكدوا كودك. لا علاقة لها بالجائزة الكبرى؛ هي سجلّك في الموسم.', ['#/me', 'كودي'])}
      ${!has ? `<div class="note" style="margin-bottom:16px">${ic('info-circle')}<div>أنشئ كودك لتبدأ التقدم. <a href="#/create">أنشئ كودك</a></div></div>` : ''}
      <div class="ms-list">${cards}</div>
      ${has ? `<section class="sec panel"><div class="sec-h"><h2>سجل الإنجازات</h2></div>${achLogHTML()}<hr class="divider"><div class="sec-h"><h2 style="font-size:18px">ما فتحته من تصاميم</h2><a class="more" href="#/card">استخدم تصميمًا ${ic('chevron-left', 'ico-sm')}</a></div>${designsHTML(false)}</section>` : ''}
    </div>`;
  },
  mount() { const off = Store.on(t => { if (t === 'race') Router.render(true); }); return off; }
};

/* ---------- 7) البطاقة والمشاركة ---------- */
Pages.card = {
  title: 'بطاقة المشاركة',

            <div class="note note-warn">${ic('info-circle')}<div><b>معاينة تصورية.</b> المعاينة الديناميكية لكل لاعب تحتاج مسارًا خادميًا يولّد وسوم Open Graph وصورة البطاقة. التفاصيل في تعليق رأس الملف.</div></div></section>
        </div>
      </div></div>`;
  },
  mount(root) {
    Regions.def('cardprev', cardPreviews);
    Regions.def('carddesigns', () => designsHTML(true));
    const off = Store.on(t => { if (t === 'race') Regions.refresh(); });
    const h = async (e) => {
      const dl = e.target.closest('[data-dl]');
      if (dl) {
        dl.classList.add('is-loading');
        try { await Card.download(dl.dataset.dl); } catch (err) { console.error(err); toast('تعذّر إنشاء الصورة في هذا المتصفح.', 'err'); }
        dl.classList.remove('is-loading');
      }
      const cl = e.target.closest('[data-copy-link]'); if (cl && Store.state.myCode) copyText(shareLink(Store.state.myCode.code), cl, 'تم نسخ الرابط');
    };
    root.addEventListener('click', h);
    return () => { off(); root.removeEventListener('click', h); };
  }
};
function cardPreviews() {
  const s = Store.state, m = Sel.mine(s);
  const d = { name: s.me.name, code: m.code, rank: m.rank, uses: m.uses, design: s.myCode.design };
  return Card.html(d) + Card.html({ ...d, story: true });
}

const Challenges = {
  list() {
    const s = Store.state, st = Sel.standings(s), me = st.byUid[s.me.uid], day = Sel.day(s), ended = !Sel.isOpen(s);
    const name = (u) => u === s.me.uid ? s.me.name + ' (أنت)' : (s.players.find(p => p.uid === u) || {}).name;
    const leader = st.ranked[0];
    // 1) أول من يصل
    const tiers = RACE.CHALLENGE_FIRST_TIERS.map(n => ({ n, win: s.firstTo[n] ? { name: name(s.firstTo[n].uid), at: s.firstTo[n].at } : null }));
    const openTier = tiers.find(t => !t.win);
    const first = {
      id: 'first', icon: 'flag', title: 'أول من يصل',
      status: openTier ? (ended ? 'ended' : 'live') : 'done',
      timing: 'طوال الموسم، حتى نهاية اليوم 14',
      rules: ['يفوز بكل مستوى أول حساب يصل إلى العدد المحدد.', 'التوقيت من الخادم عند تسجيل الاستخدام الذي أوصله للعدد.', 'الجائزة: شارة «السبّاق» على الملف.'],
      body: `<div class="tiers">${tiers.map(t => `<div class="tier ${t.win ? 'done' : ''}"><div class="row-flex" style="gap:6px"><b class="num" style="font-size:20px">${t.n}</b><span class="small muted">استخدام</span></div>${t.win ? `<div class="small ok">${ic('check', 'ico-sm')} ${esc(t.win.name)}</div><div class="xs muted">${fmtDateTime(t.win.at)}</div>` : `<div class="small t2">مفتوح · الأقرب ${leader ? esc(leader.name) + ' ' + leader.uses : '-'}</div>${me ? `<div class="xs muted">أنت ${me.uses} / ${t.n}</div>` : ''}`}</div>`).join('')}</div>`
    };
    // 2) أكبر صعود في يوم
    const climbs = Sel.climbs(s).filter(c => c.climb > 0);
    const myClimb = me && me.rank ? (s.dayRanks.ranks[me.uid] ? s.dayRanks.ranks[me.uid] - me.rank : null) : null;
    const dayEnd = s.season.start + day * DAY;
    const climb = {
      id: 'climb', icon: 'trending-up', title: 'أكبر صعود في يوم',
      status: ended ? 'ended' : 'live', timing: ended ? 'انتهى مع الموسم' : `يُحسم مع نهاية اليوم ${day}`, endsAt: ended ? null : dayEnd,
      rules: ['يُقارن ترتيبك في نهاية اليوم بترتيبك في بدايته.', 'يُحتسب الصعود الناتج عن استخدامات صحيحة فقط، لا عن تراجع الآخرين بسبب حذف استخدامات مخالفة.', 'فائز واحد لكل يوم، وعند التساوي الأعلى ترتيبًا.'],
      body: `<div class="stack">${climbs.length ? `<div class="row-flex"><span class="chip chip-gold">${ic('arrow-up')}${esc(climbs[0].name)} صعد ${P.ranks(climbs[0].climb)}</span><span class="small muted">متصدر اليوم ${day}</span></div>` : `<p class="small t2">لا صعود مسجّل اليوم حتى الآن.</p>`}
        ${me ? `<p class="small t2">صعودك اليوم: <b class="num">${myClimb == null ? 'غير مصنف' : myClimb > 0 ? '+' + myClimb : myClimb}</b></p>` : ''}
        <div class="small muted">فائزو الأيام السابقة: ${s.climbHistory.slice(-4).map(h => `اليوم ${h.day} ${esc(h.name)} (${h.climb})`).join('، ')}</div></div>`
    };
    // 3) على باب العشرة
    const tenth = st.ranked[9];
    const need = me && tenth ? (me.rank && me.rank <= 10 ? 0 : tenth.uses - me.uses + 1) : null;
    const doorActive = day >= RACE.DOOR_START_DAY;
    const eligible = s.door.eligible;
    const inDoor = eligible ? eligible.filter(u => (st.byUid[u] || {}).rank <= 10) : [];
    const door = {
      id: 'door', icon: 'ladder', title: 'على باب العشرة',
      status: ended ? 'ended' : doorActive ? 'live' : 'soon', timing: doorActive ? 'من اليوم 8 حتى نهاية الموسم' : `يبدأ مع اليوم ${RACE.DOOR_START_DAY}`, startsAt: s.season.start + (RACE.DOOR_START_DAY - 1) * DAY,
      rules: [`المؤهلون: أصحاب المراكز 11 إلى 30 عند بداية اليوم ${RACE.DOOR_START_DAY}.`, 'تكسبه إذا أنهيت الموسم داخل العشرة الأوائل.', 'الجائزة: شارة «اقتحام العشرة».'],
      body: `<div class="stack">${me ? (me.rank && me.rank <= 10 ? `<p class="small ok">${ic('check', 'ico-sm')} أنت داخل العشرة الآن (المركز ${me.rank}).</p>` : `<div class="prog"><div class="prog-top"><span class="small">لتدخل العشرة الآن</span><b class="num">${P.uses(need)}</b></div><div class="prog-bar"><i style="--p:${tenth ? clamp(me.uses / (tenth.uses + 1) * 100, 0, 100) : 0}%"></i></div></div>`) : `<p class="small t2">أنشئ كودك لتتأهل.</p>`}
        ${doorActive && eligible ? `<p class="small muted">${P.players(inDoor.length)} من المؤهلين داخل العشرة الآن.</p>` : `<p class="small muted">يبدأ بعد <span class="num ltr" data-cd-to="${s.season.start + (RACE.DOOR_START_DAY - 1) * DAY}">${fmtDurShort(s.season.start + (RACE.DOOR_START_DAY - 1) * DAY - Store.now())}</span></p>`}</div>`
    };
    // 4) 100 قبل الختام
    const centurions = st.ranked.filter(r => r.uses >= 100);
    const century = {
      id: 'century', icon: 'medal', title: '100 قبل الختام',
      status: ended ? 'ended' : 'live', timing: 'حتى نهاية اليوم 14', endsAt: ended ? null : s.season.end,
      rules: ['اجمع 100 استخدام صحيح من 100 حساب مختلف قبل نهاية الموسم.', 'كل من يصل يكسبه، لا يوجد فائز واحد.', 'يفتح محطة «أسطورة الأكواد» والتصميم الذهبي أيضًا.'],
      body: `<div class="stack">${me ? `<div class="prog"><div class="prog-top"><span class="small">تقدمك</span><b class="num">${Math.min(me.uses, 100)} / 100</b></div><div class="prog-bar gold"><i style="--p:${clamp(me.uses, 0, 100)}%"></i></div></div>` : ''}<p class="small muted">${centurions.length ? `${P.players(centurions.length)} وصلوا: ${centurions.slice(0, 3).map(c => esc(c.name)).join('، ')}` : 'لم يصل أحد بعد.'}</p></div>`
    };
    const share = !ended ? (s.myCode ? `<a class="btn btn-sm btn-primary" href="#/card"><span>${ic('share')} شارك كودك</span></a>` : `<a class="btn btn-sm btn-primary" href="#/create"><span>${ic('plus')} أنشئ كودك لتشارك</span></a>`) : `<a class="btn btn-sm btn-ghost" href="#/board"><span>النتائج النهائية</span></a>`;
    first.action = share + `<a class="btn btn-sm btn-ghost" href="#/board">${ic('list-numbers')}<span>الصدارة</span></a>`;
    climb.action = share + `<a class="btn btn-sm btn-ghost" href="#/board">${ic('trending-up')}<span>ترتيب اليوم</span></a>`;
    door.action = share + (me && me.rank ? `<a class="btn btn-sm btn-ghost" href="#/me">${ic('chart-bar')}<span>موقعي</span></a>` : '');
    century.action = share + `<a class="btn btn-sm btn-ghost" href="#/milestones">${ic('medal')}<span>مراحل الإنجاز</span></a>`;
    return [first, climb, door, century];
  },
  card(c, compact = false) {
    const stc = { live: ['جارٍ', 'chip-ok', 'player-play'], soon: ['قادم', 'chip-line', 'hourglass'], done: ['حُسم', 'chip-gold', 'trophy'], ended: ['انتهى', '', 'flag'] }[c.status];
    return `<article class="ch ${compact ? 'wide' : ''}">
      <div class="ch-top"><span class="ch-ic">${ic(c.icon, 'ico-lg')}</span><div style="min-width:0;flex:1"><h3>${c.title}</h3>
      <div class="meta"><span class="chip ${stc[1]}">${ic(stc[2])}${stc[0]}</span><span class="chip chip-line">${ic('calendar-time')}${c.timing}</span>${c.endsAt ? `<span class="chip chip-line">${ic('clock')}<span class="num ltr" data-cd-to="${c.endsAt}">${fmtDurShort(c.endsAt - Store.now())}</span></span>` : ''}</div></div></div>
      ${c.body}
      ${c.action ? `<div class="btn-row">${c.action}</div>` : ''}
      <details><summary>القواعد ${ic('chevron-down', 'ico-sm')}</summary><ul>${c.rules.map(r => `<li>${r}</li>`).join('')}</ul></details>
    </article>`;
  }
};

<script>

Pages.hall = {

    const unsubRace = Store.on(() => draw());
    const h = async (e) => {

<script>

  async download(kind) {

  const n = clamp(Math.round(uses / 100 * 60), 4, 60);

<script>
'use strict';
/* =========================================================================

const Ceremony = {

   في النسخة الحقيقية: كل أداة تستدعي callable يتحقق من vip/{uid}.endAt على الخادم.
   ========================================================================= */

    if (Store.state && Store.state.live) {
      // الوضع الحي: لوحة نظيفة؛ المشاركون من أصدقائك والمنضمين عبر رابط القاعة
      return {
        mode: 'friends', reward: { balance: 0, lastDay: null, claims: 0 }, hall: { open: true, invited: [] }, members: [],
        events: [], queue: ['سباق الشات', 'القنبلة المتحركة', 'شد الحبل', 'توب 10'], qIndex: -1, autoNext: true, live: null,
        vote: { state: 'idle', round: null, options: [{ g: 'شد الحبل', v: 0 }, { g: 'خمن الرسمة', v: 0 }, { g: 'الطريق الزجاجي', v: 0 }], winner: null },
        tour: { state: 'setup', type: 'elim', game: 'القنبلة المتحركة', reg: [], rounds: [], champion: null, comeback: null, pts: {}, round: 0 },
        teams: [{ name: 'الصقور', ids: [], pts: 0 }, { name: 'الذيابة', ids: [], pts: 0 }],
        wheel: { rot: 0, last: [] }, tools: {}, boards: [],
        log: [{ t: Date.now(), text: 'فُتحت لوحة موسم قائد المجتمع بعد حسم السباق' }]
      };
    }
    const members = FRIENDS.map(([name, handle], i) => ({ id: 'f' + i, name, handle, online: i % 4 !== 3, inHall: i < 8 }));
    return {
      start, end: start + RACE.VIP_DAYS * DAY, mode: 'friends',
      reward: { balance: 0, lastDay: null, claims: 0 },
      hall: { code: 'K7Q-42M', slug: 'fares', open: false, invited: [] },
      members,
      audience: { viewers: 1284, keyword: 'ادخل' },
      events: [
        { id: 'e1', title: 'تحمية الخميس', game: 'سباق الشات', at: t + 2 * HOUR + 15 * MIN, reminder: true },
        { id: 'e2', title: 'ليلة البطولات', game: 'القنبلة المتحركة', at: t + 2 * DAY + 4 * HOUR, reminder: false }
      ],
      queue: ['سباق الشات', 'القنبلة المتحركة', 'شد الحبل', 'توب 10'], qIndex: -1, autoNext: true,
      live: null,
      vote: { state: 'idle', options: [{ g: 'شد الحبل', v: 0 }, { g: 'خمن الرسمة', v: 0 }, { g: 'الطريق الزجاجي', v: 0 }], winner: null },
      tour: { state: 'setup', type: 'elim', game: 'القنبلة المتحركة', reg: members.filter(m => m.inHall).map(m => m.id), rounds: [], champion: null, comeback: null, pts: {}, round: 0 },
      teams: [{ name: 'الصقور', ids: ['f0', 'f2', 'f4', 'f6'], pts: 42 }, { name: 'الذيابة', ids: ['f1', 'f3', 'f5', 'f7'], pts: 38 }],
      wheel: { rot: 0, last: [] },
      tools: {},
      boards: [{ id: 'b0', title: 'جولة الافتتاح', game: 'سباق الشات', at: t - 20 * MIN, rows: [['غلا', 34], ['نوف', 31], ['سطام', 25], ['ريان', 19], ['لمى', 12]] }],
      log: [{ t, text: 'فُتحت لوحة موسم قائد المجتمع بعد حسم السباق' }]
    };
  },
  v() { return Store.state.vip; },
  mode() { const v = this.v(); return v ? v.mode : 'friends'; },
  isStreamer() { return this.mode() === 'streamer'; },
  /* اسم المشارك حسب الوضع: الأصدقاء بالاسم، المتابعون بالمعرّف */
  pname(id) { const m = this.v().members.find(x => x.id === id); if (!m) return 'مشارك'; return this.isStreamer() && !Store.state.live ? '\u2066@' + m.handle + '\u2069' : m.name; },
  someone(i = 0) { const p = this.participants(); return p.length ? this.pname(p[i % p.length]) : 'أول مشارك'; }, // عزل LTR للمعرّف داخل النص العربي
  participants() { return this.v().members.filter(m => m.inHall).map(m => m.id); },
  log(text) { Store.state.vip.log.unshift({ t: Store.now(), text }); Store.state.vip.log = Store.state.vip.log.slice(0, 40); },
  mut(fn, msg) {
    const vv = Sel.vip();
    if (vv && vv.expired) { toast('انتهت مدة VIP. الأدوات مقفلة، والسجل متاح للعرض.', 'err', 'lock'); return false; }
    Store.set(s => { fn(s.vip); if (msg) this.log(msg); }, 'vip');
    return true;
  },
  T(friends, streamer) { return this.isStreamer() ? streamer : friends; }
};

    validate: () => Vip.v().boards.length ? null : 'لا توجد فعالية منتهية لإعادتها بعد. أعلن نتائج جولة أولًا.',
    run: (c, v) => { const b = v.boards.find(x => c.from.startsWith(x.title)) || v.boards[0]; openGame(b.game); v.live = { game: b.game, title: b.title + ' (إعادة)', at: Store.now(), ids: Vip.participants() }; return { status: 'on', label: 'بدأت', html: `بدأت إعادة ${esc(b.game)} ${c.same ? 'بنفس المشاركين' : 'بمشاركين جدد'}${c.cfg ? ' والإعدادات' : ''}.` }; }, act: 'ابدأ الإعادة' },
  { id: 'highlights', n: 23, stage: 'results', icon: 'photo', name: 'ملخص اللقطات والنتائج', desc: 'ملخص قابل للنسخ بعد كل مباراة.',
    fields: () => [sel('ev', 'الفعالية', Vip.v().boards.map(b => b.title))],
    run: (c, v) => { const b = v.boards.find(x => x.title === c.ev) || v.boards[0]; const txtSum = `${b.title} (${b.game})\nالفائز: ${b.rows[0][0]} بـ${b.rows[0][1]} نقطة\nالثاني: ${b.rows[1] ? b.rows[1][0] : '-'}\nأقرب لحظة: فارق ${b.rows[1] ? b.rows[0][1] - b.rows[1][1] : 0} نقاط في الجولة الأخيرة\n#احسمها`; return { status: 'done', label: 'جاهز', sum: txtSum, html: '' }; },
    view: (st) => `<pre class="small t2" style="white-space:pre-wrap;margin:0;font-family:var(--f-body);background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(st.sum)}</pre><button class="btn btn-sm btn-ghost keep" data-act="hl-copy">${ic('copy')}<span>انسخ الملخص</span></button>`, act: 'أنشئ الملخص' }
];
const STAGES = [
  ['plan', 'التخطيط', 'حدّد المواعيد ودع المجموعة تختار.'],
  ['hall', 'تجهيز القاعة', 'المدخل، الطابور، ومن يساعدك.'],
  ['people', 'إدارة المشاركين', 'بطولات وفرق ومواجهات.'],
  ['round', 'لحظات الجولة', 'أدوات تُستخدم أثناء اللعب.'],
  ['finals', 'النهائيات', 'الحسم في نهاية الفعالية أو الشهر.'],
  ['results', 'النتائج', 'ما يبقى بعد كل فعالية.']
];
const toolName = (t) => typeof t.name === 'function' ? t.name() : t.name;
const toolDesc = (t) => typeof t.desc === 'function' ? t.desc() : t.desc;

/* ---------- عرض الأدوات المخصصة ---------- */
const VipViews = {
  hall(v, x) {
    const s = Vip.isStreamer();
    const inHall = v.members.filter(m => m.inHall);
    const link = Store.state.live ? raceURL('/hall/' + v.hall.slug) : `${RACE.PROD_ORIGIN}/code-race.html#/hall/${v.hall.slug}`;
    if (Store.state.live && !v.members.length) return `<div class="tool-body"><div class="row-flex"><span class="plate" style="font-size:22px"><span class="pre">رمز القاعة</span><span class="val">${esc(v.hall.code || '')}</span></span><button class="btn btn-sm btn-ghost keep" data-act="hall-copy">${ic('link')}<span>نسخ رابط القاعة</span></button></div>
      <div class="note">${ic('users')}<div><b>لا يوجد مشاركون بعد.</b> أرسل رابط القاعة لأصدقائك أو متابعيك؛ كل من يضغط «انضم» يظهر هنا. أصدقاؤك في احسمها يظهرون تلقائيًا.</div></div>
      <a class="btn btn-quiet keep" href="#/hall/${esc(v.hall.slug)}">${ic('eye')}شاهد صفحة القاعة كما يراها الجمهور</a></div>`;
    return `<div class="tool-body">
      <div class="row-flex">${s ? `<span class="plate" style="font-size:14px;letter-spacing:.02em;min-width:0;flex:1"><span class="val">${link}</span></span>` : `<span class="plate" style="font-size:26px"><span class="pre">رمز القاعة</span><span class="val">${v.hall.code}</span></span>`}
        <button class="btn btn-sm btn-ghost keep" data-act="hall-copy">${ic('copy')}<span>${s ? 'نسخ الرابط' : 'نسخ الرمز'}</span></button></div>
      <div class="row-flex"><span class="chip ${v.hall.open ? 'chip-ok' : ''}">${ic(v.hall.open ? 'lock-open' : 'lock')}${v.hall.open ? (s ? 'الصفحة مفتوحة للجمهور' : 'القاعة مفتوحة') : (s ? 'الصفحة مغلقة' : 'القاعة مغلقة')}</span>
        ${Store.state.live ? `<span class="chip">${ic('users')}${inHall.length} داخل القاعة</span><span class="chip">${ic('link')}يدخلون من رابط ${s ? 'الصفحة' : 'القاعة'}</span>` : s ? `<span class="chip">${ic('eye')}<span class="num">${fmtN(v.audience.viewers)}</span> مشاهد</span><span class="chip">${ic('message-circle')}للدخول: اكتب «${v.audience.keyword}» في الشات</span>` : `<span class="chip">${ic('users')}${inHall.length} داخل القاعة</span>`}</div>
      <ul class="mini-list">${v.members.slice(0, 10).map(m => `<li><span class="ord">${m.inHall ? ic('check', 'ico-sm ok') : ''}</span><span class="nm">${esc(Vip.pname(m.id))}</span>${s ? `<span class="xs muted">${m.inHall ? 'انضم من الشات' : 'يشاهد'}</span>` : `<span class="xs ${m.online ? 'ok' : 'muted'}">${m.online ? 'متصل' : 'غير متصل'}</span>`}
        ${!m.inHall ? (v.hall.invited.includes(m.id) ? `<span class="chip chip-warn xs">${ic('hourglass')}بانتظار القبول</span>` : `<button class="btn btn-sm btn-ghost" data-act="hall-invite" data-id="${m.id}"><span>${s ? 'أدخله' : 'ادعُ'}</span></button>`) : `<button class="icon-btn" data-act="hall-kick" data-id="${m.id}" aria-label="إخراج ${esc(Vip.pname(m.id))}">${ic('x', 'ico-sm')}</button>`}</li>`).join('')}</ul>
      </div><div class="tool-f"><button class="btn ${v.hall.open ? 'btn-ghost' : 'btn-gold'}" data-act="hall-toggle"><span>${ic(v.hall.open ? 'lock' : 'lock-open')} ${v.hall.open ? (s ? 'أغلق الصفحة' : 'أغلق القاعة') : (s ? 'افتح صفحة الفعالية' : 'افتح القاعة')}</span></button></div>`;
  },
  schedule(v) {
    const ev = v.events.slice().sort((a, b) => a.at - b.at);
    const now = Store.now();
    return `<div class="tool-body"><ul class="mini-list">${ev.length ? ev.map(e => `<li><div class="nm wrap"><b>${esc(e.title)}</b><div class="xs muted">${esc(e.game)} · ${fmtDateTime(e.at)}</div></div>
      <span class="chip ${e.at - now < HOUR && e.at > now ? 'chip-gold' : 'chip-line'}">${e.at > now ? `<span class="num ltr" data-cd-to="${e.at}">${fmtDurShort(e.at - now)}</span>` : 'بدأت'}</span>
      <button class="icon-btn" data-act="ev-remind" data-id="${e.id}" aria-pressed="${e.reminder}" aria-label="${e.reminder ? 'إلغاء التذكير' : 'تفعيل التذكير'} لـ${esc(e.title)}">${ic(e.reminder ? 'bell-ringing' : 'bell', e.reminder ? 'gold' : '')}</button>
      <button class="icon-btn" data-act="ev-del" data-id="${e.id}" aria-label="حذف ${esc(e.title)}">${ic('trash', 'ico-sm')}</button></li>`).join('') : '<li><span class="nm muted">لا مواعيد. أضف أول فعالية.</span></li>'}</ul>
      <form class="stack" data-form="ev-add" style="gap:8px"><div class="row-flex" style="gap:8px"><input class="input" name="title" placeholder="اسم الفعالية" aria-label="اسم الفعالية" maxlength="40" style="flex:2 1 160px" required><select class="select" name="game" aria-label="اللعبة" style="flex:1 1 140px">${GAMES.map(g => `<option>${g}</option>`).join('')}</select></div>
        <div class="row-flex" style="gap:8px"><select class="select" name="when" aria-label="الموعد" style="flex:1 1 160px"><option value="1">بعد ساعة</option><option value="tonight">الليلة 9:00 م</option><option value="tomorrow">غدًا 9:00 م</option><option value="3d">بعد 3 أيام 8:00 م</option></select>
        <button class="btn btn-sm btn-primary" type="submit"><span>${ic('plus')} أضف</span></button></div></form></div>`;
  },
  queue(v) {
    return `<div class="tool-body"><ol class="mini-list">${v.queue.map((g, i) => `<li class="${i === v.qIndex ? 'cur' : ''}"><span class="ord num">${i + 1}</span><span class="nm">${esc(g)}${i === v.qIndex ? ' <span class="chip chip-gold xs">الآن</span>' : ''}</span>
      ${i === 0 ? '<span class="icon-spacer"></span>' : `<button class="icon-btn" data-act="q-up" data-i="${i}" aria-label="ارفع ${esc(g)}">${ic('chevron-up', 'ico-sm')}</button>`}${i === v.queue.length - 1 ? '<span class="icon-spacer"></span>' : `<button class="icon-btn" data-act="q-down" data-i="${i}" aria-label="أنزل ${esc(g)}">${ic('chevron-down', 'ico-sm')}</button>`}<button class="icon-btn" data-act="q-del" data-i="${i}" aria-label="احذف ${esc(g)}">${ic('x', 'ico-sm')}</button></li>`).join('')}</ol>
      <div class="row-flex" style="gap:8px"><select class="select" data-q-add aria-label="أضف لعبة" style="flex:1">${GAMES.filter(g => !v.queue.includes(g)).map(g => `<option>${g}</option>`).join('')}</select><button class="btn btn-sm btn-ghost" data-act="q-add">${ic('plus')}<span>أضف</span></button></div>
      <label class="switch small"><input type="checkbox" data-act="q-auto" ${v.autoNext ? 'checked' : ''}>انتقال تلقائي للعبة التالية بعد إعلان النتائج</label></div>
      <div class="tool-f">${v.qIndex < 0 ? `<button class="btn btn-gold" data-act="q-start"><span>${ic('player-play')} ابدأ الطابور</span></button>` : `<button class="btn btn-primary" data-act="q-next"><span>${ic('player-skip-forward')} ${v.qIndex >= v.queue.length - 1 ? 'أنهِ الطابور' : 'اللعبة التالية'}</span></button>`}</div>`;
  },
  vote(v) {
    const total = v.vote.options.reduce((a, o) => a + o.v, 0) || 1;
    const st = v.vote.state;
    return `<div class="tool-body">${st === 'idle' ? `<div class="stack" style="gap:8px">${v.vote.options.map((o, i) => `<select class="select" data-vote-opt="${i}" aria-label="الخيار ${i + 1}">${GAMES.map(g => `<option ${g === o.g ? 'selected' : ''}>${g}</option>`).join('')}</select>`).join('')}</div><p class="small muted">${Vip.T('يصل التصويت لأعضاء القاعة.', 'الجمهور يكتب 1 أو 2 أو 3 في الشات.')}</p>`
      : `<div class="stack" style="gap:8px">${v.vote.options.map((o, i) => `<div class="vbar ${v.vote.winner === i ? 'win' : ''}"><div class="tr"><i style="--p:${o.v / total * 100}%"></i><span>${Vip.isStreamer() ? i + 1 + ' · ' : ''}${esc(o.g)}</span></div><b class="num">${o.v}</b></div>`).join('')}</div>
        ${st === 'closed' ? `<p class="small ok">${ic('check', 'ico-sm')} الفائزة: ${esc(v.vote.options[v.vote.winner].g)}</p>` : `<p class="small muted">${ic('clock', 'ico-sm')} التصويت مفتوح. الأصوات تتوالى (محاكاة).</p>`}`}</div>
      <div class="tool-f">${st === 'idle' ? `<button class="btn btn-gold" data-act="vote-open"><span>${ic('player-play')} افتح التصويت</span></button>` : st === 'open' ? `<button class="btn btn-primary" data-act="vote-close"><span>أغلق وأعلن</span></button>` : `<button class="btn btn-primary" data-act="vote-queue"><span>${ic('list-numbers')} اجعلها التالية</span></button><button class="btn btn-ghost" data-act="vote-reset">تصويت جديد</button>`}</div>`;
  },
  tour(v) {
    const t = v.tour;
    if (t.state === 'setup') {
      return `<div class="tool-body"><div class="row-flex" style="gap:8px"><div class="seg" role="group" aria-label="نوع البطولة"><button type="button" data-act="tour-type" data-v="elim" aria-pressed="${t.type === 'elim'}">إقصاء مباشر</button><button type="button" data-act="tour-type" data-v="points" aria-pressed="${t.type === 'points'}">نقاط · 3 جولات</button></div>
        <select class="select" data-tour-game aria-label="لعبة البطولة" style="flex:1 1 160px">${GAMES.map(g => `<option ${g === t.game ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
        <p class="small t2">التسجيل: <b class="num">${t.reg.length}</b> ${Vip.T('من أعضاء القاعة', 'من المتابعين المنضمين')}. ${t.type === 'elim' ? 'الإقصاء يحتاج 4 إلى 8.' : 'النقاط تحتاج 3 على الأقل.'}</p>
        <div class="discover">${v.members.map(m => `<button type="button" data-act="tour-reg" data-id="${m.id}" aria-pressed="${t.reg.includes(m.id)}" style="${t.reg.includes(m.id) ? 'border-color:rgba(242,181,68,.5);color:var(--text)' : ''}">${ic(t.reg.includes(m.id) ? 'check' : 'plus')}${esc(Vip.pname(m.id))}</button>`).join('')}</div></div>
        <div class="tool-f"><button class="btn btn-gold" data-act="tour-start"><span>${ic('tournament')} اقفل التسجيل وأنشئ الجدول</span></button></div>`;
    }
    if (t.type === 'points') {
      const rows = t.reg.map(id => [id, t.pts[id] || 0]).sort((a, b) => b[1] - a[1]);
      return `<div class="tool-body"><div class="row-flex"><span class="chip">${esc(t.game)}</span><span class="chip ${t.champion ? 'chip-gold' : 'chip-ok'}">${t.champion ? 'انتهت' : `الجولة ${t.round + 1} من 3`}</span></div>
        <ol class="mini-list">${rows.map(([id, p], i) => `<li class="${t.champion && i === 0 ? 'cur' : ''}"><span class="ord num">${i + 1}</span><span class="nm">${esc(Vip.pname(id))}</span><b class="num">${p}</b></li>`).join('')}</ol>
        <p class="small muted">${ic('info-circle', 'ico-sm')} بطاقة العودة غير متاحة في بطولات النقاط.</p></div>
        <div class="tool-f">${t.champion ? `<button class="btn btn-ghost" data-act="tour-reset">بطولة جديدة</button>` : `<button class="btn btn-primary" data-act="tour-round"><span>${ic('check')} سجّل نتائج الجولة ${t.round + 1}</span></button>`}</div>`;
    }
    const names = ['ربع النهائي', 'نصف النهائي', 'النهائي'];
    const offset = 3 - t.rounds.length;
    return `<div class="tool-body"><div class="row-flex"><span class="chip">${esc(t.game)}</span>${t.champion ? `<span class="chip chip-gold">${ic('trophy')}البطل: ${esc(Vip.pname(t.champion))}</span>` : '<span class="chip chip-ok">اضغط اسم الفائز في كل مواجهة</span>'}${t.comeback ? `<span class="chip chip-warn">${ic('arrow-back-up')}استُخدمت بطاقة العودة: ${esc(Vip.pname(t.comeback))}</span>` : ''}</div>
      <div class="bracket" style="grid-template-columns:repeat(${t.rounds.length},minmax(0,1fr))">${t.rounds.map((r, ri) => `<div class="round"><h4>${names[ri + offset]}</h4>${r.map((m, mi) => `<div class="match">${[0, 1].map(k => { const id = m.p[k]; const w = m.w; const label = id ? esc(Vip.pname(id)) : (m.bye && k === 1 ? 'تأهل مباشر' : 'بانتظار الفائز'); return (id && w == null && m.p[0] && m.p[1]) ? `<button data-act="tour-win" data-r="${ri}" data-m="${mi}" data-k="${k}" aria-label="فوز ${label}"><span>${label}</span></button>` : `<div class="slot ${w == null ? '' : w === k ? 'w' : 'l'}">${w === k ? ic('trophy', 'ico-sm') : ''}<span>${label}</span></div>`; }).join('')}
        ${m.w != null && !m.bye && !t.comeback && !t.champion ? `<button data-act="tour-comeback" data-r="${ri}" data-m="${mi}" style="justify-content:center;color:var(--warn);font-size:12px">${ic('arrow-back-up', 'ico-sm')}<span>بطاقة عودة لـ${esc(Vip.pname(m.p[1 - m.w]))}</span></button>` : ''}</div>`).join('')}</div>`).join('')}</div></div>
      <div class="tool-f">${t.champion ? `<button class="btn btn-ghost" data-act="tour-reset">بطولة جديدة</button>` : (Store.state.live ? `<span class="small muted">اضغط اسم الفائز في كل مواجهة بعد نهايتها في احسمها.</span>` : `<button class="btn btn-ghost btn-sm" data-act="tour-auto">${ic('dice-5')}<span>حسم تجريبي للجولة</span></button>`)}</div>`;
  },
  teams(v) {
    const unassigned = Vip.participants().filter(id => !v.teams.some(t => t.ids.includes(id)));
    return `<div class="tool-body"><div class="team-cols">${v.teams.map((t, ti) => `<div class="team"><h4>${ic('users-group', 'ico-sm gold')}<input value="${esc(t.name)}" data-team-name="${ti}" aria-label="اسم الفريق ${ti + 1}" maxlength="18"><span class="num xs muted">${t.pts}</span></h4>
      <ul>${t.ids.map(id => `<li><span>${esc(Vip.pname(id))}</span><button data-act="team-move" data-t="${ti}" data-id="${id}" aria-label="انقل ${esc(Vip.pname(id))} للفريق الآخر">نقل</button></li>`).join('') || '<li class="muted">فارغ</li>'}</ul></div>`).join('')}</div>
      ${unassigned.length ? `<p class="small muted">بلا فريق: ${unassigned.map(id => esc(Vip.pname(id))).join('، ')}</p>` : ''}</div>
      <div class="tool-f"><button class="btn btn-primary" data-act="team-shuffle"><span>${ic('dice-5')} وزّع عشوائيًا</span></button>${v.teams.length < 4 ? `<button class="btn btn-ghost" data-act="team-add">${ic('plus')}<span>فريق</span></button>` : ''}${v.teams.length > 2 ? `<button class="btn btn-ghost" data-act="team-remove">${ic('minus')}<span>فريق</span></button>` : ''}</div>`;
  },
  wheel(v) {
    const seg = 360 / WHEEL.length;
    const grad = WHEEL.map(([, c], i) => `${c} ${i * seg}deg ${(i + 1) * seg}deg`).join(',');
    return `<div class="tool-body"><div class="wheel-wrap"><div class="wheel" id="wheel" style="background:conic-gradient(${grad});transform:rotate(${v.wheel.rot}deg)" role="img" aria-label="عجلة المفاجآت: ${WHEEL.map(w => w[0]).join('، ')}"></div></div>
      <div class="discover" style="justify-content:center">${WHEEL.map(([n, c]) => `<span class="chip" style="background:${c}33">${n}</span>`).join('')}</div>
      <div id="wheel-res" aria-live="polite">${v.wheel.last.length ? `<p class="small" style="text-align:center">آخر نتيجة: <b class="gold">${esc(v.wheel.last[0])}</b>${v.wheel.last[1] ? ` <span class="muted">· قبلها ${v.wheel.last.slice(1, 3).map(esc).join('، ')}</span>` : ''}</p>` : ''}</div></div>
      <div class="tool-f"><button class="btn btn-gold" data-act="wheel-spin"><span>${ic('refresh')} أدر العجلة</span></button></div>`;
  },
  comeback(v) {
    const t = v.tour;
    const msg = t.type !== 'elim' ? 'تعمل في بطولات الإقصاء فقط. البطولة الحالية بنظام النقاط.' : t.state === 'setup' ? 'تتفعّل بعد إنشاء جدول بطولة إقصاء.' : t.comeback ? `استُخدمت لـ${esc(Vip.pname(t.comeback))} في هذه البطولة.` : t.champion ? 'انتهت البطولة.' : 'متاحة الآن: اختر مواجهة محسومة من جدول البطولة.';
    return `<div class="tool-body"><p class="small t2">${msg}</p><p class="xs muted">مرة واحدة لكل بطولة. الخاسر يعود ليعيد المواجهة نفسها، ولا تُستخدم في النهائي بعد التتويج.</p></div>
      <div class="tool-f"><a class="btn btn-ghost btn-sm keep" href="#tool-tour">${ic('tournament')}<span>إلى جدول البطولة</span></a></div>`;
  },
  boards(v) {
    const cur = x.boardSel && v.boards.find(b => b.id === x.boardSel) || v.boards[v.boards.length - 1];
    if (!cur) return `<div class="tool-body"><div class="note">${ic('list-numbers')}<div><b>لا توجد نتائج بعد.</b> ابدأ لعبة من الطابور، وبعد نهايتها اضغط «أعلن النتائج» لتظهر صدارتها هنا وفي صفحة القاعة.</div></div></div>`;

function genericTool(t, v) {
  const st = v.tools[t.id];
  const stChip = st ? `<span class="chip ${st.status === 'wait' ? 'chip-warn' : st.status === 'done' ? 'chip-line' : 'chip-ok'} st">${st.label}</span>` : '<span class="chip chip-line st">غير مُعد</span>';
  let body = '';
  if (st) body = `<div class="res-card ${st.status === 'done' ? '' : 'gold'}">${t.view ? t.view(st) : st.html}<div class="xs muted" style="margin-top:6px">${relTime(st.at)}</div></div>`;
  return { stChip, body, foot: `<button class="btn ${st ? 'btn-ghost' : 'btn-primary'}" data-act="tool-open" data-id="${t.id}"><span>${ic(st ? 'settings' : 'player-play')} ${st ? 'إعداد جديد' : t.act}</span></button>${st ? `<button class="btn btn-quiet" data-act="tool-stop" data-id="${t.id}">${st.status === 'done' ? 'مسح' : 'أوقف'}</button>` : ''}` };
}
function toolCard(t, v) {
  const custom = t.custom;
  let head = `<div class="tool-h"><span class="tool-ic">${ic(t.icon)}</span><div style="min-width:0;flex:1"><h3>${toolName(t)}</h3><p>${toolDesc(t)}</p></div>`;
  if (custom) return `<article class="tool ${t.feat ? 'feat' : ''} ${t.span ? 'span2' : ''}" id="tool-${t.id}" data-tool="${t.id}">${head}</div>${VipViews[t.id](v, x)}</article>`;
  const g = genericTool(t, v);
  return `<article class="tool" id="tool-${t.id}" data-tool="${t.id}">${head}${g.stChip}</div>${g.body}<div class="tool-f">${g.foot}</div></article>`;
}
function openToolDialog(t) {
  const fields = t.fields();
  const prev = (Vip.v().tools[t.id] || {}).cfg || {};
  const body = `<form class="stack-lg" data-tool-form="${t.id}" novalidate><p class="t2">${toolDesc(t)}</p>${fields.map(f => {
    const val = prev[f.k] ?? f.def; const id = 'tf-' + f.k;
    if (f.type === 'select') return `<div class="field"><label for="${id}">${f.label}</label><select class="select" id="${id}" name="${f.k}">${f.options.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    if (f.type === 'number') return `<div class="field"><label for="${id}">${f.label}</label><input class="input num" id="${id}" name="${f.k}" type="number" inputmode="numeric" min="${f.min}" max="${f.max}" value="${val}"></div>`;
    if (f.type === 'text') return `<div class="field"><label for="${id}">${f.label}</label><input class="input" id="${id}" name="${f.k}" value="${esc(val)}" maxlength="40"></div>`;
    if (f.type === 'toggle') return `<label class="switch"><input type="checkbox" name="${f.k}" ${val ? 'checked' : ''}>${f.label}</label>`;
    if (f.type === 'multi') return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">${f.label}</legend>${f.options.map(o => `<label class="switch"><input type="checkbox" name="${f.k}" value="${esc(o)}" ${(val || []).includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}</fieldset>`;
    return '';
  }).join('')}<div class="msg err" data-err role="alert"></div></form>${t.id === 'pointsbox' ? `<p class="small muted">رصيدك الحالي: <b class="num gold">${Vip.v().reward.balance}</b> نقطة.</p>` : ''}`;
  const d = Dialog.open({
    title: `${toolName(t)}`, body,
    foot: `<button class="btn btn-gold" data-run><span>${ic('player-play')} ${t.act}</span></button><button class="btn btn-ghost" data-close>إلغاء</button>`,
    mount: (el) => {
      el.querySelector('[data-run]').addEventListener('click', () => {
        const form = el.querySelector('form');
        const cfg = {};
        fields.forEach(f => {
          if (f.type === 'toggle') cfg[f.k] = form.elements[f.k].checked;
          else if (f.type === 'multi') cfg[f.k] = $$(`input[name="${f.k}"]:checked`, form).map(i => i.value);
          else cfg[f.k] = form.elements[f.k].value;
        });
        const needPeople = ['assistant', 'revenge', 'mystery', 'secret'].includes(t.id) && !Vip.participants().length && !(t.id === 'assistant' && Vip.v().members.length);
        const needBoards = t.id === 'highlights' && !Vip.v().boards.length;

        if (err) { el.querySelector('[data-err]').innerHTML = ic('alert-circle', 'ico-sm') + ' ' + err; return; }
        const ok = Vip.mut(v => { const r = t.run(cfg, v); v.tools[t.id] = { ...r, cfg, at: Store.now() }; }, `${toolName(t)}: ${t.act}`);
        if (ok) { d.close(); toast(`${toolName(t)}: تم التشغيل`, 'gold', t.icon); setTimeout(() => { const c = $('#tool-' + t.id); c && c.scrollIntoView({ block: 'nearest', behavior: Motion.reduced() ? 'auto' : 'smooth' }); }, 50); }
      });
    }
  });
}

    if (Sel.vip().expired) return toast('انتهت مدة VIP.', 'err', 'lock');
    openGame(v.queue[ni]);
    Vip.mut(vv => { vv.qIndex = ni; vv.live = { game: vv.queue[ni], title: vv.queue[ni], at: Store.now(), ids: Vip.participants() }; }, `بدأت ${v.queue[ni]}`);

  },
  async 'live-end'() {
    const v = Store.state.vip; if (!v.live) return;
    if (Sel.vip().expired) return toast('انتهت مدة VIP.', 'err', 'lock');
    const ids = v.live.ids.length ? v.live.ids : Vip.participants();
    const scores = await scoresDialog(ids, `نتائج ${v.live.game}`, !Store.state.live);
    if (!scores) return;
    if (!scores.length) { Vip.mut(vv => { vv.live = null; }, `أُنهيت ${v.live.game} بلا مشاركين`); return; }
    const rows = scores.map(([id, p]) => [Vip.pname(id), p]).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const title = v.live.title || v.live.game;
    Vip.mut(vv => { vv.boards.push({ id: 'b' + uid(), title: title + ' · ' + fmtTime(Store.now()), game: vv.live.game, at: Store.now(), rows }); vv.live = null; if (vv.autoNext && vv.qIndex < vv.queue.length - 1) { vv.qIndex++; vv.live = { game: vv.queue[vv.qIndex], title: vv.queue[vv.qIndex], at: Store.now(), ids: Vip.participants() }; openGame(vv.queue[vv.qIndex]); } }, `أُعلنت نتائج ${title}: الفائز ${rows[0][0]}`);
    x.boardSel = null;
    toast(`فاز ${esc(rows[0][0])}. أُضيفت النتيجة لصدارة الفعاليات`, 'gold', 'trophy');
  },
  'hall-toggle'() { const o = !Store.state.vip.hall.open; Vip.mut(v => v.hall.open = o, o ? (Vip.isStreamer() ? 'فتحت صفحة الفعالية' : 'فتحت القاعة') : (Vip.isStreamer() ? 'أغلقت صفحة الفعالية' : 'أغلقت القاعة')); },
  'hall-copy'(b) { const v = Store.state.vip; const link = Store.state.live ? raceURL('/hall/' + v.hall.slug) : `${RACE.PROD_ORIGIN}/code-race.html#/hall/${v.hall.slug}`; copyText(Vip.isStreamer() || Store.state.live ? link : v.hall.code, b, 'تم النسخ'); },
  'hall-invite'(b) {
    const id = b.dataset.id;
    if (Store.state.live) { copyText(raceURL('/hall/' + Store.state.vip.hall.slug), b, 'تم نسخ الرابط'); toast(`أرسل الرابط لـ${esc(Vip.pname(id))}. يظهر هنا عند ضغطه «انضم»`, 'ok', 'link'); return; }
    if (Vip.isStreamer()) { Vip.mut(v => v.members.find(m => m.id === id).inHall = true, `أدخلت ${Vip.pname(id)} للفعالية`); return; }
    Vip.mut(v => v.hall.invited.push(id), `دعوت ${Vip.pname(id)} للقاعة`);
    toast(`أُرسلت الدعوة إلى ${esc(Vip.pname(id))}`, 'ok', 'user-plus');
    setTimeout(() => { if (Store.state.vip && !(Sel.vip().expired)) Store.set(s => { const m = s.vip.members.find(m => m.id === id); m.inHall = true; s.vip.hall.invited = s.vip.hall.invited.filter(x => x !== id); s.vip.log.unshift({ t: Store.now(), text: `${m.name} قبل الدعوة ودخل القاعة` }); }, 'vip'); }, 2500);
  },
  'hall-kick'(b) { const id = b.dataset.id; if (Store.state.live) Live.kick(Store.state.vip.hall.slug, id); Vip.mut(v => { v.members.find(m => m.id === id).inHall = false; v.tour.reg = v.tour.reg.filter(x => x !== id); }, `أخرجت ${Vip.pname(id)}`); },
  'ev-remind'(b) { const id = b.dataset.id; let on; Vip.mut(v => { const e = v.events.find(e => e.id === id); e.reminder = !e.reminder; on = e.reminder; }); toast(on ? (Store.state.live ? 'فعّلت التذكير: يظهر الموعد بارزًا مع عدّه في صفحة القاعة' : 'سيصلك تذكير قبل 15 دقيقة (محاكاة)') : 'ألغيت التذكير', on ? 'gold' : '', on ? 'bell-ringing' : 'bell'); },
  async 'ev-del'(b) { const id = b.dataset.id; const e = Store.state.vip.events.find(e => e.id === id); const ok = await Dialog.confirm({ title: 'حذف الفعالية؟', body: `<p class="t2">ستُحذف «${esc(e.title)}» من الجدول ويُلغى تذكيرها.</p>`, ok: 'احذف', kind: 'danger', icon: 'trash' }); if (ok) Vip.mut(v => v.events = v.events.filter(x => x.id !== id), `حذفت «${e.title}»`); },
  'q-up'(b) { const i = +b.dataset.i; Vip.mut(v => { [v.queue[i - 1], v.queue[i]] = [v.queue[i], v.queue[i - 1]]; if (v.qIndex === i) v.qIndex--; else if (v.qIndex === i - 1) v.qIndex++; }); },
  'q-down'(b) { const i = +b.dataset.i; Vip.mut(v => { [v.queue[i + 1], v.queue[i]] = [v.queue[i], v.queue[i + 1]]; if (v.qIndex === i) v.qIndex++; else if (v.qIndex === i + 1) v.qIndex--; }); },
  'q-del'(b) { const i = +b.dataset.i; Vip.mut(v => { const g = v.queue.splice(i, 1)[0]; if (v.qIndex >= i) v.qIndex = Math.max(-1, v.qIndex - 1); v.log.unshift({ t: Store.now(), text: `أزلت ${g} من الطابور` }); }); },
  'q-add'() { const s = $('[data-q-add]'); if (!s || !s.value) return; const g = s.value; Vip.mut(v => v.queue.push(g), `أضفت ${g} للطابور`); },
  'demo-vip-active'() { Demo.vipActive(false); toast('عادت لوحة VIP نشطة (معاينة)', 'gold', 'key'); },
  'q-start'() { if (!Store.state.vip.queue.length) { toast('الطابور فارغ. أضف لعبة من القائمة أولًا.', 'err', 'list-numbers'); $('[data-q-add]') && $('[data-q-add]').focus(); return; } if (Sel.vip().expired) return toast('انتهت مدة VIP.', 'err', 'lock'); openGame(Store.state.vip.queue[0]); Vip.mut(v => { v.qIndex = 0; v.live = { game: v.queue[0], title: v.queue[0], at: Store.now(), ids: Vip.participants() }; }, `بدأ الطابور: ${Store.state.vip.queue[0]}`); },
  'q-next'() {
    const v = Store.state.vip;
    if (v.live) VipActions['live-end']();
    else if (v.qIndex >= v.queue.length - 1) Vip.mut(vv => { vv.qIndex = -1; }, 'انتهى الطابور');
    else { openGame(v.queue[v.qIndex + 1]); Vip.mut(vv => { vv.qIndex++; vv.live = { game: vv.queue[vv.qIndex], title: vv.queue[vv.qIndex], at: Store.now(), ids: Vip.participants() }; }); }
    if (Store.state.vip.qIndex >= Store.state.vip.queue.length - 1 && !Store.state.vip.live) Vip.mut(vv => vv.qIndex = -1);
  },
  'vote-open'(b, e, ctx) { const gs = Store.state.vip.vote.options.map(o => o.g); if (new Set(gs).size < gs.length) { toast('اختر ثلاث ألعاب مختلفة.', 'err'); return; } if (Vip.mut(v => { v.vote.state = 'open'; v.vote.round = uid(); v.vote.options.forEach(o => o.v = 0); v.vote.winner = null; }, 'فتحت تصويت اللعبة القادمة') && !Store.state.live) setTimeout(ctx.startVoteSim, 50); if (Store.state.live) toast('التصويت مفتوح في صفحة القاعة. انسخ رابطها وأرسله.', 'gold', 'chart-bar'); },
  'vote-close'() { Vip.mut(v => { v.vote.state = 'closed'; let w = 0; v.vote.options.forEach((o, i) => { if (o.v > v.vote.options[w].v) w = i; }); v.vote.winner = w; }, 'أُغلق التصويت'); },
  'vote-queue'() { const vv = Store.state.vip; const g = vv.vote.options[vv.vote.winner].g; if (vv.queue.indexOf(g) === vv.qIndex + 1) { toast(`${esc(g)} هي التالية في الطابور بالفعل`, 'ok', 'check'); return; } Vip.mut(v => { v.queue = v.queue.filter(x => x !== g); v.queue.splice(v.qIndex + 1, 0, g); }, `${g} هي اللعبة التالية في الطابور`); toast(`${esc(g)} صارت التالية في الطابور`, 'gold', 'list-numbers'); },
  'vote-reset'() { Vip.mut(v => { v.vote.state = 'idle'; v.vote.options.forEach(o => o.v = 0); v.vote.winner = null; }); },
  'tour-type'(b) { Vip.mut(v => v.tour.type = b.dataset.v); },
  'tour-reg'(b) { const id = b.dataset.id; Vip.mut(v => { const r = v.tour.reg; const i = r.indexOf(id); if (i >= 0) r.splice(i, 1); else r.push(id); }); },
  'tour-start'() {
    const t0 = Store.state.vip.tour, n = t0.reg.length;
    if (t0.type === 'elim' && (n < 4 || n > 8)) { toast(n < 4 ? `الإقصاء يحتاج 4 مشاركين على الأقل. المسجّلون ${n}.` : `الإقصاء يتسع لـ8 فقط. أزل ${n - 8}.`, 'err', 'tournament'); return; }
    if (t0.type === 'points' && n < 3) { toast(`بطولة النقاط تحتاج 3 مشاركين على الأقل. المسجّلون ${n}.`, 'err', 'tournament'); return; }
    Vip.mut(v => {
      const t = v.tour; const ids = t.reg.slice().sort(() => Math.random() - .5);
      t.state = 'live'; t.champion = null; t.comeback = null; t.round = 0; t.pts = {};
      if (t.type === 'elim') {
        const size = ids.length > 4 ? 8 : 4; const first = [];
        // كل مواجهة فيها لاعب واحد على الأقل؛ التأهل المباشر يذهب لمن لا خصم له
        for (let i = 0; i < size / 2; i++) { const a = ids[i] || null, b2 = ids[size / 2 + i] || null; first.push({ p: [a, b2], w: a && !b2 ? 0 : null, bye: !b2 }); }
        t.rounds = [first];
        let s2 = [];
        for (let k = size / 2; k >= 1; k /= 2) { if (k === size / 2) continue; s2 = Array.from({ length: k }, () => ({ p: [null, null], w: null })); t.rounds.push(s2); }
        advanceBracket(t);
      }
    }, `بدأت بطولة ${Store.state.vip.tour.game} بـ${Store.state.vip.tour.reg.length} مشاركين`);
  },
  'tour-win'(b) { const r = +b.dataset.r, m = +b.dataset.m, k = +b.dataset.k; Vip.mut(v => { v.tour.rounds[r][m].w = k; advanceBracket(v.tour); if (v.tour.champion) finishTour(v); }, `فاز ${Vip.pname(Store.state.vip.tour.rounds[r][m].p[k])} في المواجهة`); },
  'tour-auto'() { Vip.mut(v => { const t = v.tour; const r = t.rounds.find(r => r.some(m => m.w == null && m.p[0] && m.p[1])); if (!r) return; r.forEach(m => { if (m.w == null && m.p[0] && m.p[1]) m.w = Math.random() < .5 ? 0 : 1; }); advanceBracket(t); if (t.champion) finishTour(v); }, 'حسم تجريبي لجولة البطولة'); },
  'tour-comeback'(b) {
    const r = +b.dataset.r, m = +b.dataset.m;
    Vip.mut(v => {
      const t = v.tour; const mt = t.rounds[r][m]; const loser = mt.p[1 - mt.w];
      t.comeback = loser; mt.w = null;
      // تنظيف ما تقدّم من هذه المواجهة في الجولات التالية
      for (let ri = r + 1; ri < t.rounds.length; ri++) t.rounds[ri].forEach(x => { x.p = x.p.map(p => p); });
      clearDownstream(t, r, m);
    }, `استُخدمت بطاقة العودة: تُعاد مواجهة ${Vip.pname(Store.state.vip.tour.rounds[r][m].p[0])} و${Vip.pname(Store.state.vip.tour.rounds[r][m].p[1])}`);
    toast('بطاقة العودة: أُعيد فتح المواجهة. لا يمكن استخدامها مرة أخرى في هذه البطولة.', 'gold', 'arrow-back-up', 5000);
  },
  async 'tour-round'() { const sc = await scoresDialog(Store.state.vip.tour.reg, `نقاط الجولة ${Store.state.vip.tour.round + 1}`, !Store.state.live); if (!sc) return; const add = Object.fromEntries(sc); Vip.mut(v => { const t = v.tour; t.reg.forEach(id => t.pts[id] = (t.pts[id] || 0) + (add[id] || 0)); t.round++; if (t.round >= 3) { const best = t.reg.slice().sort((a, b) => t.pts[b] - t.pts[a])[0]; t.champion = best; finishTour(v); } }, `سُجّلت نتائج الجولة ${Store.state.vip.tour.round + 1}`); },
  'tour-reset'() { Vip.mut(v => { v.tour = { ...v.tour, state: 'setup', rounds: [], champion: null, comeback: null, pts: {}, round: 0, reg: Vip.participants() }; }); },
  'team-shuffle'() { Vip.mut(v => { const ids = Vip.participants().sort(() => Math.random() - .5); v.teams.forEach(t => t.ids = []); ids.forEach((id, i) => v.teams[i % v.teams.length].ids.push(id)); }, 'وزّعت الفرق عشوائيًا'); },
  'team-move'(b) { const ti = +b.dataset.t, id = b.dataset.id; Vip.mut(v => { v.teams[ti].ids = v.teams[ti].ids.filter(x => x !== id); v.teams[(ti + 1) % v.teams.length].ids.push(id); }); },
  'team-add'() { Vip.mut(v => v.teams.push({ name: ['النمور', 'البرق'][v.teams.length - 2] || 'فريق جديد', ids: [], pts: 0 }), 'أضفت فريقًا'); },
  'team-remove'() { Vip.mut(v => { const t = v.teams.pop(); t.ids.forEach((id, i) => v.teams[i % v.teams.length].ids.push(id)); }, 'حذفت فريقًا ووزّعت أعضاءه'); },
  'wheel-spin'(b) {
    const v = Sel.vip(); if (v.expired) return toast('انتهت مدة VIP.', 'err', 'lock');
    const idx = rndi(0, WHEEL.length - 1); const seg = 360 / WHEEL.length;
    const cur = Store.state.vip.wheel.rot;
    const target = cur + 360 * 4 + (360 - (idx * seg + seg / 2)) - (cur % 360);
    const w = $('#wheel'); b.disabled = true;
    w.style.transform = `rotate(${target}deg)`;
    setTimeout(() => { Vip.mut(vv => { vv.wheel.rot = target; vv.wheel.last.unshift(WHEEL[idx][0]); vv.wheel.last = vv.wheel.last.slice(0, 3); }, `العجلة: ${WHEEL[idx][0]}`); toast(`العجلة: ${WHEEL[idx][0]}`, 'gold', 'chart-donut'); Sound.chime(); }, Motion.reduced() ? 50 : 3300);
  },
  'board-pick'(b) { x.boardSel = b.dataset.id; Router.render(true); const el = $(`[data-act="board-pick"][data-id="${b.dataset.id}"]`); el && el.focus({ preventScroll: true }); },
  'tool-open'(b) { const t = TOOLS.find(t => t.id === b.dataset.id); if (Sel.vip().expired) return toast('انتهت مدة VIP. الأدوات مقفلة.', 'err', 'lock'); openToolDialog(t); },
  'tool-stop'(b) { const id = b.dataset.id; Vip.mut(v => delete v.tools[id], `أوقفت ${toolName(TOOLS.find(t => t.id === id))}`); },
  'mystery-reveal'() { Vip.mut(v => v.tools.mystery.revealed = true, 'كُشف الخصوم المجهولون'); },
  'mission-step'() { Vip.mut(v => { const m = v.tools.mission; m.prog = Math.min(m.goal, m.prog + (Store.state.live ? 5 : 7)); if (m.prog >= m.goal) { m.label = 'اكتملت'; m.status = 'done'; } }); },
  'rulevote-sim'() { Vip.mut(v => { const r = v.tools.rulevote; r.va += rndi(1, Vip.isStreamer() ? 40 : 3); r.vb += rndi(0, Vip.isStreamer() ? 34 : 3); }); },
  'rulevote-close'() { Vip.mut(v => { const r = v.tools.rulevote; r.closed = true; r.status = 'done'; r.label = 'معتمد'; }, 'اعتُمدت قاعدة الجولة الأخيرة'); },
  'hl-copy'(b) { copyText(Store.state.vip.tools.highlights.sum, b, 'تم نسخ الملخص'); }
};
function advanceBracket(t) {
  for (let r = 0; r < t.rounds.length - 1; r++) {
    t.rounds[r].forEach((m, i) => {
      const nx = t.rounds[r + 1][Math.floor(i / 2)];
      nx.p[i % 2] = m.w != null ? m.p[m.w] : null;
    });
  }
  const fin = t.rounds[t.rounds.length - 1][0];
  t.champion = fin && fin.w != null ? fin.p[fin.w] : null;
}
function clearDownstream(t, r, m) {
  let idx = m;
  for (let ri = r + 1; ri < t.rounds.length; ri++) { idx = Math.floor(idx / 2); t.rounds[ri][idx].w = null; }
  advanceBracket(t);
}
function finishTour(v) {
  const t = v.tour; t.state = 'done';
  let rows;
  if (t.type === 'points') rows = t.reg.map(id => [v.members.find(m => m.id === id).name, t.pts[id] || 0]).sort((a, b) => b[1] - a[1]);
  else { const nm = id => v.members.find(m => m.id === id).name; const fin = t.rounds[t.rounds.length - 1][0]; rows = [[nm(t.champion), 100], [nm(fin.p[1 - fin.w]), 70]]; const semi = t.rounds[t.rounds.length - 2]; if (semi) semi.forEach(mm => { if (mm.w != null) rows.push([nm(mm.p[1 - mm.w]), 40]); }); }
  v.boards.push({ id: 'b' + uid(), title: `بطولة ${t.game}`, game: t.game, at: Store.now(), rows: rows.slice(0, 6) });
  v.log.unshift({ t: Store.now(), text: `تُوّج ${Vip.pname(t.champion)} بطلًا لبطولة ${t.game}` });
  x.boardSel = null;
  setTimeout(() => toast(`البطل: ${esc(Vip.pname(t.champion))}. أُضيفت البطولة لصدارة الفعاليات`, 'gold', 'trophy', 4500), 60);
}

<script>
'use strict';
/* =========================================================================

  /** يجهّز الحالة اللازمة بدل رفض الضغط: موسم جارٍ + كود للاعب */
  ensureLive() { if (!Sel.isOpen()) { this.load('progress'); toast('أُعيد الموسم الجاري للمعاينة', '', 'refresh'); } },

  addUses(n) {

    const s = Store.state;

    const t = Store.now();
    Store.set(st => { for (let i = 0; i < n; i++) st.myUses.push(t - (n - i) * 50); });

  },
  open() {
    const s = Store.state, m = s.settings, ph = Sel.phase(s);
    const btn = (act, label, icon, cls = 'btn-ghost', dis = false) => `<button class="btn ${cls}" data-demo="${act}" ${dis ? 'disabled' : ''}>${icon ? ic(icon) : ''}<span>${label}</span></button>`;
    Dialog.open({
      title: 'أدوات المعاينة', wide: true,
      body: `<p class="small t2" style="margin-bottom:12px">تفتحها أيضًا من زر «معاينة» أعلى الصفحة. هذه الأدوات للتجربة فقط وتغيّر بيانات المعاينة في متصفحك. لا تظهر في النسخة الحقيقية.</p>
      <div class="demo-grp"><h3>إعلان الفائز</h3><div class="btn-row">${btn('end-now', 'عاين نهاية السباق', 'player-play', 'btn-gold')}${btn('end-win', 'النهاية وأنا الفائز', 'crown')}${btn('end-lose', 'النهاية وأنا منافس', 'users')}${btn('end-tie', 'تعادل في القمة', 'arrows-sort')}${btn('end-zero', 'بلا استخدامات', 'circle-dashed')}</div></div>
      <div class="demo-grp"><h3>حالة اللاعب</h3><div class="btn-row">${btn('s-visitor', 'موسم جديد: اليوم 1 من 14', 'calendar-event')}${btn('s-fresh', 'كود جديد بلا استخدام', 'hash')}${btn('s-progress', 'لاعب لديه تقدم', 'chart-bar')}${btn('s-near', 'قريب من الأول', 'flame')}</div></div>
      <div class="demo-grp"><h3>استخدامات لكودي (من حسابات مختلفة)</h3><div class="btn-row">${btn('u1', '+1', 'plus')}${btn('u5', '+5', 'plus')}${btn('u20', '+20', 'plus')}</div></div>
      <div class="demo-grp"><h3>الوقت</h3><div class="btn-row">${btn('t-24', 'انتقل لآخر 24 ساعة', 'flame')}${btn('t-h', '+ ساعة', 'clock')}${btn('t-d', '+ يوم', 'calendar-event')}</div></div>
      <div class="demo-grp"><h3>إدخال الكود</h3><div class="btn-row">${btn('unsupport', 'إلغاء دعمي السابق', 'arrow-back-up')}${btn('share', 'افتح رابط مشاركة RAKAN', 'link')}</div>
        <label class="switch" style="margin-top:8px"><input type="checkbox" data-demo-t="offline" ${m.offline ? 'checked' : ''}>محاكاة انقطاع الاتصال</label></div>
      <div class="demo-grp"><h3>جائزة VIP</h3><div class="btn-row">${btn('vip', 'فائز استلم VIP', 'key')}${btn('vip-exp', 'عاين انتهاء VIP', 'lock', 'btn-ghost')}${btn('vip-day', 'تقديم يوم في VIP', 'calendar-time')}</div></div>
      <div class="demo-grp"><h3>العرض</h3>
        <div class="row-flex"><span class="small strong">تقليل الحركة</span><div class="seg" role="group" aria-label="تقليل الحركة">${[['system', 'حسب الجهاز'], ['reduce', 'مفعّل'], ['full', 'متوقف']].map(([k, l]) => `<button data-demo-motion="${k}" aria-pressed="${m.motion === k}">${l}</button>`).join('')}</div></div>
        <label class="switch"><input type="checkbox" data-demo-t="sound" ${m.sound ? 'checked' : ''}>صوت الاحتفال</label>
        <label class="switch"><input type="checkbox" data-demo-t="live" ${m.live ? 'checked' : ''}>نشاط حي للمنافسين (محاكاة)</label></div>
      <div class="demo-grp"><div class="btn-row">${btn('reset', 'إعادة ضبط التجربة', 'refresh', 'btn-danger')}</div></div>`,
      mount: (el, d) => {
        el.addEventListener('click', async (e) => {
          const mo = e.target.closest('[data-demo-motion]');
          if (mo) { Store.set(s => s.settings.motion = mo.dataset.demoMotion, 'settings'); Motion.apply(); $$('[data-demo-motion]', el).forEach(b => b.setAttribute('aria-pressed', b === mo)); return; }
          const b = e.target.closest('[data-demo]'); if (!b) return;
          const a = b.dataset.demo;
          const close = () => d.close();
          switch (a) {
            case 'end-now': close(); this.ensureLive(); Store.set(s => s.clock.offset = (s.season.end - 4 * SEC) - Date.now(), 'all'); Router.render(true); toast('ينتهي السباق خلال 4 ثوانٍ', 'gold', 'clock'); break;
            case 'end-win': close(); this.load('winner'); toast('ينتهي السباق خلال ثوانٍ وأنت في الصدارة', 'gold', 'clock'); break;
            case 'end-lose': close(); this.load('loser'); toast('ينتهي السباق خلال ثوانٍ', 'gold', 'clock'); break;
            case 'end-tie': close(); this.load('tie'); toast('تعادل في القمة: ينتهي خلال ثوانٍ', 'gold', 'arrows-sort'); break;
            case 'end-zero': close(); this.load('zero'); toast('موسم بلا استخدامات: ينتهي خلال ثوانٍ', '', 'clock'); break;
            case 's-visitor': close(); this.load('visitor'); location.hash = '#/'; break;
            case 's-fresh': close(); this.load('fresh'); location.hash = '#/me'; break;
            case 's-progress': close(); this.load('progress'); location.hash = '#/me'; break;
            case 's-near': close(); this.load('near'); location.hash = '#/board'; break;
            case 'u1': this.addUses(1); close(); break;
            case 'u5': this.addUses(5); close(); break;
            case 'u20': this.addUses(20); close(); break;
            case 't-24': close(); this.ensureLive(); Store.set(s => s.clock.offset = (s.season.end - 23 * HOUR - 41 * MIN) - Date.now(), 'all'); Router.render(true); break;
            case 't-h': this.shift(HOUR); close(); break;
            case 't-d': this.shift(DAY); close(); break;
            case 'unsupport': close(); if (!Store.state.supported) { toast('لم تدعم أي كود بعد. جرّب إدخال كود RAKAN.', '', 'info-circle'); location.hash = '#/enter?code=RAKAN'; break; } Store.set(s => s.supported = null); toast('أُلغي دعمك في المعاينة فقط. تقدر تدعم كودًا من جديد', 'ok', 'arrow-back-up'); Router.render(true); break;
            case 'share': close(); location.hash = '#/c/RAKAN'; break;
            case 'vip': close(); this.vipActive(false); break;
            case 'vip-exp': close(); this.vipActive(true); break;
            case 'vip-day': close(); if (!Sel.vip() || Sel.vip().expired) this.vipActive(false); this.shift(DAY); toast('تقدّم يوم في مدة VIP. المكافأة اليومية متاحة من جديد.', 'gold', 'calendar-time'); break;
            case 'reset': {
              const ok = await Dialog.confirm({ title: 'إعادة ضبط التجربة؟', body: '<p class="t2">تُحذف كل بيانات المعاينة (الكود، الاستخدامات، VIP) ويعود الموسم لليوم 6.</p>', ok: 'أعد الضبط', kind: 'danger', icon: 'refresh' });
              if (ok) { close(); this.load('visitor'); Store.set(s => s.settings = { motion: 'system', sound: false, live: true, offline: false }, 'settings'); Motion.apply(); location.hash = '#/'; toast('أُعيد ضبط التجربة', 'ok'); }
              break;
            }
          }
        });
        el.addEventListener('change', (e) => {
          const t = e.target.closest('[data-demo-t]'); if (!t) return;
          const k = t.dataset.demoT;
          Store.set(s => s.settings[k] = t.checked, 'settings');
          if (k === 'offline') toast(t.checked ? 'انقطاع الاتصال مُفعّل: التأكيد والإنشاء سيفشلان' : 'عاد الاتصال', t.checked ? 'err' : 'ok', t.checked ? 'wifi-off' : 'check');
        });
      }
    });
  }
};
</script>
<script>
'use strict';
/* ---------- التشغيل ---------- */
(function boot() {
  Store.load();
  if (LIVE) {
    // الوضع الحي: لا أدوات معاينة، والبيانات من Firestore
    let lastKey = '';
    Store.on(() => {
      const s = Store.state, r = Router.parse().route;
      const g = Gate.check(r);
      const key = [s.loading, s.auth, s.me && s.me.uid, s.me && s.me.hasProfile, !!s.season, !!s.myCode, !!s.vip, !!s.final, g && g.title, s.fatal, !!(s.pending && s.pending.use), !!(s.pending && s.pending.createCode)].join('|');
      Header.update();
      if (key !== lastKey) { lastKey = key; if (!Ceremony.busy) Router.render(true); }
      else renderNav(Router.route);
    });
    Live.init();
  }
  Motion.apply();
  (Motion.mq.addEventListener ? Motion.mq.addEventListener('change', () => Motion.apply()) : Motion.mq.addListener(() => Motion.apply()));
  Store.on(t => { if (t === 'settings' || t === 'all') Motion.apply(); });
  Clock.lastDay = Sel.day();
  Router.render();
  window.addEventListener('hashchange', () => {
    // روابط الأقسام داخل الصفحة (#stage-plan) ليست صفحات: لا نعيد الرسم
    if (location.hash && !location.hash.startsWith('#/')) { scrollToId(location.hash.slice(1)); return; }
    Dialog.closeAll(); Router.render();
  });
  // اعتراض روابط الأقسام قبل أن تغيّر العنوان
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (a) { const h = a.getAttribute('href'); if (!h.startsWith('#/')) { e.preventDefault(); scrollToId(h.slice(1)); return; } }
    // صفوف قابلة للفتح (الصدارة والمسار) واختيار تصميم البطاقة من أي صفحة
    const row = e.target.closest('[data-href]');
    if (row && !e.target.closest('button,a,input')) { location.hash = row.dataset.href; return; }
    const pick = e.target.closest('[data-pick]');
    if (pick) pickDesign(pick.dataset.pick);
  });
  document.addEventListener('keydown', (e) => {
    const row = e.target.closest && e.target.closest('[data-href]');
    if (row && (e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); location.hash = row.dataset.href; }
  });
  LiveSim.schedule();
  setInterval(() => { Clock.tick(); LiveSim.step(); }, 1000);
  $('#menu-btn').addEventListener('click', openMenu);
  if (!LIVE) $('#preview-tag').addEventListener('click', () => Demo.open());
  // مزامنة بين تبويبات المتصفح (المعاينة فقط)
  window.addEventListener('storage', (e) => {
    if (e.key !== RACE.STORE_KEY || !e.newValue) return;
    try { Store.state = JSON.parse(e.newValue); Router.render(true); } catch (err) { }
  });
  window.addEventListener('offline', () => toast('انقطع الاتصال. لن يُحتسب أي تأكيد حتى يعود.', 'err', 'wifi-off', 5000));
  window.addEventListener('online', () => toast('عاد الاتصال', 'ok', 'check'));
  // من فتح الصفحة بعد الحسم ولم يشاهد التتويج بعد
  const s = Store.state;
  if (!LIVE && s.final && !s.ceremonySeen) { Store.set(x => x.ceremonySeen = true, 'cer'); setTimeout(() => Ceremony.replay(), 400); }
})();
</script>
</body>
</html>
