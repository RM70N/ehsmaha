<script>
'use strict';
/* =========================================================================
   سباق الأكواد · نموذج تفاعلي مستقل
   -------------------------------------------------------------------------
   بنية الملف (لتسهيل النقل إلى احسمها لاحقًا):
     1) RACE ............ الإعدادات الثابتة للموسم
     2) أدوات ........... تطبيع الكود، التنسيق، الوقت، الجمع العربي
     3) Store ........... حالة المعاينة (localStorage) ← للتجربة فقط
     4) Seed ............ بيانات تجريبية متسقة + سيناريوهات المعاينة
     5) Sel ............. محددات مشتقة (الترتيب، المرحلة، الفوارق...)
     6) PreviewBackend .. محاكاة الخادم (تأخير، رفض، انقطاع)
     7) RaceAPI ......... الواجهة الوحيدة التي تستدعيها الشاشات.
                           استبدل PreviewBackend بـ FirebaseBackend
                           بنفس التوقيعات عند الربط الفعلي.
   تحذير أمني: في النسخة الحقيقية كل العدادات، الاحتساب، الحسم، صلاحية VIP
   والمكافأة اليومية تُدار من الخادم (Cloud Functions + قواعد أمان تمنع
   الكتابة من العميل). تعديل localStorage هنا يغيّر المعاينة فقط.
   ========================================================================= */

/* ---------- 1) الإعدادات ---------- */
const DAY = 864e5, HOUR = 36e5, MIN = 6e4, SEC = 1e3;
const RACE = Object.freeze({
  SEASON_ID: 's1',
  SEASON_NAME: 'الموسم الأول',
  SEASON_DAYS: 14,            // مدة السباق: 14 يومًا بالضبط
  VIP_DAYS: 30,               // مدة الجائزة: 30 يومًا تبدأ من لحظة إعلان الفوز
  CODE_MIN: 3,
  CODE_MAX: 12,
  RESERVED: ['ADMIN', 'EHSMAHA', 'AHSEMHA', 'VIP', 'OWNER', 'MOD', 'SUPPORT', 'TEST', 'NULL', 'SYSTEM'],
  MILESTONES: [
    { n: 5,   id: 'm5',   name: 'الانطلاقة',       tier: 'lilac',  reward: 'شارة «الانطلاقة» على ملفك' },
    { n: 25,  id: 'm25',  name: 'البطاقة الفضية',   tier: 'silver', reward: 'تصميم فضي لبطاقة كودك' },
    { n: 100, id: 'm100', name: 'أسطورة الأكواد',   tier: 'gold',   reward: 'شارة «أسطورة الأكواد» وتصميم ذهبي' }
  ],
  CHALLENGE_FIRST_TIERS: [50, 120],
  DOOR_START_DAY: 8,
  VIP_DAILY_REWARD: 150,
  PROD_ORIGIN: 'https://ehsmaha.com',
  STORE_KEY: 'ehsmaha.codeRace.preview.v2'
});

/* ---------- 2) أدوات ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const uid = () => Math.random().toString(36).slice(2, 10);
const ic = (name, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

/**
 * تطبيع الكود: نفس الدالة تُستخدم عند الإنشاء وعند الإدخال وعلى الخادم.
 * - NFKC (يحوّل الحروف العريضة Ｒ إلى R)
 * - الأرقام العربية الهندية والفارسية ← أرقام لاتينية
 * - حذف الرموز غير المرئية: zero-width، علامات الاتجاه، BOM، التحكم، الواصلة اللينة
 * - حذف المسافات والفواصل الشائعة (- _ .)
 * - أحرف كبيرة
 */
function normalizeCode(raw) {
  let s = String(raw == null ? '' : raw).normalize('NFKC');
  s = s.replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x660))
       .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x6F0));
  s = s.replace(/[\u0000-\u001F\u007F­؜​-‏‪-‮⁠-⁤⁦-⁩﻿]/g, '');
  s = s.replace(/[\s\-_.ـ]+/g, '');
  return s.toUpperCase();
}
/** فحوص قواعد إنشاء الكود (العرض للمستخدم). التفرّد يُفحص من الخادم. */
function codeRules(code) {
  const hasArabic = /[؀-ۿ]/.test(code);
  return [
    { id: 'len',     label: `من ${RACE.CODE_MIN} إلى ${RACE.CODE_MAX} خانة`, pass: code.length >= RACE.CODE_MIN && code.length <= RACE.CODE_MAX },
    { id: 'chars',   label: 'حروف إنجليزية وأرقام فقط', pass: code.length > 0 && /^[A-Z0-9]+$/.test(code), hint: hasArabic ? 'اكتب الكود بحروف إنجليزية. الحروف العربية غير مدعومة في الأكواد.' : null },
    { id: 'start',   label: 'يبدأ بحرف', pass: /^[A-Z]/.test(code) },
    { id: 'reserved',label: 'ليس كلمة محجوزة', pass: code.length > 0 && !RACE.RESERVED.includes(code) }
  ];
}
function codeError(code) {
  if (!code) return 'اكتب الكود الذي تريده.';
  const r = codeRules(code);
  const chars = r.find(x => x.id === 'chars');
  if (!chars.pass) return chars.hint || 'استخدم حروفًا إنجليزية وأرقامًا فقط، بدون رموز.';
  if (!r.find(x => x.id === 'start').pass) return 'ابدأ الكود بحرف إنجليزي.';
  if (!r.find(x => x.id === 'len').pass) return code.length < RACE.CODE_MIN ? `الكود قصير. أقل طول ${RACE.CODE_MIN} خانات.` : `الكود طويل. أقصى طول ${RACE.CODE_MAX} خانة.`;
  if (!r.find(x => x.id === 'reserved').pass) return 'هذه كلمة محجوزة للمنصة. اختر كودًا آخر.';
  return null;
}

/* جمع عربي بأرقام لاتينية */
function plural(n, f) {
  const a = Math.abs(n);
  if (a === 0) return `${f.zero || ('0 ' + f.many)}`;
  if (a === 1) return f.one;
  if (a === 2) return f.two;
  if (a >= 3 && a <= 10) return `${n} ${f.few}`;
  return `${n} ${f.many}`;
}
const P = {
  uses: n => plural(n, { zero: 'لا استخدامات', one: 'استخدام واحد', two: 'استخدامان', few: 'استخدامات', many: 'استخدامًا' }),
  days: n => plural(n, { zero: '0 يوم', one: 'يوم واحد', two: 'يومان', few: 'أيام', many: 'يومًا' }),
  hours: n => plural(n, { zero: '0 ساعة', one: 'ساعة', two: 'ساعتان', few: 'ساعات', many: 'ساعة' }),
  ranks: n => plural(n, { zero: 'بدون تغيير', one: 'مركز واحد', two: 'مركزان', few: 'مراكز', many: 'مركزًا' }),
  players: n => plural(n, { zero: 'لا أحد', one: 'لاعب واحد', two: 'لاعبان', few: 'لاعبين', many: 'لاعبًا' }),
  points: n => plural(n, { zero: '0 نقطة', one: 'نقطة واحدة', two: 'نقطتان', few: 'نقاط', many: 'نقطة' })
};
const fmtN = (n) => new Intl.NumberFormat('en-US').format(n);
const LOCALE = 'ar-SA-u-nu-latn-ca-gregory';
const fmtDate = (t, o = { weekday: 'long', day: 'numeric', month: 'long' }) => new Intl.DateTimeFormat(LOCALE, o).format(new Date(t));
const fmtTime = (t) => new Intl.DateTimeFormat(LOCALE, { hour: 'numeric', minute: '2-digit' }).format(new Date(t));
const fmtDateTime = (t) => `${fmtDate(t, { day: 'numeric', month: 'long' })}، ${fmtTime(t)}`;
const pad = (n) => String(n).padStart(2, '0');
function splitDur(ms) {
  ms = Math.max(0, ms);
  return { d: Math.floor(ms / DAY), h: Math.floor(ms % DAY / HOUR), m: Math.floor(ms % HOUR / MIN), s: Math.floor(ms % MIN / SEC) };
}
function fmtDurShort(ms) {
  const x = splitDur(ms);
  if (x.d > 0) return `${x.d}ي ${pad(x.h)}س`;
  if (x.h > 0) return `${pad(x.h)}:${pad(x.m)}:${pad(x.s)}`;
  return `${pad(x.m)}:${pad(x.s)}`;
}
function fmtDurWords(ms) {
  const x = splitDur(ms);
  if (x.d > 0) return `${P.days(x.d)}${x.h ? ' و' + P.hours(x.h) : ''}`;
  if (x.h > 0) return `${P.hours(x.h)}${x.m ? ' و' + x.m + ' دقيقة' : ''}`;
  if (x.m > 0) return `${x.m} دقيقة`;
  return 'أقل من دقيقة';
}
function relTime(t) {
  const d = Store.now() - t;
  if (d < MIN) return 'الآن';
  if (d < HOUR) return `قبل ${Math.floor(d / MIN)} د`;
  if (d < DAY) return `قبل ${Math.floor(d / HOUR)} س`;
  return fmtDate(t, { day: 'numeric', month: 'short' });
}
const initial = (name) => (String(name || '').trim()[0] || '؟');

/* ---------- 3) Store: حالة المعاينة ---------- */
const Store = {
  state: null,
  subs: new Set(),
  now() { return Date.now() + (this.state ? this.state.clock.offset : 0); },
  load() {
    if (typeof LIVE !== 'undefined' && LIVE) { this.state = Seed.liveSkeleton(); this.loadLocal(null); return; }
    try {
      const raw = localStorage.getItem(RACE.STORE_KEY);
      if (raw) { const s = JSON.parse(raw); if (s && s.v === 1 && s.season) { this.state = s; return; } }
    } catch (e) { /* التخزين غير متاح: نكمل بالذاكرة */ }
    this.state = Seed.build('visitor');
    this.save();
  },
  save() {
    if (this.state && this.state.live) return this.saveLocal(); // الوضع الحي: بيانات السباق من الخادم، والمحلي للتفضيلات فقط
    try { localStorage.setItem(RACE.STORE_KEY, JSON.stringify(this.state)); } catch (e) { }
  },
  /* تفضيلات وحالة عرض محلية لكل حساب: الحركة، الصوت، الاحتفالات المعروضة، أعلى ترتيب، مشاهدة التتويج */
  localKey(uid) { return 'ehsmaha.codeRace.local.' + RACE.SEASON_ID + '.' + (uid || 'guest'); },
  loadLocal(uid) {
    const s = this.state; this._uid = uid;
    let l = {};
    try { l = JSON.parse(localStorage.getItem(this.localKey(uid)) || '{}') || {}; } catch (e) { }
    s.settings = { motion: 'system', sound: false, live: false, offline: false, ...(l.settings || {}) };
    s.ach = l.ach || {}; s.bestRank = l.bestRank || null; s.ceremonySeen = !!l.ceremonySeen;
    s.final = null; Live.finalPromise = null; Live.finalizing = false;
  },
  saveLocal() {
    const s = this.state;
    try { localStorage.setItem(this.localKey(this._uid), JSON.stringify({ settings: s.settings, ach: s.ach, bestRank: s.bestRank, ceremonySeen: s.ceremonySeen })); } catch (e) { }
  },
  set(mut, topic = 'race') { mut(this.state); this.save(); this.emit(topic); if (this.state.live && topic === 'vip') Live.saveVipSoon(); },
  replace(s, topic = 'all') { this.state = s; this.save(); this.emit(topic); },
  on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
  emit(topic) { [...this.subs].forEach(fn => { if (!this.subs.has(fn)) return; // نسخة ثابتة: من يشترك أثناء الإرسال لا يُستدعى الآن
    try { fn(topic); } catch (e) { console.error(e); } }); }
};

/* ---------- 4) Seed: بيانات تجريبية ---------- */
const Seed = {
  /** هيكل الحالة في الوضع الحي: يُملأ من Firestore عبر Live._sync */
  liveSkeleton() {
    return {
      v: 1, live: true, loading: true, auth: 'loading', seasonId: RACE.SEASON_ID, clock: { offset: 0 },
      season: null, leader: null, me: { uid: null, name: '', handle: '' }, myCode: null, myUses: [], myMs: {}, supported: null,
      players: [], bestRank: null, ach: {}, dayRanks: { day: 0, ranks: {} }, climbHistory: [], firstTo: {},
      door: { eligible: null, entered: [] }, final: null, ceremonySeen: false, vip: null, alerts: [],
      settings: { motion: 'system', sound: false, live: false, offline: false }
    };
  },
  roster: [
    ['راكان الشمري', 'rakan.live', 'RAKAN', 87], ['نوف', 'nooof.x', 'NOOF', 81], ['أبو عزوز', 'abu3zooz', 'AZOOZ', 74],
    ['غلا', 'ghala.gg', 'GHALA', 66], ['تركي ستريمز', 'turki.tv', 'TURKI', 61], ['لميس', 'lamees_', 'LAMEES', 58],
    ['سطام', 'sattam', 'SATTAM', 52], ['عبدالرحمن بن سليمان الحربي', 'abdulrahman.harbi', 'ABDULRAHMAN', 47], ['يارا', 'yara9', 'YARA9', 44],
    ['ماجد', 'majed.plays', 'MAJED', 41], ['بندر', 'bndr', 'BNDR', 37], ['شهد', 'shahad', 'SHAHAD', 33],
    ['فيصل', 'faisal_q', 'FAISAL', 30], ['حصة', 'hessa', 'HESSA', 28], ['ريان', 'ryan_77', 'RAYAN', 26],
    ['مشعل', 'meshal', 'MESHAL', 24], ['العنود', 'anood', 'ANOOD', 21], ['خالد', 'khalid7', 'KHALID7', 19],
    ['ديم', 'deem', 'DEEM', 17], ['سلطان', 'sultan.k', 'SULTAN', 15], ['هيا', 'haya', 'HAYA', 14],
    ['زياد', 'ziyad', 'ZIYAD', 12], ['منيرة', 'munira', 'MUNIRA', 11], ['عمر', 'omar.o', 'OMAR', 10],
    ['رهف', 'rahaf', 'RAHAF', 9], ['نايف', 'naif', 'NAIF', 8], ['جواهر', 'jawaher', 'JAWAHER', 7],
    ['صالح', 'saleh', 'SALEH', 6], ['لجين', 'lujain', 'LUJAIN', 5], ['وليد', 'waleed', 'WALEED', 4],
    ['دانة', 'dana', 'DANA', 3], ['حمد', 'hamad', 'HAMAD', 3], ['أسيل', 'aseel', 'ASEEL', 2],
    ['طلال', 'talal', 'TALAL', 2], ['بسمة', 'basma', 'BASMA', 1], ['ياسر', 'yasser', 'YASSER', 1],
    ['روان', 'rawan', 'RAWAN', 0], ['عبدالله', 'abdullah', 'ABDULLAH', 0]
  ],
  /** early=true: الموسم بدأ للتو (عداد 14 يومًا كامل). وإلا: منتصف الموسم (اليوم 6 من 14). */
  base(early) {
    const real = Date.now();
    // موسم جديد يبدأ لحظة فتح المعاينة، فيظهر العداد 14 يومًا كاملة
    const start = early ? real + 999 : real - (5 * DAY + 7 * HOUR + 22 * MIN);
    const players = this.roster.map(([name, handle, code, full], i) => {
      const uses = early ? Math.max(0, Math.round(full * 0.04 + (i < 6 ? 1 : 0)) - (i > 14 ? 1 : 0)) : full;
      const today = early ? uses : (uses ? Math.min(uses, rndi(0, Math.max(1, Math.round(uses / 12)))) : 0);
      return {
        uid: 'p' + i, name, handle, code, uses, today,
        createdAt: early ? start : start + rnd(0.02, 0.4) * DAY,
        reachedAt: uses ? (early ? start + i * 7 * SEC : real - rnd(4, 300) * MIN) : start
      };
    });
    // أول من وصل 50: راكان في اليوم 4 (منتصف الموسم فقط)
    const first = early ? {} : { 50: { uid: 'p0', at: start + 3 * DAY + 11 * HOUR } };
    const s = {
      v: 1, seasonId: RACE.SEASON_ID,
      clock: { offset: 0 },
      season: { start, end: start + RACE.SEASON_DAYS * DAY },
      me: { uid: 'u_me', name: 'فارس', handle: 'fares.gg' },
      myCode: null, myUses: [], supported: null,
      players, bestRank: null, ach: {},
      dayRanks: { day: 0, ranks: {} },
      climbHistory: early ? [] : [
        { day: 1, name: 'نوف', climb: 6 }, { day: 2, name: 'غلا', climb: 5 }, { day: 3, name: 'حصة', climb: 7 },
        { day: 4, name: 'سطام', climb: 4 }, { day: 5, name: 'يارا', climb: 6 }
      ],
      firstTo: first,
      door: { eligible: null, entered: [] },
      final: null, ceremonySeen: false,
      vip: null,
      alerts: [],
      settings: { motion: 'system', sound: false, live: true, offline: false }
    };
    return s;
  },
  spreadUses(s, count, fromT, toT) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      // تركيز أكبر في الأيام الأخيرة (منحنى واقعي لانتشار الكود)
      const u = Math.pow(Math.random(), 0.65);
      arr.push(Math.round(fromT + u * (toT - fromT)));
    }
    return arr.sort((a, b) => a - b);
  },
  snapshotDay(s) {
    // ترتيب بداية اليوم = الاستخدامات الحالية ناقص استخدامات اليوم
    const now = Date.now() + s.clock.offset;
    const day = Sel.dayIndex(s, now);
    const dayStart = s.season.start + (day - 1) * DAY;
    const rows = s.players.map(p => ({ uid: p.uid, u: p.uses - (p.today || 0), r: p.reachedAt }));
    if (s.myCode) rows.push({ uid: s.me.uid, u: s.myUses.filter(t => t < dayStart).length, r: s.myCode.createdAt });
    rows.filter(x => x.u > 0).sort((a, b) => b.u - a.u || a.r - b.r).forEach((x, i) => { rows.find(y => y.uid === x.uid).rank = i + 1; });
    const ranks = {}; rows.forEach(x => { if (x.rank) ranks[x.uid] = x.rank; });
    s.dayRanks = { day, ranks };
  },
  build(kind) {
    const s = this.base(kind === 'visitor' || kind === 'fresh');
    const now = Date.now();
    const st = s.season.start;
    const giveCode = (code = 'FARES', createdAt = st + 0.6 * DAY) => { s.myCode = { code, createdAt, design: 'base', locked: true }; };
    const mark = (n, celebrated = true) => {
      RACE.MILESTONES.forEach(m => { if (n >= m.n) s.ach[m.id] = { at: s.myUses[m.n - 1] || now, celebrated }; });
    };
    switch (kind) {
      case 'visitor': break;
      case 'fresh': giveCode('FARES', st + 2 * SEC); break;
      case 'progress':
        giveCode();
        s.myUses = this.spreadUses(s, 27, st + 0.8 * DAY, now - 2 * MIN);
        mark(27); s.bestRank = 13; break;
      case 'near':
        giveCode();
        s.myUses = this.spreadUses(s, 84, st + 0.7 * DAY, now - 90 * SEC);
        mark(84); s.bestRank = 2; break;
      case 'final24': {
        giveCode();
        s.clock.offset = (s.season.end - 19 * HOUR - 47 * MIN) - now;
        const t = now + s.clock.offset;
        s.players.forEach(p => { if (p.uses) { const add = Math.round(p.uses * 1.25); p.uses += add; p.today = Math.min(p.uses, rndi(2, 9)); p.reachedAt = t - rnd(2, 200) * MIN; } });
        s.players[1].uses = s.players[0].uses - 2;
        s.myUses = this.spreadUses(s, 131, st + 0.7 * DAY, t - 4 * MIN);
        mark(131); s.bestRank = 3;
        s.firstTo[120] = { uid: 'p0', at: st + 10 * DAY + 4 * HOUR };
        s.door.eligible = ['p10', 'p11', 'p12', 'p13', 'p14', 'p15', 'p16', 'p17', 'p18', 'p19', s.me.uid];
        break;
      }
      case 'winner': case 'loser': case 'zero': case 'tie': {
        if (kind !== 'zero') giveCode();
        s.clock.offset = (s.season.end - 8 * SEC) - now;
        const t = now + s.clock.offset;
        if (kind === 'zero') {
          s.players.forEach(p => { p.uses = 0; p.today = 0; });
          delete s.firstTo[50];
        } else {
          s.players.forEach(p => { if (p.uses) { p.uses = Math.round(p.uses * 2.3); p.reachedAt = t - rnd(5, 600) * MIN; } });
          const top = s.players[0].uses;
          if (kind === 'winner') { s.myUses = this.spreadUses(s, top + 9, st + 0.7 * DAY, t - 3 * MIN); mark(top + 9); s.bestRank = 1; }
          if (kind === 'loser') { s.myUses = this.spreadUses(s, 63, st + 0.7 * DAY, t - 30 * MIN); mark(63); s.bestRank = 11; }
          if (kind === 'tie') {
            // تعادل في القمة: نوف وصلت للرقم نفسه قبل راكان
            s.players[1].uses = top; s.players[1].reachedAt = t - 52 * MIN; s.players[0].reachedAt = t - 14 * MIN;
            s.myUses = this.spreadUses(s, 40, st + 0.7 * DAY, t - 50 * MIN); mark(40); s.bestRank = 9;
          }
          s.firstTo[120] = { uid: 'p0', at: st + 9 * DAY + 2 * HOUR };
        }
        break;
      }
    }
    if (s.myCode && s.bestRank == null && s.myUses.length) s.bestRank = Sel.standings(s).byUid[s.me.uid]?.rank || null;
    this.snapshotDay(s);
    return s;
  }
};

/* ---------- 5) محددات مشتقة ---------- */
const Sel = {
  end(s = Store.state) { return s.season.end; },
  dayIndex(s, t) { if (!s.season) return 1; return clamp(Math.floor((t - s.season.start) / DAY) + 1, 1, RACE.SEASON_DAYS); },
  day(s = Store.state) { return this.dayIndex(s, Store.now()); },
  dayProgress(s = Store.state) { if (!s.season) return 0; const t = Store.now() - s.season.start; return clamp((t % DAY) / DAY, 0, 1); },
  left(s = Store.state) { if (!s.season) return 0; return Math.max(0, s.season.end - Store.now()); },
  phase(s = Store.state) {
    if (!s.season) return 'waiting';
    if (s.final) return 'ended';
    const t = Store.now();
    if (t >= s.season.end) return 'certifying';
    if (s.season.end - t <= DAY) return 'final24';
    return 'live';
  },
  isOpen(s = Store.state) { const p = this.phase(s); return p === 'live' || p === 'final24'; },
  standings(s = Store.state) {
    const rows = s.players.map(p => ({ uid: p.uid, name: p.name, handle: p.handle, code: p.code, uses: p.uses, reachedAt: p.reachedAt, today: p.today || 0, me: false }));
    if (s.myCode) {
      const n = s.myUses.length;
      rows.push({ uid: s.me.uid, name: s.me.name, handle: s.me.handle, code: s.myCode.code, uses: n, reachedAt: n ? s.myUses[n - 1] : s.myCode.createdAt, today: this.myToday(s), me: true });
    }
    const ranked = rows.filter(r => r.uses > 0).sort((a, b) => b.uses - a.uses || a.reachedAt - b.reachedAt);
    ranked.forEach((r, i) => {
      r.rank = i + 1;
      const above = ranked[i - 1];
      r.gapUp = above ? above.uses - r.uses : 0;
      r.tiedWithAbove = !!above && above.uses === r.uses;
      const below = ranked[i + 1];
      r.tiedWithBelow = !!below && below.uses === r.uses;
    });
    // الوضع الحي: نحمّل أعلى 50 فقط؛ ترتيبك خارجها يأتي من استعلام عدّ على الخادم
    if (s.live && s.truncated && s.myCode) {
      const meRow = ranked.find(r => r.me);
      if (meRow && s.myRankOverride && meRow.rank >= ranked.length) { ranked.splice(ranked.indexOf(meRow), 1); meRow.rank = s.myRankOverride; meRow.gapUp = null; meRow.outside = true; }
    }
    const byUid = {}; rows.forEach(r => { if (r.uid) byUid[r.uid] = r; });
    return { ranked, rows, byUid, total: rows.length };
  },
  mine(s = Store.state) {
    if (!s.myCode) return null;
    const st = this.standings(s);
    const r = st.byUid[s.me.uid];
    const above = r.outside ? st.ranked[st.ranked.length - 1] : (r.rank ? st.ranked[r.rank - 2] : st.ranked[st.ranked.length - 1]);
    // الاستخدامات اللازمة لتجاوز من فوقك: يلزم أن تتجاوزه (أو تعادله إن وصلت قبله، وهذا لا يحدث لأنه وصل أولًا)
    const toPass = above ? (above.uses - r.uses + 1) : 0;
    return { ...r, above, toPass, ranked: st.ranked, leader: st.ranked[0] };
  },
  myToday(s = Store.state) {
    const d = this.dayIndex(s, Store.now()); const ds = s.season.start + (d - 1) * DAY;
    return s.myUses.filter(t => t >= ds).length;
  },
  myDaily(s = Store.state, days = 7) {
    const cur = this.day(s);
    const out = [];
    for (let d = Math.max(1, cur - days + 1); d <= cur; d++) {
      const a = s.season.start + (d - 1) * DAY, b = a + DAY;
      out.push({ day: d, n: s.myUses.filter(t => t >= a && t < b).length, today: d === cur });
    }
    return out;
  },
  nextMilestone(n) { return RACE.MILESTONES.find(m => n < m.n) || null; },
  msState(m, n) {
    if (n >= m.n) return 'open';
    const prev = RACE.MILESTONES[RACE.MILESTONES.indexOf(m) - 1];
    const span = m.n - (prev ? prev.n : 0);
    return (m.n - n) <= Math.max(2, Math.ceil(span * 0.2)) ? 'near' : 'locked';
  },
  designUnlocked(d, n) { return d === 'base' || (d === 'silver' && n >= 25) || (d === 'gold' && n >= 100); },
  climbs(s = Store.state) {
    const st = this.standings(s);
    return st.ranked.map(r => ({ ...r, from: s.dayRanks.ranks[r.uid] || null, climb: s.dayRanks.ranks[r.uid] ? s.dayRanks.ranks[r.uid] - r.rank : 0 }))
      .sort((a, b) => b.climb - a.climb || a.rank - b.rank);
  },
  vip(s = Store.state) {
    if (!s.vip) return null;
    const t = Store.now();
    const left = Math.max(0, s.vip.end - t);
    return { ...s.vip, left, expired: left <= 0, dayIdx: clamp(Math.floor((t - s.vip.start) / DAY) + 1, 1, RACE.VIP_DAYS) };
  },
  isWinner(s = Store.state) { return !!(s.final && s.final.winner && s.final.winner.uid === s.me.uid); }
};

/* ---------- 6) PreviewBackend: محاكاة الخادم ---------- */
const PreviewBackend = {
  latency() { return sleep(rndi(380, 820)); },
  offline() { return Store.state.settings.offline || !navigator.onLine; },
  codeOwner(key) {
    const s = Store.state;
    if (s.myCode && s.myCode.code === key) return { uid: s.me.uid, name: s.me.name, me: true };
    const p = s.players.find(p => p.code === key);
    return p ? { uid: p.uid, name: p.name, me: false } : null;
  },
  async createCode(raw) {
    await this.latency();
    const s = Store.state, code = normalizeCode(raw);
    if (this.offline()) return { ok: false, reason: 'offline' };
    if (!Sel.isOpen(s)) return { ok: false, reason: 'season_ended' };
    if (s.myCode) return { ok: false, reason: 'already_has_code' };
    if (codeError(code)) return { ok: false, reason: 'invalid', message: codeError(code) };
    if (this.codeOwner(code)) return { ok: false, reason: 'taken' };
    Store.set(st => { st.myCode = { code, createdAt: Store.now(), design: 'base', locked: true }; });
    return { ok: true, code };
  },
  async isAvailable(raw) {
    await sleep(rndi(220, 420));
    const code = normalizeCode(raw);
    return { available: !this.codeOwner(code) };
  },
  async lookupCode(raw) {
    await sleep(rndi(260, 520));
    const code = normalizeCode(raw);
    const o = this.codeOwner(code);
    if (!o) return { found: false };
    const r = Sel.standings().byUid[o.uid];
    return { found: true, owner: { name: o.name, rank: r.rank || null, uses: r.uses, me: o.me }, code };
  },
  async confirmUse(raw) {
    await this.latency();
    const s = Store.state, code = normalizeCode(raw);
    if (this.offline()) return { ok: false, reason: 'offline' };
    if (!code || codeError(code) && !this.codeOwner(code)) return { ok: false, reason: 'invalid' };
    if (!Sel.isOpen(s)) return { ok: false, reason: 'season_ended' };
    const o = this.codeOwner(code);
    if (!o) return { ok: false, reason: 'not_found' };
    if (o.me) return { ok: false, reason: 'own_code' };
    if (s.supported) return { ok: false, reason: 'already_supported', supported: s.supported };
    const at = Store.now();
    Store.set(st => {
      const p = st.players.find(p => p.uid === o.uid);
      p.uses += 1; p.today = (p.today || 0) + 1; p.reachedAt = at;
      st.supported = { code, ownerName: o.name, ownerUid: o.uid, at };
    });
    return { ok: true, owner: { name: o.name, uid: o.uid }, code, at };
  },
  async finalize() {
    await sleep(600);
    return this.finalizeSync();
  },
  /** الحسم: في الإنتاج تنفّذه Scheduled Function عند endAt وتكتب final مرة واحدة. */
  finalizeSync() {
    const s = Store.state;
    if (s.final) return s.final;
    const st = Sel.standings(s);
    const top = st.ranked.slice(0, 10).map(r => ({ uid: r.uid, name: r.name, code: r.code, uses: r.uses, rank: r.rank, reachedAt: r.reachedAt, me: r.me }));
    const me = st.byUid[s.me.uid];
    const w = st.ranked[0] || null;
    const second = st.ranked[1] || null;
    const final = {
      at: Math.max(Store.now(), s.season.end),
      top, me: me ? { rank: me.rank || null, uses: me.uses } : null,
      winner: w ? { uid: w.uid, name: w.name, code: w.code, uses: w.uses, me: w.me } : null,
      margin: w && second ? w.uses - second.uses : (w ? w.uses : 0),
      tie: !!(w && second && w.uses === second.uses),
      tieWith: w && second && w.uses === second.uses ? { name: second.name, reachedAt: second.reachedAt, winnerReachedAt: w.reachedAt } : null,
      totalUses: st.ranked.reduce((a, r) => a + r.uses, 0)
    };
    Store.set(x => {
      x.final = final;
      if (final.winner && final.winner.me) x.vip = Vip.seed(final.at);
    }, 'all');
    return final;
  },
  async claimDaily() {
    await sleep(rndi(400, 700));
    const v = Sel.vip();
    if (!v) return { ok: false, reason: 'no_vip' };
    if (v.expired) return { ok: false, reason: 'expired' };
    if (this.offline()) return { ok: false, reason: 'offline' };
    if (v.reward.lastDay === v.dayIdx) return { ok: false, reason: 'already_claimed' };
    Store.set(x => {
      x.vip.reward.balance += RACE.VIP_DAILY_REWARD; x.vip.reward.lastDay = v.dayIdx; x.vip.reward.claims += 1;
      x.vip.log.unshift({ t: Store.now(), text: `استلمت مكافأة اليوم ${v.dayIdx}: ${P.points(RACE.VIP_DAILY_REWARD)}` });
    }, 'vip');
    return { ok: true, amount: RACE.VIP_DAILY_REWARD };
  }
};

/* ---------- 7) RaceAPI: نقاط الربط مع Firebase ----------
   مخطط مقترح (Realtime Database، مثل نظام secretCodes الحالي، مع تطبيع scodeCodeKey):
     codeRace/seasons/{seasonId}                 { startAt, endAt, status: live|certifying|final }
     codeRace/seasons/{seasonId}/codes/{codeKey} { ownerUid, display, createdAt, uses, lastUseAt }
     codeRace/seasons/{seasonId}/owners/{uid}    codeKey            ← كود واحد لكل حساب
     codeRace/seasons/{seasonId}/supports/{uid}  { codeKey, at }    ← دعم واحد لكل حساب
     codeRace/seasons/{seasonId}/board/{codeKey} { name, uses, lastUseAt } ← مرآة للقراءة فقط
     codeRace/seasons/{seasonId}/final           يكتبها الخادم فقط بعد الحسم
     vip/{uid}                                   { seasonId, startAt, endAt, mode }
     vipRewards/{uid}/{dayIndex}                 { amount, at }
   كل الكتابات عبر Callable Functions؛ قواعد الأمان تمنع العميل من كتابة
   uses/board/final/vip. أسماء الداعمين لا تُرسل أبدًا لصاحب الكود.
   (هذا الملف المستقل غير مربوط بأي من ذلك.) */
const B = () => (Store.state && Store.state.live ? Live : PreviewBackend);
const RaceAPI = {
  /** إنشاء كود اللاعب. Firebase: httpsCallable('codeRaceCreateCode')({ raw })
   *  الخادم: يطبّع، يتحقق من القواعد، يتأكد عبر Transaction من owners/{uid} و codes/{key}، ويرفض بعد endAt. */
  createCode: (raw) => B().createCode(raw),
  /** فحص توفر الكود أثناء الكتابة. Firebase: get(codes/{key}) أو callable خفيف مع حد معدل. */
  checkAvailability: (raw) => B().isAvailable(raw),
  /** معاينة صاحب الكود قبل التأكيد (اسم وترتيب فقط). Firebase: get(board/{key}). */
  lookupCode: (raw) => B().lookupCode(raw),
  /** تأكيد استخدام. Firebase: httpsCallable('codeRaceConfirmUse')({ raw })
   *  Transaction: supports/{uid} غير موجود + الكود موجود + ليس كود المستخدم + now < endAt
   *  ثم uses+1 و lastUseAt = serverTimestamp (مرجع كسر التعادل). */
  confirmUse: (raw) => B().confirmUse(raw),
  /** الاستماع للصدارة. Firebase: onValue(query(board, orderByChild('uses'), limitToLast(10))) + موقع المستخدم من callable. */
  listenLeaderboard(cb) { return Store.on(t => { if (t === 'race' || t === 'all') cb(Sel.standings()); }); },
  /** جلب النتيجة المعتمدة. Firebase: onValue(final): تكتبها Scheduled Function عند endAt (لا يُحسم من العميل). */
  fetchFinalResults: () => B().finalize(),
  /** حالة VIP. Firebase: get(vip/{uid}) + التحقق الخادمي من endAt قبل أي أداة. */
  getVipStatus: () => Sel.vip(),
  /** المكافأة اليومية. Firebase: httpsCallable('vipClaimDaily')() يتحقق من الصلاحية واليوم. */
  claimDailyReward: () => B().claimDaily(),
  /** تصميم البطاقة (الخادم يتحقق من حدود 25 و100). */
  setDesign: (d) => Store.state.live ? Live.setDesign(d) : (Store.set(s => s.myCode.design = d), Promise.resolve(true))
};
</script>
<script>
'use strict';
/* =========================================================================
   الربط الفعلي بقاعدة بيانات احسمها (Firebase: نفس مشروع ehsmaha.com)
   -------------------------------------------------------------------------
   الوضع الحي يعمل تلقائيًا عند فتح الصفحة من الموقع (https).
   ?preview=1 يفرض وضع المعاينة ببيانات تجريبية، و?live=1 يفرض الوضع الحي.
   البنية في Firestore (القواعد في firestore.rules تحت match /codeRace):
     codeRace/{season}                      { name, days:14, startAt, leader:{key,uses,at} }

    if (Store.now() >= s.season.end && !s.final && !this.finalPromise && s.auth !== 'loading' && (s.auth === 'out' || s.profileReady)) this.finalize(true);
    // VIP
    this.syncVip(s);
    s.pending = Q.view();
    Q.maybeReplay(s);
    // تقدم اللاعب: احتفالات وتنبيه التجاوز
    const myN = s.myUses.length;
    if (this.lastMyUses !== null && myN > this.lastMyUses) Progress.afterChange({ uses: this.lastMyUses, rank: this.lastMyRank });
    else if (this.lastMyUses === null && s.myCode) {
      // أول تحميل: افتح ما وصلت له المحطات دون احتفال متكرر لما احتُفل به سابقًا
      RACE.MILESTONES.forEach(m => { if (myN >= m.n && !s.ach[m.id]) s.ach[m.id] = { at: this.ts(s.myMs['n' + m.n]) || Store.now(), celebrated: false }; });
      Store.saveLocal();
    }
    this.lastMyUses = s.myCode ? myN : null;
    const mine = Sel.mine(s); this.lastMyRank = mine ? mine.rank : null;
    if (mine && mine.rank && (!s.bestRank || mine.rank < s.bestRank)) { s.bestRank = mine.rank; Store.saveLocal(); }
    Store.emit('race');
    Celebrate.flush();
  },
  rowsAll(s) {
    const rows = s.players.map(p => ({ uid: p.uid, name: p.name, uses: p.uses, daily: p.daily, reachedAt: p.reachedAt }));
    if (s.myCode && this.myCodeData) rows.push({ uid: s.me.uid, name: s.me.name, uses: s.myUses.length, daily: this.myCodeData.daily || {}, reachedAt: this.ts(this.myCodeData.lastUseAt) || 0 });
    return rows;
  },
  sumFrom(daily, fromDay) { let t = 0; Object.keys(daily || {}).forEach(k => { if (parseInt(k.slice(1), 10) >= fromDay) t += daily[k] || 0; }); return t; },
  climbHistory(s, dayNow) {
    const rows = this.rowsAll(s), out = [];
    const rankAt = (fn) => { const r = rows.map(x => ({ uid: x.uid, u: fn(x), t: x.reachedAt })).filter(x => x.u > 0).sort((a, b) => b.u - a.u || a.t - b.t); const m = {}; r.forEach((x, i) => m[x.uid] = i + 1); return m; };
    for (let d = Math.max(1, dayNow - 6); d < dayNow; d++) {
      const endR = rankAt(x => x.uses - this.sumFrom(x.daily, d + 1));
      const startR = rankAt(x => x.uses - this.sumFrom(x.daily, d));
      let best = null;
      rows.forEach(x => { if (startR[x.uid] && endR[x.uid]) { const c = startR[x.uid] - endR[x.uid]; if (c > 0 && (!best || c > best.climb)) best = { day: d, name: x.name, climb: c }; } });
      if (best) out.push(best);
    }
    return out;
  },
  syncVip(s) {
    const v = this.vipDoc;
    if (!v || !this.user) { s.vip = null; return; }
    // تعديلات محلية لم تُحفظ بعد: لا نكتب فوقها، نحدّث المشاركين والأصوات فقط
    const base = (this.dirty && s.vip) ? s.vip : JSON.parse(JSON.stringify(v.state || Vip.seed(this.ts(v.startAt))));
    // المشاركون الحقيقيون: أصدقاؤك في احسمها + من انضم عبر رابط القاعة
    const saved = {}; (base.members || []).forEach(m => saved[m.id] = m);
    const members = [];
    this.friends.forEach(fr => members.push({ id: fr.id, name: fr.name, handle: fr.name, online: !!this.presence[fr.id], inHall: saved[fr.id] ? !!saved[fr.id].inHall : false, friend: true }));
    this.joins.forEach(j => { const m = members.find(x => x.id === j.id); if (m) { m.inHall = true; m.joined = true; } else members.push({ id: j.id, name: j.name || 'مشارك', handle: j.name || 'مشارك', online: true, inHall: true, joined: true }); });
    const vote = base.vote || { state: 'idle', options: [], winner: null };
    if (vote.state === 'open' || vote.state === 'closed') {
      const counts = (vote.options || []).map(() => 0);
      this.votes.forEach(x => { if (x.gameRound === vote.round && typeof x.game === 'number' && counts[x.game] != null) counts[x.game]++; });
      if (vote.state === 'open') vote.options = vote.options.map((o, i) => ({ ...o, v: counts[i] }));
    }
    const rv = base.tools && base.tools.rulevote;
    if (rv && !rv.closed) { rv.va = this.votes.filter(x => x.ruleRound === rv.round && x.rule === 'a').length; rv.vb = this.votes.filter(x => x.ruleRound === rv.round && x.rule === 'b').length; }
    s.vip = { ...base, vote, members, start: this.ts(v.startAt), end: this.ts(v.endAt), hall: { ...(base.hall || {}), code: v.hallCode, slug: this.user.uid } };
  },

  /* ---------- الكتابة ---------- */
  needUser() {
    if (!this.user) throw new RaceErr('login');
    if (!Store.state.me.hasProfile) throw new RaceErr('no_profile');
  },
  async createCode(raw, opts = {}) {
    const code = normalizeCode(raw);
    try {
      this.needUser();
      const err = codeError(code); if (err) throw new RaceErr('invalid', err);
      if (!Sel.isOpen()) throw new RaceErr('season_ended');
      const f = this.fb, uid = this.user.uid;
      await f.runTransaction(f.db, async (tx) => {
        const own = await tx.get(this.P.owner(uid)); if (own.exists()) throw new RaceErr('already_has_code');
        const cs = await tx.get(this.P.code(code)); if (cs.exists()) throw new RaceErr('taken');
        tx.set(this.P.code(code), { ownerUid: uid, name: Store.state.me.name, createdAt: f.serverTimestamp(), uses: 0, lastUseAt: f.serverTimestamp(), daily: {}, ms: {}, design: 'base' });
        tx.set(this.P.owner(uid), { key: code, at: f.serverTimestamp() });
      });
      return { ok: true, code };
    } catch (e) {
      if (!opts.noQueue && Q.isQuota(e)) return Q.queueCreate(code);
      console.warn('createCode', e); return { ok: false, reason: this.mapErr(e), message: e.message, raw: e };
    }
  },
  async isAvailable(raw) {
    try { const s = await this.fb.getDoc(this.P.code(normalizeCode(raw))); return { available: !s.exists() }; }
    catch (e) { return { available: true }; }
  },
  async lookupCode(raw) {
    const code = normalizeCode(raw);
    try {
      const s = await this.fb.getDoc(this.P.code(code));
      if (!s.exists()) return { found: false };
      const d = s.data();
      const r = Sel.standings().rows.find(x => x.code === code);
      return { found: true, code, owner: { name: d.name, uses: d.uses || 0, rank: r ? r.rank || null : null, me: !!(this.user && d.ownerUid === this.user.uid) } };
    } catch (e) { return { found: false, error: this.mapErr(e) }; }
  },
  async confirmUse(raw, opts = {}) {
    const key = normalizeCode(raw);
    try {
      this.needUser();
      const f = this.fb, uid = this.user.uid;
      let ownerName = '', ownerUid = '', n = 0;
      await f.runTransaction(f.db, async (tx) => {
        const [ss, cs, sup] = await Promise.all([tx.get(this.P.season()), tx.get(this.P.code(key)), tx.get(this.P.support(uid))]);
        if (!ss.exists()) throw new RaceErr('season_ended');
        const sd = ss.data(), start = this.ts(sd.startAt), end = start + (sd.days || 14) * DAY, now = Store.now();
        if (now >= end) throw new RaceErr('season_ended');
        if (!cs.exists()) throw new RaceErr('not_found');
        const d = cs.data();
        if (d.ownerUid === uid) throw new RaceErr('own_code');
        if (sup.exists()) throw new RaceErr('already_supported');
        n = (d.uses || 0) + 1; ownerName = d.name; ownerUid = d.ownerUid;
        const day = 'd' + clamp(Math.floor((now - start) / DAY) + 1, 1, 14);
        const upd = { uses: n, lastUseAt: f.serverTimestamp(), ['daily.' + day]: ((d.daily || {})[day] || 0) + 1 };
        if (MS_KEYS.includes(n)) upd['ms.n' + n] = f.serverTimestamp();
        tx.update(this.P.code(key), upd);
        tx.set(this.P.support(uid), { key, at: f.serverTimestamp() });
        const L = sd.leader || {};
        if (n > (L.uses || 0)) tx.update(this.P.season(), { leader: { key, uses: n, at: f.serverTimestamp() } });
      });
      return { ok: true, owner: { name: ownerName, uid: ownerUid }, code: key, at: Date.now(), uses: n };
    } catch (e) {
      if (!opts.noQueue && Q.isQuota(e)) return Q.queueUse(key);
      console.warn('confirmUse', e); return { ok: false, reason: this.mapErr(e), raw: e };
    }
  },
  async setDesign(design) {
    try { await this.fb.updateDoc(this.P.code(this.myKey), { design }); return true; }
    catch (e) {
      if (Q.isQuota(e)) {
        try { await Q.put('design', { design }); Q.mark(v => v.design = design); toast('الخادم ممتلئ مؤقتًا: حُفظ اختيارك احتياطيًا ويُطبَّق تلقائيًا عند عودته.', '', 'hourglass', 5000); return true; } catch (e2) { }
      }
      toast('تعذّر حفظ التصميم. حاول مرة ثانية.', 'err'); return false;
    }
  },
  async startSeason() {
    const f = this.fb;
    await f.setDoc(this.P.season(), { name: RACE.SEASON_NAME, days: RACE.SEASON_DAYS, startAt: f.serverTimestamp(), leader: { key: null, uses: 0, at: null } });
  },
  /** النتيجة النهائية: المتصدر يحدده الخادم (leader) أثناء السباق، والكتابة تتوقف بعد النهاية بقاعدة الأمان */
  finalize(silent) {
    if (!this.finalPromise) this.finalPromise = this._finalize(silent).catch(e => { console.error('finalize', e); this.finalPromise = null; return Store.state.final; });
    return this.finalPromise;
  },
  async _finalize(silent) {
    this.finalizing = true;
    const f = this.fb, s = Store.state;
    try {
      const snap = await f.getDocs(f.query(this.P.codes(), f.orderBy('uses', 'desc'), f.limit(TOP_LIMIT)));
      this.top = snap.docs.map(x => ({ key: x.id, ...this.data(x) }));
      const ss = await f.getDoc(this.P.season()); if (ss.exists()) this.seasonData = this.data(ss);
    } catch (e) { }
    const rows = this.top.filter(t => (t.uses || 0) > 0).map(t => ({ uid: t.ownerUid, name: t.name, code: t.key, uses: t.uses, reachedAt: this.ts(t.lastUseAt) || 0, me: !!(this.user && t.ownerUid === this.user.uid) }))
      .sort((a, b) => b.uses - a.uses || a.reachedAt - b.reachedAt);
    rows.forEach((r, i) => r.rank = i + 1);
    const L = (this.seasonData && this.seasonData.leader) || {};
    const w = L.key ? (rows.find(r => r.code === L.key) || rows[0]) : null;
    const second = w ? rows.find(r => r !== w) : null;
    const meRow = s.myCode ? (rows.find(r => r.me) || { rank: this.myRankCount, uses: s.myUses.length }) : null;
    const final = {
      at: s.season.end, top: rows.slice(0, 10), me: meRow ? { rank: meRow.rank || null, uses: meRow.uses } : null,
      winner: w ? { uid: w.uid, name: w.name, code: w.code, uses: w.uses, me: w.me } : null,
      margin: w && second ? w.uses - second.uses : (w ? w.uses : 0),
      tie: !!(w && second && w.uses === second.uses),
      tieWith: w && second && w.uses === second.uses ? { name: second.name, reachedAt: second.reachedAt, winnerReachedAt: w.reachedAt } : null,
      totalUses: rows.reduce((a, r) => a + r.uses, 0)
    };
    s.final = final;
    if (final.winner && final.winner.me && !this.vipDoc) await this.ensureVip();
    this.finalizing = false;
    Store.emit('all');
    if (silent && !s.ceremonySeen && !Ceremony.busy) setTimeout(() => { if (!Store.state.ceremonySeen) { Store.state.ceremonySeen = true; Store.saveLocal(); Ceremony.replay(); } }, 300);
    return final;
  },
  async ensureVip() {
    const f = this.fb, uid = this.user.uid, s = Store.state;
    try { if ((await f.getDoc(this.P.vip(uid))).exists()) return; } catch (e) { return; } // موجودة: لا نكتب فوق لوحتك
    const start = s.season.end;
    const hallCode = Array.from({ length: 6 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
    const state = Vip.seed(start);
    try {
      await f.setDoc(this.P.vip(uid), { uid, name: s.me.name, startAt: f.Timestamp.fromMillis(start), endAt: f.Timestamp.fromMillis(start + RACE.VIP_DAYS * DAY), hallCode, state, updatedAt: f.serverTimestamp() });
    } catch (e) { console.warn('ensureVip', e); }
  },
  /** حفظ حالة لوحة VIP (مؤجل قليلًا لتجميع التعديلات المتتالية) */
  saveVipSoon() {
    if (!this.user || !this.vipDoc) return;
    this.dirty = true;
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.saveVip(), 500);
  },
  async saveVip() {
    const v = Store.state.vip; if (!v) return;
    const { start, end, members, ...rest } = v;
    const state = JSON.parse(JSON.stringify({ ...rest, members: (members || []).map(m => ({ id: m.id, inHall: !!m.inHall })) }));
    try { await this.fb.updateDoc(this.P.vip(this.user.uid), { state, updatedAt: this.fb.serverTimestamp() }); this.dirty = false; }
    catch (e) {
      if (Q.isQuota(e)) {
        // نُبقي التعديلات ظاهرة محليًا (dirty) حتى تُرحَّل لـFirestore
        try {
          await Q.put('vip', { state: JSON.stringify(state) }); Q.mark(v => v.vip = 1);
          if (Date.now() - (this.queuedToastAt || 0) > 60000) { this.queuedToastAt = Date.now(); toast('الخادم ممتلئ مؤقتًا: تعديلات لوحتك محفوظة احتياطيًا وتُرحَّل تلقائيًا.', '', 'hourglass', 5000); }
          return;
        } catch (e2) { }
      }
      this.dirty = false; this.sync(); console.warn('saveVip', e); toast(this.mapErr(e) === 'offline' ? 'تعذّر الحفظ: لا يوجد اتصال. سنعيد المحاولة عند أي تعديل.' : 'رفض الخادم الحفظ. ربما انتهت مدة VIP.', 'err', 'alert-triangle'); }
  },
  async claimDaily() {
    const v = Sel.vip(); if (!v) return { ok: false, reason: 'no_vip' };
    if (v.expired) return { ok: false, reason: 'expired' };
    const f = this.fb, uid = this.user.uid, day = v.dayIdx;
    try {
      const ex = await f.getDoc(this.P.reward(uid, day));
      if (ex.exists()) return { ok: false, reason: 'already_claimed' };
      const b = f.writeBatch(f.db);
      b.set(this.P.reward(uid, day), { uid, day, amount: RACE.VIP_DAILY_REWARD, at: f.serverTimestamp() });
      b.update(this.P.user(uid), { onlinePoints: f.increment(RACE.VIP_DAILY_REWARD) });
      await b.commit();
      Vip.mut(x => { x.reward.balance += RACE.VIP_DAILY_REWARD; x.reward.lastDay = day; x.reward.claims += 1; }, `استلمت مكافأة اليوم ${day}: ${P.points(RACE.VIP_DAILY_REWARD)} أُضيفت لنقاطك في احسمها`);
      return { ok: true, amount: RACE.VIP_DAILY_REWARD };
    } catch (e) { console.warn('claim', e); if (Q.isQuota(e)) return { ok: false, reason: 'busy' }; const r = this.mapErr(e); return { ok: false, reason: r === 'denied' ? 'already_claimed' : r }; }
  },
  /* القاعة العامة: الانضمام والتصويت (للزوار المسجلين) */
  async joinHall(hostUid) {
    this.needUser();
    try { await this.fb.setDoc(this.P.join(hostUid, this.user.uid), { name: Store.state.me.name, at: this.fb.serverTimestamp() }); }
    catch (e) {
      if (!Q.isQuota(e)) throw e;
      await Q.put('joins/' + hostUid, { name: Store.state.me.name }); Q.mark(v => { (v.joins = v.joins || {})[hostUid] = 1; });
      return 'queued';
    }
  },
  async leaveHall(hostUid) { await this.fb.deleteDoc(this.P.join(hostUid, this.user.uid)); },
  async kick(hostUid, uid) { try { await this.fb.deleteDoc(this.P.join(hostUid, uid)); } catch (e) { } },
  async vote(hostUid, fields) {
    this.needUser();
    try { await this.fb.setDoc(this.P.vote(hostUid, this.user.uid), { ...fields, at: this.fb.serverTimestamp() }, { merge: true }); }
    catch (e) {
      if (!Q.isQuota(e)) throw e;
      await Q.put('votes/' + hostUid, fields, true); Q.mark(v => { (v.votes = v.votes || {})[hostUid] = 1; });
      return 'queued';
    }
  },
  async findHall(code) {
    const f = this.fb;
    const snap = await f.getDocs(f.query(this.P.vips(), f.where('hallCode', '==', normalizeCode(code)), f.limit(1)));
    return snap.empty ? null : snap.docs[0].id;
  },
  watchHall(uid, cb) {
    const f = this.fb; const out = {};
    const u1 = f.onSnapshot(this.P.vip(uid), (s) => { out.vip = s.exists() ? this.data(s) : null; cb(out); }, () => { out.vip = null; cb(out); });
    const u2 = f.onSnapshot(this.P.joins(uid), (s) => { out.joins = s.docs.map(x => ({ id: x.id, ...x.data() })); cb(out); }, () => { });
    const u3 = this.user ? f.onSnapshot(this.P.vote(uid, this.user.uid), (s) => { out.myVote = s.exists() ? s.data() : null; cb(out); }, () => { }) : () => { };
    return () => { u1(); u2(); u3(); };
  },
  async signIn() {
    const { authM } = this.fb;
    try { await authM.signInWithPopup(this.fb.auth, new authM.GoogleAuthProvider()); }
    catch (e) { if (!/popup-closed|cancelled/.test(e.code || '')) toast('تعذّر تسجيل الدخول بقوقل. سجّل من صفحة احسمها الرئيسية.', 'err'); }
  }
};

<script>
'use strict';
/* =========================================================================
   طبقة الواجهة: تنقل، نوافذ، إشعارات، مؤقت، محاكاة حيّة
   ========================================================================= */

/* ---------- الحركة ---------- */
const Motion = {
  mq: window.matchMedia('(prefers-reduced-motion: reduce)'),
  reduced() { const m = Store.state.settings.motion; return m === 'reduce' || (m === 'system' && this.mq.matches); },
  apply() { document.documentElement.dataset.motion = this.reduced() ? 'reduce' : 'full'; }
};

/* ---------- صوت احتفالي اختياري (مكتوم افتراضيًا) ---------- */
const Sound = {
  ctx: null,
  on() { return !!Store.state.settings.sound; },
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } return this.ctx; },
  tone(freq, at = 0, dur = .5, type = 'sine', vol = .12) {
    if (!this.on() || !this.ensure()) return;
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  },
  tick() { this.tone(880, 0, .08, 'square', .03); },
  reveal() { this.tone(392, 0, .4, 'triangle', .1); this.tone(523, .12, .5, 'triangle', .08); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .14, .7, 'triangle', .1)); this.tone(1319, .62, 1.2, 'sine', .07); },
  chime() { this.tone(988, 0, .3, 'sine', .08); this.tone(1319, .1, .5, 'sine', .06); }
};

/* ---------- إشعارات ---------- */
function toast(msg, kind = '', icon = null, ms = 3600) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  const icn = icon || ({ ok: 'check', err: 'alert-circle', gold: 'crown' }[kind] || 'info-circle');
  el.innerHTML = `${ic(icn)}<span>${msg}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms);
}
const announce = (t) => { const l = $('#sr-live'); l.textContent = ''; setTimeout(() => l.textContent = t, 30); };

/* ---------- نافذة حوار / ورقة سفلية ---------- */
const Dialog = {
  stack: [],
  open({ title, body, foot = '', wide = false, onClose, label, mount }) {
    const prevFocus = document.activeElement;
    const id = 'dlg-' + uid();
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="${id}-t" id="${id}">
      <div class="grab" aria-hidden="true"></div>
      <div class="dlg-h"><h2 id="${id}-t">${title}</h2><button class="icon-btn" data-close aria-label="إغلاق">${ic('x')}</button></div>
      <div class="dlg-b">${body}</div>${foot ? `<div class="dlg-f">${foot}</div>` : ''}</div>`;
    $('#layer').appendChild(scrim);
    document.body.style.overflow = 'hidden';
    const dlg = scrim.firstElementChild;
    const close = (result) => {
      if (!scrim.isConnected) return;
      scrim.remove();
      this.stack = this.stack.filter(x => x !== api);
      if (!this.stack.length) document.body.style.overflow = '';
      if (prevFocus && prevFocus.focus) prevFocus.focus();
      onClose && onClose(result);
    };
    scrim.addEventListener('mousedown', e => { if (e.target === scrim) close(); });
    dlg.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
    dlg.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
      if (e.key === 'Tab') { // حبس التركيز
        const f = $$('button:not([disabled]),[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', dlg).filter(x => x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    const api = { el: dlg, close };
    this.stack.push(api);
    mount && mount(dlg, api);

  },
  confirm({ title, body, ok = 'تأكيد', cancel = 'رجوع', kind = 'primary', icon }) {

/* ---------- نسخ ---------- */
async function copyText(text, btn, doneLabel = 'تم النسخ') {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) { } ta.remove();
  }
  if (btn) {
    const span = btn.querySelector('span'); const prev = span ? span.textContent : '';
    btn.classList.add('is-done');
    if (span) span.textContent = ok ? doneLabel : 'انسخ يدويًا';
    setTimeout(() => { btn.classList.remove('is-done'); if (span) span.textContent = prev; }, 1800);
  }
  if (ok) announce(doneLabel);
  else Dialog.open({ // المتصفح منع النسخ التلقائي: نعرض النص محددًا للنسخ اليدوي
    title: 'انسخ يدويًا',
    body: `<p class="small t2" style="margin-bottom:10px">المتصفح منع النسخ التلقائي. النص محدد، انسخه بـ Ctrl+C أو بالضغط المطوّل.</p><input class="input mono" readonly value="${esc(text)}" style="direction:ltr" data-manual>`,
    mount: (el) => { const i = el.querySelector('[data-manual]'); setTimeout(() => { i.focus(); i.select(); }, 60); }
  });
  return ok;
}
/* تمرير لقسم داخل الصفحة مع نقل التركيز إليه */
function scrollToId(id) {

  if (!t.matches('a,button,input,select,textarea,[tabindex]')) t.setAttribute('tabindex', '-1');
  t.focus({ preventScroll: true });
  if (!Motion.reduced() && t.animate) t.animate([{ boxShadow: '0 0 0 0 rgba(242,181,68,.55)' }, { boxShadow: '0 0 0 12px rgba(242,181,68,0)' }], { duration: 900, delay: 350 });
}

/* ---------- المناطق الحية (تتحدث دون إعادة رسم الصفحة) ---------- */
const Regions = {
  fns: {},
  def(name, fn) { this.fns[name] = fn; },
  html(name, attrs = '') { return `<div data-region="${name}" ${attrs}>${this.fns[name]()}</div>`; },
  refresh() {
    $$('[data-region]').forEach(el => {
      const fn = this.fns[el.dataset.region]; if (!fn) return;
      const flip = el.hasAttribute('data-flip');
      const before = flip ? FLIP.measure(el) : null;
      el.innerHTML = fn();
      if (flip) FLIP.play(el, before);
    });
  }
};
/* FLIP لتبديل المراكز بسلاسة دون قفزات */
const FLIP = {
  measure(el) { const m = {}; $$('[data-k]', el).forEach(n => m[n.dataset.k] = { top: n.getBoundingClientRect().top, uses: n.dataset.u }); return m; },
  play(el, before) {
    if (Motion.reduced()) return;
    $$('[data-k]', el).forEach(n => {
      const b = before[n.dataset.k]; if (!b) return;
      const dy = b.top - n.getBoundingClientRect().top;
      if (b.uses !== n.dataset.u) n.classList.add('bumped');
      if (Math.abs(dy) > 1) n.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 620, easing: 'cubic-bezier(.2,.8,.2,1)' });
    });
  }
};

/* ---------- المؤقت ---------- */
const Clock = {
  lastPhase: null, lastDay: null,
  segs(ms) { const x = splitDur(ms); return [['d', x.d, 'يوم'], ['h', x.h, 'ساعة'], ['m', x.m, 'دقيقة'], ['s', x.s, 'ثانية']]; },
  segHTML(ms, hot) {
    return `<div class="cd ${hot ? 'hot' : ''} ${ms <= 0 ? 'done' : ''}" role="timer" aria-label="الوقت المتبقي ${fmtDurWords(ms)}">` +
      this.segs(ms).map(([k, v, l]) => `<div class="cd-seg"><b data-seg="${k}">${pad(v)}</b><span>${l}</span></div>`).join('') + `</div>`;
  },
  tick() {
    const s = Store.state;
    if (s.live && (!s.season || s.loading)) { const chip = $('#hdr-cd'); if (chip) { chip.innerHTML = s.loading ? `${ic('hourglass', 'ico-sm')}...` : `${ic('calendar-event', 'ico-sm')}قريبًا`; chip.className = 'cd-chip'; } return; }
    const left = Sel.left(s), ph = Sel.phase(s);
    // ترويسة
    const chip = $('#hdr-cd');
    if (ph === 'ended') { chip.innerHTML = `${ic('trophy', 'ico-sm')}انتهى الموسم`; chip.className = 'cd-chip'; }
    else if (ph === 'certifying') { chip.innerHTML = `${ic('lock', 'ico-sm')}اعتماد النتائج`; chip.className = 'cd-chip hot'; }
    else { chip.innerHTML = `${ic('clock', 'ico-sm')}<span class="num" style="direction:${left >= DAY ? 'rtl' : 'ltr'}">${fmtDurShort(left)}</span>`; chip.className = 'cd-chip' + (ph === 'final24' ? ' hot' : ''); chip.setAttribute('aria-label', 'متبقٍ ' + fmtDurWords(left)); chip.title = `متبقٍ ${fmtDurWords(left)} من سباق مدته ${RACE.SEASON_DAYS} يومًا`; }
    // عدادات الموسم
    $$('[data-cd="season"]').forEach(el => {
      const x = splitDur(left);
      $$('[data-seg]', el).forEach(b => { const v = pad(x[b.dataset.seg]); if (b.textContent !== v) b.textContent = v; });
      const cd = el.querySelector('.cd'); if (cd) cd.setAttribute('aria-label', 'الوقت المتبقي ' + fmtDurWords(left));
    });
    // صيغة الأيام عربية (اتجاه RTL) وصيغة الساعات أرقام (LTR)
    const setDur = (el, ms) => { el.textContent = fmtDurShort(ms); el.style.direction = ms >= DAY ? 'rtl' : 'ltr'; };
    $$('[data-cd-text="season"]').forEach(el => setDur(el, left));
    $$('[data-cd-words="season"]').forEach(el => el.textContent = fmtDurWords(left));
    $$('[data-cd-to]').forEach(el => setDur(el, +el.dataset.cdTo - Store.now()));
    $$('[data-cd-vip]').forEach(el => {
      const v = Sel.vip(); if (!v) return; const x = splitDur(v.left);
      $$('[data-seg]', el).forEach(b => { const val = pad(x[b.dataset.seg]); if (b.textContent !== val) b.textContent = val; });
    });
    $$('.tl i.now').forEach(el => el.style.setProperty('--p', Math.round(Sel.dayProgress(s) * 100) + '%'));
    // يوم جديد في الموسم: لقطة ترتيب بداية اليوم وتصفير "اليوم"
    if (s.live && !s.season) return; // لم يبدأ الموسم بعد
    const day = Sel.day(s);
    if (this.lastDay !== null && day !== this.lastDay && Sel.isOpen(s) && s.live) { this.lastDay = day; Live.sync(); }
    if (this.lastDay !== null && day !== this.lastDay && Sel.isOpen(s) && !s.live) {
      Store.set(st => {
        const prevDay = this.lastDay;
        const top = Sel.climbs(st)[0];
        if (top && top.climb > 0) st.climbHistory.push({ day: prevDay, name: top.name, climb: top.climb });
        st.players.forEach(p => p.today = 0);
        Seed.snapshotDay(st);
        if (day >= RACE.DOOR_START_DAY && !st.door.eligible) st.door.eligible = Sel.standings(st).ranked.filter(r => r.rank > 10 && r.rank <= 30).map(r => r.uid);
      });
    }
    this.lastDay = day;
    // تغير المرحلة → إعادة رسم
    const prev = this.lastPhase;
    this.lastPhase = ph; // يُسجَّل قبل إعادة الرسم لأن Router.render يستدعي tick
    if (prev && ph !== prev) { Router.render(true); if (ph === 'final24') toast('بدأت آخر 24 ساعة. مواجهة القمة مفتوحة الآن.', 'gold', 'flame', 5000); }
    if (ph === 'certifying' && !Ceremony.busy) {
      // الحي: ننتظر معرفة الحساب، ومن شاهد التتويج سابقًا تُحسب له النتيجة بصمت
      const authReady = !s.live || (s.auth !== 'loading' && (s.auth === 'out' || s.profileReady));
      if (authReady) { if (s.live && s.ceremonySeen) RaceAPI.fetchFinalResults(); else Ceremony.begin(); }
    }
  }
};

/* ---------- محاكاة نشاط حي (بيانات تجريبية) ---------- */
const LiveSim = {
  next: 0,
  schedule() { const ph = Sel.phase(); this.next = Date.now() + (ph === 'final24' ? rnd(3500, 7000) : rnd(7000, 14000)); },
  step() {
    const s = Store.state;
    if (s.live || !s.settings.live || !Sel.isOpen(s) || Ceremony.busy) return;
    if (Date.now() < this.next) return;
    this.schedule();
    const before = Sel.mine();
    const t = Store.now();
    const meChance = s.myCode ? 0.16 : 0;
    Store.set(st => {
      if (Math.random() < meChance) { st.myUses.push(t); }
      else {
        // وزن أكبر للمراكز العليا
        const pool = st.players.filter(p => p.uses > 0);
        pool.sort((a, b) => b.uses - a.uses);
        const i = Math.min(pool.length - 1, Math.floor(Math.pow(Math.random(), 1.9) * Math.min(pool.length, 18)));
        const p = pool[i]; p.uses += 1; p.today = (p.today || 0) + 1; p.reachedAt = t;
        RACE.CHALLENGE_FIRST_TIERS.forEach(n => { if (!st.firstTo[n] && p.uses >= n) st.firstTo[n] = { uid: p.uid, at: t }; });
      }
    });
    Progress.afterChange(before);
  }
};

/* ---------- ما بعد أي تغيير في استخدامات اللاعب: ترتيب، إنجازات، تنبيهات ---------- */
const Progress = {
  afterChange(before) {
    const s = Store.state;
    const now = Sel.mine();
    if (!now) return;
    const changes = {};
    if (now.rank && (s.bestRank == null || now.rank < s.bestRank)) changes.bestRank = now.rank;
    if (before && before.uses < now.uses) {
      toast(`استخدام جديد لكودك <span class="code-txt">${esc(now.code)}</span> · المجموع ${now.uses}`, 'ok', 'sparkles', 3000);
      Sound.tick();
      RACE.CHALLENGE_FIRST_TIERS.forEach(n => { if (!s.firstTo[n] && now.uses >= n) changes['first' + n] = true; });
    }
    if (before && before.rank && now.rank && now.rank > before.rank) {
      const passer = now.above;
      toast(`${passer ? esc(passer.name) + ' تجاوزك. ' : ''}مركزك الآن ${now.rank} · تحتاج ${P.uses(now.toPass)} للعودة`, '', 'trending-up', 4200);
    }
    const unlock = RACE.MILESTONES.filter(m => now.uses >= m.n && !s.ach[m.id]);
    if (Object.keys(changes).length || unlock.length) {
      Store.set(st => {
        if (changes.bestRank) st.bestRank = changes.bestRank;
        RACE.CHALLENGE_FIRST_TIERS.forEach(n => { if (changes['first' + n]) st.firstTo[n] = { uid: st.me.uid, at: Store.now() }; });
        unlock.forEach(m => st.ach[m.id] = { at: Store.now(), celebrated: false });
      });
    }
    Celebrate.flush();
  }
};

/* ---------- الموجّه ---------- */
const Router = {
  route: null, params: {}, cleanup: null, first: true,
  parse() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    const [path, qs] = h.split('?');
    const parts = path.split('/').filter(Boolean);
    const q = Object.fromEntries(new URLSearchParams(qs || ''));
    if (parts[0] === 'c' && parts[1]) return { route: 'c', params: { code: parts[1], ...q } };
    if (parts[0] === 'hall') return { route: 'hall', params: { uid: parts[1] || '', ...q } };
    return { route: parts[0] || '', params: q };
  },
  render(keepScroll = false) {
    const { route, params } = this.parse();
    const changed = route !== this.route;
    this.route = route; this.params = params;
    let page = Pages[route] || Pages['404'];
    const gate = Gate.check(route);
    if (gate) page = gate;
    if (this.cleanup) { try { this.cleanup(); } catch (e) { } this.cleanup = null; }
    // عنصر main جديد لكل رسم: يزيل أي مستمعات أضافتها الصفحة السابقة
    const old = $('#view'); const main = old.cloneNode(false); old.replaceWith(main);
    main.innerHTML = page.render(params);
    document.title = (page.title ? (typeof page.title === 'function' ? page.title(params) : page.title) + ' | ' : '') + 'سباق الأكواد | احسمها';
    renderNav(route);
    Clock.tick();
    if (page.mount) this.cleanup = page.mount(main, params) || null;
    if (changed && !keepScroll) {
      window.scrollTo(0, 0);
      if (!this.first) main.focus({ preventScroll: true });
    }
    this.first = false;
    Celebrate.flush();
  }
};

    const n = i + 1;
    const cls = ended || n < d ? 'past' : n === d ? 'now' : '';
    return `<i class="${cls} ${n === RACE.SEASON_DAYS ? 'last' : ''}" title="اليوم ${n}" style="--p:${Math.round(Sel.dayProgress(s) * 100)}%"></i>`;
  }).join('');
  return `<div class="tl" role="img" aria-label="${ended ? 'اكتملت الأيام الأربعة عشر' : `اليوم ${d} من ${RACE.SEASON_DAYS}`}">${cells}</div>
  <div class="tl-legend"><span>البداية ${fmtDate(s.season.start, { day: 'numeric', month: 'short' })}</span><span>النهاية ${fmtDateTime(s.season.end)}</span></div>`;
}

/* مسار الصدارة: كل نقطة في الخط = أثر استخدامات */
function laneRow(r, leaderUses, extraCls = '') {
  const w = leaderUses ? Math.max(3, Math.round(r.uses / leaderUses * 100)) : 0;
  return `<div class="lane ${r.rank === 1 ? 'is-1' : ''} ${r.me ? 'is-me' : ''} ${extraCls}" data-k="${r.uid}" data-u="${r.uses}" data-href="${r.me ? '#/me' : '#/c/' + encodeURIComponent(r.code)}" tabindex="0" role="link" aria-label="${esc(r.name)}، المركز ${r.rank || '-'}، ${P.uses(r.uses)}. افتح البطاقة">
    <span class="lane-rank">${r.rank || '-'}</span>
    <div class="lane-main"><div class="lane-name"><span class="nm">${esc(r.name)}</span><span class="code-txt">${esc(r.code)}</span>${r.me ? '<span class="chip chip-line xs">أنت</span>' : ''}</div>
    <div class="lane-track" aria-hidden="true"><span class="lane-trail" style="--w:${w}%"></span><span class="lane-dot" style="--w:${w}%"></span></div></div>
    <span class="lane-uses num">${r.uses}<small>${r.uses === 1 ? 'استخدام' : 'استخدام'}</small></span></div>`;
}
Regions.def('lanes', () => {
  const st = Sel.standings();
  const top = st.ranked.slice(0, 5);
  if (!top.length) return `<p class="muted">لم تُسجَّل أي استخدامات بعد. أول تأكيد صحيح يفتح المسار.</p>`;
  const lead = top[0].uses;
  let html = '<div class="lanes" role="list" aria-label="أعلى خمسة في السباق">';
  top.forEach((r, i) => {
    html += laneRow(r, lead);
    if (i === 0 && top[1]) {
      const g = top[0].uses - top[1].uses;
      html += `<div class="lane-gap" aria-label="الفارق بين الأول والثاني">${g === 0 ? 'تعادل في القمة. يتقدم من وصل أولًا' : `الفارق بين الأول والثاني <b class="num">${g}</b>`}</div>`;
    }
  });
  const me = st.byUid[Store.state.me.uid];
  if (me && me.rank > 5) html += `<div class="board-sep">موقعك</div>${laneRow(me, lead)}`;
  return html + '</div>';
});

function coachMsg(m) {
  const s = Store.state, ph = Sel.phase(s);
  if (!m) return null;
  if (ph === 'ended' || ph === 'certifying') {
    if (Sel.isWinner(s)) return { t: 'بطل الموسم', p: `فزت بـ${P.uses(m.uses)}. لوحة موسم قائد المجتمع VIP مفتوحة لك 30 يومًا.`, gold: true, icon: 'crown' };
    return { t: 'انتهى الموسم', p: m.rank ? `مركزك النهائي ${m.rank} بـ${P.uses(m.uses)}. إنجازاتك وتصاميمك تبقى في ملفك.` : 'لم تُسجَّل استخدامات لكودك هذا الموسم.', icon: 'flag' };
  }
  if (m.uses === 0) return { t: 'كودك جديد', p: 'أرسل رابطك لأول ثلاثة أصدقاء الآن. أول 5 استخدامات تفتح شارة «الانطلاقة».', icon: 'rocket' };
  if (m.rank === 1) { const second = m.ranked[1]; const lead = second ? m.uses - second.uses : m.uses; return { t: 'أنت في الصدارة', p: lead === 0 ? 'متعادل مع الثاني، وتتقدم لأنك وصلت أولًا. استخدام واحد يكسر التعادل.' : `تتقدم بـ${P.uses(lead)}. الحسم بنهاية اليوم 14 وليس الآن.`, gold: true, icon: 'crown' }; }
  if (m.rank && m.rank <= 3 && m.leader) { const g = m.leader.uses - m.uses + 1; return { t: 'قريب من القمة', p: `تحتاج ${P.uses(g)} لتتجاوز ${esc(m.leader.name)} في المركز الأول.`, gold: true, icon: 'flame' }; }
  if (m.uses >= 20 && m.uses < 25) return { t: 'البطاقة الفضية قريبة', p: `باقي ${P.uses(25 - m.uses)} لتفتح التصميم الفضي لبطاقتك.`, icon: 'sparkles' };
  if (m.rank && m.rank <= 10) return { t: 'دخلت العشرة الأوائل', p: `${m.above ? `تحتاج ${P.uses(m.toPass)} لتتجاوز ${esc(m.above.name)}.` : ''} حافظ على مكانك بمشاركة الرابط في بثك أو مجموعتك.`, icon: 'trending-up' };
  const nm = Sel.nextMilestone(m.uses);
  return { t: m.above ? `${P.uses(m.toPass)} وتتجاوز ${esc(m.above.name)}` : 'استمر', p: nm ? `محطتك التالية ${nm.n}: ${nm.reward}.` : 'وصلت لكل المحطات. الآن المنافسة على الصدارة.', icon: 'target' };
}
const coachHTML = (c) => c ? `<div class="coach ${c.gold ? 'gold' : ''}">${ic(c.icon || 'info-circle', 'ico-lg')}<div><b>${c.t}</b><p>${c.p}</p></div></div>` : '';

Regions.def('mystatus', () => {

  const sup = s.supported ? `<div class="note note-ok">${ic('check')}<div>دعمت كود <span class="code-txt">${esc(s.supported.code)}</span> لـ<b>${esc(s.supported.ownerName)}</b>. لكل حساب دعم واحد في الموسم.</div></div>` : '';

    </dl>${coachHTML(c)}
    <div class="btn-row"><a class="btn btn-ghost btn-sm" href="#/me">${ic('chart-bar')}<span>إحصائياتي</span></a><a class="btn btn-ghost btn-sm" href="#/card">${ic('share')}<span>شارك البطاقة</span></a></div>${sup}`;
});

    const sugg = [normalizeCode(s.me.handle).replace(/[^A-Z0-9]/g, '').slice(0, 8), 'FARES', 'FARES7', 'FRS' + (new Date().getFullYear() % 100)].filter((v, i, a) => v && a.indexOf(v) === i && !codeError(v)).slice(0, 3);
    return `<div class="wrap">
      ${pageHead('أنشئ كودك', 'كود واحد لحسابك في هذا الموسم. اختره قصيرًا وسهل النطق ليكتبه متابعوك بسرعة.', ['#/', 'السباق'])}
      <div class="create-grid">
        <form class="panel stack-lg" id="create-form" novalidate>
          <div class="field">
            <label for="code-in">الكود</label>
            <input class="input code-input" id="code-in" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="latin" maxlength="24" placeholder="مثال ${esc(sugg[0] || 'FARES')}" aria-describedby="code-help code-msg" enterkeyhint="done">
            <span class="help" id="code-help">المسافات والرموز غير المرئية تُحذف تلقائيًا، والحروف تتحول لكبيرة.</span>
            <span class="msg" id="code-msg" aria-live="polite"></span>
          </div>
          <ul class="rules-mini" id="code-rules" aria-label="شروط الكود"></ul>
          ${sugg.length ? `<div class="row-flex small"><span class="muted">اقتراحات:</span>${sugg.map(c => `<button type="button" class="chip chip-line" data-sugg="${c}"><span class="code-txt">${c}</span></button>`).join('')}</div>` : ''}
          <div class="note note-warn">${ic('lock')}<div><b>الكود نهائي بعد الاعتماد.</b> لا يمكن تغييره حتى نهاية الموسم، لأن الاستخدامات مرتبطة به ولا تُنقل لكود آخر.</div></div>
          <button class="btn btn-primary btn-lg btn-block" id="create-btn" type="submit"><span>${ic('check')} اعتمد الكود</span></button>
        </form>
        <div class="stack">
          <h2 style="font-size:16px;font-family:var(--f-body)" class="t2">معاينة بطاقتك</h2>
          <div id="create-preview">${Card.html({ name: s.me.name, code: 'CODE', rank: null, uses: 0, design: 'base' })}</div>
          <p class="small muted">اسمك هو عنوان البطاقة. الكود يظهر تحته كما سيكتبه الناس.</p>
        </div>
      </div></div>`;
  },
  mount(root) {
    const inp = $('#code-in', root); if (!inp) return;
    const msg = $('#code-msg'), rules = $('#code-rules'), btn = $('#create-btn'), prev = $('#create-preview');
    let avail = null, seq = 0, timer;
    const draw = () => {
      const code = normalizeCode(inp.value);
      const err = code ? codeError(code) : null;
      rules.innerHTML = codeRules(code).map(r => `<li class="${!code ? '' : r.pass ? 'pass' : 'fail'}">${ic(!code ? 'circle-dashed' : r.pass ? 'check' : 'x')}${r.label}</li>`).join('') +
        `<li class="${avail === true ? 'pass' : avail === false ? 'fail' : ''}">${ic(avail === true ? 'check' : avail === false ? 'x' : avail === 'checking' ? 'hourglass' : 'circle-dashed')}${avail === 'checking' ? 'نتحقق أنه غير مستخدم...' : 'غير مستخدم من لاعب آخر'}</li>`;
      const name = Store.state.me.name;
      prev.innerHTML = Card.html({ name, code: code || 'CODE', rank: null, uses: 0, design: 'base' });
      if (!code) { msg.innerHTML = ''; inp.removeAttribute('aria-invalid'); inp.classList.remove('is-valid'); }
      else if (err) { msg.innerHTML = `<span class="err">${ic('alert-circle', 'ico-sm')}${err}</span>`; inp.setAttribute('aria-invalid', 'true'); inp.classList.remove('is-valid'); }
      else if (avail === false) { msg.innerHTML = `<span class="err">${ic('alert-circle', 'ico-sm')}<span class="code-txt">${esc(code)}</span>&nbsp;مستخدم. جرّب إضافة رقم أو اختصار.</span>`; inp.setAttribute('aria-invalid', 'true'); inp.classList.remove('is-valid'); }
      else if (avail === true) { msg.innerHTML = `<span class="ok">${ic('check', 'ico-sm')}الكود متاح</span>`; inp.removeAttribute('aria-invalid'); inp.classList.add('is-valid'); }
      else { msg.innerHTML = ''; inp.removeAttribute('aria-invalid'); }
      btn.setAttribute('aria-describedby', 'code-msg');
      btn.classList.toggle('is-dim', !(code && !err && avail === true));
    };
    let pending = null;
    const check = () => {
      const code = normalizeCode(inp.value);
      avail = null; clearTimeout(timer); pending = null;
      if (code && !codeError(code)) {
        avail = 'checking';
        const my = ++seq;
        pending = new Promise(res => { timer = setTimeout(async () => { const r = await RaceAPI.checkAvailability(code); if (my === seq) { avail = r.available; draw(); } res(); }, 260); });
      }
      draw();
    };
    inp.addEventListener('input', check);
    root.addEventListener('click', e => { const b = e.target.closest('[data-sugg]'); if (b) { inp.value = b.dataset.sugg; check(); inp.focus(); } });
    $('#create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = normalizeCode(inp.value);
      if (!code) { msg.innerHTML = `<span class="err">${ic('alert-circle', 'ico-sm')} اكتب الكود الذي تريده أولًا، أو اختر اقتراحًا.</span>`; inp.setAttribute('aria-invalid', 'true'); inp.focus(); return; }
      if (codeError(code)) { draw(); inp.focus(); return; }
      if (avail === 'checking' && pending) { btn.classList.add('is-loading'); await pending; btn.classList.remove('is-loading'); }
      if (avail === false) { draw(); inp.focus(); return; }
      const ok = await Dialog.confirm({
        title: 'اعتماد الكود', icon: 'check', ok: 'اعتمد الكود', cancel: 'عدّل',
        body: `<div class="stack"><div style="text-align:center">${plate(code)}</div><p class="t2">بعد الاعتماد يصبح هذا كودك الوحيد في ${RACE.SEASON_NAME}، ولا يمكن تغييره أو نقل استخداماته.</p></div>`
      });
      if (!ok) { inp.focus(); return; }
      btn.classList.add('is-loading');
      const r = await RaceAPI.createCode(code);
      btn.classList.remove('is-loading');
      if (!r.ok && r.reason === 'queued') { Router.render(true); return; }
      if (!r.ok) {
        const m = { taken: 'سبقك لاعب لهذا الكود قبل لحظات. اختر كودًا آخر.', offline: 'تعذّر الاتصال. لم يُنشأ الكود. حاول مرة ثانية.', season_ended: 'انتهى الموسم.', already_has_code: 'لديك كود بالفعل.', invalid: r.message, login: 'سجّل دخولك أولًا.', no_profile: 'اختر اسم مستخدم في احسمها أولًا.', denied: 'رفض الخادم إنشاء الكود. ربما الكود محجوز أو لديك كود.', queued: `الخادم ممتلئ مؤقتًا: حفظنا طلب الكود ${esc(r.code || code)} ويُعتمد تلقائيًا عند عودته، ما لم يسبقك إليه لاعب.` }[r.reason] || 'تعذّر إنشاء الكود.';
        if (r.reason === 'taken') avail = false;
        draw(); msg.innerHTML = `<span class="err">${ic('alert-circle', 'ico-sm')}${m}</span>`; inp.focus();
        return;
      }
      Reveal.show(r.code);
    });
    draw();
    setTimeout(() => inp.focus({ preventScroll: true }), 60);
  }
};

/* كشف البطاقة بعد الإنشاء: الآثار تتجمع ثم تنقلب البطاقة */
const Reveal = {
  show(code) {
    const el = document.createElement('div');
    el.className = 'reveal'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'كودك جاهز');
    const dots = Motion.reduced() ? '' : Array.from({ length: 28 }, (_, i) => { const a = i / 28 * Math.PI * 2, r = rnd(180, 420); return `<i style="--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r}px;animation-delay:${rnd(0, .25).toFixed(2)}s"></i>`; }).join('');
    el.innerHTML = `<div class="reveal-lines">${dots}</div>${Card.html({ name: Store.state.me.name, code, rank: null, uses: 0, design: 'base' })}<p class="reveal-cap">كودك جاهز. اضغط للمتابعة</p>`;
    document.body.appendChild(el);
    Sound.reveal();
    announce(`تم اعتماد الكود ${code}`);
    let done = false;
    const go = () => { if (done) return; done = true; el.remove(); document.removeEventListener('keydown', key); location.hash = '#/me'; toast(`كودك <span class="code-txt">${esc(code)}</span> جاهز للمشاركة`, 'ok'); };
    const key = (e) => { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') go(); };
    el.addEventListener('click', go); document.addEventListener('keydown', key);
    setTimeout(go, Motion.reduced() ? 1400 : 2600);
  }
};

const ENTER_ERR = {

  season_ended: () => ({ t: 'انتهى الموسم', p: 'لا تُحتسب استخدامات بعد نهاية الأسبوعين.' }),
  offline: () => ({ t: 'تعذّر الاتصال', p: 'لم يُحتسب أي استخدام. تأكد من الإنترنت ثم أعد المحاولة. لن يُحتسب مرتين.', retry: true }),

  login: () => ({ t: 'سجّل دخولك أولًا', p: 'الدعم يُسجَّل باسم حسابك في احسمها. <a href="#/me">سجّل الدخول</a>' }),
  no_profile: () => ({ t: 'أكمل حسابك', p: 'اختر اسم مستخدم في احسمها ثم ارجع.' }),
  denied: () => ({ t: 'رفض الخادم العملية', p: 'لم يُحتسب شيء. ربما دعمت كودًا من قبل أو انتهى الموسم. حدّث الصفحة وحاول مرة ثانية.' }),

};
Pages.enter = {

  state: null,
  render(params) {
    const s = Store.state, ph = Sel.phase(s);
    let pre = params.code ? normalizeCode(params.code) : '';
    if (!pre) { try { pre = localStorage.getItem('ehsmaha.codeRace.pendingCode') || ''; localStorage.removeItem('ehsmaha.codeRace.pendingCode'); } catch (e) { } }

        : sup ? `<div class="panel stack-lg"><div class="note note-ok">${ic('check')}<div><b>دعمت ${esc(sup.ownerName)} في هذا الموسم</b><br>الكود <span class="code-txt">${esc(sup.code)}</span> · ${fmtDateTime(sup.at)}. لكل حساب دعم واحد، ولا يمكن تغييره.</div></div>
          <div class="btn-row"><a class="btn btn-ghost" href="#/board">${ic('list-numbers')}<span>الصدارة</span></a>${!s.myCode && !closed ? `<a class="btn btn-primary" href="#/create"><span>${ic('plus')} أنشئ كودك أنت</span></a>` : ''}</div></div>`
        : closed ? `<div class="panel">${emptyState('flag', 'انتهى الموسم', 'لا تُحتسب استخدامات بعد نهاية الأسبوعين. النتائج معتمدة.', `<a class="btn btn-primary" href="#/board"><span>النتائج</span></a>`)}</div>`
        : `<form class="panel stack-lg" id="enter-form" novalidate>
          ${fromShare ? `<div class="chip chip-line">${ic('link')}وصلت عبر رابط مشاركة. الكود مكتوب ولم يُحتسب بعد</div>` : ''}
          <div class="field">
            <label for="enter-in">كود اللاعب</label>
            <input class="input code-input" id="enter-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="اكتب الكود هنا" value="${esc(pre)}" aria-describedby="enter-help enter-err" enterkeyhint="go">
            <span class="help" id="enter-help">الحروف الصغيرة والمسافات لا تؤثر. RaKan و RAKAN نفس الكود.</span>
          </div>
          <div id="owner-peek" aria-live="polite"></div>
          <div id="enter-err" role="alert"></div>
          <button class="btn btn-primary btn-lg btn-block" id="enter-btn" type="submit"><span>${ic('check')} تأكيد الكود</span></button>

  },
  mount(root, params) {
