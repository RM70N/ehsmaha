<head>
<meta charset="utf-8">

<title>سباق الأكواد | احسمها</title>
<meta name="description" content="سباق الأكواد في احسمها: أنشئ كودك، شاركه، وكل حساب مختلف يؤكده يدفعك خطوة نحو الصدارة. أعلى استخدامات بنهاية 14 يومًا يفوز بموسم قائد المجتمع VIP لمدة 30 يومًا.">
<!--
  ============================================================
  Open Graph / معاينة الرابط
  ------------------------------------------------------------
  هذا الملف المحلي لا يستطيع وحده تغيير معاينة الرابط لكل لاعب:
  تطبيقات المشاركة (واتساب، تويتر/X، ديسكورد، تيليجرام) تقرأ وسوم og
  من HTML الذي يرسله الخادم، ولا تشغّل JavaScript.

  عند النقل إلى ehsmaha.com يلزم:
   1) مسار خادمي:  GET /race/c/:code
      يقرأ codeRace/seasons/{seasonId}/codes/{codeKey} من القاعدة ويعيد HTML
      فيه og:title = "<اسم اللاعب> في سباق الأكواد"
          og:description = "الكود <CODE> · المركز <n> · <uses> استخدام"
          og:image = https://ehsmaha.com/api/race-card/<CODE>.png?v=<uses>
      ثم يحوّل المتصفح إلى صفحة البطاقة (#/c/CODE) داخل الموقع.
   2) مسار صورة: GET /api/race-card/:code.png  (1200×630)
      يرسم بطاقة اللاعب على الخادم (Cloudflare Worker + satori/resvg، أو
      Cloud Function + @napi-rs/canvas) بنفس تصميم drawCardCanvas() أدناه.
   3) Cache-Control قصير (5 دقائق) لأن الترتيب يتغير.
  القيم التالية ثابتة للصفحة العامة فقط.
  ============================================================
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="احسمها">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="سباق الأكواد | احسمها">
<meta property="og:description" content="أنشئ كودك وشاركه. أعلى استخدامات صحيحة بنهاية 14 يومًا تفوز بموسم قائد المجتمع VIP لمدة 30 يومًا.">
<meta property="og:url" content="https://ehsmaha.com/race">
<meta property="og:image" content="https://ehsmaha.com/api/race-card/default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   سباق الأكواد · نظام التصميم
   هوية احسمها: أسود بنفسجي، بنفسجي مضبوط، ذهبي للحظات المستحقة.
   الفكرة: كل استخدام صحيح = "أثر" (نقطة) يتجمّع في المسار والعداد.
   ===================================================================== */
:root{
  --ink:#0B0518; --ink-2:#0F0720; --panel:#150B29; --panel-2:#1B1033; --panel-3:#22163F;
  --line:rgba(167,139,255,.14); --line-2:rgba(167,139,255,.26); --line-3:rgba(167,139,255,.42);
  --text:#EDE9FF; --text-2:#C3B8E8; --muted:#9283BF;
  --violet:#7C3AED; --violet-2:#8B5CF6; --lilac:#A78BFF; --lilac-2:#C4B0FF; --on-lilac:#14071F;
  --gold:#F2B544; --gold-2:#FFD98A; --gold-3:#FFF1CC; --gold-deep:#8A5A12; --on-gold:#2A1803;
  --silver:#CDD3E2; --silver-2:#8E97AD; --bronze:#D99A6C;
  --ok:#34D399; --ok-bg:rgba(52,211,153,.10);
  --warn:#FB923C; --warn-bg:rgba(251,146,60,.10);
  --err:#F87171; --err-bg:rgba(248,113,113,.10);
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --f-display:'Cairo',system-ui,sans-serif; --f-body:'Tajawal',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.5,0,.75,0);
  --t-fast:160ms; --t-mid:260ms; --t-slow:420ms;
  --header-h:60px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --gutter:16px; --maxw:1200px;
  /* طبقات */
  --z-header:20; --z-nav:30; --z-fab:35; --z-sheet:60; --z-toast:80; --z-cer:90; --z-cel:95;
  color-scheme:dark;
}
@media (min-width:640px){:root{--gutter:24px}}
@media (min-width:1024px){:root{--gutter:32px;--header-h:68px}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + 16px)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 520px at 85% -8%,rgba(124,58,237,.20),transparent 60%),radial-gradient(800px 420px at 0% 110%,rgba(124,58,237,.10),transparent 60%)}
img,svg,canvas{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--lilac-2);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.25;font-weight:800;letter-spacing:0}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--lilac-2);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:8px;right:8px;z-index:100;background:var(--lilac);color:var(--on-lilac);padding:10px 16px;border-radius:var(--r-sm);font-weight:800;transform:translateY(-200%);transition:transform var(--t-fast)}
.skip:focus{transform:none}
.ico{display:inline-block;vertical-align:-.22em;width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:16px;height:16px}.ico-lg{width:24px;height:24px}.ico-xl{width:32px;height:32px}
/* الكود الإنجليزي والأرقام داخل الواجهة العربية */
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--f-mono);letter-spacing:.04em}
.code-txt{font-family:var(--f-mono);font-weight:800;letter-spacing:.08em;direction:ltr;unicode-bidi:isolate;display:inline-block;overflow-wrap:anywhere}

/* ====== هيكل ====== */
.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
main{flex:1;padding-top:calc(var(--header-h) + 8px);padding-bottom:calc(var(--nav-h) + var(--safe-b) + 40px)}
@media (min-width:960px){main{padding-bottom:64px}}

/* ترويسة */
.hdr{position:fixed;top:0;inset-inline:0;z-index:var(--z-header);height:calc(var(--header-h) + var(--safe-t));padding-top:var(--safe-t);background:rgba(11,5,24,.82);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.hdr .wrap{height:var(--header-h);display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);min-width:0}
.brand:hover{text-decoration:none}
.brand-mark{width:32px;height:32px;border-radius:9px;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-txt b{font-family:var(--f-display);font-weight:900;font-size:16px;white-space:nowrap}
.brand-txt small{font-size:12px;color:var(--muted);white-space:nowrap}
.hdr-nav{display:none;gap:2px;margin-inline-start:20px}
.hdr-nav a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--r-sm);color:var(--text-2);font-weight:700;font-size:15px;white-space:nowrap;transition:background var(--t-fast),color var(--t-fast)}
.hdr-nav a:hover{background:rgba(167,139,255,.08);color:var(--text);text-decoration:none}
.hdr-nav a[aria-current="page"]{color:var(--text);background:rgba(167,139,255,.12)}
.hdr-nav a.is-vip{color:var(--gold-2)}
.hdr-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.preview-tag{cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--warn);border:1px dashed rgba(251,146,60,.5);padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
.preview-tag.acct{color:var(--text-2);border:1px solid var(--line-2);max-width:140px;overflow:hidden}
.preview-tag.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-tag.acct:hover{text-decoration:none;color:var(--text)}
.cd-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r-pill);background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.cd-chip.hot{border-color:rgba(242,181,68,.45);color:var(--gold-2)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--text-2);transition:background var(--t-fast),color var(--t-fast)}
.icon-btn:hover{background:rgba(167,139,255,.10);color:var(--text)}
@media (min-width:960px){.hdr-nav{display:flex}.hdr .menu-btn{display:none}}
@media (max-width:420px){.brand-txt small{display:none}.hdr .wrap{gap:6px}.hdr-end{gap:4px}.cd-chip .ico{display:none}.cd-chip{padding:6px 8px}.preview-tag{padding:3px 7px}.brand-mark{width:28px;height:28px}.brand{gap:7px}.brand-txt b{font-size:15px}.hdr .menu-btn{width:40px}}
@media (max-width:370px){.brand-txt{display:none}}
.wide-only{display:none}@media (min-width:1200px){.wide-only{display:inline}}

/* شريط تنقل سفلي (جوال) */
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:var(--z-nav);padding-bottom:var(--safe-b);background:rgba(13,6,28,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bnav ul{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);max-width:560px;margin:0 auto}
.bnav a{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:700;position:relative;-webkit-tap-highlight-color:transparent}
.bnav a:hover{text-decoration:none;color:var(--text-2)}
.bnav a[aria-current="page"]{color:var(--text)}
.bnav a[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--lilac)}
.bnav a.is-vip{color:var(--gold-2)}
.bnav a.is-vip[aria-current="page"]::before{background:var(--gold)}
.bnav .bnav-main{position:relative}
.bnav .bnav-main .ico-wrap{width:46px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(100deg,var(--lilac-2),var(--violet));color:var(--on-lilac);transform:skewX(-7deg);box-shadow:0 4px 0 #4C1D95}
.bnav .bnav-main .ico-wrap .ico{transform:skewX(7deg)}
.bnav .bnav-main[aria-current="page"]::before{display:none}
@media (min-width:960px){.bnav{display:none}}
@media (orientation:landscape) and (max-height:500px){:root{--nav-h:52px}.bnav a span.lbl{display:none}}

/* درج القائمة */
.drawer-list a{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:var(--r-sm);color:var(--text);font-weight:700;min-height:48px}
.drawer-list a:hover{background:rgba(167,139,255,.08);text-decoration:none}
.drawer-list a .ico{color:var(--lilac)}
.drawer-list a.is-vip .ico{color:var(--gold)}
.drawer-list hr{border:0;border-top:1px solid var(--line);margin:8px 0}

/* ====== أزرار ====== */
.btn{--bg:var(--panel-3);--fg:var(--text);--bd:var(--line-2);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-sm);background:var(--bg);color:var(--fg);border:1px solid var(--bd);font-family:var(--f-body);font-weight:800;font-size:16px;line-height:1;white-space:nowrap;text-decoration:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform var(--t-fast) var(--ease),background-color var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast),color var(--t-fast),opacity var(--t-fast)}
.btn:hover{text-decoration:none;border-color:var(--line-3)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn .ico{width:18px;height:18px}
.btn > span{display:inline-flex;align-items:center;gap:8px}
.mini-card .pcard{max-width:250px;margin-inline:auto}
/* الزر الأساسي بميلان احسمها */
.btn-primary{--fg:var(--on-lilac);background:linear-gradient(100deg,var(--lilac-2),var(--violet-2));border:0;transform:skewX(-7deg);box-shadow:0 5px 0 #4C1D95,0 12px 28px rgba(124,58,237,.32)}
.btn-primary > *{transform:skewX(7deg)}
.btn-primary:hover{box-shadow:0 5px 0 #4C1D95,0 14px 34px rgba(124,58,237,.42)}
.btn-primary:active{transform:skewX(-7deg) translateY(3px);box-shadow:0 2px 0 #4C1D95}
.btn-gold{--fg:var(--on-gold);background:linear-gradient(100deg,var(--gold-3),var(--gold));border:0;transform:skewX(-7deg);box-shadow:0 5px 0 var(--gold-deep),0 12px 30px rgba(242,181,68,.28)}
.btn-gold > *{transform:skewX(7deg)}
.btn-gold:active{transform:skewX(-7deg) translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.btn-ghost{--bg:transparent}
.btn-ghost:hover{--bg:rgba(167,139,255,.08)}
.btn-quiet{--bg:transparent;--bd:transparent;--fg:var(--lilac-2);padding:0 12px;min-height:44px}
.btn-quiet:hover{--bg:rgba(167,139,255,.08)}
.btn-danger{--fg:var(--err);--bd:rgba(248,113,113,.4);--bg:transparent}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn-lg{min-height:56px;padding:0 26px;font-size:17px}
.btn-block{width:100%}
.btn.is-loading{color:transparent!important;pointer-events:none}
.btn.is-loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-color:var(--on-lilac) transparent var(--on-lilac) transparent;animation:spin .8s linear infinite}
.btn-ghost.is-loading::after,.btn.is-loading:not(.btn-primary):not(.btn-gold)::after{border-color:var(--lilac) transparent var(--lilac) transparent}
.btn.is-done{--bg:var(--ok-bg);--bd:rgba(52,211,153,.5);--fg:var(--ok)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn.is-dim{opacity:.62;filter:saturate(.7)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ====== أسطح ====== */
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
@media (min-width:640px){.panel{padding:24px}}
.panel-flat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.panel-gold{border-color:rgba(242,181,68,.35);background:linear-gradient(180deg,rgba(242,181,68,.08),rgba(242,181,68,.02) 40%,var(--panel))}
.sec{margin-top:40px}
.sec-tight{margin-top:24px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-size:22px}
@media (min-width:1024px){.sec-h h2{font-size:26px}}
.sec-h .more{margin-inline-start:auto;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:4px}
.lead{color:var(--text-2);font-size:17px;max-width:62ch}
.muted{color:var(--muted)}
.t2{color:var(--text-2)}
.small{font-size:14px}
.xs{font-size:13px}
.strong{font-weight:800}
.gold{color:var(--gold-2)}
.ok{color:var(--ok)}
.err{color:var(--err)}
.warn{color:var(--warn)}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:20px}
.row-flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spacer{flex:1}
.divider{border:0;border-top:1px solid var(--line);margin:20px 0}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);background:rgba(167,139,255,.10);color:var(--text-2);font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent;max-width:100%}
@media (max-width:420px){.chip{white-space:normal;border-radius:12px}}
.chip .ico{width:14px;height:14px}
.chip-ok{background:var(--ok-bg);color:var(--ok)}
.chip-warn{background:var(--warn-bg);color:var(--warn)}
.chip-err{background:var(--err-bg);color:var(--err)}
.chip-gold{background:rgba(242,181,68,.12);color:var(--gold-2)}
.chip-line{background:transparent;border-color:var(--line-2)}
.chip-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}

/* رسائل حالة */
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);font-size:15px;color:var(--text-2)}
.note .ico{margin-top:2px;color:var(--lilac)}
.note b{color:var(--text)}
.note-ok{border-color:rgba(52,211,153,.35);background:var(--ok-bg)} .note-ok .ico{color:var(--ok)}
.note-warn{border-color:rgba(251,146,60,.35);background:var(--warn-bg)} .note-warn .ico{color:var(--warn)}
.note-err{border-color:rgba(248,113,113,.35);background:var(--err-bg)} .note-err .ico{color:var(--err)}
.note-gold{border-color:rgba(242,181,68,.35);background:rgba(242,181,68,.07)} .note-gold .ico{color:var(--gold)}

/* حقول */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-weight:800;font-size:15px}
.field .help{font-size:14px;color:var(--muted)}
.field .msg{font-size:14px;font-weight:700;min-height:1.6em;display:flex;align-items:center;gap:6px}
.input,.select,.textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:var(--r-sm);background:var(--ink-2);border:1px solid var(--line-2);color:var(--text);font-size:16px;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.input::placeholder,.textarea::placeholder{color:#7F70AD}
.input:hover,.select:hover{border-color:var(--line-3)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--lilac);box-shadow:0 0 0 3px rgba(167,139,255,.22)}
.input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
.input.is-valid{border-color:rgba(52,211,153,.6)}
.input[disabled]{opacity:.5;cursor:not-allowed}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:16px 50%,22px 50%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-start:36px}
.textarea{min-height:88px;resize:vertical;line-height:1.5}
.code-input{font-family:var(--f-mono);font-weight:800;font-size:clamp(24px,7vw,34px);letter-spacing:.14em;text-align:center;direction:ltr;text-transform:uppercase;min-height:68px;padding:8px 16px}
.code-input::placeholder{letter-spacing:.08em;font-weight:500;font-size:.62em;font-family:var(--f-body);color:#7F70AD}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-sm);background:var(--ink-2);border:1px solid var(--line);gap:4px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:800;font-size:14px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;transition:background var(--t-fast),color var(--t-fast)}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;min-height:44px}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--panel-3);border:1px solid var(--line-2);position:relative;transition:background var(--t-fast);cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--text-2);transition:transform var(--t-mid) var(--ease)}
.switch input:checked{background:var(--violet)}
.switch input:checked::after{transform:translateX(-18px);background:#fff}
.switch input:focus-visible{outline:2px solid var(--lilac-2);outline-offset:2px}

/* ====== لوحة الكود (Plate) ====== */
.plate{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line-2);font-family:var(--f-mono);font-weight:800;letter-spacing:.12em;direction:ltr;unicode-bidi:isolate;max-width:100%;overflow:hidden}
.plate .pre{color:var(--muted);font-weight:500;letter-spacing:.04em;font-size:.72em}
.plate .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ====== الصفحة الرئيسية ====== */
.hero{display:grid;gap:20px;padding-top:16px}
@media (min-width:1024px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:stretch;padding-top:28px}}
.title-block{position:relative;display:flex;flex-direction:column;justify-content:center;gap:14px}
.season-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.race-title{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,11vw,76px);line-height:1.05;letter-spacing:0;display:flex;flex-wrap:wrap;align-items:center;gap:.12em .28em}
.race-title .sig{display:inline-flex;align-items:center;gap:.16em;font-family:var(--f-mono);font-weight:800;font-size:.34em;color:var(--lilac-2);letter-spacing:.14em;direction:ltr;padding:.32em .6em;border:1px solid var(--line-2);border-radius:10px;background:var(--ink-2);transform:translateY(-.12em)}
.race-title .sig i{width:.42em;height:.42em;border-radius:50%;background:var(--lilac);display:inline-block}
.race-title .sig i:nth-child(2){opacity:.6}.race-title .sig i:nth-child(3){opacity:.3}
.hero-sub{font-size:18px;color:var(--text-2);max-width:46ch}
.hero-sub b{color:var(--text)}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
@media (max-width:480px){.hero-actions .btn{flex:1 1 100%}}

/* عدّاد */
.clock{display:flex;flex-direction:column;gap:16px}
.clock-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock-head h2{font-size:16px;font-weight:800;color:var(--text-2);font-family:var(--f-body)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl}
.cd-seg{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 6px 10px;text-align:center;min-width:0}
.cd-seg b{display:block;font-family:var(--f-mono);font-weight:800;font-size:clamp(28px,8vw,44px);line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.cd-seg span{display:block;margin-top:6px;font-size:13px;color:var(--muted);font-weight:700}
.cd.hot .cd-seg{border-color:rgba(242,181,68,.4)}
.cd.hot .cd-seg b{color:var(--gold-2)}
.cd.done .cd-seg b{color:var(--muted)}
/* شريط الأيام الـ14 */
.tl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;direction:rtl}
.tl i{height:10px;border-radius:3px;background:var(--panel-3);position:relative;overflow:hidden}
.tl i.past{background:rgba(167,139,255,.55)}
.tl i.now{background:var(--panel-3)}
.tl i.now::after{content:"";position:absolute;inset:0;inset-inline-end:auto;width:var(--p,50%);background:var(--lilac)}
.tl i.last{outline:1px solid rgba(242,181,68,.55);outline-offset:1px}
.tl-legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* مسار الصدارة (التوقيع البصري) */
.lanes{display:flex;flex-direction:column;gap:6px}
.lane{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 4px;border-radius:var(--r-sm);position:relative}
.lane + .lane{border-top:1px solid var(--line)}
[data-href]{cursor:pointer;transition:background-color var(--t-fast),border-color var(--t-fast)}
.lane[data-href]:hover{background:rgba(167,139,255,.06)}
.brow[data-href]:hover{border-color:var(--line-3)}
.flow-step .btn-quiet{margin-top:6px;padding-inline:0;min-height:36px}
.lane-rank{font-family:var(--f-mono);font-weight:800;color:var(--muted);text-align:center;font-size:15px}
.lane-main{min-width:0;display:flex;flex-direction:column;gap:7px}
.lane-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800}
.lane-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lane-name .code-txt{font-size:12px;color:var(--muted);font-weight:700}
.lane-track{position:relative;height:12px;direction:rtl}
.lane-track::before{content:"";position:absolute;inset-inline:0;top:50%;height:1px;background:var(--line-2)}
.lane-trail{position:absolute;top:50%;inset-inline-start:0;height:4px;transform:translateY(-50%);width:var(--w,0%);border-radius:2px;
  background-image:radial-gradient(circle,var(--lilac) 1.6px,transparent 2px);background-size:9px 4px;background-repeat:repeat-x;background-position:right center;transition:width var(--t-slow) var(--ease-out)}
.lane-dot{position:absolute;top:50%;inset-inline-start:var(--w,0%);width:12px;height:12px;border-radius:50%;background:var(--lilac-2);transform:translate(50%,-50%);box-shadow:0 0 0 4px rgba(167,139,255,.16);transition:inset-inline-start var(--t-slow) var(--ease-out)}
.lane-uses{font-family:var(--f-mono);font-weight:800;font-size:20px;text-align:end;min-width:3ch}
.lane-uses small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0}
.lane.is-1 .lane-rank{color:var(--gold)}
.lane.is-1 .lane-trail{background-image:radial-gradient(circle,var(--gold) 1.6px,transparent 2px)}
.lane.is-1 .lane-dot{background:var(--gold-2);box-shadow:0 0 0 4px rgba(242,181,68,.2)}
.lane.is-1 .lane-uses{color:var(--gold-2)}
.lane.is-me{background:rgba(167,139,255,.06)}
.lane.is-me .lane-dot{background:#fff}
.lane-gap{display:flex;align-items:center;gap:10px;margin:2px 0 4px;padding-inline-start:40px;font-size:14px;color:var(--text-2)}
.lane-gap::before{content:"";width:2px;height:22px;background:repeating-linear-gradient(to bottom,var(--gold) 0 3px,transparent 3px 6px);border-radius:1px}
.lane-gap b{color:var(--gold-2);font-family:var(--f-mono);font-size:16px}
.pulse-in{animation:pulseIn .7s var(--ease-out)}
@keyframes pulseIn{0%{box-shadow:0 0 0 0 rgba(167,139,255,.5)}100%{box-shadow:0 0 0 14px rgba(167,139,255,0)}}

.home-grid{display:grid;gap:20px;margin-top:20px}
@media (min-width:1024px){.home-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px}}
.mystatus,.mystatus > [data-region]{display:flex;flex-direction:column;gap:16px}
.mystatus .big{font-family:var(--f-mono);font-weight:800;font-size:44px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv > div{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;min-width:0}
.kv dt{font-size:13px;color:var(--muted);font-weight:700}
@media (max-width:360px){.kv{gap:6px}.kv > div{padding:10px 8px}.kv dt{font-size:12px}.kv dd{font-size:19px}}
.kv dt{overflow-wrap:anywhere}
.kv dd{margin:4px 0 0;font-family:var(--f-mono);font-weight:800;font-size:22px;line-height:1.1;overflow-wrap:anywhere}

/* شريط الجائزة */
.prize{position:relative;overflow:hidden;display:grid;gap:20px;border-radius:var(--r-lg);border:1px solid rgba(242,181,68,.32);padding:22px;
  background:linear-gradient(110deg,rgba(242,181,68,.10),rgba(242,181,68,0) 45%),linear-gradient(180deg,var(--panel-2),var(--panel))}
@media (min-width:860px){.prize{grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr);align-items:center;padding:28px 32px;gap:32px}}
.prize-key{width:84px;height:84px;color:var(--gold)}
.prize h2{font-size:24px;color:var(--gold-2)}
.prize .dur{display:inline-flex;align-items:baseline;gap:6px;font-weight:800;margin-top:6px}
.prize .dur b{font-family:var(--f-mono);font-size:30px;color:var(--gold-3)}
.prize-uses{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.prize-uses{grid-template-columns:1fr}}
.prize-uses h3{font-size:15px;font-family:var(--f-body);font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--text)}
.prize-uses h3 .ico{color:var(--gold)}
.prize-uses li{font-size:15px;color:var(--text-2);padding-inline-start:14px;position:relative;line-height:1.5}
.prize-uses li+li{margin-top:4px}
.prize-uses li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--gold)}

/* خطوات المشاركة (تسلسل حقيقي) */
.flow{display:grid;gap:0;position:relative}
@media (min-width:760px){.flow{grid-template-columns:repeat(3,1fr)}}
.flow-step{position:relative;padding:18px 0 18px 0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:760px){.flow-step{grid-template-columns:1fr;padding:0 0 0 24px}}
.flow-node{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel-3);border:1px solid var(--line-2);color:var(--lilac-2);position:relative;z-index:1}
.flow-step h3{font-size:17px;margin-bottom:4px}
.flow-step p{color:var(--text-2);font-size:15px}
.flow-line{position:absolute;inset-inline-start:21px;top:62px;bottom:-18px;width:2px;background:repeating-linear-gradient(to bottom,var(--line-3) 0 4px,transparent 4px 9px)}
@media (min-width:760px){.flow-line{top:21px;bottom:auto;inset-inline-start:56px;inset-inline-end:-8px;width:auto;height:2px;background:repeating-linear-gradient(to left,var(--line-3) 0 4px,transparent 4px 9px)}}
.flow-step:last-child .flow-line{display:none}
.flow-signal{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lilac-2);inset-inline-start:-3px;top:-3px;animation:signalV 3.2s var(--ease) infinite}
@media (min-width:760px){.flow-signal{animation-name:signalH}}
@keyframes signalV{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(80px);opacity:0}}
@keyframes signalH{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(-180px);opacity:0}}

/* ====== لوحة الصدارة ====== */
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);will-change:transform}
@media (min-width:720px){.brow{grid-template-columns:52px minmax(0,1.6fr) minmax(0,1fr) 120px 110px;padding:14px 18px}}
.brow .rk{font-family:var(--f-mono);font-weight:800;font-size:18px;color:var(--text-2);text-align:center}
.brow .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.brow .who .nm{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .who .sub{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.brow .code-col{display:none}
.brow .uses{font-family:var(--f-mono);font-weight:800;font-size:22px;text-align:end;line-height:1}
.brow .uses small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:0}
.brow .gap{display:none;font-size:14px;color:var(--text-2);text-align:end}
.brow .gap b{font-family:var(--f-mono)}
.brow .gap-m{color:var(--muted)}
@media (min-width:720px){.brow .code-col{display:block;color:var(--text-2);font-size:14px}.brow .gap{display:block}.brow .who .sub .code-txt{display:none}}
.brow.top-1{background:linear-gradient(100deg,rgba(242,181,68,.13),rgba(242,181,68,.02) 50%),var(--panel);border-color:rgba(242,181,68,.38)}
.brow.top-1 .rk{color:var(--gold)}
.brow.top-1 .uses{color:var(--gold-2)}
.brow.top-2{border-color:rgba(205,211,226,.30)}
.brow.top-2 .rk{color:var(--silver)}
.brow.top-3{border-color:rgba(217,154,108,.30)}
.brow.top-3 .rk{color:var(--bronze)}
.brow.is-me{border-color:var(--lilac);box-shadow:inset 0 0 0 1px rgba(167,139,255,.35)}
.brow.is-me .nm::after{content:"أنت";margin-inline-start:8px;font-size:12px;font-weight:800;color:var(--on-lilac);background:var(--lilac);padding:1px 8px;border-radius:var(--r-pill);vertical-align:2px}
.brow.bumped .uses{animation:bump .6s var(--ease-out)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18);color:var(--lilac-2)}100%{transform:scale(1)}}
.board-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700;padding:4px 6px}
.board-sep::before,.board-sep::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(to left,var(--line-2) 0 4px,transparent 4px 8px)}
.board-head{display:none;padding:0 18px;font-size:13px;color:var(--muted);font-weight:700}
@media (min-width:720px){.board-head{display:grid;grid-template-columns:52px minmax(0,1.6fr) minmax(0,1fr) 120px 110px;gap:12px}.board-head span:nth-child(n+4){text-align:end}}

/* مواجهة القمة */
.summit{border-radius:var(--r-lg);border:1px solid rgba(242,181,68,.4);background:radial-gradient(600px 240px at 50% -20%,rgba(242,181,68,.16),transparent 70%),var(--panel);padding:20px;position:relative;overflow:hidden}
@media (min-width:720px){.summit{padding:28px}}
.summit-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.summit-head h2{font-size:24px;color:var(--gold-2)}
.summit-vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.summit-p{text-align:center;min-width:0}
.summit-p .rk{font-family:var(--f-mono);font-weight:800;color:var(--muted);font-size:14px}
.summit-p .nm{font-family:var(--f-display);font-weight:900;font-size:clamp(17px,4.4vw,26px);line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.summit-p .u{font-family:var(--f-mono);font-weight:800;font-size:clamp(36px,10vw,56px);line-height:1}
.summit-p.lead .u{color:var(--gold-2)}
.summit-gap{text-align:center;padding:10px 12px;border-radius:var(--r-md);border:1px dashed rgba(242,181,68,.5)}
.summit-gap b{display:block;font-family:var(--f-mono);font-size:28px;color:var(--gold-3);line-height:1}
.summit-gap span{font-size:12px;color:var(--text-2);font-weight:700}
.summit-third{margin-top:14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--text-2)}

/* النتائج النهائية / المنصة */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-top:8px}
.pod{text-align:center;min-width:0}
.pod .bar{border-radius:var(--r-md) var(--r-md) 6px 6px;background:var(--panel-2);border:1px solid var(--line);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pod.p1 .bar{min-height:170px;border-color:rgba(242,181,68,.45);background:linear-gradient(180deg,rgba(242,181,68,.16),var(--panel))}
.pod.p2 .bar{min-height:128px}
.pod.p3 .bar{min-height:104px}
.pod .rk{font-family:var(--f-mono);font-weight:800;font-size:22px}
.pod.p1 .rk{color:var(--gold)}
.pod.p2 .rk{color:var(--silver)}
.pod.p3 .rk{color:var(--bronze)}
.pod .nm{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .u{font-family:var(--f-mono);font-weight:800;font-size:20px}

/* ====== صفحة كودي ====== */
.me-grid{display:grid;gap:20px}
@media (min-width:980px){.me-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.stat dt{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.stat dt .ico{width:15px;height:15px}
.stat dd{margin:6px 0 0;font-family:var(--f-mono);font-weight:800;font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.stat dd small{font-family:var(--f-body);font-size:13px;color:var(--text-2);font-weight:700;letter-spacing:0;margin-inline-start:4px}
.stat.hl{border-color:rgba(167,139,255,.45)}
.coach{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-md);background:rgba(167,139,255,.07);border:1px solid rgba(167,139,255,.3)}
.coach .ico{color:var(--lilac-2);margin-top:2px}
.coach b{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:2px}
.coach p{color:var(--text-2);font-size:15px}
.coach.gold{background:rgba(242,181,68,.07);border-color:rgba(242,181,68,.35)}
.coach.gold .ico{color:var(--gold)}
/* رسم 7 أيام */
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:22px;direction:rtl}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .bar{width:100%;max-width:38px;border-radius:6px 6px 3px 3px;background:rgba(167,139,255,.45);position:relative;min-height:2px;transform-origin:bottom;animation:grow .6s var(--ease-out) both}
.chart .col.today .bar{background:var(--lilac)}
.chart .bar b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;font-family:var(--f-mono);font-size:13px;font-weight:800;color:var(--text)}
.chart .col span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.chart .col.today span{color:var(--text)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
/* شبكة الأثر 10×10 */
.trace{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;direction:rtl;width:min(300px,100%);flex:none}
.trace i{aspect-ratio:1;border-radius:50%;background:var(--panel-3);position:relative}
.trace i.on{background:var(--lilac)}
.trace i.m{box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--line-3)}
.trace i.m.on{box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--lilac-2)}
.trace i.m100{box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--gold)}
.trace i.new{animation:dotIn .5s var(--ease-out) both}
@keyframes dotIn{0%{transform:scale(0);background:#fff}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.trace-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

/* تقدم */
.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700}
.prog-top b{font-family:var(--f-mono)}
.prog-bar{height:8px;border-radius:4px;position:relative;background:repeating-linear-gradient(to left,var(--line-2) 0 2px,transparent 2px 6px)}
.prog-bar i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--p,0%);border-radius:4px;background:var(--lilac);transition:width var(--t-slow) var(--ease-out)}
.prog-bar.silver i{background:linear-gradient(90deg,var(--silver-2),var(--silver))}
.prog-bar.gold i{background:linear-gradient(90deg,var(--gold-deep),var(--gold))}

/* المحطات */
.ms-list{display:grid;gap:14px}
@media (min-width:900px){.ms-list{grid-template-columns:1fr 1fr 1.3fr}}
.ms{position:relative;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.ms-top{display:flex;align-items:center;gap:14px}
.ms-badge{width:64px;height:64px;flex:none}
.ms h3{font-size:19px}
.ms .ms-at{font-family:var(--f-mono);font-weight:800;font-size:14px;color:var(--muted)}
.ms.locked .ms-badge{opacity:.42;filter:grayscale(.6)}
.ms.near{border-color:rgba(167,139,255,.5)}
.ms.open{border-color:rgba(52,211,153,.4)}
.ms.open.tier-silver{border-color:rgba(205,211,226,.45);background:linear-gradient(160deg,rgba(205,211,226,.08),var(--panel) 55%)}
.ms.open.tier-gold{border-color:rgba(242,181,68,.5);background:linear-gradient(160deg,rgba(242,181,68,.12),var(--panel) 55%)}
.log{display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .when{font-size:13px;color:var(--muted);white-space:nowrap}

/* ====== بطاقة اللاعب ====== */
.pcard{--c1:#2A1757;--c2:#140A2A;--ac:var(--lilac);--ac2:var(--lilac-2);--fg:var(--text);--sub:var(--text-2);
  position:relative;isolation:isolate;width:100%;max-width:420px;aspect-ratio:1;border-radius:24px;overflow:hidden;color:var(--fg);
  background:radial-gradient(120% 80% at 100% 0%,var(--c1),var(--c2) 70%);border:1px solid rgba(167,139,255,.3);padding:7%;display:flex;flex-direction:column;container-type:inline-size}
.pcard.story{aspect-ratio:9/16;max-width:300px}
.pcard.d-silver{--c1:#3B4152;--c2:#13141C;--ac:#E6EAF3;--ac2:#FFFFFF;--sub:#C9CFDC;border-color:rgba(230,234,243,.4)}
.pcard.d-gold{--c1:#5A3A0C;--c2:#1A0F03;--ac:var(--gold);--ac2:var(--gold-3);--sub:#F4DDB0;border-color:rgba(242,181,68,.55)}
.pcard-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(11px,3.4cqi,15px);color:var(--sub)}
.pcard-top svg{width:clamp(18px,6cqi,26px);height:clamp(18px,6cqi,26px);border-radius:6px}
.pcard-top .tag{margin-inline-start:auto;font-family:var(--f-mono);letter-spacing:.08em;font-size:.86em}
.pcard-name{margin-top:auto;font-family:var(--f-display);font-weight:900;font-size:clamp(28px,13cqi,62px);line-height:1.08;overflow-wrap:anywhere;color:var(--fg)}
.pcard-name.long{font-size:clamp(22px,9cqi,44px)}
.pcard-code{margin-top:4%;display:flex;align-items:center;gap:10px;direction:ltr;justify-content:flex-end}
.pcard-code .plate{background:rgba(0,0,0,.28);border-color:color-mix(in srgb,var(--ac) 50%,transparent);font-size:clamp(16px,7.4cqi,32px);color:var(--ac2);padding:.3em .55em}
.pcard-trace{margin-top:6%;height:8px;background-image:radial-gradient(circle,var(--ac) 2px,transparent 2.4px);background-size:11px 8px;background-repeat:repeat-x;background-position:right center;opacity:.9;width:var(--tw,30%);margin-inline-start:0}
.pcard-foot{margin-top:5%;display:flex;gap:6%;align-items:flex-end;border-top:1px solid color-mix(in srgb,var(--ac) 28%,transparent);padding-top:5%}
.pcard-foot div{display:flex;flex-direction:column}
.pcard-foot span{font-size:clamp(10px,3.2cqi,14px);color:var(--sub);font-weight:700}
.pcard-foot b{font-family:var(--f-mono);font-weight:800;font-size:clamp(20px,8cqi,36px);line-height:1.05;color:var(--fg)}
.pcard-foot .url{margin-inline-start:auto;font-family:var(--f-mono);font-size:clamp(9px,2.8cqi,12px);color:var(--sub);direction:ltr;text-align:left}
.pcard.story .pcard-name{font-size:clamp(26px,15cqi,56px)}
@container (max-width:200px){.pcard-top span:not(.tag){display:none}.pcard-foot .url{display:none}.pcard-foot{gap:14%}}
.pcard.story .pcard-cta{margin-top:7%;font-weight:800;font-size:clamp(12px,5cqi,18px);color:var(--sub)}
.pcard::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 40% at 0% 100%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 70%)}
.pcard.d-silver.sheen::before,.pcard.d-gold.sheen::before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(120%);animation:sheen 1.6s var(--ease) .2s both;pointer-events:none;z-index:2}
@keyframes sheen{to{transform:translateX(-120%)}}
.designs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.design-opt{position:relative;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--panel);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:14px;min-height:96px;justify-content:center;text-align:center}
.design-opt .sw{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 100% 0%,#2A1757,#140A2A);border:1px solid rgba(167,139,255,.4)}
.design-opt[data-d="silver"] .sw{background:radial-gradient(circle at 100% 0%,#3B4152,#13141C);border-color:rgba(230,234,243,.45)}
.design-opt[data-d="gold"] .sw{background:radial-gradient(circle at 100% 0%,#5A3A0C,#1A0F03);border-color:rgba(242,181,68,.6)}
.design-opt[aria-pressed="true"]{border-color:var(--lilac);box-shadow:inset 0 0 0 1px var(--lilac)}
.design-opt[data-locked="true"]{opacity:.6}
.design-opt small{font-weight:700;color:var(--muted);font-size:12px}
.card-stage{display:grid;gap:20px}
.card-stage > *,.me-grid > *,.create-grid > *,.home-grid > *,.hero > *,.vip-hero > *{min-width:0}
@media (min-width:900px){.card-stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:32px}}
.card-previews{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.card-previews .pcard:not(.story){flex:1 1 260px}
.card-previews .pcard.story{flex:0 0 min(46%,220px)}
/* معاينة الرابط في تطبيق مراسلة */
.og-mock{max-width:420px;background:#0E1A14;border-radius:14px 14px 4px 14px;padding:6px;border:1px solid rgba(255,255,255,.06)}
.og-mock .og-card{border-radius:10px;overflow:hidden;background:#13221B}
.og-mock .og-img{aspect-ratio:1200/630;background:radial-gradient(120% 90% at 100% 0%,#2A1757,#140A2A);display:flex;align-items:flex-end;padding:14px;gap:10px}
.og-mock .og-img .n{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.1}
.og-mock .og-img .plate{font-size:14px;margin-inline-start:auto}
.og-mock .og-meta{padding:8px 10px}
.og-mock .og-meta b{display:block;font-size:14px;color:#E9EDEF}
.og-mock .og-meta span{display:block;font-size:13px;color:#8696A0;line-height:1.4}
.og-mock .og-link{padding:6px 8px 4px;font-size:14px;color:#53BDEB;direction:ltr;text-align:left;font-family:var(--f-mono);overflow-wrap:anywhere}

/* ====== إنشاء الكود ====== */
.create-grid{display:grid;gap:24px}
@media (min-width:960px){.create-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}}
.rules-mini{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules-mini li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.rules-mini li .ico{width:16px;height:16px}
.rules-mini li.pass{color:var(--ok)}
.rules-mini li.fail{color:var(--err)}
.reveal{position:fixed;inset:0;z-index:var(--z-cel);display:grid;place-items:center;background:rgba(8,3,18,.92);padding:24px}
.reveal .pcard{max-width:min(380px,82vw);animation:revealCard .9s var(--ease-out) .55s both}
.reveal-lines{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.reveal-lines i{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;background:var(--lilac-2);animation:converge .8s var(--ease-in) both}
.reveal-cap{position:absolute;bottom:calc(32px + var(--safe-b));left:0;right:0;text-align:center;font-weight:800;color:var(--text-2);animation:fadeUp .5s var(--ease-out) 1.2s both}
@keyframes revealCard{0%{opacity:0;transform:perspective(900px) rotateY(-70deg) scale(.86)}100%{opacity:1;transform:none}}
@keyframes converge{0%{transform:translate(var(--x),var(--y));opacity:0}30%{opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ====== إدخال الكود ====== */
.enter-wrap{max-width:640px;margin-inline:auto}
.owner-peek{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--line-2);min-height:64px}
.owner-peek .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;background:var(--panel-3);color:var(--lilac-2);flex:none}
.owner-peek .who{min-width:0;flex:1}
.owner-peek .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner-peek .who span{font-size:13px;color:var(--muted)}
.skeleton{background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:6px;height:12px}
@keyframes shimmer{to{background-position:-200% 0}}
.success-burst{text-align:center;padding:12px 0 4px}
.success-burst .ring{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);border:1px solid rgba(52,211,153,.5);color:var(--ok);animation:popIn .5s var(--ease-out)}
.success-burst h2{font-size:26px}
@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.signal-dot{position:fixed;z-index:var(--z-cel);width:10px;height:10px;border-radius:50%;background:var(--lilac-2);pointer-events:none;box-shadow:0 0 0 4px rgba(167,139,255,.25)}

/* ====== التحديات ====== */
.ch-list{display:grid;gap:16px}
@media (min-width:900px){.ch-list{grid-template-columns:1fr 1fr}}
.ch{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:14px}
.ch.wide{grid-column:1/-1}
.ch-top{display:flex;align-items:flex-start;gap:14px}
.ch-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--panel-3);color:var(--lilac-2);flex:none;border:1px solid var(--line-2)}
.ch h3{font-size:19px}
.ch .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ch details{border-top:1px solid var(--line);padding-top:10px}
.ch summary{cursor:pointer;font-weight:800;color:var(--lilac-2);font-size:15px;min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.ch summary::-webkit-details-marker{display:none}
.ch details[open] summary .ico{transform:rotate(180deg)}
.ch details ul{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.ch details li{font-size:15px;color:var(--text-2);padding-inline-start:16px;position:relative}
.ch details li::before{content:"";position:absolute;inset-inline-start:0;top:.66em;width:6px;height:2px;background:var(--lilac)}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tier{border-radius:var(--r-md);border:1px solid var(--line);background:var(--ink-2);padding:12px 14px;min-width:0}
.tier.done{border-color:rgba(52,211,153,.35)}
.tier b{font-family:var(--f-mono)}

/* ====== القواعد ====== */
.rules{max-width:820px}
.rules h2{font-size:20px;margin:32px 0 12px}
.rules ol.rl{counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rules ol.rl li{counter-increment:r;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);color:var(--text-2)}
.rules ol.rl li::before{content:counter(r);font-family:var(--f-mono);font-weight:800;color:var(--lilac-2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel-3)}
.rules ol.rl li b{color:var(--text)}
.tie-demo{display:grid;gap:8px;margin-top:12px}
.tie-demo .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r-sm);background:var(--ink-2);border:1px solid var(--line);font-size:15px}
.tie-demo .r.w{border-color:rgba(242,181,68,.45)}
.tie-demo .r b{min-width:0;overflow-wrap:anywhere}
.tie-demo .r span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* ====== نوافذ ====== */
.scrim{position:fixed;inset:0;z-index:var(--z-sheet);background:rgba(6,2,14,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade var(--t-mid) var(--ease-out)}
@media (min-width:640px){.scrim{align-items:center;padding:24px}}
.dlg{width:100%;max-width:520px;max-height:calc(100dvh - 24px - var(--safe-t));display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -10px 60px rgba(0,0,0,.5);animation:sheetUp var(--t-slow) var(--ease-out)}
@media (min-width:640px){.dlg{border-radius:var(--r-lg);animation:dlgIn var(--t-mid) var(--ease-out)}}
.dlg.wide{max-width:720px}
.dlg-h{display:flex;align-items:center;gap:12px;padding:18px 20px 10px}
.dlg-h h2{font-size:20px;flex:1;min-width:0}
.dlg-b{padding:6px 20px 20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dlg-f{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px calc(16px + var(--safe-b));border-top:1px solid var(--line)}
.dlg-f .btn{flex:1 1 160px}
@media (min-width:640px){.dlg-f{padding-bottom:16px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-3);margin:10px auto 0}
@media (min-width:640px){.grab{display:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes dlgIn{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}

/* إشعارات */
.toasts{position:fixed;z-index:var(--z-toast);inset-inline:0;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media (min-width:960px){.toasts{bottom:24px;align-items:flex-start;inset-inline-start:24px;inset-inline-end:auto}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:440px;padding:12px 16px;border-radius:var(--r-md);background:#24183F;border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.45);font-weight:700;font-size:15px;animation:toastIn var(--t-mid) var(--ease-out)}
.toast .ico{color:var(--lilac-2)}
.toast.ok .ico{color:var(--ok)}
.toast.err .ico{color:var(--err)}
.toast.gold{border-color:rgba(242,181,68,.45)} .toast.gold .ico{color:var(--gold)}
.toast.out{animation:toastOut .2s var(--ease-in) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* لوحة أدوات المعاينة */
.fab{display:none;position:fixed;z-index:var(--z-fab);inset-inline-end:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r-pill);background:#2A1A10;color:var(--warn);border:1px dashed rgba(251,146,60,.6);font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (min-width:960px){.fab{display:inline-flex;bottom:24px;inset-inline-end:24px}}
.demo-grp{border-top:1px solid var(--line);padding:14px 0}
.demo-grp:first-child{border-top:0;padding-top:4px}
.demo-grp h3{font-size:14px;font-family:var(--f-body);font-weight:800;color:var(--muted);margin-bottom:10px}
.demo-grp .btn-row{gap:8px}
.demo-grp .btn{min-height:42px;font-size:14px;padding:0 12px}

/* احتفال المحطات */
.celebrate{position:fixed;inset:0;z-index:var(--z-cel);display:grid;place-items:center;padding:24px;background:rgba(8,3,18,.86);animation:fade .25s}
.celebrate .cel-card{position:relative;text-align:center;max-width:420px;width:100%;padding:32px 24px;border-radius:var(--r-lg);background:var(--panel-2);border:1px solid var(--line-2)}
.celebrate .cel-card .ms-badge{width:112px;height:112px;margin:0 auto 16px;animation:popIn .6s var(--ease-out)}
.celebrate h2{font-size:28px}
.celebrate.tier-silver .cel-card{border-color:rgba(230,234,243,.5);background:linear-gradient(170deg,#2B2F3C,var(--panel-2) 60%)}
.celebrate.tier-gold .cel-card{border-color:rgba(242,181,68,.6);background:linear-gradient(170deg,#3A2608,var(--panel-2) 60%)}
.burst{position:absolute;inset:0;pointer-events:none;overflow:visible}
.burst i{position:absolute;top:30%;left:50%;width:7px;height:7px;border-radius:50%;background:var(--c,var(--lilac-2));animation:burst 1s var(--ease-out) both}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);opacity:0}}
.sweep{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.sweep::before{content:"";position:absolute;inset:-30%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.28) 50%,transparent 58%);animation:sheen 1.4s var(--ease) .1s both;transform:translateX(120%)}

/* ====== مشهد التتويج ====== */
.cer{position:fixed;inset:0;z-index:var(--z-cer);background:#07030F;color:var(--text);overflow:hidden;display:flex;flex-direction:column}
.cer::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 50% 0%,rgba(124,58,237,.22),transparent 65%);opacity:var(--glow,1);transition:opacity 1s}
.cer.goldlit::before{background:radial-gradient(900px 560px at 50% 10%,rgba(242,181,68,.22),transparent 65%)}
.cer-bar{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(12px + var(--safe-t)) 16px 0;justify-content:flex-start}
.cer-bar .spacer{flex:1}
.cer-bar .btn{min-height:44px;font-size:14px;--bg:rgba(255,255,255,.05)}
.cer-stage{position:relative;z-index:2;flex:1;display:grid;place-items:center;padding:16px 20px calc(24px + var(--safe-b))}
.cer-scene{position:absolute;inset:0;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
.cer-scene.on{opacity:1;pointer-events:auto}
.cer-cert{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:520px}
.cer-cert .cd-seg b{color:var(--muted)}
.cer-cert h2{font-size:clamp(26px,6vw,40px)}
.cer-verify{width:min(320px,80vw);height:4px;border-radius:2px;background:var(--panel-3);overflow:hidden}
.cer-verify i{display:block;height:100%;width:100%;background:var(--lilac);transform-origin:right;transform:scaleX(0);transition:transform 2.2s linear}
.cer-verify.go i{transform:scaleX(1)}
.cer-places{display:flex;flex-direction:column;gap:14px;width:min(520px,100%);align-items:stretch}
.cer-place{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease-out),transform .6s var(--ease-out)}
.cer-place.in{opacity:1;transform:none}
.cer-place .rk{font-family:var(--f-mono);font-weight:800;font-size:26px;text-align:center}
.cer-place.p2 .rk{color:var(--silver)} .cer-place.p3 .rk{color:var(--bronze)}
.cer-place .nm{font-family:var(--f-display);font-weight:900;font-size:clamp(18px,4.6vw,24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cer-place .u{font-family:var(--f-mono);font-weight:800;font-size:24px}
.cer-wait{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,5vw,28px);color:var(--gold-2);text-align:center;opacity:0;transition:opacity .5s}
.cer-wait.in{opacity:1}
.cer-dots{position:absolute;inset:0;pointer-events:none;z-index:1}
.cer-dots i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--lilac-2);opacity:0}
.cer-champ{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:760px;width:100%}
.cer-champ .crown .ico{width:64px;height:64px}
.cer-champ .crown{width:64px;height:64px;color:var(--gold);opacity:0;transform:translateY(-14px);transition:all .6s var(--ease-out)}
.cer-champ .nm{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,12vw,104px);line-height:1.05;overflow-wrap:anywhere;opacity:0;transform:scale(.92);transition:all .8s var(--ease-out);background:linear-gradient(180deg,#FFF6DD,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.cer-champ .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;opacity:0;transform:translateY(12px);transition:all .6s var(--ease-out)}
.cer-champ .facts div{display:flex;flex-direction:column;align-items:center}
.cer-champ .facts span{font-size:14px;color:var(--text-2);font-weight:700}
.cer-champ .facts b{font-family:var(--f-mono);font-weight:800;font-size:clamp(22px,6vw,32px);color:var(--gold-3)}
.cer-champ .title{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,4.4vw,26px);color:var(--gold-2);opacity:0;transition:opacity .6s;margin-top:6px}
.cer-champ.s1 .crown,.cer-champ.s1 .nm{opacity:1;transform:none}
.cer-champ.s2 .facts{opacity:1;transform:none}
.cer-champ.s3 .title{opacity:1}
.cer-key{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:560px}
.keycard{position:relative;width:min(340px,80vw);aspect-ratio:1.58;border-radius:20px;background:linear-gradient(135deg,#3A2608,#1A0F03 70%);border:1px solid rgba(242,181,68,.6);display:flex;flex-direction:column;justify-content:space-between;padding:18px 20px;overflow:hidden;color:var(--gold-3);box-shadow:0 30px 80px rgba(242,181,68,.16)}
.keycard .k-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--gold-2)}
.keycard .k-top svg.brand-mark{width:24px;height:24px;border-radius:6px}
.keycard .k-title{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,6vw,26px);line-height:1.15;text-align:start}
.keycard .k-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.keycard .k-foot b{font-family:var(--f-mono);font-size:28px;line-height:1}
.keycard .k-foot span{font-size:13px;color:#E8CF97;font-weight:700}
.keycard .k-key{position:absolute;inset-inline-end:-12px;top:10px;width:120px;height:120px;color:rgba(242,181,68,.16)}
.keycard.morph{animation:keyIn 1.1s var(--ease-out) both}
@keyframes keyIn{0%{transform:perspective(900px) rotateY(180deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.cer-final{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.cer-final .btn-row{justify-content:center}
.cer-nowinner{text-align:center;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px}

/* ====== لوحة VIP ====== */
.vip-hero{display:grid;gap:20px;padding-top:12px}
@media (min-width:1000px){.vip-hero{grid-template-columns:auto minmax(0,1fr) minmax(0,.9fr);align-items:center;gap:28px;padding-top:24px}}
.vip-hero .keycard{width:min(280px,100%);margin-inline:auto}
@media (min-width:1000px){.vip-hero .keycard{width:250px}}
.vip-hero h1{font-size:clamp(28px,6vw,40px);color:var(--gold-2)}
.vip-time{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vip-time .cd-seg b{font-size:clamp(26px,7vw,36px)}
.vip-meta{display:flex;flex-wrap:wrap;gap:8px}
.vip-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
@media (min-width:760px){.vip-quick{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vq{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line-2);text-align:start;min-height:64px;transition:border-color var(--t-fast),transform var(--t-fast)}
.vq:hover{border-color:rgba(242,181,68,.5)}
.vq:active{transform:scale(.985)}
.vq .ico{color:var(--gold);width:22px;height:22px}
.vq > div{min-width:0}
.vq b{display:block;font-weight:800;font-size:15px}
.vq span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.vq[disabled]{opacity:.45;cursor:not-allowed}
.reward{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.reward .bal{font-family:var(--f-mono);font-weight:800;font-size:34px;color:var(--gold-3);line-height:1}
.vip-layout{display:grid;gap:24px;margin-top:28px}
@media (min-width:1100px){.vip-layout{grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}}
.stage-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;position:sticky;top:calc(var(--header-h) + var(--safe-t));z-index:5;background:var(--ink);margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);padding-block:8px}
.stage-nav::-webkit-scrollbar{display:none}
.stage-nav a{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--text-2);font-weight:800;font-size:14px;white-space:nowrap;min-height:40px}
.stage-nav a:hover{text-decoration:none;border-color:var(--line-3)}
.stage-nav a.on{background:rgba(242,181,68,.10);border-color:rgba(242,181,68,.45);color:var(--gold-2)}
.stage-nav a b{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (min-width:1100px){.stage-nav{flex-direction:column;overflow:visible;margin:0;padding:0;top:calc(var(--header-h) + 24px);background:none}.stage-nav a{border-radius:var(--r-sm);border-color:transparent;justify-content:space-between}}
.stage{scroll-margin-top:calc(var(--header-h) + 72px)}
.stage + .stage{margin-top:36px}
.stage-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stage-h h2{font-size:22px}
.stage-h p{color:var(--muted);font-size:15px;flex-basis:100%}
.tools{display:grid;gap:12px;align-items:start}
.tool.span2 .mini-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
@media (min-width:700px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tool{display:flex;flex-direction:column;gap:12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);padding:16px;min-width:0}
.tool{scroll-margin-top:calc(var(--header-h) + 72px)}
#stage-results,.vip-hero .reward{scroll-margin-top:calc(var(--header-h) + 72px)}
.tool.feat{border-color:rgba(242,181,68,.28)}
.tool.span2{grid-column:1/-1}
.tool-h{display:flex;align-items:flex-start;gap:12px}
.tool-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel-3);color:var(--gold-2);flex:none}
.tool-h h3{font-size:16px;font-family:var(--f-body);font-weight:800}
.tool-h p{font-size:14px;color:var(--muted);line-height:1.5}
.tool-h .st{margin-inline-start:auto;flex:none}
.tool-body{display:flex;flex-direction:column;gap:10px}
.tool-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.tool-f .btn{min-height:42px;font-size:14px;padding:0 14px}
.mini-list{display:flex;flex-direction:column;gap:6px}
.mini-list li{display:flex;align-items:center;gap:10px;padding:5px 10px;min-height:46px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);font-size:15px;min-width:0}
.mini-list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-list li.cur{border-color:rgba(242,181,68,.5);background:rgba(242,181,68,.06)}
.mini-list li .ord{font-family:var(--f-mono);font-weight:800;color:var(--muted);width:20px;text-align:center}
.mini-list .icon-btn{width:36px;height:36px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:center;direction:rtl}
.bracket .round{display:flex;flex-direction:column;gap:10px;justify-content:space-around;height:100%}
.bracket .round h4{font-size:12px;font-family:var(--f-body);color:var(--muted);font-weight:800;text-align:center}
.match{display:flex;flex-direction:column;border-radius:10px;border:1px solid var(--line-2);overflow:hidden;background:var(--ink-2)}
.match button{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:13px;font-weight:700;text-align:start;min-height:34px;color:var(--text-2);min-width:0}
.match button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match button + button{border-top:1px solid var(--line)}
.match button:hover:not([disabled]){background:rgba(167,139,255,.08)}
.match button.w{color:var(--gold-2);background:rgba(242,181,68,.07)}
.match button.l{color:var(--muted);text-decoration:line-through}
.match button[disabled]{cursor:default}
.vbar{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:14px}
.vbar .tr{height:28px;border-radius:8px;background:var(--ink-2);border:1px solid var(--line);position:relative;overflow:hidden}
.vbar .tr i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--p,0%);background:rgba(167,139,255,.35);transition:width .4s var(--ease-out)}
.vbar .tr span{position:relative;padding-inline:10px;line-height:28px;font-weight:800;white-space:nowrap}
.vbar.win .tr i{background:rgba(242,181,68,.35)}
.vbar b{font-family:var(--f-mono);text-align:end}
.wheel{width:180px;height:180px;margin:4px auto;border-radius:50%;position:relative;border:2px solid rgba(242,181,68,.5);transition:transform 3.2s cubic-bezier(.12,.8,.18,1)}
.wheel-wrap{position:relative;width:180px;margin:0 auto}
.wheel-wrap::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top:14px solid var(--gold-2)}
.team-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.team{border-radius:12px;border:1px solid var(--line-2);background:var(--ink-2);padding:10px;min-width:0}
.team h4{font-size:14px;font-family:var(--f-body);font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.team h4 input{background:transparent;border:0;border-bottom:1px dashed var(--line-3);color:var(--text);font-weight:800;width:100%;min-width:0;padding:2px 0}
.team h4 input:focus{outline:none;border-bottom-color:var(--lilac)}
.team ul{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--text-2)}
.team li{display:flex;align-items:center;gap:6px;min-width:0}
.team li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li button{color:var(--muted);font-size:12px;font-weight:800;padding:2px 6px;border-radius:6px;min-height:28px}
.team li button:hover{color:var(--lilac-2);background:rgba(167,139,255,.08)}
.res-card{border-radius:12px;border:1px solid rgba(52,211,153,.35);background:var(--ok-bg);padding:12px 14px;font-size:15px;color:var(--text-2)}
.res-card b{color:var(--text)}
.res-card.gold{border-color:rgba(242,181,68,.4);background:rgba(242,181,68,.07)}
.activity li{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--text-2);padding:8px 0;border-bottom:1px solid var(--line)}
.activity li:last-child{border-bottom:0}
.activity .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.discover{display:flex;flex-wrap:wrap;gap:8px}
.discover button{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--panel);font-weight:700;font-size:14px;min-height:40px;color:var(--text-2)}
.discover button:hover{border-color:rgba(242,181,68,.5);color:var(--text)}
.mini-list li .nm.wrap{white-space:normal;overflow-wrap:anywhere}
.mini-list li .nm.wrap *{white-space:normal}
@media (max-width:759px){.discover.tools-index{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);padding-bottom:4px}.discover.tools-index::-webkit-scrollbar{display:none}.discover.tools-index button{flex:none}}
.discover button .ico{width:16px;height:16px;color:var(--gold)}
.vip-expired .tool-f .btn:not(.keep),.vip-expired .vq{opacity:.5;filter:grayscale(.5)}
.match .slot{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:13px;font-weight:700;min-height:34px;color:var(--muted);min-width:0}
.match .slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .slot + button,.match button + .slot,.match .slot + .slot{border-top:1px solid var(--line)}
.match .slot.w{color:var(--gold-2);background:rgba(242,181,68,.07)}
.match .slot.l{color:var(--muted);text-decoration:line-through}
.icon-spacer{width:36px;height:36px;flex:none}
.lock-banner{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-lg);border:1px solid rgba(248,113,113,.4);background:var(--err-bg)}
.lock-banner .ico{color:var(--err);width:26px;height:26px}
.lock-banner b{display:block;font-family:var(--f-display);font-size:18px}

/* حالات فارغة */
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line-2);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ico{width:40px;height:40px;color:var(--lilac)}
.empty h2{font-size:22px}
.empty p{color:var(--text-2);max-width:44ch}

.page-h{padding-top:20px;margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
@media (min-width:1024px){.page-h{padding-top:32px}}
.page-h h1{font-size:clamp(28px,6vw,40px);font-weight:900}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--text-2);min-height:40px}
.back .ico{transform:scaleX(-1)}

/* تقليل الحركة: إعداد النظام أو اختيار المستخدم */
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
html[data-motion="reduce"] .flow-signal{display:none}
html[data-motion="reduce"] .cer-scene{transition:opacity .3s!important}
</style>
