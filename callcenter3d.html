    for (var i = 0; i < hits.length; i++) {
      var o = hits[i].object;
      var pr = propHit(o);
      if (pr) return { kind: 'prop', prop: pr, label: pr.id.indexOf('box:') === 0 ? 'خذ ' + pr.label : 'خذ ' + pr.label };
      var it = o.userData.ia; if (!it) { var a = o; while (a && !it) { it = a.userData && a.userData.ia; a = a.parent; } }
      if (it && (!it.can || it.can())) return { kind: 'ia', it: it, label: it.label(), hold: it.hold ? it.hold() : 0 };
    }
    return null;
  }
  O.hoverLabel = function () { return O.hover ? O.hover.label : null; };
  function onDown() {

    return G.auth.call('progress/reset', { confirm: 'RESET' }).then(function (r) { if (r.state) Gm.applySnap(r.state); G.idb.all().then(function (a) { a.forEach(function (x) { G.idb.del(x.id); }); }); G.store.del('cc3d.notes'); Gm.toMenu('تمت إعادة ضبط تقدم مركز الاتصالات.'); });
  };

  /* ---------- الكاميرا داخل اللعبة ---------- */
  G.on('photo', function () {
    if (!S.hasCamera || G.player.mode !== 'walk' || S.phase !== 'shift') { if (S.phase === 'shift' && !S.hasCamera) G.ui.toast('ما معك كاميرا', S.effects.worldCamera ? 'الكاميرا بدرج مكتبك.' : 'تقدر تشتري «كاميرا المكتب» من المتجر.', 'camera'); return; }
    var url = G.world.snapshot(640, 360); G.audio.fx('shutter');
    G.idb.put({ id: U.uid('img'), at: Date.now(), kind: 'لقطة المكتب', url: url }).then(function () { return G.idb.trim(40); });
    G.ui.toast('لقطة', 'انحفظت بالألبوم.', 'camera', 'ok'); G.ui.highlight('photo', 'صورة للمكتب');
  });

  /* ---------- محرر الشخصيات (للمالك، يطبّق بالتدريب المحلي) ---------- */
  var baseIds = C.PERSONAS.map(function (p) { return p.id; });
  Gm.validatePersona = function (p) {
    if (!p || typeof p !== 'object') return 'لازم يكون كائن';
    if (typeof p.id !== 'string' || !/^[a-z0-9_]{2,20}$/.test(p.id)) return 'المعرف id: حروف إنجليزية صغيرة وأرقام فقط';
    if (baseIds.indexOf(p.id) >= 0) return 'المعرف مستخدم بشخصية أساسية';
    if (typeof p.name !== 'string' || !p.name.trim() || p.name.length > 30) return 'الاسم مطلوب (٣٠ حرف كحد)';
    if (typeof p.label !== 'string' || p.label.length > 40) return 'الوصف المختصر label مطلوب';
    if (['grumpy', 'rushed', 'chatty', 'sweet', 'casual', 'formal', 'techy'].indexOf(p.tone) < 0) return 'النبرة tone لازم تكون من: grumpy, rushed, chatty, sweet, casual, formal, techy';
    if (!p.traits || ['patience', 'trust', 'suspicion', 'attention', 'speed'].some(function (k) { return typeof p.traits[k] !== 'number' || p.traits[k] < 0 || p.traits[k] > 100; })) return 'traits: خمس قيم بين ٠ و١٠٠';
    if (!Array.isArray(p.openings) || p.openings.length < 1 || p.openings.some(function (o) { return typeof o !== 'string' || o.length > 160 || R.latinRatio(o) > 0.2; })) return 'openings: جملة افتتاحية عربية وحدة على الأقل';
    if (typeof p.difficulty !== 'number' || p.difficulty < 1 || p.difficulty > 5) return 'difficulty بين ١ و٥';
    if (!p.voice || typeof p.voice.tts !== 'string') return 'voice.tts اسم صوت جاهز (مثل Kore)';
    p.quirks = Array.isArray(p.quirks) ? p.quirks.filter(function (q) { return ['impatient', 'tangents', 'first_no', 'asks_why', 'forgets', 'needs_explain', 'interrupts', 'changes_topic', 'fake_convince', 'catches_contradictions', 'hold', 'haggles'].indexOf(q) >= 0; }) : [];
    p.g = p.g === 'f' ? 'f' : 'm'; p.look = p.look && typeof p.look === 'object' ? p.look : {}; p.style = String(p.style || '').slice(0, 200); p.limits = String(p.limits || '').slice(0, 200); p.archetype = 'custom';
    return null;
  };
  Gm.applyCustomPersonas = function () {
    if (!G.auth || G.auth.kind !== 'local') return;
    for (var i = C.PERSONAS.length - 1; i >= 0; i--) if (baseIds.indexOf(C.PERSONAS[i].id) < 0) C.PERSONAS.splice(i, 1);
    (G.store.get('cc3d.personas.custom', []) || []).forEach(function (p) { if (!Gm.validatePersona(p)) C.PERSONAS.push(p); });
  };

  /* ---------- الخروج ---------- */
  Gm.exit = function () {
    try { G.calls.state === 'active' && G.calls.call && G.auth.call('call/end', { callId: G.calls.call.id, reason: 'disconnect' }); } catch (e) { /* */ }
    G.mic.release(); G.audio.destroy(); if (G.auth) G.auth.destroy();
    G.loop && G.loop.stop();
    if (G.world.ready) G.world.dispose();
    if (G.device.embed) G.postParent('home');
    else if (history.length > 1) history.back(); else location.href = '/';
  };
})();

/* ===== 86-perf.js ===== */
/* الأداء: قياس زمن الإطار (مو متوسط الإطارات بس)، رصد التقطعات، وجودة تكيفية بحدود تمنع التذبذب.
   ترتيب التخفيف: دقة العرض أولاً، ثم الجودة (ظلال، تفاصيل، تحديث الموظفين البعيدين). النصوص والأزرار ما تتأثر لأنها DOM. */
(function () {
  'use strict';
  var G = window.CC;
  var P = G.perf = { frames: new Float32Array(240), i: 0, n: 0, hitches: [], quality: 'medium', start: performance.now(), lastChange: 0, changes: 0, dyn: 1, win: [] };

  P.initialQuality = function () {
    var q = G.settings.quality;
    if (q !== 'auto') return q;
    var mem = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4;
    if (G.device.mobile) return mem >= 6 && cores >= 8 ? 'medium' : 'low';
    return mem >= 8 && cores >= 8 ? 'high' : 'medium';
  };
  P.applyQuality = function () {
    var q = G.settings.quality === 'auto' ? P.quality : G.settings.quality;
    P.quality = q; P.dyn = 1; G.world.setDynScale(1); G.world.setQuality(q);
  };
  P.frame = function (ms) {
    P.frames[P.i] = ms; P.i = (P.i + 1) % P.frames.length; P.n = Math.min(P.n + 1, P.frames.length);
    var t = performance.now();
    if (ms > 50) { P.hitches.push(t); }
    while (P.hitches.length && t - P.hitches[0] > 60000) P.hitches.shift();
    P.win.push(ms);
    if (P.win.length >= 90) { evaluate(); P.win = []; }
  };
  function avg(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  var downStreak = 0, upStreak = 0;
  function evaluate() {
    if (G.settings.quality !== 'auto' || document.hidden || G.state.phase === 'menu') return;
    var a = avg(P.win.slice().sort(function (x, y) { return x - y; }).slice(0, Math.floor(P.win.length * 0.9))); // نتجاهل أسوأ ١٠٪ (تحميل لحظي)
    var target = G.device.mobile ? 33.4 : 16.9;
    if (a > target * 1.25) { downStreak++; upStreak = 0; } else if (a < target * 0.7) { upStreak++; downStreak = 0; } else { downStreak = 0; upStreak = 0; }
    var t = performance.now();
    if (downStreak >= 2) {
      downStreak = 0;
      if (P.dyn > 0.72) { P.dyn = Math.max(0.7, P.dyn - 0.1); G.world.setDynScale(P.dyn); return; }
      if (t - P.lastChange > 12000 && P.changes < 4) { var nq = P.quality === 'high' ? 'medium' : P.quality === 'medium' ? 'low' : null; if (nq) { P.quality = nq; P.dyn = 1; G.world.setQuality(nq); G.world.setDynScale(1); P.lastChange = t; P.changes++; } }
    } else if (upStreak >= 6) {
      upStreak = 0;
      if (P.dyn < 1) { P.dyn = Math.min(1, P.dyn + 0.1); G.world.setDynScale(P.dyn); return; }
      // نرفع الجودة مرة وحدة بالكثير، وبعد استقرار طويل (يمنع التذبذب)
      if (t - P.lastChange > 30000 && P.changes < 2 && P.quality === 'low' && !G.device.mobile) { P.quality = 'medium'; G.world.setQuality('medium'); P.lastChange = t; P.changes++; }
    }
  }
  P.report = function () {
    var a = Array.prototype.slice.call(P.frames, 0, P.n).sort(function (x, y) { return x - y; });
    var pct = function (q) { return a.length ? a[Math.min(a.length - 1, Math.floor(q * a.length))].toFixed(1) : '-'; };
    var info = G.world.ready ? G.world.drawInfo() : {};
    return { quality: P.quality, fps: a.length ? Math.round(1000 / (a.reduce(function (s, v) { return s + v; }, 0) / a.length)) : 0, p50: pct(0.5), p95: pct(0.95), hitches: P.hitches.length, calls: info.calls || 0, tris: info.tris || 0, geos: info.geos || 0, texs: info.texs || 0,
      heap: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null, dpr: ((G.world.pixelRatio || 1) * P.dyn).toFixed(2), session: (performance.now() - P.start) / 1000 };
  };
})();

/* ===== 90-main.js ===== */
/* التشغيل: تحميل حقيقي بخطوات (خطوط ← محرك ← بناء المكتب ← تجهيز الظلال ← المرجع)، ثم القائمة فوق المشهد الحي.
   حلقة رسم وحدة، تتوقف بالخلفية، والحركة مربوطة بالوقت المنقضي. */
(function () {
  'use strict';
  var G = window.CC, U = G.U;
  var THREE_SRC = window.CC_THREE_SRC || 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  var BGU_SRC = window.CC_BGU_SRC || 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js';

  function loadScript(src, timeout) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script'); s.src = src; s.async = true; s.crossOrigin = 'anonymous';
      var t = setTimeout(function () { reject(new Error('timeout')); }, timeout || 20000);
      s.onload = function () { clearTimeout(t); resolve(); }; s.onerror = function () { clearTimeout(t); reject(new Error('load')); };
      document.head.appendChild(s);
    });
  }
  function frameYield() { return new Promise(function (r) { requestAnimationFrame(function () { setTimeout(r, 0); }); }); }
  function webglOk() { try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; } }

  /* ---------- الحلقة ---------- */
  var loop = G.loop = { raf: 0, last: 0, running: false, t: 0, fpsAcc: 0, fpsN: 0, menuOrbit: 0 };
  loop.start = function () { if (loop.running) return; loop.running = true; loop.last = performance.now(); loop.raf = requestAnimationFrame(tick); };
  loop.stop = function () { loop.running = false; cancelAnimationFrame(loop.raf); };
  function tick(now) {
    if (!loop.running) return;
    loop.raf = requestAnimationFrame(tick);
    var raw = now - loop.last; loop.last = now;
    var dt = Math.min(0.1, raw / 1000); loop.t += dt;
    var S = G.state;
    // القائمة: دوران هادئ للكاميرا وتحديث أقل (توفير بطارية)
    if (S.phase === 'menu' || S.phase === 'boot' || S.phase === 'intro' || S.phase === 'between') {
      loop.skip = (loop.skip || 0) + 1; if (loop.skip % 2) return;
      loop.menuOrbit += dt * (G.settings.reduceMotion ? 0.01 : 0.05);
      var cam = G.world.camera, a = loop.menuOrbit, MC = G.world.MENU_CAM;
      cam.position.set(MC.cx + Math.cos(a) * MC.r, MC.y, MC.cz + Math.sin(a) * MC.ry); cam.lookAt(MC.look.x, MC.look.y, MC.look.z);
      G.world.update(dt * 2, loop.t); G.world.render();
      return;
    }
    if (!S.paused) {
      G.player.update(dt);
      G.office.update(dt);
      G.calls.update(dt);
      G.game.update(dt);
    } else G.player.update(0);
    G.world.update(S.paused ? 0 : dt, loop.t);
    // جالس وواجهة الكمبيوتر مغطية الشاشة: نرسم أبطأ (المشهد خلفها مو ظاهر)
    var seatedFull = G.player.mode === 'seated' && G.os.on && G.os.full;
    loop.sk = (loop.sk || 0) + 1;
    if (!seatedFull || loop.sk % 4 === 0) G.world.render();
    if (G.world.tick % 15 === 0) { G.ui.updateHud(); G.os.clock(G.game.clockLabel()); G.world.updateClock(G.game.clockMinutes()); if (G.player.mode !== 'seated') G.world.updateMyScreen(G.game.clockLabel()); }
    G.perf.frame(raw);
    if (G.settings.showFps && G.world.tick % 30 === 0) { var r = G.perf.report(); var f = document.getElementById('cc-fps'); f.hidden = false; f.textContent = r.fps + ' fps · p95 ' + r.p95 + 'ms · ' + r.quality + ' · ' + r.calls + ' dc'; }
  }

  /* ---------- أزرار الجوال والعامة ---------- */
  function bindUi() {
    document.getElementById('cc-pause-btn').onclick = function () { G.game.pause(); };
    var act = document.getElementById('tb-act');
    act.addEventListener('pointerdown', function (e) { e.preventDefault(); G.office.mobileAct(true); });
    act.addEventListener('pointerup', function () { G.office.mobileAct(false); });
    act.addEventListener('pointercancel', function () { G.office.mobileAct(false); });
    document.getElementById('tb-sit').onclick = function () {
      if (G.player.mode === 'seated') G.game.standUp();
      else if (G.player.mode === 'walk') { if (G.player.distTo(G.world.PLAYER_DESK.x, G.world.PLAYER_DESK.z + 0.6) < 2.2) G.game.sitDown(); else G.ui.toast('الكمبيوتر', 'امشِ لمكتبك أول: آخر مكتب بالصف القريب من الاستقبال.', 'desktop'); }
    };
    document.getElementById('tb-call').onclick = function () { var st = G.calls.state; if (st === 'ringing') G.calls.answer(); else { var d = document.getElementById('cc-dock'); if (st !== 'idle') { d.hidden = false; d.classList.remove('min'); } else G.ui.toast('الهاتف', 'ما فيه مكالمة الحين.', 'phone'); } };
    var mic = document.getElementById('tb-mic');
    mic.addEventListener('pointerdown', function (e) { e.preventDefault(); G.emit('ptt-down'); });
    mic.addEventListener('pointerup', function () { G.emit('ptt-up'); });
    mic.addEventListener('pointercancel', function () { G.emit('ptt-up'); });
    G.on('typing', function (on) { G.player.keys = {}; });
    G.on('seated', function () { var b = document.getElementById('tb-sit'); b.querySelector('small').textContent = 'قوم'; });
    G.on('call-render', function () { var b = document.getElementById('tb-sit'); if (G.player.mode !== 'seated') b.querySelector('small').textContent = 'الكمبيوتر'; });
    window.addEventListener('resize', function () { G.world.resize(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (G.state.phase === 'shift' || G.state.phase === 'review_call') G.game.pause(); G.audio.suspend(); loop.stop(); }
      else { G.audio.resume(); loop.start(); }
    });
    window.addEventListener('pagehide', function () { G.mic.release(); });
    G.on('ctx-lost', function () { if (G.state.phase === 'shift') G.game.pause(); G.ui.toast('الرسوميات توقفت', 'المتصفح أوقف كرت الشاشة مؤقتاً. نحاول نرجعه تلقائياً، وتقدمك محفوظ.', 'warning', 'bad'); });
    G.on('ctx-restored', function () { G.ui.toast('رجعت الرسوميات', 'كمّل من الإيقاف المؤقت.', 'check-circle', 'ok'); });
    // إعدادات الموقع الأم ممكن توصل بعد الإقلاع: نحدّث القائمة عشان خيار المحادثة الحية يظهر صح
    G.on('host', function () { if (G.state.phase === 'menu' && !document.getElementById('cc-modal')) G.game.toMenu(); });
    G.on('restored', function (r) { if (r && r.state) G.game.applySnap(r.state); G.ui.toast('اتصال جديد بالخادم', G.C.STRINGS.reloadRestore, 'arrow-counter-clockwise'); });
    if (G.device.touch && window.innerHeight > window.innerWidth) G.ui.toast('نصيحة', 'لف الجوال بالعرض لتجربة أوسع. اللعبة تشتغل بالوضعين.', 'device-rotate');
  }

  /* ---------- الإقلاع ---------- */
  function boot() {
    G.applyA11y();
    G.ui.loading(0.04, 'تجهيز الخطوط العربية...');
    var fonts = document.fonts && document.fonts.load ? Promise.race([Promise.all(['900 64px Cairo', '800 32px Cairo', '700 16px Tajawal'].map(function (f) { return document.fonts.load(f); })), U.wait(2500)]) : Promise.resolve();
    fonts.then(function () {
      G.ui.loading(0.18, 'تحميل محرك الرسوم...');
      if (!webglOk()) throw { kind: 'webgl' };
      return window.THREE ? null : loadScript(THREE_SRC, 25000);
    }).then(function () {
      G.ui.loading(0.4, 'تحميل أدوات الدمج...');
      return window.THREE && window.THREE.BufferGeometryUtils ? null : loadScript(BGU_SRC, 15000);
    }).then(frameYield).then(function () {
      G.ui.loading(0.55, 'بناء المكتب والخامات...');
      return frameYield();
    }).then(function () {
      var q = G.perf.initialQuality(); G.perf.quality = q;
      var r = G.world.init(document.getElementById('cc-stage'), q);
      if (!r.ok) throw { kind: 'webgl' };
      G.world.setQuality(q);
      G.ui.loading(0.75, 'تجهيز الإضاءة والظلال...');
      return frameYield();
    }).then(function () {
      try { G.world.renderer.compile(G.world.scene, G.world.camera); } catch (e) { /* */ }
      G.player.init(); G.office.init(); G.os.mount(); bindUi();
      G.world.updateBoard({ day: 1, earned: 0, quota: G.C.DAYS[0].quota, left: G.C.DAYS[0].duration, rank: G.C.rankFor(1), power: true });
      G.ui.loading(0.88, 'تجهيز الحفظ والمحادثة...');
      return G.idb.open();
    }).then(function () {
      return G.game.makeAuthority(G.settings.mode);
    }).then(function (r) {
      G.state.restoreNote = r.restoreNote;
      G.state.phase = 'menu';
      loop.start();
      var note = r.note || (r.restoreNote === 'invalid_save' ? 'ملف الحفظ غير صالح وتم تجاهله. بدأنا من آخر حالة سليمة.' : r.restoreNote === 'restored_day' ? 'لقينا يوم شغال محفوظ. تقدر تكمله من آخر نقطة حفظ.' : null);
      G.game.toMenu(note);
      G.postParent('ready');
    }).catch(function (e) {
      console.error(e);
      if (e && e.kind === 'webgl') G.ui.fatal('جهازك ما يدعم الرسوم ثلاثية الأبعاد', 'اللعبة تحتاج WebGL. جرب متصفح حديث (كروم، سفاري، فايرفوكس) وتأكد إن تسريع الرسوم مفعّل.', null);
      else G.ui.fatal('تعذر تحميل اللعبة', 'ما قدرنا نحمّل محرك الرسوم. تأكد من الإنترنت وجرب مرة ثانية.', function () { location.reload(); });
    });
  }
  // نطلب إعدادات الموقع الأم قبل الإقلاع (لو داخل احسمها)
  G.postParent('hello');
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
