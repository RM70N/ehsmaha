<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مركز الاتصالات 3D | احسمها</title>
<meta name="description" content="لعبة فردية ثلاثية الأبعاد من احسمها: مركز اتصالات خيالي ساخر، مكالمات حرة مع متصلين، كمبيوتر وتطبيقات، أحداث مفاجئة وتقييم مدير.">
<meta name="theme-color" content="#0b0518">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* احسمها | مركز الاتصالات — أنماط اللعبة.
   قاعدة الأشكال: أزرار 8px، نوافذ الكمبيوتر 10px، بطاقات 14px، شارات HUD حبة كاملة.
   لون التمييز الوحيد: بنفسجي احسمها. باقي الواجهات محايدة (غرافيت) عشان المكتب ما يصير كله بنفسجي.
   كل الأنماط تحت #cc ومعزولة. */
:root{
  --cc-bg:#0b0518;--cc-bg2:#120a22;--cc-surface:#1a1030;--cc-surface2:#231740;--cc-line:rgba(167,139,255,.18);--cc-line2:rgba(167,139,255,.34);
  --cc-text:#EDE9FF;--cc-muted:#B2A6D8;--cc-accent:#7C3AED;--cc-accent2:#A78BFF;--cc-accent-ink:#14071f;
  --cc-ok:#34D399;--cc-warn:#FBBF24;--cc-bad:#F87171;--cc-cyan:#22D3EE;
  --os-bg:#14121a;--os-panel:#1c1925;--os-panel2:#262233;--os-panel3:#302b40;--os-line:rgba(255,255,255,.09);--os-line2:rgba(255,255,255,.16);--os-text:#ECEAF2;--os-muted:#ABA6BC;--os-accent:#8B5CF6;--os-accent-soft:rgba(139,92,246,.18);
  --r-btn:8px;--r-win:10px;--r-card:14px;--r-pill:999px;
  --font:'Tajawal',system-ui,sans-serif;--font-brand:'Cairo','Tajawal',system-ui,sans-serif;--mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --fs:1;
}
html,body{margin:0;height:100%;background:var(--cc-bg);color:var(--cc-text);overflow:hidden;font-family:var(--font);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
#cc{position:fixed;inset:0;height:100dvh;overflow:hidden;direction:rtl;isolation:isolate;-webkit-tap-highlight-color:transparent;font-size:calc(15px * var(--fs))}
#cc [hidden]{display:none!important}
#cc button,#cc input,#cc textarea,#cc select{font-family:inherit;font-size:inherit;color:inherit}
#cc button{cursor:pointer;touch-action:manipulation}
#cc button:disabled{cursor:not-allowed}
#cc :focus-visible{outline:2px solid var(--cc-accent2);outline-offset:2px}
.cc-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cc-num{font-variant-numeric:tabular-nums}
.cc-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ph{line-height:1;vertical-align:-.12em}

/* ---------- المسرح ---------- */
.cc-stage{position:absolute;inset:0;z-index:0;direction:ltr}
.cc-stage canvas{display:block;width:100%!important;height:100%!important;touch-action:none;outline:none}
.cc-vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 95% at 50% 50%,transparent 62%,rgba(8,4,16,.45) 100%)}
.cc-dim{position:absolute;inset:0;z-index:1;pointer-events:none;background:#05030a;opacity:0;transition:opacity .45s var(--ease)}
.cc-dim.on{opacity:.82}
.cc-smoke{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(80% 70% at 50% 60%,rgba(120,110,100,.0),rgba(90,84,80,.55));opacity:0;transition:opacity 1.2s}
.cc-smoke.on{opacity:1}
.cc-alarm{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 120px 18px rgba(248,113,113,.45);opacity:0}
.cc-alarm.on{animation:cc-alarm 1s steps(2) infinite}
@keyframes cc-alarm{50%{opacity:1}}
.cc-crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(0,0,0,.35);z-index:3;pointer-events:none;transition:transform .15s var(--ease)}
.cc-crosshair.hot{transform:scale(1.8);background:#fff}

/* ---------- عام: أزرار ---------- */
.cc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-btn);border:1px solid var(--cc-line2);background:var(--cc-surface2);color:var(--cc-text);font-weight:700;transition:transform .12s var(--ease),background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.cc-btn:hover{border-color:var(--cc-accent2)}
.cc-btn:active{transform:translateY(1px) scale(.985)}
.cc-btn.primary{background:var(--cc-accent);border-color:transparent;color:#fff}
.cc-btn.primary:hover{background:#8b4ef5}
.cc-btn.ghost{background:transparent}
.cc-btn.danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.5);color:#fecaca}
.cc-btn.ok{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);color:#bbf7d0}
.cc-btn.sm{min-height:36px;padding:0 12px;font-size:.9em}
.cc-btn:disabled{opacity:.45}
.cc-btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-inline-end-color:transparent;animation:cc-spin .8s linear infinite}
@keyframes cc-spin{to{transform:rotate(360deg)}}
.cc-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--cc-line);background:rgba(18,10,34,.78);font-weight:700;font-size:.85em;white-space:nowrap}
.cc-chip.warn{border-color:rgba(251,191,36,.5);color:#fde68a}
.cc-chip.bad{border-color:rgba(248,113,113,.5);color:#fecaca}
.cc-chip.ok{border-color:rgba(52,211,153,.5);color:#bbf7d0}
.cc-chip.acc{border-color:var(--cc-line2);color:var(--cc-accent2)}

/* ---------- الشاشات الكاملة (تحميل، قائمة، بداية يوم) ---------- */
.cc-screen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) calc(16px + var(--sar)) calc(20px + var(--sab)) calc(16px + var(--sal));background:rgba(9,5,18,.72);overflow:auto}
.cc-screen.solid{background:radial-gradient(900px 520px at 85% -10%,rgba(124,58,237,.28),transparent 60%),radial-gradient(700px 420px at 0% 110%,rgba(34,211,238,.08),transparent 60%),var(--cc-bg)}
.cc-panel{width:100%;max-width:560px;background:linear-gradient(170deg,rgba(28,18,50,.96),rgba(17,10,32,.96));border:1px solid var(--cc-line);border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:0 40px 90px -40px #000;animation:cc-rise .38s var(--ease) both}
@keyframes cc-rise{from{opacity:0;transform:translateY(12px)}}
.cc-panel h1,.cc-panel h2{font-family:var(--font-brand);margin:0;line-height:1.3}
.cc-panel h1{font-size:clamp(26px,4.4vw,36px);font-weight:900}
.cc-panel h2{font-size:22px;font-weight:900}
.cc-panel p{margin:8px 0 0;color:var(--cc-muted);line-height:1.75}
.cc-brand{font-family:var(--font-brand);font-weight:800;color:var(--cc-accent2);font-size:15px}
.cc-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cc-col{display:flex;flex-direction:column;gap:10px}
.cc-sep{height:1px;background:var(--cc-line);margin:16px 0;border:0}

/* القائمة الرئيسية: تقسيم غير متماثل (مشهد يسار، أوامر يمين) */
.cc-menu{width:100%;max-width:1080px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(16px,3vw,36px);align-items:center}
.cc-menu-art{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--cc-line);aspect-ratio:16/11;background:#120c1c}
.cc-menu-art canvas{width:100%;height:100%;display:block}
.cc-menu-art .cap{position:absolute;inset-inline:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.cc-menu-cmds{display:flex;flex-direction:column;gap:12px}
.cc-menu-cmds h1{font-family:var(--font-brand);font-size:clamp(30px,5vw,48px);font-weight:900;line-height:1.15;margin:0}
.cc-menu-cmds .lead{color:var(--cc-muted);line-height:1.75;margin:0;max-width:44ch}
.cc-mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.cc-mode button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:64px;padding:10px 14px;border-radius:var(--r-btn);border:1px solid var(--cc-line);background:rgba(26,16,48,.6);text-align:start}
.cc-mode button b{font-weight:800}
.cc-mode button small{color:var(--cc-muted);font-size:.82em;line-height:1.5}
.cc-mode button[aria-pressed="true"]{border-color:var(--cc-accent2);background:rgba(124,58,237,.18)}
.cc-mode button:disabled{opacity:.5}
.cc-note{font-size:.84em;color:var(--cc-muted);line-height:1.7;padding:10px 12px;border-radius:var(--r-btn);background:rgba(255,255,255,.03);border:1px solid var(--cc-line)}
@media (max-width:820px){.cc-menu{grid-template-columns:1fr}.cc-menu-art{aspect-ratio:16/8;order:-1}}

/* التحميل */
.cc-load{width:100%;max-width:420px;text-align:center}
.cc-load .bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);overflow:hidden;margin:18px 0 10px}
.cc-load .bar i{display:block;height:100%;width:0;background:var(--cc-accent2);transition:width .25s var(--ease)}
.cc-load .step{color:var(--cc-muted);font-size:.9em;min-height:1.6em}

/* بطاقة بداية اليوم */
.cc-dayintro{max-width:620px}
.cc-dayintro .num{font-family:var(--font-brand);font-size:15px;color:var(--cc-accent2);font-weight:800}
.cc-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.cc-fact{padding:12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--cc-line)}
.cc-fact span{display:block;color:var(--cc-muted);font-size:.8em}
.cc-fact b{display:block;font-family:var(--font-brand);font-size:1.25em;margin-top:2px}
.cc-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
@media (max-width:560px){.cc-facts{grid-template-columns:1fr 1fr}}

/* ---------- HUD ---------- */
.cc-hud{position:absolute;inset:0;z-index:10;pointer-events:none}
.cc-top{position:absolute;top:calc(10px + var(--sat));inset-inline:calc(12px + var(--sar)) calc(12px + var(--sal));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-top>*{pointer-events:auto}
.cc-goal{min-width:230px;max-width:340px;padding:10px 12px;border-radius:14px;background:rgba(14,8,26,.82);border:1px solid var(--cc-line);backdrop-filter:blur(6px)}
.cc-goal .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.cc-goal .l1 small{color:var(--cc-muted);font-weight:700}
.cc-goal .track{position:relative;height:8px;margin-top:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);overflow:hidden}
.cc-goal .track i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--cc-ok);border-radius:inherit;transition:width .6s var(--ease)}
.cc-goal .track i.pulse{animation:cc-pulse .7s var(--ease)}
@keyframes cc-pulse{50%{filter:brightness(1.6)}}
.cc-goal .l2{display:flex;justify-content:space-between;margin-top:6px;font-size:.82em;color:var(--cc-muted)}
.cc-clock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cc-clock .t{font-family:var(--font-brand);font-weight:900;font-size:1.15em}
.cc-iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--cc-line);background:rgba(14,8,26,.82);font-size:20px}
.cc-prompt{position:absolute;left:50%;bottom:calc(120px + var(--sab));transform:translateX(-50%);padding:8px 14px;border-radius:var(--r-pill);background:rgba(14,8,26,.86);border:1px solid var(--cc-line2);font-weight:800;white-space:nowrap;opacity:0;transition:opacity .15s}
.cc-prompt.on{opacity:1}
.cc-prompt kbd{display:inline-block;min-width:26px;padding:2px 6px;margin-inline-end:8px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-family:var(--font);font-weight:800;direction:ltr}
.cc-hold{position:absolute;left:50%;top:calc(50% + 26px);width:120px;height:6px;margin-left:-60px;border-radius:var(--r-pill);background:rgba(255,255,255,.15);overflow:hidden}
.cc-hold i{display:block;height:100%;width:0;background:#fff}
.cc-captions{position:absolute;inset-inline:0;bottom:calc(64px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.cc-cap{max-width:min(720px,92vw);padding:7px 14px;border-radius:12px;background:rgba(6,3,12,.78);font-weight:700;line-height:1.6;text-align:center;animation:cc-rise .25s var(--ease)}
.cc-cap b{color:var(--cc-accent2)}
.cc-toasts{position:absolute;top:calc(84px + var(--sat));inset-inline-end:calc(12px + var(--sal));display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 24px));pointer-events:none}
.cc-toast{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(14,8,26,.92);border:1px solid var(--cc-line);line-height:1.6;animation:cc-slide .28s var(--ease);pointer-events:auto}
.cc-toast i.ph{font-size:20px;margin-top:2px}
.cc-toast.warn{border-color:rgba(251,191,36,.45)}.cc-toast.warn i.ph{color:var(--cc-warn)}
.cc-toast.bad{border-color:rgba(248,113,113,.45)}.cc-toast.bad i.ph{color:var(--cc-bad)}
.cc-toast.ok{border-color:rgba(52,211,153,.45)}.cc-toast.ok i.ph{color:var(--cc-ok)}
.cc-toast b{display:block}
.cc-toast small{color:var(--cc-muted)}
@keyframes cc-slide{from{opacity:0;transform:translateY(-8px)}}
.cc-float{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--font-brand);font-weight:900;font-size:28px;color:var(--cc-ok);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;animation:cc-floatup 1.4s var(--ease) forwards}
.cc-float.bad{color:var(--cc-bad)}
@keyframes cc-floatup{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.cc-fps{position:absolute;bottom:calc(8px + var(--sab));inset-inline-start:calc(8px + var(--sar));font:700 11px var(--mono);color:#cbd5e1;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:6px;direction:ltr;pointer-events:none}

/* ---------- لوحة المكالمة (نفس المكون داخل نافذة الهاتف أو عائمة أثناء المشي) ---------- */
.cc-dock{position:absolute;inset-inline-start:calc(12px + var(--sar));bottom:calc(12px + var(--sab));width:min(400px,calc(100vw - 24px));max-height:min(62vh,560px);display:flex;flex-direction:column;border-radius:16px;background:rgba(16,12,24,.94);border:1px solid var(--os-line2);box-shadow:0 30px 70px -30px #000;pointer-events:auto;overflow:hidden}
.cc-dock.min .cp-body{display:none}
.cp{display:flex;flex-direction:column;min-height:0;height:100%;color:var(--os-text)}
.cp-head{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--os-line)}
.cp-av{width:44px;height:44px;border-radius:12px;flex:none;background:#2a2536;overflow:hidden}
.cp-av canvas{width:100%;height:100%;display:block}
.cp-who{min-width:0;flex:1}
.cp-who b{display:block;font-weight:800}
.cp-who small{display:block;color:var(--os-muted);font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-mood{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--os-line);font-size:.8em}
.cp-pat{flex:1;min-width:110px;display:flex;align-items:center;gap:6px;color:var(--os-muted)}
.cp-pat .tr{flex:1;height:6px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);overflow:hidden}
.cp-pat .tr i{display:block;height:100%;background:var(--cc-cyan);transition:width .4s var(--ease)}
.cp-body{display:flex;flex-direction:column;min-height:0;flex:1}
.cp-log{flex:1;min-height:120px;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.cp-msg{max-width:88%;padding:8px 11px;border-radius:12px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.cp-msg.c{align-self:flex-start;background:var(--os-panel3);border-start-start-radius:4px}
.cp-msg.p{align-self:flex-end;background:rgba(139,92,246,.22);border-start-end-radius:4px}
.cp-msg.sys{align-self:center;max-width:96%;background:transparent;border:1px dashed var(--os-line2);color:var(--os-muted);font-size:.85em;text-align:center}
.cp-msg.sys.good{border-color:rgba(52,211,153,.45);color:#bbf7d0}
.cp-msg.sys.badx{border-color:rgba(248,113,113,.45);color:#fecaca}
.cp-msg .meta{display:block;font-size:.72em;color:var(--os-muted);margin-top:2px}
.cp-msg.pending{opacity:.6}
.cp-typing{align-self:flex-start;display:inline-flex;gap:4px;padding:10px 12px;border-radius:12px;background:var(--os-panel3)}
.cp-typing i{width:6px;height:6px;border-radius:50%;background:var(--os-muted);animation:cc-dot 1s infinite}
.cp-typing i:nth-child(2){animation-delay:.15s}.cp-typing i:nth-child(3){animation-delay:.3s}
@keyframes cc-dot{50%{opacity:.25;transform:translateY(-2px)}}
.cp-status{padding:6px 12px;font-size:.8em;color:var(--os-muted);min-height:26px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--os-line)}
.cp-status.err{color:#fecaca}
.cp-in{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + var(--sab));border-top:1px solid var(--os-line);background:rgba(0,0,0,.18)}
.cp-in textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:10px 12px;border-radius:10px;border:1px solid var(--os-line2);background:var(--os-panel);line-height:1.5;font-size:16px}
.cp-in textarea:focus{border-color:var(--os-accent);outline:none}
.cp-mic{position:relative;width:48px;height:48px;border-radius:12px;border:1px solid var(--os-line2);background:var(--os-panel2);font-size:22px;flex:none}
.cp-mic .lvl{position:absolute;inset-inline:6px;bottom:5px;height:3px;border-radius:2px;background:var(--cc-ok);transform-origin:right;transform:scaleX(0)}
.cp-mic.rec{border-color:var(--cc-bad);background:rgba(248,113,113,.18)}
.cp-mic.busy{opacity:.7}
.cp-send{width:48px;height:48px;border-radius:12px;border:0;background:var(--os-accent);color:#fff;font-size:22px;flex:none}
.cp-actions{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.cp-incoming{padding:16px;text-align:center}
.cp-incoming .ring{font-size:34px;color:var(--cc-ok);animation:cc-ring 1s infinite}
@keyframes cc-ring{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}}
.cp-badge{font-size:.72em;padding:2px 8px;border-radius:var(--r-pill);background:rgba(251,191,36,.14);color:#fde68a;border:1px solid rgba(251,191,36,.35)}

/* ---------- نظام الكمبيوتر داخل اللعبة (احسمها OS) ---------- */
.os{position:absolute;z-index:20;display:flex;flex-direction:column;background:var(--os-bg);color:var(--os-text);border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px -20px rgba(0,0,0,.9);opacity:0;pointer-events:none;transition:opacity .22s var(--ease);font-size:calc(14px * var(--fs))}
.os.on{opacity:1;pointer-events:auto}
.os.full{inset:calc(var(--sat)) calc(var(--sar)) calc(var(--sab)) calc(var(--sal))!important;width:auto!important;height:auto!important;border-radius:0}
.os.off .os-desk,.os.off .os-bar{visibility:hidden}
.os.off::after{content:'الجهاز مطفي';position:absolute;inset:0;display:grid;place-items:center;color:#57536a;font-weight:800;background:#060509}
.os-desk{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(700px 400px at 90% 10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(500px 300px at 0% 100%,rgba(34,211,238,.06),transparent 60%),#14121a}
.os-desk::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 1px,transparent 1px 26px);pointer-events:none}
.os-icons{position:absolute;inset:12px;display:grid;grid-template-columns:repeat(auto-fill,88px);grid-auto-rows:92px;gap:6px;align-content:start}
.os-ic{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid transparent;background:transparent;padding:6px;text-align:center}
.os-ic:hover{background:rgba(255,255,255,.05);border-color:var(--os-line)}
.os-ic .g{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--os-panel2);border:1px solid var(--os-line2);font-size:24px;color:#d9d4ea}
.os-ic.k-call .g{color:#86efac}.os-ic.k-mail .g{color:#93c5fd}.os-ic.k-tx .g{color:#fcd34d}.os-ic.k-files .g{color:#fdba74}.os-ic.k-remote .g{color:#67e8f9}.os-ic.k-av .g{color:#fca5a5}.os-ic.k-store .g{color:#c4b5fd}
.os-ic span{font-size:.8em;line-height:1.3;color:#e5e1f0}
.os-ic.locked{opacity:.5}
.os-ic .lock{position:absolute;top:6px;inset-inline-start:14px;font-size:14px;color:var(--os-muted)}
.os-ic .dot{position:absolute;top:4px;inset-inline-end:14px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--cc-bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.os-bar{flex:none;height:42px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#0f0d14;border-top:1px solid var(--os-line)}
.os-bar .start{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--os-line2);background:var(--os-panel);font-weight:800;font-size:.85em}
.os-tasks{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.os-tasks button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;font-size:.82em;white-space:nowrap;color:var(--os-muted)}
.os-tasks button.act{background:var(--os-panel2);border-color:var(--os-line2);color:var(--os-text)}
.os-tasks button.minz{opacity:.6}
.os-tray{display:flex;align-items:center;gap:8px;font-size:.82em;color:var(--os-muted)}
.os-tray .clock{font-weight:800;color:var(--os-text)}
.os-tray #os-goal{white-space:nowrap}
@media (max-width:700px){.os-tray #os-goal{display:none}.os-bar .start span{display:none}.os-bar .start{padding:0 8px}}
.os-win{position:absolute;display:flex;flex-direction:column;min-width:280px;min-height:200px;background:var(--os-panel);border:1px solid var(--os-line2);border-radius:var(--r-win);box-shadow:0 24px 60px -24px rgba(0,0,0,.85);overflow:hidden;animation:cc-winin .18s var(--ease)}
@keyframes cc-winin{from{opacity:0;transform:scale(.98)}}
.os-win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.os-win.frozen .os-wb{filter:grayscale(1) brightness(.7);pointer-events:none}
.os-win.frozen::after{content:'البرنامج لا يستجيب. افتح «إدارة المهام» من الشريط.';position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.8);font-weight:800;text-align:center}
.os-wt{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 10px;background:var(--os-panel2);border-bottom:1px solid var(--os-line);cursor:grab;touch-action:none;user-select:none}
.os-wt b{flex:1;font-size:.88em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os-wt button{width:34px;height:30px;border-radius:7px;border:0;background:transparent;color:var(--os-muted);font-size:16px}
.os-wt button:hover{background:rgba(255,255,255,.08);color:var(--os-text)}
.os-wt button.x:hover{background:#b91c1c;color:#fff}
.os-wb{flex:1;min-height:0;overflow:auto;padding:12px}
.os-win.np .os-wb{padding:0}
.os-rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,rgba(255,255,255,.18) 55% 62%,transparent 62% 72%,rgba(255,255,255,.18) 72% 79%,transparent 79%)}
.os-menu{position:absolute;bottom:46px;inset-inline-end:8px;width:260px;max-height:70%;overflow:auto;padding:8px;border-radius:12px;background:var(--os-panel);border:1px solid var(--os-line2);box-shadow:0 20px 50px -20px #000;z-index:50}
.os-menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;text-align:start}
.os-menu button:hover{background:rgba(255,255,255,.06)}
.os-notes{position:absolute;bottom:50px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px;width:min(320px,80%);z-index:60;pointer-events:none}
.os-note{padding:9px 11px;border-radius:10px;background:#211d2c;border:1px solid var(--os-line2);font-size:.85em;line-height:1.55;animation:cc-slide .2s var(--ease);pointer-events:auto}
.os-note b{display:block;font-size:.95em}
.os-popup{position:absolute;width:230px;background:#fef9c3;color:#1c1917;border:2px solid #a16207;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:70;animation:cc-winin .12s}
.os-popup .h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:#facc15;font-weight:900;font-size:.8em}
.os-popup .b{padding:10px;font-weight:700;line-height:1.5}
.os-popup input{width:100%;margin-top:6px;padding:6px 8px;border:1px solid #a16207;border-radius:6px;background:#fff;color:#111;font-size:16px}

/* عناصر مشتركة داخل التطبيقات */
.ap{display:flex;flex-direction:column;gap:12px;color:var(--os-text)}
.ap h3{margin:0;font-family:var(--font-brand);font-size:1.05em;font-weight:800}
.ap p{margin:0;color:var(--os-muted);line-height:1.7}
.ap .card{padding:12px;border-radius:12px;background:var(--os-panel2);border:1px solid var(--os-line)}
.ap .muted{color:var(--os-muted)}
.ap label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9em}
.ap input[type=text],.ap input[type=number],.ap textarea,.ap select{padding:10px 12px;border-radius:9px;border:1px solid var(--os-line2);background:var(--os-bg);color:var(--os-text);font-size:16px;min-height:44px}
.ap input:focus,.ap textarea:focus,.ap select:focus{border-color:var(--os-accent);outline:none}
.ap .err{color:#fecaca;font-size:.85em}
.ap .okk{color:#bbf7d0;font-size:.85em}
.ap .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ap .split{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:10px;min-height:0}
.ap .list{display:flex;flex-direction:column;gap:4px}
.ap .li{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;border:1px solid transparent;background:transparent;text-align:start}
.ap .li:hover{background:rgba(255,255,255,.04)}
.ap .li.sel{background:var(--os-accent-soft);border-color:rgba(139,92,246,.4)}
.ap .li small{color:var(--os-muted);display:block;font-size:.78em}
.ap .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-pill);font-size:.75em;font-weight:800;border:1px solid var(--os-line2);color:var(--os-muted)}
.ap .tag.ok{color:#bbf7d0;border-color:rgba(52,211,153,.4)}.ap .tag.warn{color:#fde68a;border-color:rgba(251,191,36,.4)}.ap .tag.bad{color:#fecaca;border-color:rgba(248,113,113,.4)}.ap .tag.acc{color:#ddd6fe;border-color:rgba(139,92,246,.5)}
.ap .steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ap .steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--os-line)}
.ap .steps li.cur{border-color:rgba(139,92,246,.55);background:var(--os-accent-soft)}
.ap .steps li.done{opacity:.7}
.ap .steps li i.ph{font-size:18px;margin-top:2px}
.ap .steps li.done i.ph{color:var(--cc-ok)}
.ap .order{display:flex;flex-direction:column;gap:6px}
.ap .order .it{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--os-bg);border:1px solid var(--os-line2)}
.ap .order .it b{flex:1}
.ap .order .it .n{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:var(--os-panel3);font-weight:800}
.ap .opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--os-line2);background:var(--os-bg);font:700 18px var(--mono);letter-spacing:.06em}
.ap .opt[aria-pressed="true"]{border-color:var(--os-accent);background:var(--os-accent-soft)}
.ap .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ap .field{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1px dashed var(--os-line2);background:repeating-linear-gradient(45deg,#3a3446 0 6px,#332e3f 6px 12px)}
.ap .field.rev{background:var(--os-bg);border-style:solid;border-color:rgba(52,211,153,.5)}
.ap .field i.ph{font-size:24px}
.ap table{width:100%;border-collapse:collapse;font-size:.9em}
.ap th,.ap td{padding:8px;border-bottom:1px solid var(--os-line);text-align:start;vertical-align:top}
.ap th{color:var(--os-muted);font-weight:700}
.ap .folders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ap .folder{min-height:84px;padding:8px;border-radius:10px;border:1px solid var(--os-line2);background:var(--os-bg);display:flex;flex-direction:column;gap:4px}
.ap .folder.target{border-color:var(--os-accent);background:var(--os-accent-soft)}
.ap .folder .fh{display:flex;gap:6px;align-items:center;font-weight:800;font-size:.9em}
.ap .file{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;border:1px solid var(--os-line);background:var(--os-panel2);font:600 .82em var(--mono);direction:ltr;text-align:left}
.ap .file.sel{border-color:var(--os-accent);background:var(--os-accent-soft)}
.ap .file.hint{box-shadow:0 0 0 2px rgba(52,211,153,.6)}
.ap .shopit{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px;border-radius:12px;background:var(--os-panel2);border:1px solid var(--os-line)}
.ap .shopit .pr{font-family:var(--font-brand);font-weight:900}
.ap .ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--os-line)}
.ap .ach i.ph{font-size:24px;color:var(--os-muted)}
.ap .ach.on{border-color:rgba(251,191,36,.4)}.ap .ach.on i.ph{color:var(--cc-warn)}
.ap .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92em}
.ap .kv span{color:var(--os-muted)}
.ap .bar2{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);overflow:hidden}
.ap .bar2 i{display:block;height:100%;background:var(--os-accent)}
.ap .addr{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--os-bg);border:1px solid var(--os-line2);direction:ltr;font:600 .85em var(--mono)}
.ap .site{padding:16px;border-radius:12px;background:#f5f3ef;color:#1d1a22;line-height:1.8}
.ap .site h4{margin:0 0 6px;font-family:var(--font-brand);font-size:1.2em}
.ap canvas.paint{width:100%;aspect-ratio:16/10;background:#fff;border-radius:10px;touch-action:none;cursor:crosshair}
.ap .swatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.ap .swatch[aria-pressed="true"]{border-color:#fff}
.ap .album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ap .album figure{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--os-line);background:#000}
.ap .album img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.ap .album figcaption{padding:4px 6px;font-size:.75em;color:var(--os-muted)}
.ap .device{border-radius:16px;padding:14px;background:linear-gradient(160deg,#dfe7ea,#c7d1d5);color:#19222a;border:6px solid #9aa7ad}
.ap .device .scr{border-radius:10px;padding:12px;background:#0d1b22;color:#b6f0ff;font:600 .9em var(--mono);direction:rtl;line-height:1.7}
.ap .chart{width:100%;height:150px;border-radius:10px;background:var(--os-bg);border:1px solid var(--os-line2);display:block}
.ap .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 12px;text-align:center;color:var(--os-muted)}
.ap .empty i.ph{font-size:34px}
@media (max-width:640px){.ap .split{grid-template-columns:1fr}.ap .grid2{grid-template-columns:1fr}.ap .fields{grid-template-columns:repeat(2,1fr)}.ap .folders{grid-template-columns:1fr}}

/* ---------- القوائم المنبثقة (إيقاف، إعدادات، تقييم) ---------- */
.cc-modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) calc(12px + var(--sar)) calc(16px + var(--sab)) calc(12px + var(--sal));background:rgba(6,3,12,.66)}
.cc-modal .cc-panel{max-height:100%;overflow:auto}
.cc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.cc-tabs button{min-height:38px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--cc-line);background:transparent;font-weight:700}
.cc-tabs button[aria-selected="true"]{background:rgba(124,58,237,.22);border-color:var(--cc-accent2)}
.cc-set{display:flex;flex-direction:column;gap:14px}
.cc-set .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cc-set .row>span{font-weight:700}
.cc-set .row small{display:block;color:var(--cc-muted);font-weight:500}
.cc-set input[type=range]{width:min(240px,100%);accent-color:var(--cc-accent2)}
.cc-set select{min-height:40px;padding:0 10px;border-radius:var(--r-btn);border:1px solid var(--cc-line2);background:var(--cc-surface2)}
.cc-switch{position:relative;width:48px;height:28px;border-radius:var(--r-pill);border:1px solid var(--cc-line2);background:rgba(255,255,255,.06);flex:none}
.cc-switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#cbd5e1;transition:transform .18s var(--ease)}
.cc-switch[aria-checked="true"]{background:var(--cc-accent)}
.cc-switch[aria-checked="true"]::after{transform:translateX(-20px);background:#fff}
.cc-key{min-width:64px;min-height:38px;border-radius:var(--r-btn);border:1px solid var(--cc-line2);background:var(--cc-surface2);font-weight:800;direction:ltr}
.cc-key.wait{border-color:var(--cc-warn);color:var(--cc-warn)}
.cc-help{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.cc-help kbd{display:inline-block;min-width:30px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-family:var(--font);font-weight:800;direction:ltr;text-align:center}

/* التقييم */
.cc-review{max-width:860px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.cc-review .boss{display:flex;gap:12px;align-items:center}
.cc-review .boss canvas{width:72px;height:72px;border-radius:16px;background:#2a2536;flex:none}
.cc-grade{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.cc-grade b{font-family:var(--font-brand);font-size:54px;font-weight:900;line-height:1}
.cc-grade.pass b{color:var(--cc-ok)}.cc-grade.fail b{color:var(--cc-bad)}
.cc-bd{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cc-bd .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9em}
.cc-bd .r .tr{grid-column:1/-1;height:6px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);overflow:hidden}
.cc-bd .r .tr i{display:block;height:100%;background:var(--cc-accent2);width:0;transition:width .7s var(--ease)}
.cc-quotes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.cc-quotes li{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--cc-line);line-height:1.7;animation:cc-rise .3s var(--ease) both}
.cc-hl{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto;font-size:.88em}
.cc-hl div{display:flex;gap:8px;color:var(--cc-muted)}
.cc-hl div b{color:var(--cc-text);font-weight:700}
@media (max-width:760px){.cc-review{grid-template-columns:1fr}}

/* ---------- تحكم الجوال ---------- */
.cc-touch{position:absolute;inset:0;z-index:12;pointer-events:none}
.cc-stick{position:absolute;inset-inline-end:calc(18px + var(--sal));bottom:calc(22px + var(--sab));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);pointer-events:auto;touch-action:none}
.cc-stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35)}
.cc-look{position:absolute;inset-block:0;inset-inline-start:0;width:55%;pointer-events:auto;touch-action:none}
.cc-tbtns{position:absolute;inset-inline-start:calc(16px + var(--sar));bottom:calc(20px + var(--sab));display:grid;grid-template-columns:repeat(2,64px);gap:12px;pointer-events:auto}
.cc-tbtn{width:64px;height:64px;border-radius:18px;border:1px solid rgba(255,255,255,.22);background:rgba(14,8,26,.72);font-size:26px;display:grid;place-items:center;position:relative}
.cc-tbtn small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap;text-shadow:0 1px 3px #000}
.cc-tbtn.main{background:rgba(124,58,237,.55);border-color:var(--cc-accent2)}
.cc-tbtn:disabled{opacity:.35}
.cc-touch.seated{display:none}
.cc-orient{position:absolute;top:calc(64px + var(--sat));left:50%;transform:translateX(-50%);z-index:13}

@media (max-height:480px){.cp-head{padding:6px 10px}.cp-log{min-height:70px;padding:6px 10px}.cp-actions{padding:4px 10px}.cp-mood{padding:4px 10px}.os-win .cc-tabs{margin:4px 8px 0!important}.os-win .cc-tabs button{min-height:30px}}
@media (prefers-reduced-motion:reduce){
  #cc *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
#cc.reduce *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (max-width:640px){
  .cc-goal{min-width:0;max-width:56vw;padding:8px 10px}
  .cc-dock{inset-inline:calc(8px + var(--sar)) calc(8px + var(--sal));width:auto;bottom:calc(150px + var(--sab));max-height:44vh}
  .os-icons{grid-template-columns:repeat(auto-fill,76px);grid-auto-rows:84px}
}

/* =====================================================================
   الإصدار ٢: نظام «رنّة ديسك»، لوحة المكالمة بثلاث حالات، مؤشر الثقة، و«نصب».
   ألوان الشركة الخيالية: غرافيت هادئ + نحاسي. بنفسجي احسمها للأزرار المهمة والحالات فقط.
   ===================================================================== */
:root{--rn-ink:#101318;--rn-slate:#1a1f27;--rn-slate2:#222833;--rn-slate3:#2b3240;--rn-line:rgba(255,255,255,.08);--rn-line2:rgba(255,255,255,.14);--rn-text:#e8ebf0;--rn-muted:#9aa3b2;--rn-brass:#d6a84f;--rn-brass-soft:rgba(214,168,79,.14);--rn-teal:#4fb3a9}
#cc.seated .cc-goal,#cc.seated #cc-mode-chip,#cc.seated #cc-call-chip,#cc.seated .cc-clock>.cc-chip{display:none}
#cc.seated .cc-top{justify-content:flex-start}
#cc.seated .cc-iconbtn{width:38px;height:38px;font-size:17px;opacity:.85}

/* الشاشة: إطار واحد فقط (حافة الشاشة ثلاثية الأبعاد). واجهة النظام بدون إطار أو ظل ثاني */
.os{background:var(--rn-ink);color:var(--rn-text);border-radius:3px;box-shadow:none}
.os.full{border-radius:0}
.os-desk{background:linear-gradient(180deg,#1b212b 0%,#141920 62%,#10141a 100%)}
.os-desk::before{background:radial-gradient(600px 300px at 15% 0%,rgba(79,179,169,.07),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 64px)}
.os-wall{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 28px 22px;pointer-events:none}
.os-wall .mark{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:0 12px;align-items:center;color:rgba(214,168,79,.42)}
.os-wall .mark svg{grid-row:1/3;width:44px;height:44px}
.os-wall .mark b{font-family:var(--font-brand);font-weight:800;font-size:15px;color:rgba(232,235,240,.38)}
.os-wall .mark small{font-size:11px;color:rgba(154,163,178,.45)}
.os-icons{grid-template-columns:repeat(auto-fill,84px);grid-auto-rows:86px;gap:4px}
.os-ic{gap:7px;border-radius:8px;padding:6px 4px}
.os-ic:hover{background:rgba(255,255,255,.045);border-color:var(--rn-line)}
.os-ic .nm{font-size:.78em;line-height:1.3;color:#dfe3ea;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.os-ic.locked .tile{filter:grayscale(1) brightness(.6)}
/* أيقونات التطبيقات: كل وحدة لها شكل ولون يخدم وظيفتها */
#cc .tile{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:11px;font-size:23px;line-height:1;color:#fff;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 2px 6px -2px rgba(0,0,0,.6)}
#cc .tile.sm{width:28px;height:28px;border-radius:7px;font-size:16px}
#cc .tile.xs{width:20px;height:20px;border-radius:5px;font-size:12px;box-shadow:none}
#cc .tile .ph{font-size:inherit}
.cp.ringing .cp-log,.cp.ringing .cp-status{display:none}
.cc-dock:has(.cp.ringing){max-height:none}
#cc .ic-phone{background:#1f8a5b}
#cc .ic-guide{background:#e9e1cf;color:#5a4a2a;border-radius:4px 11px 11px 4px}
#cc .ic-mail{background:#2f6fd0}
#cc .ic-remote{background:#0f5e6e;color:#9ff0ff}
#cc .ic-files{background:#e0a336;color:#4a3108;border-radius:5px 11px 11px 11px}
#cc .ic-tx{background:#14171c;color:var(--rn-brass);box-shadow:inset 0 0 0 1.5px rgba(214,168,79,.55),0 2px 6px -2px rgba(0,0,0,.6)}
#cc .ic-store{background:#2a9d8f}
#cc .ic-av{background:#b33b3b;border-radius:11px 11px 16px 16px}
#cc .ic-paint{background:conic-gradient(from 200deg,#ef6a5b,#f2c14e,#58b368,#4f8fd8,#9b6ad6,#ef6a5b)}
#cc .ic-album{background:#3e4a5c;color:#ffd38a}
#cc .ic-hl{background:#6a3f2f;color:#ffcfa9}
#cc .ic-stats{background:#3a3f8f}
#cc .ic-browser{background:#2b84b8}
#cc .ic-owner{background:#4b5563}
.os-ic .dot{top:2px;inset-inline-end:12px}

/* شريط المهام */
.os-bar{height:44px;gap:6px;padding:0 6px;background:rgba(12,14,18,.96);border-top:1px solid var(--rn-line);backdrop-filter:blur(6px)}
.os-bar .start{height:34px;border-radius:7px;border-color:transparent;background:transparent;color:var(--rn-brass);gap:6px;padding:0 10px}
.os-bar .start span{color:var(--rn-text);font-family:var(--font-brand)}
.os-bar .start:hover{background:rgba(255,255,255,.06)}
.os-tasks button{height:34px;border-radius:7px;color:var(--rn-muted);gap:7px}
.os-tasks button.act{background:var(--rn-slate3);border-color:var(--rn-line2);color:var(--rn-text);box-shadow:inset 0 -2px 0 var(--rn-brass)}
.os-tray{gap:4px}
.trayb{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;border:0;background:transparent;color:var(--rn-muted);font-size:17px}
.trayb:hover{background:rgba(255,255,255,.07);color:var(--rn-text)}
.trayb .cnt{position:absolute;top:3px;inset-inline-end:3px;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:var(--cc-bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.os-net{display:inline-flex;align-items:center;gap:5px;font-size:.78em;color:var(--rn-muted);padding:0 6px}
.os-net i{width:7px;height:7px;border-radius:50%;background:#9aa3b2}
.os-net.live i{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.os-net.local i{background:#fbbf24}
.os-goal{display:inline-flex;align-items:center;gap:7px;font-size:.8em;color:var(--rn-muted);padding:0 4px}
.os-goal .gbar{width:58px;height:5px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.os-goal .gbar i{display:block;height:100%;background:var(--rn-brass);transition:width .5s var(--ease)}
.os-goal.done .gbar i{background:var(--cc-ok)}
.os-tray .clock{padding:0 6px;font-size:.85em}
.os-callpill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid rgba(52,211,153,.4);background:rgba(31,138,91,.18);color:#c6f6dc;font-weight:800;font-size:.8em;white-space:nowrap}
.os-callpill.ring{animation:cc-pulse 1s infinite;border-color:#34d399}
.os-callpill .t{font-weight:700;color:#9fe3bd}
@media (max-width:760px){.os-goal .gbar,.os-net{display:none}.os-bar .start span{display:none}}

/* النوافذ */
.os-win{background:var(--rn-slate);border-color:var(--rn-line2);border-radius:8px;box-shadow:0 18px 44px -18px rgba(0,0,0,.85)}
.os-win.tiled{border-radius:0;box-shadow:none;border-width:0 1px}
.os-wt{height:36px;background:var(--rn-slate2);border-bottom-color:var(--rn-line);gap:8px}
.os-wt b{font-weight:700;color:var(--rn-text)}
.os-menu{background:var(--rn-slate);border-color:var(--rn-line2);bottom:48px;inset-inline-end:auto;inset-inline-start:6px;width:280px}
.os-menu .mh{display:flex;justify-content:space-between;align-items:baseline;padding:6px 8px 8px;border-bottom:1px solid var(--rn-line);margin-bottom:6px}
.os-menu .mh b{font-family:var(--font-brand)}
.os-menu .mh small{color:var(--rn-muted)}
.os-menu button.dim{opacity:.55}
.os-notep{inset-inline-start:auto;inset-inline-end:6px;width:320px}
.os-notep .nrow{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px}
.os-notep .nrow span{flex:1;min-width:0}
.os-notep .nrow b{display:block;font-size:.88em}
.os-notep .nrow small{color:var(--rn-muted);font-size:.78em;line-height:1.5}
.os-notep .nrow.bad i{color:var(--cc-bad)}.os-notep .nrow.warn i{color:var(--cc-warn)}.os-notep .nrow.ok i{color:var(--cc-ok)}
.os-notes{top:10px;bottom:auto;inset-inline-start:auto;inset-inline-end:10px;width:min(300px,70%)}
.os-note{display:flex;gap:10px;align-items:flex-start;background:rgba(26,31,39,.97);border-color:var(--rn-line2);transition:opacity .25s,transform .25s}
.os-note i.ph{font-size:18px;color:var(--rn-brass);margin-top:2px}
.os-note.bad i.ph{color:var(--cc-bad)}.os-note.warn i.ph{color:var(--cc-warn)}.os-note.ok i.ph{color:var(--cc-ok)}
.os-note.out{opacity:0;transform:translateY(-4px)}

/* الشريط المصغر للمكالمة */
.os-callbar{flex:none;display:flex;align-items:center;gap:10px;padding:5px 10px;background:#14181e;border-top:1px solid rgba(52,211,153,.25);overflow-x:auto;scrollbar-width:none}
.os-callbar .cb-act{margin-inline-start:auto}
.os-notes{z-index:100001}.os-menu{z-index:100002}.os-popup{z-index:100003}.os-desk .cc-coach{z-index:100001}
.os-callbar .cb-av{width:34px;height:34px;border-radius:9px;overflow:hidden;background:var(--rn-slate3);display:grid;place-items:center;flex:none}
.os-callbar .cb-av canvas{width:100%;height:100%}
.os-callbar .cb-who{min-width:0}
.os-callbar .cb-who b{display:block;font-size:.88em;white-space:nowrap}
.os-callbar .cb-trust{min-width:130px;display:flex;flex-direction:column;gap:3px}
.os-callbar .cb-trust small{font-size:.72em;color:var(--rn-muted);white-space:nowrap}
.os-callbar .cb-trust b{color:var(--rn-text)}
.os-callbar .cb-act{display:flex;gap:4px}
.os-callbar .cb-act .cc-btn{min-height:32px;padding:0 9px}
@media (max-width:760px){.os-callbar .cb-act .cc-btn span{display:none}.os-callbar .cb-trust{min-width:90px}}

/* لوحة المكالمة */
.cp{background:var(--rn-slate);color:var(--rn-text)}
.cp-head{gap:9px;padding:9px 10px;border-bottom-color:var(--rn-line);flex-wrap:wrap}
.cp-av{width:42px;height:42px;border-radius:10px}
.cp-noav{display:grid;place-items:center;height:100%;font-size:20px;color:var(--rn-muted)}
.cp-state{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:.74em;font-weight:800;background:rgba(255,255,255,.06);color:var(--rn-muted);white-space:nowrap}
.cp-state::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.cp-state.live{color:#86efac}.cp-state.rec{color:#fca5a5;background:rgba(248,113,113,.14)}.cp-state.proc{color:#fcd34d}.cp-state.talk{color:#93c5fd}.cp-state.ring{color:#86efac;animation:cc-pulse 1s infinite}.cp-state.off{color:var(--rn-muted)}
.cp-state.rec::before,.cp-state.proc::before{animation:cc-dot 1s infinite}
.cp-timer{font-size:.78em;color:var(--rn-muted);font-weight:700}
.cp-modes{display:flex;gap:2px;margin-inline-start:auto}
.cp-modes button,.cp-min{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;border:0;background:transparent;color:var(--rn-muted);font-size:16px}
.cp-modes button:hover,.cp-min:hover{background:rgba(255,255,255,.07);color:var(--rn-text)}
.cp-trust{padding:8px 12px 10px;border-bottom:1px solid var(--rn-line);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.cp-trust .t1{display:flex;align-items:baseline;gap:8px;font-size:.8em;color:var(--rn-muted)}
.cp-trust .t1 b{font-family:var(--font-brand);font-size:1.18em;color:var(--rn-text);transition:color .3s}
.cp-trust .t1 .ph{font-size:15px}
.cp-trust .t1 .up{color:#86efac}.cp-trust .t1 .down{color:#fca5a5}
.cp-warn{margin-inline-start:auto;color:#fcd34d;font-weight:700}
.cp-meter{position:relative;display:block;height:9px;margin-top:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.cp-meter i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:inherit;background:#d6a84f;transition:width .5s var(--ease),background-color .4s}
.cp-trust[data-band="0"] .cp-meter i{background:#d4574f}.cp-trust[data-band="1"] .cp-meter i{background:#e08a43}.cp-trust[data-band="2"] .cp-meter i{background:#d6a84f}.cp-trust[data-band="3"] .cp-meter i{background:#6cc08f}.cp-trust[data-band="4"] .cp-meter i{background:#34b37a}
.cp-meter s{position:absolute;top:0;bottom:0;width:2px;background:var(--rn-slate);text-decoration:none}
.cp-meter.sm{height:6px;margin:0}
.cp-trust[data-band="0"] .t1 b{color:#fca5a5}.cp-trust[data-band="1"] .t1 b{color:#fdba74}.cp-trust[data-band="2"] .t1 b{color:#fde68a}.cp-trust[data-band="3"] .t1 b{color:#bbf7d0}.cp-trust[data-band="4"] .t1 b{color:#6ee7b7}
.cp-log{background:var(--rn-ink)}
.cp-msg.c{background:var(--rn-slate3)}
.cp-msg.c .who{display:block;font-size:.72em;font-weight:800;color:var(--rn-brass);margin-bottom:2px}
.cp-msg.p{background:rgba(139,92,246,.2)}
.cp-msg.sys{border-color:var(--rn-line2);color:var(--rn-muted)}
.cp-msg.sys.coach{border-style:solid;border-color:rgba(214,168,79,.35);color:#f3dca9;background:var(--rn-brass-soft)}
.cp-msg.sys.coach::before{content:'المدرب: ';font-weight:800}
.cp-data{align-self:flex-start;display:flex;align-items:center;gap:10px;max-width:92%;padding:8px 10px;border-radius:10px;background:var(--rn-brass-soft);border:1px solid rgba(214,168,79,.45)}
.cp-data>span{font-size:.78em;color:#f3dca9;font-weight:700;white-space:nowrap}
.cc-code{font:800 1.02em/1.4 var(--mono);letter-spacing:.04em;color:var(--rn-text);unicode-bidi:isolate}
.cp-copy{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;border:1px solid var(--rn-line2);background:transparent;color:var(--rn-muted)}
.cp-in{background:var(--rn-slate2);border-top-color:var(--rn-line)}
.cp-in textarea{background:var(--rn-ink);border-color:var(--rn-line2)}
.cp-mic{background:var(--rn-slate3);border-color:var(--rn-line2)}
.cp-status{border-top-color:var(--rn-line)}
.cp-actions .cc-btn.ghost{border-color:var(--rn-line2)}
.os-win.app-phone .os-wt{background:#16271f;border-bottom-color:rgba(52,211,153,.18)}
.os-win.app-phone{border-color:rgba(52,211,153,.22)}

/* «نصب»: لوحة عمليات داكنة بلمسة نحاسية */
.os-win.app-tx{background:#0f1216;border-color:rgba(214,168,79,.28)}
.os-win.app-tx .os-wt{background:#14171c;border-bottom-color:rgba(214,168,79,.2)}
.nb{display:grid;grid-template-columns:150px minmax(0,1fr);height:100%;min-height:0}
.nb-nav{display:flex;flex-direction:column;gap:2px;padding:10px 8px;background:#0b0d10;border-inline-end:1px solid rgba(214,168,79,.14)}
.nb-nav button{position:relative;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--rn-muted);font-weight:700;text-align:start}
.nb-nav button[aria-selected="true"]{background:rgba(214,168,79,.12);color:#f3dca9;box-shadow:inset 3px 0 0 var(--rn-brass)}
.nb-nav button .live{position:absolute;inset-inline-end:5px;top:6px;width:7px;height:7px;border-radius:50%;background:#34d399}
.nb-foot{margin-top:auto;font-size:.7em;color:#6b7280;line-height:1.5;padding:6px}
.nb-main{padding:12px 14px;overflow:auto;min-height:0}
.nb-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nb-kpis .k{padding:10px;border-radius:9px;background:#151a20;border:1px solid var(--rn-line)}
.nb-kpis .k span{display:block;font-size:.74em;color:var(--rn-muted)}
.nb-kpis .k b{display:block;font-family:var(--font-brand);font-size:1.15em;margin-top:2px;color:#f6efe0}
.nb-kpis .k small{font-size:.68em;color:#8b8573}
.pb{display:block;height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;background:var(--rn-brass);transition:width .6s var(--ease)}
.nb-card{padding:12px;border-radius:10px;background:#151a20;border:1px solid var(--rn-line);display:flex;flex-direction:column;gap:6px}
.nb-card b{display:flex;align-items:center;gap:6px}
.nb-card.unlock{border-color:rgba(214,168,79,.3)}
.nb-card.unlock small{display:block;color:var(--rn-muted)}
.nb-card.tool{border-color:rgba(139,92,246,.35)}
.nb-rows{display:flex;flex-direction:column;gap:2px;font-size:.84em}
.nb-rows .r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;background:rgba(255,255,255,.02)}
.nb-rows .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rn-muted)}
.nb-rows .r span:first-child{color:var(--rn-text)}
.nb-rows .r.ok b{color:#86efac}.nb-rows .r.bad b{color:#fca5a5;font-weight:600;font-size:.92em}
.nb-methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.nb-m{display:flex;flex-direction:column;gap:6px;padding:11px;border-radius:10px;background:#151a20;border:1px solid var(--rn-line)}
.nb-m header{display:flex;align-items:center;gap:7px}
.nb-m header .ph{font-size:20px;color:var(--rn-brass)}
.nb-m header b{flex:1}
.nb-m .rw{font-family:var(--font-brand);font-weight:900;color:#f6efe0}
.nb-m p{font-size:.8em;line-height:1.6}
.nb-m dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:.76em}
.nb-m dt{color:#7d8696}.nb-m dd{margin:0;color:#cfd5de}
.nb-m footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:auto}
.nb-m .st{display:inline-flex;align-items:center;gap:5px;font-size:.76em;font-weight:800;color:var(--rn-muted)}
.nb-m .st.ok{color:#86efac}.nb-m .st.cur{color:#f3dca9}
.nb-m footer .pb{flex:1;min-width:60px;margin:0}
.nb-m.locked{opacity:.7}.nb-m.locked header .ph{color:#6b7280}
.nb-m.cur{border-color:rgba(214,168,79,.55);box-shadow:inset 0 0 0 1px rgba(214,168,79,.2)}
.dots{display:inline-flex;gap:2px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:#3a414d}.dots i.on{background:var(--rn-brass)}
.nb-ophead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:10px;background:linear-gradient(135deg,#1a1d22,#13161a);border:1px solid rgba(214,168,79,.3)}
.nb-ophead>div:first-child{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.nb-ophead .ph{grid-row:1/3;font-size:28px;color:var(--rn-brass)}
.nb-ophead b{font-family:var(--font-brand);font-size:1.1em}
.nb-ophead small{color:var(--rn-muted);font-size:.8em}
.nb-ophead .rw{font-family:var(--font-brand);font-weight:900;font-size:1.3em;color:#f6efe0}
.nb-rule{font-size:.8em;color:var(--rn-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.linkb{border:0;background:none;color:#f3dca9;text-decoration:underline;padding:0;font-weight:700}
.nb-pieces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nb-pieces li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.025);font-size:.86em}
.nb-pieces li .ph{color:#6b7280;font-size:16px}
.nb-pieces li small{color:#7d8696;font-size:.82em}
.nb-pieces li.got .ph{color:#34d399}.nb-pieces li.got small{color:#86efac}
.nb-pieces li.later{opacity:.55}
.nb-form{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:#12161b;border:1px solid var(--rn-line)}
.nb-f{display:flex;flex-direction:column;gap:5px;font-size:.84em;font-weight:700;color:#cfd5de}
.nb-f .in{display:flex;align-items:stretch;border-radius:8px;border:1px solid var(--rn-line2);background:#0b0d10;overflow:hidden}
.nb-f .in:focus-within{border-color:var(--rn-brass)}
.nb-f em{display:grid;place-items:center;padding:0 10px;font-style:normal;font-weight:800;color:var(--rn-brass);background:rgba(214,168,79,.08);border-inline-end:1px solid var(--rn-line)}
.nb-f input{flex:1;min-width:0;min-height:42px;padding:0 10px;border:0;background:transparent;color:var(--rn-text);font:700 16px var(--mono);letter-spacing:.06em;outline:none}
.nb-f input[dir=auto]{font-family:var(--font);letter-spacing:0}
.nb-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nb-msg{font-size:.84em;color:var(--rn-muted);line-height:1.6}

.nb-cardviz .top{display:flex;justify-content:space-between;font-size:.72em;color:var(--rn-muted)}
.nb-cardviz .top b{color:#f3dca9;font-weight:800;max-width:60%;text-align:end}
.nb-cardviz .emb{width:38px;height:26px;border-radius:6px;background:linear-gradient(135deg,#8a7445,#d6a84f);margin-top:6px;opacity:.85}
.nb-cardviz .id{font:800 1.12em var(--mono);letter-spacing:.08em;margin-top:auto}
.nb-cardviz .nm{font-weight:800;color:#e8ebf0}

@media (max-width:640px){.nb{grid-template-columns:1fr;grid-template-rows:auto 1fr}.nb-nav{flex-direction:row;overflow-x:auto;padding:6px;border-inline-end:0;border-bottom:1px solid rgba(214,168,79,.14)}.nb-nav button{flex:none}.nb-nav button span{font-size:.85em}.nb-foot{display:none}.nb-kpis{grid-template-columns:1fr 1fr}.nb-tokens{grid-template-columns:repeat(2,1fr)}.nb-rows .r{grid-template-columns:1fr auto}.nb-rows .r span:nth-child(2),.nb-rows .r span:nth-child(3){display:none}}


/* ===== «نصب»: صفحات تشغيل الطرق ===== */
.nb-m{cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.nb-m:hover{border-color:rgba(214,168,79,.5);background:#181e25}

.nb-chip.wait{color:#f3dca9;border-color:rgba(214,168,79,.4);background:rgba(214,168,79,.08)}
.nb-chip.ok{color:#bbf7d0;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.14)}
.nb-chip.bad{color:#fecaca;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.1)}
.nb-chip.lock{color:#9aa3b2}
.nb-mp{--acc:var(--rn-brass);display:flex;flex-direction:column;gap:10px}

.nb-mp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nb-how{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:.86em;line-height:1.7;color:#cfd5de}
.nb-chk{display:flex;flex-wrap:wrap;gap:6px 12px}.nb-chk:empty{display:none}
.nb-cardviz .id{letter-spacing:0;word-spacing:.15em;unicode-bidi:plaintext}
.pc{display:inline-flex;align-items:center;gap:4px;font-size:.78em;color:#7d8696}.pc.got{color:#86efac}
.nb-f .lb{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nb-f .hint{font-weight:500;color:#7d8696;font-size:.86em}
.nb-f .in em.sf{border-inline-end:0;border-inline-start:1px solid var(--rn-line)}
.mx{display:flex;flex-direction:column;gap:10px}
.mx-bar,.inv-top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(214,168,79,.08);border:1px solid rgba(214,168,79,.2)}
.mx-bar span,.inv-top span{margin-inline-start:auto;color:var(--rn-muted);font-size:.82em}
.nb-permits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nb-permits .pm{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:start;padding:10px;border-radius:10px;border:1px solid var(--rn-line2);background:#0b0d10;color:var(--rn-text);font:inherit;min-height:44px}
.nb-permits .pm:hover{border-color:rgba(224,164,74,.6)}
.nb-permits .pm.on{border-color:var(--acc);background:rgba(224,164,74,.1);box-shadow:inset 0 0 0 1px var(--acc)}
.nb-permits .pm-h{display:flex;align-items:center;gap:6px;color:var(--acc)}.nb-permits .pm-h b{color:var(--rn-text);font-family:var(--mono);letter-spacing:.04em}
.nb-permits .pm-n{font-weight:800}.nb-permits small{color:#7d8696}.nb-permits .pm-s{margin-top:auto;font-size:.74em;color:#9aa3b2;display:flex;align-items:center;gap:4px}
.nb-permits .pm.on .pm-s{color:#f3dca9}
.inv-doc{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:#f6f1e4;color:#1c1917;border:1px solid #d9cfb4}
.inv-doc .inv-top{background:rgba(120,90,30,.1);border-color:rgba(120,90,30,.25);color:#3b2f12}
.inv-doc .nb-opts legend{color:#57502f}

.vlt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:linear-gradient(135deg,#1c2026,#111418);border:1px solid rgba(192,160,96,.4)}

.vlt .cells{display:flex;align-items:center;gap:5px;direction:ltr}
.vlt .cells i{width:30px;height:40px;display:grid;place-items:center;border-radius:6px;background:#0b0d10;border:1px solid var(--rn-line2);font:800 1.1em var(--mono);font-style:normal;color:#6b7280}
.vlt .cells i.on{color:#f3dca9;border-color:var(--acc)}
.vlt .sep{width:10px}
.nb-order li{touch-action:manipulation}
.nb-order li:focus-visible{outline:2px solid var(--rn-brass);outline-offset:1px}
.nb-order li.drag{border-color:var(--acc);background:rgba(187,154,247,.12);box-shadow:0 8px 20px -10px #000}
.nb-order .grip{display:grid;place-items:center;width:28px;height:32px;cursor:grab;color:#7d8696;touch-action:none}
.nb-order li.drag .grip{cursor:grabbing}
.nb-order.pv li{opacity:.7}
.wl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wl-cnt{font-family:var(--font-brand);color:#f3dca9}
.nb-tokens .tok{cursor:pointer;color:var(--rn-text);font:inherit;display:grid;place-items:center}
.nb-tokens .tok.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.nb-tokens.pv .tok{opacity:.55}
.cb-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb-steps li{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--rn-line);background:#0b0d10;opacity:.6}
.cb-steps li span{grid-row:1/3;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.06);font-weight:800}
.cb-steps li small{color:#7d8696}
.cb-steps li.cur{opacity:1;border-color:var(--acc)}.cb-steps li.cur span{background:var(--acc);color:#111}
.cb-steps li.done{opacity:1;border-color:rgba(52,211,153,.4)}.cb-steps li.done span{background:rgba(52,211,153,.2);color:#86efac}
.nb-actions .spin,.nb-form .spin{display:inline-block}
@media (max-width:640px){.nb-permits{grid-template-columns:1fr}.vlt .cells i{width:26px;height:36px}.nb-m footer .nb-open{margin-inline-start:0}.cb-steps{grid-template-columns:1fr}.nb-f input{font-size:16px}}
@media (prefers-reduced-motion:reduce){.nb-m,.nb-m:active{transition:none;transform:none}}

  /* ================= نهاية اليوم وتقييم المدير ================= */

   عصا حركة للجوال، جلوس سلس على الكمبيوتر، حمل ورمي خفيف. الحركة تتوقف تلقائياً وقت الكتابة. */
(function () {
  'use strict';
  var G = window.CC, U = G.U;
  var P = G.player = { x: 0, z: 0, y: 1.65, yaw: 0, pitch: 0, mode: 'walk', vx: 0, vz: 0, keys: {}, enabled: false, carried: null, bob: 0, stepAcc: 0, sitT: 0, lastSafe: null };
  var EYE = 1.65, RADIUS = 0.28, SPEED = 2.6, RUN = 3.6;
  var T;

  P.place = function (x, z, yaw) { P.x = x; P.z = z; P.yaw = yaw || 0; P.pitch = 0; P.vx = P.vz = 0; P.lastSafe = { x: x, z: z }; };
  P.init = function () { T = window.THREE; P.place(G.world.SPAWN.x, G.world.SPAWN.z, G.world.SPAWN.yaw); bindInput(); };

  /* ---------- الإدخال ---------- */
  var look = { dx: 0, dy: 0 }, stick = { x: 0, y: 0, id: null }, lookTouch = null;
  function inGameKeys() { return P.enabled && !U.isTyping() && P.mode === 'walk'; }
  function bindInput() {
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('keyup', function (e) { P.keys[e.code] = false; if (e.code === G.settings.keys.interact) G.emit('interact-up'); if (e.code === G.settings.keys.ptt) G.emit('ptt-up'); }, true);
    window.addEventListener('blur', function () { P.keys = {}; G.emit('interact-up'); G.emit('ptt-up'); });
    var stage = document.getElementById('cc-stage');
    stage.addEventListener('mousedown', function (e) {
      if (!P.enabled || P.mode !== 'walk' || G.device.touch) return;
      if (document.pointerLockElement !== stage) { try { var pr = stage.requestPointerLock(); if (pr && pr.catch) pr.catch(function () {}); } catch (x) { /* */ } }
      else if (e.button === 0) G.emit('interact-click');
    });
    document.addEventListener('mousemove', function (e) { if (document.pointerLockElement === stage && P.mode === 'walk') { look.dx += e.movementX || 0; look.dy += e.movementY || 0; } });
    document.addEventListener('pointerlockchange', function () { G.emit('lock', document.pointerLockElement === stage); });
    // الجوال
    var st = document.getElementById('cc-stick'), lk = document.getElementById('cc-look');
    st.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; stick.id = t.identifier; stick.cx = t.clientX; stick.cy = t.clientY; var r = st.getBoundingClientRect(); stick.cx = r.left + r.width / 2; stick.cy = r.top + r.height / 2; moveStick(t); e.preventDefault(); }, { passive: false });
    st.addEventListener('touchmove', function (e) { for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === stick.id) moveStick(e.changedTouches[i]); e.preventDefault(); }, { passive: false });
    var endStick = function (e) { for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === stick.id) { stick.id = null; stick.x = stick.y = 0; st.firstElementChild.style.transform = ''; } };
    st.addEventListener('touchend', endStick); st.addEventListener('touchcancel', endStick);
    lk.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; lookTouch = { id: t.identifier, x: t.clientX, y: t.clientY }; }, { passive: true });
    lk.addEventListener('touchmove', function (e) { if (!lookTouch) return; for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; if (t.identifier === lookTouch.id) { look.dx += (t.clientX - lookTouch.x) * 2.2; look.dy += (t.clientY - lookTouch.y) * 2.2; lookTouch.x = t.clientX; lookTouch.y = t.clientY; } } e.preventDefault(); }, { passive: false });
    lk.addEventListener('touchend', function () { lookTouch = null; });
    lk.addEventListener('touchcancel', function () { lookTouch = null; });
    function moveStick(t) { var dx = t.clientX - stick.cx, dy = t.clientY - stick.cy, m = Math.hypot(dx, dy), R = 52; if (m > R) { dx = dx / m * R; dy = dy / m * R; } stick.x = dx / R; stick.y = dy / R; st.firstElementChild.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; }
  }
  function onKey(e) {
    if (G.rebinding) return;
    var typing = U.isTyping(e.target);
    if (e.code === 'Escape') { if (G.ui && G.ui.onEscape) { G.ui.onEscape(e); } return; }
    if (typing) return; // ما نطلق أي فعل للعبة والحقل نشط (حتى المسافة والحروف)
    P.keys[e.code] = true;
    if (!P.enabled) return;
    var K = G.settings.keys;
    if (e.code === K.interact && !e.repeat) { e.preventDefault(); G.emit('interact-down'); }
    if (e.code === K.stand && !e.repeat && P.mode === 'seated') { e.preventDefault(); G.emit('stand-request'); }
    if (e.code === K.ptt && !e.repeat) G.emit('ptt-down');
    if (e.code === K.photo && !e.repeat) G.emit('photo');
    if (/^(Arrow|Space)/.test(e.code) && P.mode === 'walk') e.preventDefault();
  }
  P.releaseLock = function () { if (document.pointerLockElement) try { document.exitPointerLock(); } catch (e) { /* */ } };
  P.locked = function () { return !!document.pointerLockElement; };

  /* ---------- التصادم ---------- */
  function resolve(nx, nz) {
    var cs = G.world.colliders, R = G.world.ROOM;
    nx = U.clamp(nx, R.x0 + RADIUS, R.x1 - RADIUS); nz = U.clamp(nz, R.z0 + RADIUS, R.z1 - RADIUS);
    for (var it = 0; it < 3; it++) {
      for (var i = 0; i < cs.length; i++) {
        var c = cs[i]; if (!c.on || c.top < 0.3) continue;
        var cx = U.clamp(nx, c.x0, c.x1), cz = U.clamp(nz, c.z0, c.z1), dx = nx - cx, dz = nz - cz, d2 = dx * dx + dz * dz;
        if (d2 < RADIUS * RADIUS) {

            var ex = [nx - c.x0, c.x1 - nx, nz - c.z0, c.z1 - nz], m = Math.min.apply(null, ex), k = ex.indexOf(m);
            if (k === 0) nx = c.x0 - RADIUS; else if (k === 1) nx = c.x1 + RADIUS; else if (k === 2) nz = c.z0 - RADIUS; else nz = c.z1 + RADIUS;

  }
  function blockedAt(x, z) { var cs = G.world.colliders; for (var i = 0; i < cs.length; i++) { var c = cs[i]; if (c.on && c.top >= 0.3 && x > c.x0 - RADIUS * 0.9 && x < c.x1 + RADIUS * 0.9 && z > c.z0 - RADIUS * 0.9 && z < c.z1 + RADIUS * 0.9) return true; } return false; }
  P.unstuck = function () { var s = G.world.SAFE; P.place(s.x, s.z, s.yaw); };

  /* ---------- الجلوس ---------- */
  var tween = null;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  P.sitPose = function () {
    var d = G.world.playerDesk;
    var SC = G.world.SCREEN;
    return { x: d.cx, y: 1.2, z: d.cz + 0.55, yaw: 0, pitch: -0.12, focus: { x: SC.cx, y: SC.cy, z: SC.cz + 0.5, yaw: 0, pitch: 0 } };
  };
  P.goTo = function (to, ms, done) {
    var fast = G.settings.reduceMotion;
    var from = { x: P.x, y: P.y, z: P.z, yaw: P.yaw, pitch: P.pitch };
    var dy = ((to.yaw - from.yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    tween = { from: from, to: { x: to.x, y: to.y, z: to.z, yaw: from.yaw + dy, pitch: to.pitch }, t: 0, dur: fast ? 0.001 : ms / 1000, done: done };
  };
  P.sit = function (done) {
    if (P.mode !== 'walk') return;
    P.mode = 'sitting'; P.releaseLock(); P.dropCarried(true);
    var s = P.sitPose(), fast = G.state.effects && G.state.effects.sitFast;
    G.audio.fx('click');
    // الكرسي يتسحب شوي للخلف ويرجع (حركة جلوس قصيرة)
    G.world.playerChair.position.z = G.world.playerDesk.chair.z + 0.12;
    P.goTo({ x: s.x, y: s.y, z: s.z, yaw: 0, pitch: s.pitch }, fast ? 220 : 360, function () {
      P.goTo(s.focus, fast ? 180 : 300, function () { P.mode = 'seated'; G.audio.space('seated'); if (done) done(); });
    });
  };
  P.stand = function (done) {
    if (P.mode !== 'seated') return;
    P.mode = 'standing';
    var d = G.world.playerDesk, fast = G.state.effects && G.state.effects.sitFast;
    G.audio.space('office');
    P.goTo({ x: d.cx + 0.05, y: EYE, z: d.cz + 1.15, yaw: 0, pitch: -0.08 }, fast ? 220 : 340, function () { P.x = d.cx + 0.05; P.z = d.cz + 1.15; P.mode = 'walk'; G.world.playerChair.position.z = d.chair.z; if (done) done(); });
  };
  P.seatAt = function (pos, yaw, done) { // كرسي الزائر عند المدير
    P.mode = 'sitting'; P.releaseLock(); P.dropCarried(true);
    P.goTo({ x: pos.x, y: 1.2, z: pos.z, yaw: yaw, pitch: -0.04 }, 500, function () { P.mode = 'review'; if (done) done(); });
  };
  P.leaveSeat = function (pos, yaw) { P.place(pos.x, pos.z, yaw); P.mode = 'walk'; P.y = EYE; };

  /* ---------- الحمل ---------- */
  P.pick = function (prop) { if (P.carried) return; prop.carried = true; prop.sleeping = true; P.carried = prop; G.audio.fx('pickup'); G.emit('carry', prop); };
  P.dropCarried = function (gentle, throwIt) {
    var p = P.carried; if (!p) return; P.carried = null; p.carried = false;
    var dir = new T.Vector3(-Math.sin(P.yaw) * Math.cos(P.pitch), Math.sin(P.pitch), -Math.cos(P.yaw) * Math.cos(P.pitch));
    var pos = p.mesh.position; pos.set(P.x, P.y - 0.25, P.z).addScaledVector(dir, 0.55);
    if (throwIt) p.vel.copy(dir.multiplyScalar(4.2)).add(new T.Vector3(0, 1.2, 0)); else p.vel.set(0, 0, 0);
    if (gentle) { var y = G.world.surfaceY(pos.x, pos.z, pos.y) + p.h / 2; if (y > pos.y - 0.8) pos.y = Math.max(pos.y, y); }
    p.sleeping = false; G.emit('carry', null);
  };

  /* ---------- التحديث ---------- */
  var tmp = { f: 0, r: 0 };
  P.update = function (dt) {
    var S = G.settings, cam = G.world.camera;
    if (tween) {
      tween.t += dt / tween.dur; var k = ease(Math.min(1, tween.t)), a = tween.from, b = tween.to;
      P.x = a.x + (b.x - a.x) * k; P.y = a.y + (b.y - a.y) * k; P.z = a.z + (b.z - a.z) * k; P.yaw = a.yaw + (b.yaw - a.yaw) * k; P.pitch = a.pitch + (b.pitch - a.pitch) * k;
      if (tween.t >= 1) { var d = tween.done; tween = null; if (d) d(); }
    } else if (P.mode === 'walk' && P.enabled) {
      // نظر
      var sens = 0.0022 * S.sens;
      P.yaw -= look.dx * sens; P.pitch -= look.dy * sens * (S.invertY ? -1 : 1);
      P.pitch = U.clamp(P.pitch, -1.35, 1.35);
      // حركة
      var f = 0, r = 0, k2 = P.keys;
      if (inGameKeys()) {
        if (k2.KeyW || k2.ArrowUp) f += 1; if (k2.KeyS || k2.ArrowDown) f -= 1;
        if (k2.KeyD || k2.ArrowRight) r += 1; if (k2.KeyA || k2.ArrowLeft) r -= 1;
      }
      if (stick.id !== null) { f += -stick.y; r += stick.x; }
      var m = Math.hypot(f, r); if (m > 1) { f /= m; r /= m; }
      var sp = (k2.ShiftLeft || k2.ShiftRight) ? RUN : SPEED;
      var tx = (-Math.sin(P.yaw) * f + Math.cos(P.yaw) * r) * sp, tz = (-Math.cos(P.yaw) * f - Math.sin(P.yaw) * r) * sp;
      var acc = Math.min(1, dt * 12); P.vx += (tx - P.vx) * acc; P.vz += (tz - P.vz) * acc;
      var n = resolve(P.x + P.vx * dt, P.z + P.vz * dt); P.x = n[0]; P.z = n[1];
      var spd = Math.hypot(P.vx, P.vz);
      if (spd > 0.4) { P.bob += dt * spd * 3.2; P.stepAcc += spd * dt; if (P.stepAcc > 0.72) { P.stepAcc = 0; G.audio.fx('step'); } }
      P.y = EYE + (S.headBob ? Math.sin(P.bob * 2) * 0.022 * Math.min(1, spd / 2) : 0);
      if (!blockedAt(P.x, P.z)) P.lastSafe = { x: P.x, z: P.z };
      tmp.f = f; tmp.r = r;
    }
    look.dx = 0; look.dy = 0;
    cam.position.set(P.x, P.y, P.z);
    var sh = G.world.shakeOffset();
    if (sh > 0 && !S.reduceShake) { var amp = Math.min(0.04, sh * 0.02) * (S.reduceMotion ? 0.3 : 1); cam.position.x += (Math.random() - 0.5) * amp; cam.position.y += (Math.random() - 0.5) * amp; }
    cam.rotation.set(P.pitch, P.yaw, 0);
    // الشي المحمول قدام الكاميرا
    if (P.carried) {
      var p = P.carried.mesh, off = new T.Vector3(0.22, -0.28, -0.55).applyEuler(cam.rotation);
      p.position.copy(cam.position).add(off); p.rotation.set(0, P.yaw, 0);
    }
  };
  P.forward = function () { return new T.Vector3(-Math.sin(P.yaw) * Math.cos(P.pitch), Math.sin(P.pitch), -Math.cos(P.yaw) * Math.cos(P.pitch)); };
  P.distTo = function (x, z) { return Math.hypot(P.x - x, P.z - z); };
  P.destroy = function () { document.removeEventListener('keydown', onKey, true); P.releaseLock(); };
})();

/* ===== 50-office.js ===== */
/* المكتب الحي: التفاعل مع الأشياء، والأحداث المفاجئة بشروط ظهور وتحذير ومدة وطريقة تعامل وتأثير وفترة تهدئة.
   قاعدة العدالة: حدث ثقيل واحد بالمرة، ولا أحداث بأول ٤٥ ثانية أو آخر ٥٠ ثانية، والتدريب يوقف الوقت. */
(function () {
  'use strict';
  var G = window.CC, U = G.U, C = G.C;
  var O = G.office = { hover: null, holding: null, holdT: 0, events: [], last: {}, nextAt: 0, budget: 0 };
  var T, ray, v2;

  /* ================= التفاعل ================= */
  function I(o) { return o; }
  O.list = [];
  O.init = function () {
    T = window.THREE; ray = new T.Raycaster(); ray.far = 2.4; v2 = new T.Vector2(0, 0);
    var W = G.world, P = G.player;
    var deskTarget = W.playerDeskTop;
    O.list = [
      I({ id: 'pc', objs: [W.myScreen, deskTarget, W.playerChair], label: function () { return 'اجلس على الكمبيوتر'; }, can: function () { return G.state.phase === 'shift'; }, act: function () { G.game.sitDown(); } }),
      I({ id: 'phone', objs: [W.handset], label: function () { var c = G.calls.state; return c === 'ringing' ? 'رد على المكالمة' : c === 'active' ? 'المكالمة شغالة' : 'هاتف المكتب'; }, act: function () { if (G.calls.state === 'ringing') G.calls.answer(); else G.ui.toast('الهاتف', G.calls.state === 'active' ? 'المكالمة شغالة. استخدم لوحة المكالمة.' : 'ما فيه مكالمة الحين. الهاتف يرن لما يتصل أحد.', 'phone'); } }),
      I({ id: 'drawer', objs: [W.drawer], label: function () { return W.drawerOpen ? (W.cameraItem.visible ? 'خذ الكاميرا' : 'سكّر الدرج') : 'افتح الدرج'; }, act: function () {
        if (W.drawerOpen && W.cameraItem.visible) { W.cameraTaken = true; W.cameraItem.visible = false; G.state.hasCamera = true; G.audio.fx('pickup'); G.ui.toast('كاميرا المكتب', 'اضغط ' + G.keyLabel(G.settings.keys.photo) + ' لالتقاط صورة. الصور تنحفظ بالألبوم.', 'camera'); return; }
        W.drawerOpen = !W.drawerOpen; G.audio.fx('box'); } }),
      I({ id: 'door', objs: [W.door.g], label: function () { return W.door.target ? 'سكّر الباب' : 'افتح الباب'; }, act: function () { W.setDoor(!W.door.target); } }),
      I({ id: 'coffee', objs: [W.coffee], label: function () { return W.powerOn ? 'اشرب قهوة' : 'الآلة مطفية'; }, act: function () {
        if (!W.powerOn) { G.ui.toast('آلة القهوة', 'الكهرباء مقطوعة.', 'warning', 'warn'); return; }
        G.audio.fx('coffee'); G.state.coffeeCount = (G.state.coffeeCount || 0) + 1; G.state.idleSec += 6;
        if (G.state.effects.coffeeBoost) { G.auth.call('coffee'); G.ui.toast('قهوة مختصة', 'تركيزك أعلى: أول متصل بالمكالمة الجاية يثق فيك أكثر.', 'coffee', 'ok'); }
        else G.ui.toast('قهوة', 'قهوة عادية. آلة القهوة المختصة بالمتجر تعطيك تركيز.', 'coffee'); } }),
      I({ id: 'breaker', objs: [W.breaker], label: function () { return O.active('power_out') ? 'ارفع القاطع' : 'لوحة الكهرباء'; }, act: function () { if (O.active('power_out')) O.handle('power_out'); else G.ui.toast('لوحة الكهرباء', 'كل شي شغال.', 'lightning'); } }),
      I({ id: 'printer', objs: [W.printer], hold: function () { return O.active('printer_jam') ? 1.6 : 0; }, label: function () { return O.active('printer_jam') ? 'أصلح الطابعة (اضغط مطولاً)' : 'الطابعة'; }, act: function () { if (O.active('printer_jam')) O.handle('printer_jam'); else G.ui.toast('الطابعة', 'شغالة. للحين.', 'printer'); } }),
      I({ id: 'ext', objs: [W.extinguisher], label: function () { return 'خذ طفاية الحريق'; }, can: function () { return !P.carried; }, act: function () { O.extProp.carried = true; P.pick(O.extProp); } }),
      I({ id: 'board', objs: [W.board], label: function () { return 'لوحة الهدف'; }, act: function () { var d = G.state.snap && G.state.snap.day; if (d) G.ui.toast('لوحة الهدف', 'محقق ' + U.money(d.earned) + ' من ' + U.money(d.quota) + '. باقي ' + U.mmss(G.game.timeLeft()) + '.', 'target'); } }),
      I({ id: 'visitor', objs: [W.visitorChair], label: function () { var d = G.state.snap && G.state.snap.day; return G.state.phase === 'review_call' ? 'اجلس قدام المدير' : (d && d.earned >= d.quota ? 'أنهِ اليوم عند المدير' : 'كرسي الزوار'); }, act: function () { var d = G.state.snap && G.state.snap.day; if (G.state.phase === 'review_call') G.game.sitForReview(); else if (d && d.earned >= d.quota) G.game.endEarly(); else G.ui.toast('مكتب المدير', 'تعال هنا بنهاية الدوام، أو بعد ما تحقق الهدف لو تبي تنهي مبكراً.', 'chair'); } })
    ];

    O.list.forEach(function (it) { it.objs.forEach(function (o) { if (o) o.traverse(function (m) { if (m.isMesh) m.userData.ia = it; }); }); });

  };

  function propHit(obj) { var p = null; G.world.props.forEach(function (pp) { obj.traverseAncestors(function (a) { if (a === pp.mesh) p = pp; }); if (obj === pp.mesh) p = pp; }); return p; }
  function npcPhoneNear() { var pos = G.world.npcRingPos(); return pos && Math.hypot(G.player.x - pos.x, G.player.z - pos.z) < 1.6 ? pos : null; }
  function scan() {
    var P = G.player, W = G.world;
    if (P.mode !== 'walk') return null;
    // أولوية للأحداث المكانية
    if (P.carried && P.carried === O.extProp && O.active('small_fire') && W.firePos().distanceTo(W.camera.position) < 2.6) return { kind: 'fire', label: 'أطفئ النار (اضغط مطولاً)', hold: 1.8 };
    if (O.active('phone_ring') && npcPhoneNear()) return { kind: 'npcphone', label: 'أسكت الهاتف' };
    if (P.carried) return { kind: 'drop', label: P.carried.id.indexOf('box:') === 0 ? 'افتح الصندوق (اضغط) أو ارمه (مطولاً)' : 'حطه (اضغط) أو ارمه (مطولاً)', throwable: true };
    ray.setFromCamera(v2, W.camera);

    O.list.forEach(function (it) { it.objs.forEach(function (o) { if (o) targets.push(o); }); });
    W.props.forEach(function (p) { if (!p.carried && p !== O.extProp) targets.push(p.mesh); });
